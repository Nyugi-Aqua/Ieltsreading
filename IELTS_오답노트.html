<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Reading 오답노트 | Cambridge 16–20</title>
<style>
:root{--bg:#f5f4f0;--surface:#fff;--sb:#1c2235;--sbt:#b8c0d0;--sba:#4f8ef7;--sbh:#252d42;--acc:#3b6fd4;--acc2:#d4603b;--text:#1a1a2e;--tl:#6b7280;--bdr:#e0ddd6;--nbg:#f0f4ff;--nbr:#c5d5f5;--ok:#16a34a;--ng:#dc2626;--am:#d97706;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}
#sidebar{width:250px;min-width:250px;background:var(--sb);color:var(--sbt);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s;}
#sidebar.collapsed{width:0;min-width:0;}
#sidebar.collapsed #sidebar-header,#sidebar.collapsed #nav-tree{opacity:0;pointer-events:none;}
#toggle-sidebar{position:fixed;top:14px;left:258px;z-index:100;background:var(--acc);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:left .2s;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.2);}
#sidebar.collapsed~* #toggle-sidebar,body.sb-collapsed #toggle-sidebar{left:8px;}
body.sb-collapsed #toggle-sidebar{left:8px;}
#sidebar-header{padding:18px 16px 12px;border-bottom:1px solid #2a3248;}
#sidebar-header h1{font-size:14px;font-weight:700;color:#fff;}
#sidebar-header p{font-size:11px;color:#6b7a99;margin-top:2px;}
#nav-tree{overflow-y:auto;flex:1;padding:6px 0;}
.book-group{margin-bottom:2px;}
.book-label{padding:6px 16px;font-size:11px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.7px;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;}
.book-label:hover{color:#9aa5bb;}
.book-label .arr{font-size:9px;transition:transform .2s;}
.book-label.collapsed .arr{transform:rotate(-90deg);}
.book-label.collapsed+.test-group{display:none;}
.test-group{display:block;}
.test-label{padding:5px 16px 5px 24px;font-size:12px;color:#7a8599;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;}
.test-label:hover{color:#b8c0d0;}
.test-label .arr{font-size:9px;transition:transform .2s;}
.test-label.collapsed .arr{transform:rotate(-90deg);}
.test-label.collapsed+.passage-list{display:none;}
.passage-list{display:block;}
.passage-item{padding:5px 16px 5px 36px;font-size:12px;color:#6b7a99;cursor:pointer;border-left:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:space-between;}
.passage-item:hover{background:var(--sbh);color:#b8c0d0;}
.passage-item.active{background:#1a2e55;color:var(--sba);border-left-color:var(--sba);font-weight:600;}
.p-badge{font-size:10px;background:#252d42;border-radius:8px;padding:1px 6px;color:#4a5568;}
.passage-item.active .p-badge{background:#1e3a6e;color:#7ab3f7;}
.passage-item.done::before{content:'●';color:var(--ok);font-size:8px;margin-right:5px;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{background:var(--surface);border-bottom:1px solid var(--bdr);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#topbar h2{font-size:15px;font-weight:700;flex:1;}
.topic-chip{font-size:11px;background:#eef2ff;color:var(--acc);border-radius:16px;padding:3px 11px;font-weight:600;}
#tabs{background:var(--surface);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;flex-shrink:0;}
.tab-btn{padding:10px 16px;font-size:12px;font-weight:600;color:var(--tl);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--acc);}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);}
#content{flex:1;overflow-y:auto;padding:0;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* passage intro */
.passage-intro{background:var(--surface);border-bottom:1px solid var(--bdr);padding:16px 28px;}
.passage-intro h3{font-size:13px;font-weight:700;color:var(--tl);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.passage-intro p{font-size:14px;font-weight:700;}
.q-types{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.q-chip{font-size:11px;padding:2px 10px;border-radius:12px;background:#f3f4f6;color:var(--tl);font-weight:600;}
/* para divider */
.para-divider{display:flex;align-items:center;gap:10px;padding:18px 0 8px;margin:0 0 4px;}
.para-divider-badge{background:var(--acc);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.para-divider-role{font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.4px;}
.para-divider-line{flex:1;height:1px;background:var(--bdr);}
/* sentence block */
.sentences-container{padding:0 28px 40px;}
.sent-block{border-bottom:1px solid #ebe9e4;padding:18px 0 14px;}
.sent-block:last-child{border-bottom:none;}
.sent-num-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.sent-num{font-size:15px;font-weight:800;color:var(--acc);min-width:22px;line-height:1.5;flex-shrink:0;}
.sent-en{font-size:14px;font-weight:700;line-height:1.8;color:#1a1a2e;flex:1;}
.sent-kr{font-size:13px;line-height:1.8;color:#374151;padding-left:32px;margin-bottom:8px;}
.grammar-note{margin:0 0 8px 32px;background:var(--nbg);border-left:3px solid var(--nbr);border-radius:0 6px 6px 0;padding:8px 12px;font-size:12px;line-height:1.7;color:#1e3a6e;}
.grammar-note strong{color:var(--acc2);}
.vocab-table{margin:0 0 0 32px;width:calc(100% - 32px);border-collapse:collapse;font-size:12.5px;}
.vocab-table th{background:#f3f4f6;padding:4px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--tl);letter-spacing:.3px;border-bottom:1px solid var(--bdr);}
.vocab-table td{padding:5px 10px;border-bottom:1px solid #f0ede8;vertical-align:top;line-height:1.6;}
.vocab-table tr:last-child td{border-bottom:none;}
.vocab-table td:first-child{font-weight:700;color:#1a1a2e;white-space:nowrap;min-width:130px;}
.vocab-table td:nth-child(2){color:var(--acc);font-weight:600;white-space:nowrap;min-width:55px;font-size:11px;}
/* vocab all */
.vocab-all-container{padding:20px 28px 40px;}
.vocab-all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.vcard{background:var(--surface);border:1px solid var(--bdr);border-radius:9px;padding:13px 15px;}
.vcard-word{font-size:15px;font-weight:800;}
.vcard-pos{font-size:10px;background:var(--acc);color:#fff;border-radius:9px;padding:1px 7px;margin-left:5px;font-weight:700;vertical-align:middle;}
.vcard-pron{font-size:11px;color:var(--tl);margin-top:2px;}
.vcard-kr{font-size:13px;margin-top:6px;line-height:1.6;}
.vcard-ex{font-size:12px;color:var(--tl);font-style:italic;margin-top:5px;border-top:1px solid var(--bdr);padding-top:5px;line-height:1.6;}
.vcard-ex em{color:var(--acc);font-style:normal;font-weight:700;}
.vcard-syn{font-size:11px;color:var(--tl);margin-top:4px;}
.vcard-syn span{background:#f3f4f6;border-radius:7px;padding:1px 6px;margin-right:3px;}
/* tfng */
.tfng-container{padding:20px 28px 40px;}
.tfng-block{background:var(--surface);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.tfng-block.ans-TRUE{border-left:4px solid var(--ok);}
.tfng-block.ans-FALSE{border-left:4px solid var(--ng);}
.tfng-block.ans-NG{border-left:4px solid var(--am);}
.tfng-block.ans-YES{border-left:4px solid var(--ok);}
.tfng-block.ans-NO{border-left:4px solid var(--ng);}
.tfng-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.q-circle{width:25px;height:25px;border-radius:50%;background:var(--sb);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.q-stmt{font-size:13.5px;font-weight:600;flex:1;line-height:1.6;}
.ans-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
.pill-TRUE,.pill-YES{background:#dcfce7;color:#15803d;}
.pill-FALSE,.pill-NO{background:#fee2e2;color:#b91c1c;}
.pill-NG,.pill-NOT.GIVEN{background:#fef3c7;color:#b45309;}
.pill-mine{background:#f3f4f6;color:#374151;}
.result-row{display:flex;align-items:center;gap:5px;margin-bottom:8px;font-size:12px;font-weight:700;}
.result-row.correct{color:var(--ok);}
.result-row.wrong{color:var(--ng);}
.ev-label,.why-label,.trap-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tl);margin-bottom:4px;}
.ev-box{background:#f0fdf4;border-left:3px solid var(--ok);border-radius:0 6px 6px 0;padding:8px 12px;font-size:13px;line-height:1.7;margin-bottom:8px;}
.ev-box mark{background:#bbf7d0;color:#065f46;padding:0 2px;border-radius:2px;}
.why-box{background:#fffbeb;border-left:3px solid var(--am);border-radius:0 6px 6px 0;padding:8px 12px;font-size:13px;line-height:1.7;color:#78350f;margin-bottom:6px;}
.trap-box{background:#fff1f2;border-left:3px solid var(--ng);border-radius:0 6px 6px 0;padding:8px 12px;font-size:13px;line-height:1.7;}
.trap-box strong{color:var(--ng);}
/* summary */
.summary-container{padding:20px 28px 40px;}
.sum-card{background:var(--surface);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.sum-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tl);margin-bottom:10px;}
.sum-text{font-size:13px;line-height:1.8;}
.smap-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--bdr);}
.smap-lbl{min-width:30px;height:30px;border-radius:6px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.smap-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--tl);}
.smap-desc{font-size:13px;line-height:1.7;margin-top:2px;}
.smap-desc strong{color:var(--acc2);}
/* legend */
.legend-row{display:flex;gap:14px;flex-wrap:wrap;padding:8px 28px;background:var(--surface);border-bottom:1px solid var(--bdr);}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tl);}
.leg-dot{width:10px;height:3px;border-radius:2px;}
/* empty */
.empty{text-align:center;padding:70px 24px;color:var(--tl);}
.empty .em{font-size:40px;margin-bottom:12px;}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty p{font-size:13px;line-height:1.7;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header"><h1>📚 IELTS 오답노트</h1><p>Cambridge 16–20 · Reading</p></div>
  <div id="nav-tree"></div>
</div>
<button id="toggle-sidebar" onclick="toggleSidebar()" title="사이드바 닫기">‹</button>
<div id="main">
  <div id="topbar"><h2 id="ptitle">패시지를 선택하세요</h2><span id="ptopic" class="topic-chip" style="display:none"></span></div>
  <div id="tabs">
    <div class="tab-btn active" data-tab="sents">① 문장별 학습</div>
    <div class="tab-btn" data-tab="vocab">📖 전체 어휘</div>
    <div class="tab-btn" data-tab="tfng">❌ T/F/NG 오답</div>
    <div class="tab-btn" data-tab="summary">🗺️ 구조도</div>
  </div>
  <div id="content">
    <div id="tab-sents" class="tab-panel active"><div class="empty"><div class="em">👈</div><h3>왼쪽에서 패시지를 선택하세요</h3><p>Cambridge 16–20 총 60개 패시지</p></div></div>
    <div id="tab-vocab" class="tab-panel"></div>
    <div id="tab-tfng" class="tab-panel"></div>
    <div id="tab-summary" class="tab-panel"></div>
  </div>
</div>
<script>

const PASSAGES = {

"C16_T1_P1": {
  title:"Cambridge 16 · Test 1 · Passage 1",
  topic:"Why We Need to Protect Polar Bears",
  qTypes:["True / False / Not Given","Table Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 기후변화와 지방의 역설"},
    {num:1,en:"Polar bears are being increasingly threatened by the effects of climate change, but their disappearance could have far-reaching consequences.",
     kr:"북극곰은 기후변화의 영향으로 점점 더 위협받고 있지만, 그들의 소멸은 광범위한 결과를 초래할 수 있다.",
     grammar:"<strong>be being + p.p.</strong> → 현재진행 수동태. <strong>far-reaching</strong> = '광범위한' IELTS 빈출.",
     vocab:[{w:"threatened",pos:"adj",kr:"위협받는"},{w:"increasingly",pos:"adv",kr:"점점 더"},{w:"far-reaching",pos:"adj",kr:"광범위한"},{w:"consequences",pos:"n",kr:"결과, 영향"}]},
    {num:2,en:"They are uniquely adapted to the extreme conditions of the Arctic Circle, where temperatures can reach -40°C.",
     kr:"이들은 기온이 영하 40도까지 떨어지는 북극권의 극한 환경에 독특하게 적응해 있다.",
     grammar:"<strong>be adapted to</strong> = '~에 적응하다'. <strong>where</strong>는 관계부사 (= in which).",
     vocab:[{w:"uniquely",pos:"adv",kr:"독특하게"},{w:"adapted to",pos:"phrase",kr:"~에 적응된"},{w:"extreme",pos:"adj",kr:"극한의"}]},
    {num:3,en:"One reason for this is that they have up to 11 centimetres of fat underneath their skin.",
     kr:"그 이유 중 하나는 이들의 피부 아래에 최대 11센티미터 두께의 지방이 있다는 것이다.",
     grammar:"<strong>One reason for this is that ~</strong>: 앞 내용을 설명하는 전형적 구조. <strong>up to</strong> = '최대 ~까지'.",
     vocab:[{w:"up to",pos:"prep",kr:"최대 ~까지"},{w:"underneath",pos:"prep",kr:"~의 아래에"}]},
    {num:4,en:"Humans with comparative levels of adipose tissue would be considered obese and would be likely to suffer from diabetes and heart disease.",
     kr:"비슷한 수준의 지방 조직을 가진 인간이라면 비만으로 여겨지고 당뇨병과 심장 질환을 앓을 가능성이 높을 것이다.",
     grammar:"<strong>would be considered / would be likely to</strong> → 가정법 현재. <strong>adipose tissue</strong> = 지방 조직(의학 용어).",
     vocab:[{w:"comparative",pos:"adj",kr:"비교적, 유사 수준의"},{w:"adipose tissue",pos:"n",kr:"지방 조직"},{w:"obese",pos:"adj",kr:"비만인"},{w:"diabetes",pos:"n",kr:"당뇨병"}]},
    {num:5,en:"Yet the polar bear experiences no such consequences.",
     kr:"그러나 북극곰은 그러한 결과를 전혀 경험하지 않는다.",
     grammar:"<strong>Yet</strong> = 역접 접속사. <strong>no such consequences</strong>는 앞 문장(비만·당뇨·심장병)을 통째로 부정. Q1 FALSE의 핵심 근거.",
     vocab:[{w:"yet",pos:"conj",kr:"그러나"},{w:"consequences",pos:"n",kr:"결과"}]},
    {type:"para",label:"Para 2",role:"유전자 연구 — 심장병 모델"},
    {num:6,en:"A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery.",
     kr:"Shi Ping Liu와 동료들이 2014년 수행한 연구가 이 미스터리를 밝혀준다.",
     grammar:"<strong>shed light on</strong> = '~을 밝히다' IELTS 빈출 관용어.",
     vocab:[{w:"shed light on",pos:"idiom",kr:"~을 밝히다"}]},
    {num:7,en:"They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears.",
     kr:"그들은 북극곰의 유전 구조를 더 따뜻한 기후에 사는 가장 가까운 친척인 불곰의 그것과 비교했다.",
     grammar:"<strong>compare A with B</strong>. <strong>that of</strong>는 'the genetic structure of'의 반복을 피하는 대명사. Q2 FALSE 핵심.",
     vocab:[{w:"genetic structure",pos:"n",kr:"유전 구조"},{w:"relatives",pos:"n",kr:"친척, 근연종"}]},
    {num:8,en:"This allowed them to determine the genes that have allowed polar bears to survive in one of the toughest environments on Earth.",
     kr:"이를 통해 북극곰이 지구에서 가장 혹독한 환경 중 하나에서 살아남도록 한 유전자들을 밝혀낼 수 있었다.",
     grammar:"<strong>allow A to do</strong> 구조 2회 반복. <strong>one of the toughest</strong> = 최상급 복수 구조.",
     vocab:[{w:"determine",pos:"v",kr:"밝히다, 결정하다"},{w:"survive",pos:"v",kr:"살아남다"}]},
    {num:9,en:"Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) – a form of 'bad' cholesterol.",
     kr:"Liu 연구팀은 북극곰이 APoB라는 유전자를 가지며, 이 유전자가 나쁜 콜레스테롤인 저밀도 지단백(LDL) 수치를 낮춘다는 것을 발견했다.",
     grammar:"<strong>known as</strong> = 과거분사구. <strong>which reduces</strong> = 비제한적 관계절. 대시(–) = 동격 설명. Q4 TRUE 핵심.",
     vocab:[{w:"gene",pos:"n",kr:"유전자"},{w:"known as",pos:"phrase",kr:"~로 알려진"},{w:"reduce",pos:"v",kr:"낮추다"},{w:"cholesterol",pos:"n",kr:"콜레스테롤"}]},
    {num:10,en:"In humans, mutations of this gene are associated with increased risk of heart disease.",
     kr:"인간에서는 이 유전자의 돌연변이가 심장 질환 위험 증가와 연관되어 있다.",
     grammar:"<strong>be associated with</strong> = '~와 연관되다' 빈출 수동 표현.",
     vocab:[{w:"mutation",pos:"n",kr:"돌연변이"},{w:"associated with",pos:"phrase",kr:"~와 연관된"}]},
    {num:11,en:"Polar bears may therefore be an important study model to understand heart disease in humans.",
     kr:"따라서 북극곰은 인간의 심장 질환을 이해하는 중요한 연구 모델이 될 수 있다.",
     grammar:"<strong>may therefore be</strong>: may = 가능성, therefore = 앞 내용의 결론.",
     vocab:[{w:"therefore",pos:"adv",kr:"따라서"},{w:"study model",pos:"n",kr:"연구 모델"}]},
    {type:"para",label:"Para 3",role:"골다공증 연구"},
    {num:12,en:"The genome of the polar bear may also provide the solution for another condition, one that particularly affects our older generation: osteoporosis.",
     kr:"북극곰의 게놈은 노년층에 특히 영향을 미치는 또 다른 질환, 즉 골다공증의 해결책도 제공할 수 있다.",
     grammar:"콜론(:) 뒤 <strong>osteoporosis</strong>는 'another condition'의 동격. <strong>one that</strong> = 'a condition that'의 압축.",
     vocab:[{w:"genome",pos:"n",kr:"유전체, 게놈"},{w:"condition",pos:"n",kr:"(의학적) 질환"},{w:"osteoporosis",pos:"n",kr:"골다공증"}]},
    {num:13,en:"This is a disease where bones show reduced density, usually caused by insufficient exercise, reduced calcium intake or food starvation.",

    {num:15,en:"Female polar bears, however, undergo extreme conditions during every pregnancy.",

    {num:20,en:"They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens.",

     vocab:[{w:"pregnant",pos:"adj",kr:"임신한"}]},

    {num:23,en:"If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit.",

    {num:27,en:"And yet anecdotal evidence from the field challenges those assumptions, suggesting for example that polar bears have good problem-solving abilities.",

    {num:28,en:"A male bear called GoGo in Tennoji Zoo, Osaka, has even been observed making use of a tool to manipulate his environment.",

    {num:29,en:"The bear used a tree branch on multiple occasions to dislodge a piece of meat hung out of his reach.",

     grammar:"<strong>on multiple occasions</strong> = '여러 차례'. <strong>dislodge</strong> = '제자리에서 떼어내다'. Q10 정답(meat).",

    {type:"para",label:"Para 6",role:"Ames 연구 — 창의성"},
    {num:32,en:"In other studies, such as one by Alison Ames in 2008, polar bears showed deliberate and focused manipulation.",

    {num:38,en:"Remarkably, one hand-raised polar bear called Agee has formed a close relationship with her owner Mark Dumas to the point where they even swim together.",
     kr:"놀랍게도, Agee라는 손수 키운 북극곰은 주인 Mark Dumas와 함께 수영까지 할 정도로 친밀한 관계를 형성했다.",

     vocab:[{w:"astonishing",pos:"adj",kr:"놀라운"},{w:"actively",pos:"adv",kr:"적극적으로"}]},

"C18_T2_P1": {

  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 스톤헨지 소개"},
    {num:1,en:"For centuries, historians and archaeologists have puzzled over the many mysteries of Stonehenge, a prehistoric monument that took an estimated 1,500 years to erect.",
     kr:"수 세기 동안 역사학자와 고고학자들은 건설에 약 1,500년이 걸린 것으로 추정되는 선사 시대 기념물 스톤헨지의 많은 수수께끼에 당혹감을 느껴왔다.",
     grammar:"<strong>have puzzled over</strong> = 현재완료(오랫동안 지속). <strong>a prehistoric monument</strong>는 Stonehenge의 동격. <strong>took ~ to erect</strong> = '건설하는 데 ~이 걸렸다'.",
     vocab:[{w:"puzzle over",pos:"phrasal v",kr:"~에 당혹해하다, 고민하다"},{w:"prehistoric",pos:"adj",kr:"선사 시대의"},{w:"monument",pos:"n",kr:"기념물"},{w:"erect",pos:"v",kr:"세우다, 건설하다"}]},
    {num:2,en:"Located on Salisbury Plain in southern England, it is comprised of roughly 100 massive upright stones placed in a circular layout.",
     kr:"잉글랜드 남부 솔즈베리 평원에 위치한 이 유적은 원형 배열로 놓인 약 100개의 거대한 직립 돌로 이루어져 있다.",
     grammar:"<strong>Located on</strong> = 과거분사 분사구문(= Because/As it is located). <strong>be comprised of</strong> = '~으로 구성되다'. <strong>upright</strong> = '직립한'.",
     vocab:[{w:"comprised of",pos:"phrase",kr:"~으로 구성된"},{w:"upright",pos:"adj",kr:"직립한"},{w:"circular layout",pos:"n",kr:"원형 배열"}]},
    {type:"para",label:"Para 2",role:"1단계 — 도랑과 기둥"},
    {num:3,en:"Archaeologists believe England's most iconic prehistoric ruin was built in several stages with the earliest constructed 5,000 or more years ago.",
     kr:"고고학자들은 영국에서 가장 상징적인 선사 시대 유적이 여러 단계에 걸쳐 건설되었으며, 가장 초기 단계는 5,000년 이상 전에 이루어진 것으로 보고 있다.",
     grammar:"<strong>with the earliest constructed</strong> = 'with + 명사 + 분사' 독립분사구문. <strong>iconic</strong> = '상징적인' IELTS 빈출.",
     vocab:[{w:"iconic",pos:"adj",kr:"상징적인"},{w:"ruin",pos:"n",kr:"유적, 폐허"},{w:"stage",pos:"n",kr:"단계"}]},
    {num:4,en:"First, Neolithic Britons used primitive tools, which may have been fashioned out of deer antlers, to dig a massive circular ditch and bank, or henge.",
     kr:"먼저, 신석기 시대 영국인들은 사슴 뿔로 만들어졌을 가능성이 있는 원시적인 도구를 사용해 거대한 원형 도랑과 둑, 즉 헨지를 팠다.",
     grammar:"<strong>which may have been fashioned out of</strong>: 비제한적 관계절 + may have p.p.(과거에 대한 추측). <strong>fashioned out of</strong> = '~으로 만들어진'. Q1 정답(deer antlers).",
     vocab:[{w:"Neolithic",pos:"adj",kr:"신석기 시대의"},{w:"primitive",pos:"adj",kr:"원시적인"},{w:"fashion",pos:"v",kr:"만들다, 제작하다"},{w:"antler",pos:"n",kr:"사슴 뿔"},{w:"ditch",pos:"n",kr:"도랑"},{w:"henge",pos:"n",kr:"헨지(원형 토루)"}]},
    {num:5,en:"Deep pits dating back to that era and located within the circle may have once held a ring of timber posts, according to some scholars.",
     kr:"일부 학자들에 따르면, 그 시대로 거슬러 올라가 원 안에 위치한 깊은 구덩이들은 한때 목재 기둥 고리를 지탱했을 수 있다.",
     grammar:"<strong>dating back to</strong>와 <strong>located within</strong>은 pits를 수식하는 분사구. <strong>may have once held</strong> = 과거 가능성 추측. Q2 정답(timber posts).",
     vocab:[{w:"dating back to",pos:"phrase",kr:"~로 거슬러 올라가는"},{w:"pit",pos:"n",kr:"구덩이"},{w:"timber",pos:"n",kr:"목재"},{w:"post",pos:"n",kr:"기둥"}]},
    {type:"para",label:"Para 3",role:"2단계 — 청석 이동 수수께끼"},
    {num:6,en:"Several hundred years later, it is thought, Stonehenge's builders hoisted an estimated 80 bluestones, 43 of which remain today, into standing positions and placed them in either a horseshoe or circular formation.",
     kr:"수백 년 후, 스톤헨지 건설자들은 약 80개의 청석(현재 43개 남음)을 직립 위치로 들어 올려 말굽형 또는 원형 배열로 놓은 것으로 추정된다.",
     grammar:"<strong>it is thought</strong>는 삽입구(추측 표현). <strong>43 of which remain today</strong> = 비제한적 관계절. <strong>hoist</strong> = '들어 올리다'.",
     vocab:[{w:"hoist",pos:"v",kr:"들어 올리다"},{w:"bluestone",pos:"n",kr:"청석"},{w:"horseshoe",pos:"n",kr:"말굽형"},{w:"formation",pos:"n",kr:"배열, 형태"}]},
    {num:7,en:"These stones have been traced all the way to the Preseli Hills in Wales, some 300 kilometres from Stonehenge.",
     kr:"이 돌들은 스톤헨지에서 약 300킬로미터 떨어진 웨일스의 프레셀리 구릉지까지 거슬러 추적되었다.",
     grammar:"<strong>have been traced</strong> = 현재완료 수동태. <strong>all the way to</strong> = '저 멀리 ~까지'. <strong>some 300 kilometres</strong> = 'approximately 300 km'.",
     vocab:[{w:"trace",pos:"v",kr:"추적하다, 거슬러 올라가다"},{w:"all the way to",pos:"phrase",kr:"저 멀리 ~까지"}]},
    {num:8,en:"How, then, did prehistoric builders without sophisticated tools or engineering haul these boulders, which weigh up to four tons, over such a great distance?",
     kr:"그렇다면, 정교한 도구나 공학 기술도 없는 선사 시대 건설자들이 어떻게 최대 4톤에 달하는 이 바위들을 그토록 먼 거리까지 운반했을까?",
     grammar:"수사의문문(rhetorical question). <strong>sophisticated</strong> = '정교한'. <strong>haul</strong> = '끌다, 운반하다'. <strong>which weigh up to</strong> = 비제한적 관계절.",
     vocab:[{w:"sophisticated",pos:"adj",kr:"정교한, 고도의"},{w:"haul",pos:"v",kr:"운반하다, 끌다"},{w:"boulder",pos:"n",kr:"바위, 큰 돌"}]},
    {type:"para",label:"Para 4",role:"고고학적 이론 — 운반 방법"},
    {num:9,en:"According to one long-standing theory among archaeologists, Stonehenge's builders fashioned sledges and rollers out of tree trunks to lug the bluestones from the Preseli Hills.",
     kr:"고고학자들 사이에서 오래된 이론에 따르면, 스톤헨지 건설자들이 나무 줄기로 썰매와 롤러를 만들어 프레셀리 구릉지에서 청석을 끌어온 것이다.",
     grammar:"<strong>According to</strong> = '~에 따르면'. <strong>fashion A out of B</strong> = 'B로 A를 만들다'. Q3 정답(tree trunks).",
     vocab:[{w:"long-standing",pos:"adj",kr:"오래된, 오래 지속된"},{w:"sledge",pos:"n",kr:"썰매"},{w:"roller",pos:"n",kr:"롤러"},{w:"trunk",pos:"n",kr:"나무 줄기"},{w:"lug",pos:"v",kr:"끌다, 운반하다"}]},
    {num:10,en:"They then transferred the boulders onto rafts and floated them first along the Welsh coast and then up the River Avon toward Salisbury Plain; alternatively, they may have towed each stone with a fleet of vessels.",
     kr:"그런 다음 바위를 뗏목에 올려 웨일스 해안을 따라, 이어 에이번 강을 거슬러 솔즈베리 평원 쪽으로 운반했거나, 선단 선박으로 각 돌을 예인했을 수도 있다.",
     grammar:"세미콜론(;)으로 두 이론 병렬. <strong>alternatively</strong> = '아니면, 대안으로'. <strong>may have towed</strong> = 과거 가능성. <strong>fleet</strong> = '선단'.",
     vocab:[{w:"raft",pos:"n",kr:"뗏목"},{w:"alternatively",pos:"adv",kr:"아니면, 대안으로"},{w:"tow",pos:"v",kr:"예인하다, 끌다"},{w:"fleet",pos:"n",kr:"선단, 함대"},{w:"vessel",pos:"n",kr:"선박"}]},
    {num:11,en:"More recent archaeological hypotheses have them transporting the bluestones with supersized wicker baskets on a combination of ball bearings and long grooved planks, hauled by oxen.",
     kr:"더 최근의 고고학적 가설은 초대형 바구니에 청석을 담아 볼 베어링과 긴 홈 판자 조합 위에서 소가 끌어 운반했다고 본다.",
     grammar:"<strong>have them transporting</strong>: 'have + 목적어 + v-ing'(사역 표현). Q4 정답(oxen).",
     vocab:[{w:"hypothesis",pos:"n",kr:"가설"},{w:"wicker",pos:"adj",kr:"고리버들로 만든"},{w:"ball bearing",pos:"n",kr:"볼 베어링"},{w:"grooved",pos:"adj",kr:"홈이 파인"},{w:"plank",pos:"n",kr:"널판자"},{w:"oxen",pos:"n",kr:"소(복수)"}]},
    {type:"para",label:"Para 5",role:"지질학적 이론 — 빙하"},
    {num:12,en:"As early as the 1970s, geologists have been adding their voices to the debate over how Stonehenge came into being.",
     kr:"1970년대부터 지질학자들은 스톤헨지가 어떻게 생겨났는지에 대한 논쟁에 자신들의 목소리를 더해왔다.",
     grammar:"<strong>As early as</strong> = '이미 ~ 때부터'. <strong>have been adding</strong> = 현재완료 진행. <strong>come into being</strong> = '생겨나다, 탄생하다'.",
     vocab:[{w:"geologist",pos:"n",kr:"지질학자"},{w:"debate",pos:"n",kr:"논쟁"},{w:"come into being",pos:"phrase",kr:"생겨나다, 탄생하다"}]},
    {num:13,en:"Challenging the classic image of industrious builders pushing, carting, rolling or hauling giant stones from faraway Wales, some scientists have suggested that it was glaciers, not humans, that carried the bluestones to Salisbury Plain.",
     kr:"멀리 웨일스에서 거대한 돌을 밀고, 수레로 나르고, 굴리고, 끌어온 부지런한 건설자들의 전통적인 이미지에 도전하며, 일부 과학자들은 청석을 솔즈베리 평원으로 운반한 것은 인간이 아닌 빙하였다고 제안했다.",
     grammar:"<strong>Challenging ~</strong> = 분사구문(동시 행위). <strong>it was glaciers, not humans, that ~</strong> = 강조 구문(it ~ that 분열문). Q5 정답(glaciers).",
     vocab:[{w:"industrious",pos:"adj",kr:"부지런한, 근면한"},{w:"glacier",pos:"n",kr:"빙하"},{w:"faraway",pos:"adj",kr:"먼, 멀리 있는"}]},
    {num:14,en:"Most archaeologists have remained sceptical about this theory, however, wondering how the forces of nature could possibly have delivered the exact number of stones needed to complete the circle.",
     kr:"그러나 대부분의 고고학자들은 이 이론에 회의적인 태도를 유지하며, 자연의 힘이 어떻게 원을 완성하는 데 필요한 정확한 수의 돌을 가져다줄 수 있었는지 의문을 품고 있다.",
     grammar:"<strong>remain sceptical about</strong> = '~에 대해 회의적인 상태를 유지하다'. <strong>wondering</strong> = 분사구문. <strong>could possibly have delivered</strong> = 추측 강조.",
     vocab:[{w:"sceptical",pos:"adj",kr:"회의적인"},{w:"forces of nature",pos:"n",kr:"자연의 힘"},{w:"possibly",pos:"adv",kr:"어떻게든, 혹시"}]},
    {type:"para",label:"Para 6",role:"3단계 — 사암(사르센석)"},

     vocab:[{w:"take place",pos:"phrase",kr:"이루어지다, 발생하다"},{w:"BCE",pos:"abbr",kr:"기원전(Before Common Era)"}]},
    {num:16,en:"At this point, sandstone slabs – known as 'sarsens' – were arranged into an outer crescent or ring; some were assembled into the iconic three-pieced structures called trilithons that stand tall in the centre of Stonehenge.",
     kr:"이 시점에 사암 판(사르센이라고 알려짐)이 외부 초승달 또는 고리 형태로 배열되었고, 일부는 스톤헨지 중앙에 우뚝 서 있는 세 조각 구조물인 삼석문(트릴리톤)으로 조립되었다.",
     grammar:"대시(–) = 동격 설명. 세미콜론(;) = 두 절 병렬. <strong>stand tall</strong> = '우뚝 서 있다'. Q9 TRUE 핵심(외부 + 중앙 모두).",
     vocab:[{w:"sandstone slab",pos:"n",kr:"사암 판"},{w:"sarsen",pos:"n",kr:"사르센석(사암)"},{w:"crescent",pos:"n",kr:"초승달 모양"},{w:"trilithon",pos:"n",kr:"삼석문(세 개의 돌로 된 구조물)"}]},
    {num:17,en:"Some 50 of these stones are now visible on the site, which may once have contained many more.",
     kr:"현재 현장에서는 약 50개의 돌이 보이며, 한때는 훨씬 더 많았을 수 있다.",
     grammar:"<strong>Some 50</strong> = 'approximately 50'. <strong>which may once have contained</strong> = 비제한적 관계절 + 과거 가능성 추측.",
     vocab:[{w:"visible",pos:"adj",kr:"눈에 보이는"}]},
    {num:18,en:"Radiocarbon dating has revealed that work continued at Stonehenge until roughly 1600 BCE, with the bluestones in particular being repositioned multiple times.",
     kr:"방사성탄소 연대 측정에 따르면 작업은 기원전 약 1600년까지 계속되었으며, 특히 청석은 여러 차례 재배치되었다.",
     grammar:"<strong>Radiocarbon dating</strong> = 방사성탄소 연대 측정. <strong>with ~ being repositioned</strong> = '~ 됨으로써'(독립분사구문). Q10 FALSE 핵심.",
     vocab:[{w:"radiocarbon dating",pos:"n",kr:"방사성탄소 연대 측정"},{w:"reveal",pos:"v",kr:"밝히다"},{w:"reposition",pos:"v",kr:"재배치하다"},{w:"multiple times",pos:"adv",kr:"여러 차례"}]},
    {type:"para",label:"Para 7",role:"건설자 — 드루이드 이론"},
    {num:19,en:"But who were the builders of Stonehenge?",
     kr:"그렇다면 스톤헨지를 건설한 사람들은 누구였을까?",
     grammar:"수사의문문으로 단락 전환. 독자의 관심을 새 주제(건설자)로 끌어들이는 수법.",
     vocab:[]},
    {num:20,en:"In the 17th century, archaeologist John Aubrey made the claim that Stonehenge was the work of druids, who had important religious, judicial and political roles in Celtic society.",
     kr:"17세기에 고고학자 John Aubrey는 스톤헨지가 드루이드교도들의 작품이라고 주장했는데, 이들은 켈트 사회에서 중요한 종교적·사법적·정치적 역할을 담당했다.",
     grammar:"<strong>make the claim that</strong> = '~라고 주장하다'. <strong>who had</strong> = 비제한적 관계절(druids 추가 설명). Q6 정답(druids).",
     vocab:[{w:"druid",pos:"n",kr:"드루이드(켈트 사제)"},{w:"judicial",pos:"adj",kr:"사법의"},{w:"Celtic",pos:"adj",kr:"켈트족의"}]},
    {num:21,en:"This theory was widely popularized by the antiquarian William Stukeley, who had unearthed primitive graves at the site.",
     kr:"이 이론은 유적지에서 원시 무덤을 발굴한 고물 수집가 William Stukeley에 의해 널리 대중화되었다.",
     grammar:"<strong>popularize</strong> = '대중화하다'. <strong>antiquarian</strong> = '고물 수집가, 골동품 연구자'. <strong>unearthed</strong> = '발굴된'.",
     vocab:[{w:"popularize",pos:"v",kr:"대중화하다"},{w:"antiquarian",pos:"n",kr:"고물 수집가"},{w:"unearth",pos:"v",kr:"발굴하다"}]},
    {num:22,en:"Even today, people who identify as modern druids continue to gather at Stonehenge for the summer solstice.",
     kr:"오늘날에도 현대 드루이드교도라고 자처하는 사람들이 하지 때 스톤헨지에 모인다.",
     grammar:"<strong>identify as</strong> = '~로 자처하다, 정체화하다'. <strong>summer solstice</strong> = '하지(夏至)'.",
     vocab:[{w:"identify as",pos:"phrase",kr:"~로 자처하다"},{w:"solstice",pos:"n",kr:"지점(至點); 하지/동지"}]},
    {num:23,en:"However, in the mid-20th century, radiocarbon dating demonstrated that Stonehenge stood more than 1,000 years before the Celts inhabited the region.",
     kr:"그러나 20세기 중반, 방사성탄소 연대 측정으로 스톤헨지가 켈트족이 이 지역에 거주하기 1,000년 이상 전에 세워졌음이 밝혀졌다.",
     grammar:"<strong>demonstrate</strong> = '(증거로) 입증하다'. <strong>inhabited</strong> = '거주했다'. Q11 FALSE 핵심: 20세기 발견이 Aubrey 주장을 지지하지 않고 오히려 반박함.",
     vocab:[{w:"demonstrate",pos:"v",kr:"입증하다"},{w:"inhabit",pos:"v",kr:"거주하다, 서식하다"}]},
    {type:"para",label:"Para 8",role:"복수 부족 이론"},
    {num:24,en:"Many modern historians and archaeologists now agree that several distinct tribes of people contributed to Stonehenge, each undertaking a different phase of its construction.",
     kr:"현대의 많은 역사학자와 고고학자들은 여러 다른 부족이 각각 다른 단계를 맡아 스톤헨지 건설에 기여했다는 데 동의한다.",
     grammar:"<strong>distinct</strong> = '서로 다른, 별개의'. <strong>each undertaking</strong> = 독립분사구문. <strong>contribute to</strong> = '~에 기여하다'.",
     vocab:[{w:"distinct",pos:"adj",kr:"서로 다른, 뚜렷한"},{w:"tribe",pos:"n",kr:"부족"},{w:"contribute to",pos:"phrasal v",kr:"~에 기여하다"}]},
    {num:25,en:"Bones, tools and other artefacts found on the site seem to support this hypothesis.",
     kr:"유적지에서 발견된 뼈, 도구 및 기타 유물들은 이 가설을 뒷받침하는 것으로 보인다.",
     grammar:"<strong>found on the site</strong> = 과거분사구로 주어를 수식. <strong>seem to support</strong> = 추측 표현. Q12 TRUE 핵심.",
     vocab:[{w:"artefact",pos:"n",kr:"유물, 인공물"},{w:"hypothesis",pos:"n",kr:"가설"}]},
    {num:26,en:"The first stage was achieved by Neolithic agrarians who were likely to have been indigenous to the British Isles.",
     kr:"첫 번째 단계는 영국 제도 원주민이었을 가능성이 높은 신석기 시대 농경인들에 의해 이루어졌다.",
     grammar:"<strong>agrarian</strong> = '농경인'. <strong>indigenous to</strong> = '~의 원주민인'. <strong>likely to have been</strong> = 과거 가능성 추측.",
     vocab:[{w:"agrarian",pos:"n",kr:"농경인"},{w:"indigenous",pos:"adj",kr:"원주민의, 토착의"}]},
    {num:27,en:"Later, it is believed, groups with advanced tools and a more communal way of life left their mark on the site.",
     kr:"이후에는 더 발전된 도구와 공동체적 생활 방식을 가진 집단들이 유적지에 자신들의 흔적을 남긴 것으로 믿어진다.",
     grammar:"<strong>it is believed</strong> = 삽입 수동 표현. <strong>leave one's mark on</strong> = '~에 흔적을 남기다'. <strong>communal</strong> = '공동체적인'.",
     vocab:[{w:"communal",pos:"adj",kr:"공동체적인"},{w:"leave one's mark on",pos:"phrase",kr:"~에 흔적을 남기다"}]},
    {num:28,en:"Some believe that they were immigrants from the European continent, while others maintain that they were probably native Britons, descended from the original builders.",
     kr:"일부는 그들이 유럽 대륙에서 온 이민자라고 믿는 반면, 다른 이들은 원래 건설자들의 후손인 원주민 영국인이었을 것이라고 주장한다.",
     grammar:"<strong>while</strong> = 대조 접속사. <strong>maintain</strong> = '주장하다'(격식체). <strong>descended from</strong> = '~의 후손인'.",
     vocab:[{w:"immigrant",pos:"n",kr:"이민자"},{w:"maintain",pos:"v",kr:"주장하다"},{w:"descended from",pos:"phrase",kr:"~의 후손인"}]},
    {type:"para",label:"Para 9",role:"목적 — 매장지"},
    {num:29,en:"If the facts surrounding the architects and construction of Stonehenge remain shadowy at best, the purpose of the striking monument is even more of a mystery.",
     kr:"스톤헨지의 설계자와 건설에 관한 사실이 기껏해야 불분명한 상태라면, 이 인상적인 기념물의 목적은 더욱 수수께끼다.",
     grammar:"<strong>shadowy at best</strong> = '기껏해야 불분명한'. <strong>even more of a mystery</strong> = '훨씬 더 큰 수수께끼'. <strong>striking</strong> = '인상적인'.",
     vocab:[{w:"shadowy",pos:"adj",kr:"불분명한, 모호한"},{w:"at best",pos:"phrase",kr:"기껏해야"},{w:"striking",pos:"adj",kr:"인상적인, 두드러진"}]},
    {num:30,en:"While there is consensus among the majority of modern scholars that Stonehenge once served the function of burial ground, they have yet to determine what other purposes it had.",
     kr:"대부분의 현대 학자들은 스톤헨지가 매장지 역할을 했다는 데 의견이 일치하지만, 어떤 다른 목적이 있었는지는 아직 밝혀내지 못하고 있다.",
     grammar:"<strong>consensus</strong> = '합의, 일치'. <strong>have yet to determine</strong> = '아직 ~을 밝혀내지 못하다'. Q7 정답(burial).",
     vocab:[{w:"consensus",pos:"n",kr:"합의, 의견 일치"},{w:"burial ground",pos:"n",kr:"매장지"},{w:"have yet to",pos:"phrase",kr:"아직 ~하지 못하다"}]},
    {type:"para",label:"Para 10",role:"목적 — 달력 이론"},
    {num:31,en:"In the 1960s, the astronomer Gerald Hawkins suggested that the cluster of megalithic stones operated as a form of calendar, with different points corresponding to astrological phenomena such as solstices, equinoxes and eclipses occurring at different times of the year.",
     kr:"1960년대에 천문학자 Gerald Hawkins는 거석 군이 달력의 형태로 기능했으며, 각 지점이 하지·동지, 춘분·추분, 일식 같은 천문 현상에 해당한다고 제안했다.",
     grammar:"<strong>with different points corresponding to</strong> = 독립분사구문. <strong>solstice/equinox/eclipse</strong>는 IELTS 빈출 천문 용어. Q8 정답(calendar).",
     vocab:[{w:"megalithic",pos:"adj",kr:"거석의"},{w:"correspond to",pos:"phrasal v",kr:"~에 해당하다"},{w:"solstice",pos:"n",kr:"지점(하지/동지)"},{w:"equinox",pos:"n",kr:"분점(춘분/추분)"},{w:"eclipse",pos:"n",kr:"일식, 월식"}]},
    {num:32,en:"While his theory has received a considerable amount of attention over the decades, critics maintain that Stonehenge's builders probably lacked the knowledge necessary to predict such events or that England's dense cloud cover would have obscured their view of the skies.",
     kr:"그의 이론은 수십 년 동안 상당한 주목을 받아왔지만, 비평가들은 스톤헨지 건설자들이 이러한 현상을 예측할 지식이 없었거나 잉글랜드의 짙은 구름이 하늘을 가렸을 것이라고 주장한다.",
     grammar:"<strong>While</strong> = 양보(비록 ~이지만). <strong>critics maintain that</strong> 뒤에 두 개의 that절 병렬. <strong>obscure</strong> = '가리다, 모호하게 하다'. Q13 NOT GIVEN 핵심(critics가 '주로 천문학자'라는 내용 없음).",
     vocab:[{w:"considerable",pos:"adj",kr:"상당한"},{w:"lacked",pos:"v",kr:"~이 부족했다"},{w:"dense",pos:"adj",kr:"짙은, 밀집한"},{w:"obscure",pos:"v",kr:"가리다, 모호하게 하다"}]},
    {type:"para",label:"Para 11",role:"목적 — 치유 장소 이론"},
    {num:33,en:"More recently, signs of illness and injury in the human remains unearthed at Stonehenge led a group of British archaeologists to speculate that it was considered a place of healing, perhaps because bluestones were thought to have curative powers.",
     kr:"더 최근에는, 스톤헨지에서 발굴된 인골에서 발견된 질병과 부상의 흔적으로 인해 영국 고고학자 집단이 이곳이 치유의 장소로 여겨졌으며, 아마도 청석에 치유력이 있다고 생각되었기 때문일 것이라고 추측했다.",
     grammar:"<strong>lead A to speculate</strong> = 'A가 ~을 추측하게 하다'. <strong>curative powers</strong> = '치유력'. <strong>were thought to have</strong> = 수동 추측.",
     vocab:[{w:"remains",pos:"n",kr:"유해, 유골"},{w:"speculate",pos:"v",kr:"추측하다"},{w:"healing",pos:"n",kr:"치유"},{w:"curative",pos:"adj",kr:"치유력이 있는"}]}

     kr:"오늘날 세계는 방치될 경우 광범위한 이주, 멸종, 사망을 초래할 것으로 예측되는 기후 위기의 기로에 서 있다.",
     grammar:"<strong>on the cusp of</strong> = '~의 기로에'. <strong>if left unaddressed</strong> = 조건절 압축(if it is left).",
     vocab:[{w:"on the cusp of",pos:"phrase",kr:"~의 기로에"},{w:"displacement",pos:"n",kr:"이주, 이동"},{w:"unaddressed",pos:"adj",kr:"해결되지 않은"}]},
    {num:7,en:"Then, as now, radical solutions were called for to revolutionise the way people lived and safeguard humanity against catastrophe.",
     kr:"그때도 지금처럼, 사람들의 생활 방식을 혁신하고 인류를 재앙으로부터 보호하기 위한 급진적인 해결책이 요구되었다.",
     grammar:"<strong>Then, as now</strong> = '그때도 지금처럼'(비교 강조). <strong>be called for</strong> = '요구되다'. Q29 TRUE 핵심.",
     vocab:[{w:"radical",pos:"adj",kr:"급진적인"},{w:"revolutionise",pos:"v",kr:"혁신하다"},{w:"safeguard",pos:"v",kr:"보호하다"},{w:"catastrophe",pos:"n",kr:"재앙"}]},
    {type:"para",label:"Para 3",role:"다빈치의 이상 도시 프로젝트"},
    {num:8,en:"Around 1486 – after a pestilence that killed half the population in Milan, Italy – Leonardo turned his thoughts to urban planning problems.",
     kr:"약 1486년경, 이탈리아 밀라노 인구의 절반을 앗아간 전염병 이후 레오나르도는 도시 계획 문제에 눈을 돌렸다.",
     grammar:"대시(–) 사이 = 삽입 배경 설명. <strong>pestilence</strong> = '전염병'. <strong>turn one's thoughts to</strong> = '~에 관심을 돌리다'.",
     vocab:[{w:"pestilence",pos:"n",kr:"전염병"},{w:"urban planning",pos:"n",kr:"도시 계획"}]},
    {num:9,en:"Following a typical Renaissance trend, he began to work on an 'ideal city' project, which – due to its excessive costs – would remain unfulfilled.",
     kr:"전형적인 르네상스 트렌드를 따라 그는 '이상 도시' 프로젝트에 착수했지만, 과도한 비용으로 인해 미실현 상태로 남았다.",
     grammar:"<strong>due to</strong> = '~로 인해'. <strong>would remain unfulfilled</strong> = '미실현으로 남을 것이었다'. Q30 FALSE 핵심.",
     vocab:[{w:"excessive",pos:"adj",kr:"과도한, 지나친"},{w:"unfulfilled",pos:"adj",kr:"실현되지 않은"}]},
    {num:10,en:"Yet given that unsustainable urban models are a key cause of global climate change today, it's only natural to wonder how Leonardo might have changed the shape of modern cities.",
     kr:"그러나 지속 불가능한 도시 모델이 오늘날 지구 기후 변화의 주요 원인임을 감안하면, 레오나르도가 현대 도시의 모습을 어떻게 바꿀 수 있었을지 궁금해하는 것은 당연하다.",
     grammar:"<strong>given that</strong> = '~을 감안하면'. <strong>it's only natural to</strong> = '~하는 것은 당연하다'. Q31 TRUE 핵심(unsustainable urban models = key cause).",
     vocab:[{w:"unsustainable",pos:"adj",kr:"지속 불가능한"},{w:"it's only natural to",pos:"phrase",kr:"~하는 것은 당연하다"}]},
    {type:"para",label:"Para 4",role:"르네상스 도시계획의 탄생"},
    {num:11,en:"Although the Renaissance is renowned as an era of incredible progress in art and architecture, it is rarely noted that the 15th century also marked the birth of urbanism as a true academic discipline.",
     kr:"르네상스는 예술과 건축의 엄청난 진보의 시대로 유명하지만, 15세기가 도시주의가 진정한 학문 분야로 탄생한 시기라는 점은 거의 주목받지 못한다.",
     grammar:"<strong>renowned as</strong> = '~로 유명한'. <strong>it is rarely noted that</strong> = '~는 거의 주목받지 못한다'. <strong>urbanism</strong> = '도시주의'.",
     vocab:[{w:"renowned",pos:"adj",kr:"유명한"},{w:"urbanism",pos:"n",kr:"도시주의"},{w:"discipline",pos:"n",kr:"학문 분야"}]},
    {num:12,en:"The rigour and method behind the conscious conception of a city had been largely missing in Western thought until the moment when prominent Renaissance men pushed forward large-scale urban projects in Italy, such as the reconfiguration of the town of Pienza and the expansion of the city of Ferrara.",
     kr:"도시의 의식적인 구상 뒤에 있는 엄격함과 방법론은 저명한 르네상스 인들이 피엔차 마을 재편성과 페라라 도시 확장 같은 대규모 도시 프로젝트를 추진할 때까지 서구 사상에서 대부분 빠져 있었다.",
     grammar:"<strong>had been ~ missing</strong> = 과거완료 수동. <strong>rigour</strong> = '엄격함'. Q32 NOT GIVEN 핵심(지역 주민의 저항 언급 없음).",
     vocab:[{w:"rigour",pos:"n",kr:"엄격함, 철저함"},{w:"conception",pos:"n",kr:"구상, 개념"},{w:"reconfiguration",pos:"n",kr:"재편성"},{w:"expansion",pos:"n",kr:"확장"}]},
    {num:13,en:"These works surely inspired Leonardo's decision to rethink the design of medieval cities, with their winding and overcrowded streets and with houses piled against one another.",
     kr:"이러한 작업들이 분명히 레오나르도가 구불구불하고 혼잡한 거리와 다닥다닥 붙어 있는 중세 도시 설계를 재고하도록 결정하는 데 영감을 주었다.",
     grammar:"<strong>with their winding ~ streets</strong> = 중세 도시의 문제점 묘사 독립분사구문. <strong>winding</strong> = '구불구불한'.",
     vocab:[{w:"medieval",pos:"adj",kr:"중세의"},{w:"winding",pos:"adj",kr:"구불구불한"},{w:"overcrowded",pos:"adj",kr:"혼잡한"},{w:"pile against",pos:"phrase",kr:"~에 다닥다닥 붙다"}]},
    {type:"para",label:"Para 5",role:"이상 도시의 구체적 계획"},
    {num:14,en:"It is not easy to identify a coordinated vision of Leonardo's ideal city because of his disordered way of working with notes and sketches.",
     kr:"레오나르도가 노트와 스케치를 무질서하게 작업하는 방식 때문에 그의 이상 도시에 대한 체계적인 비전을 파악하기 쉽지 않다.",
     grammar:"<strong>coordinated</strong> = '체계적인, 조율된'. Q33 FALSE 핵심: <strong>disordered</strong> = '무질서한'(≠ neat/organised).",
     vocab:[{w:"coordinated",pos:"adj",kr:"체계적인, 조율된"},{w:"disordered",pos:"adj",kr:"무질서한"},{w:"sketch",pos:"n",kr:"스케치"}]},
    {num:15,en:"But from the largest collection of Leonardo's papers ever assembled, a series of innovative thoughts can be reconstructed regarding the foundation of a new city along the Ticino River, which runs from Switzerland into Italy and is 248 kilometres long.",
     kr:"그러나 지금까지 모은 가장 큰 레오나르도 문서 컬렉션에서 스위스에서 이탈리아로 흐르는 248킬로미터 길이의 티치노 강을 따라 새 도시를 세우는 것에 관한 혁신적인 사상들을 재구성할 수 있다.",
     grammar:"<strong>can be reconstructed</strong> = 수동태. <strong>which runs</strong> = 비제한적 관계절.",
     vocab:[{w:"assembled",pos:"adj",kr:"수집된, 모인"},{w:"reconstruct",pos:"v",kr:"재구성하다"},{w:"innovative",pos:"adj",kr:"혁신적인"}]},
    {num:16,en:"He designed the city for the easy transport of goods and clean urban spaces, and he wanted a comfortable and spacious city, with well-ordered streets and architecture.",
     kr:"그는 쉬운 물류 운송과 깨끗한 도시 공간을 위해 도시를 설계했으며, 잘 정비된 거리와 건축물을 갖춘 쾌적하고 넓은 도시를 원했다.",
     grammar:"Q34 정답(transport) 핵심.",
     vocab:[{w:"transport",pos:"n",kr:"운송, 수송"},{w:"spacious",pos:"adj",kr:"넓은, 쾌적한"},{w:"well-ordered",pos:"adj",kr:"잘 정비된"}]},
    {num:17,en:"He recommended 'high, strong walls', with 'towers and battlements of all necessary and pleasant beauty'.",
     kr:"그는 '높고 튼튼한 성벽'과 '필요하고 아름다운 탑과 성루'를 권고했다.",
     vocab:[{w:"battlement",pos:"n",kr:"성루, 성벽 위 방어 시설"}]},
    {type:"para",label:"Para 6",role:"다층 도시 설계 — 혁신"},
    {num:18,en:"His plans for a modern and 'rational' city were consistent with Renaissance ideals.",
     kr:"현대적이고 '합리적인' 도시에 대한 그의 계획은 르네상스 이상과 일치했다.",
     vocab:[{w:"rational",pos:"adj",kr:"합리적인"},{w:"consistent with",pos:"phrase",kr:"~와 일치하는"}]},
    {num:19,en:"But, in keeping with his personality, Leonardo included several innovations in his urban design.",
     kr:"하지만 그의 성격에 맞게 레오나르도는 도시 설계에 여러 혁신을 포함시켰다.",
     grammar:"<strong>in keeping with</strong> = '~에 걸맞게, ~에 따라'.",
     vocab:[{w:"in keeping with",pos:"phrase",kr:"~에 걸맞게"},{w:"innovation",pos:"n",kr:"혁신"}]},
    {num:20,en:"Leonardo wanted the city to be built on several levels, linked with vertical outdoor staircases.",
     kr:"레오나르도는 수직 야외 계단으로 연결된 여러 층으로 도시를 건설하길 원했다.",
     grammar:"Q35 정답(staircases) 핵심.",
     vocab:[{w:"vertical",pos:"adj",kr:"수직의"},{w:"outdoor staircase",pos:"n",kr:"야외 계단"}]},
    {num:21,en:"This design can be seen in some of today's high-rise buildings but was unconventional at the time.",
     kr:"이 설계는 오늘날 일부 고층 건물에서 볼 수 있지만, 당시에는 관습적이지 않았다.",
     grammar:"<strong>unconventional</strong> = '관습에 얽매이지 않은, 비전통적인'. <strong>high-rise</strong> = '고층의'.",
     vocab:[{w:"unconventional",pos:"adj",kr:"비전통적인"},{w:"high-rise",pos:"adj",kr:"고층의"}]},
    {num:22,en:"Indeed, this idea of taking full advantage of the interior spaces wasn't implemented until the 1920s and 1930s, with the birth of the Modernist movement.",
     kr:"실제로 내부 공간을 최대한 활용하는 이 아이디어는 모더니즘 운동의 탄생과 함께 1920-30년대까지 실행되지 않았다.",
     grammar:"<strong>take full advantage of</strong> = '~을 최대한 활용하다'. <strong>wasn't implemented until</strong> = '~까지 실행되지 않았다'.",
     vocab:[{w:"implement",pos:"v",kr:"실행하다, 구현하다"},{w:"Modernist movement",pos:"n",kr:"모더니즘 운동"}]},
    {type:"para",label:"Para 7",role:"상하층 기능 분리 + 수로 설계"},
    {num:23,en:"While in the upper layers of the city, people could walk undisturbed between elegant palaces and streets, the lower layer was the place for services, trade, transport and industry.",
     kr:"도시 상층에서는 사람들이 우아한 궁전과 거리를 방해받지 않고 걸을 수 있었던 반면, 하층은 서비스, 무역, 운송, 산업을 위한 공간이었다.",
     grammar:"<strong>While</strong> = 대조 접속사. <strong>undisturbed</strong> = '방해받지 않은'. 기능별 층 구분이 핵심.",
     vocab:[{w:"undisturbed",pos:"adj",kr:"방해받지 않은"},{w:"elegant",pos:"adj",kr:"우아한"}]},
    {num:24,en:"But the true originality of Leonardo's vision was its fusion of architecture and engineering.",
     kr:"하지만 레오나르도 비전의 진정한 독창성은 건축과 공학의 융합이었다.",
     grammar:"<strong>originality</strong> = '독창성'. <strong>fusion</strong> = '융합'. Q36 정답(engineering) 핵심.",
     vocab:[{w:"originality",pos:"n",kr:"독창성"},{w:"fusion",pos:"n",kr:"융합"}]},
    {num:25,en:"Leonardo designed extensive hydraulic plants to create artificial canals throughout the city.",
     kr:"레오나르도는 도시 전체에 인공 운하를 만들기 위해 광범위한 수력 설비를 설계했다.",
     grammar:"<strong>hydraulic</strong> = '수력의'. <strong>extensive</strong> = '광범위한'. Q36 정답(engineering) 근거.",
     vocab:[{w:"hydraulic",pos:"adj",kr:"수력의"},{w:"artificial canal",pos:"n",kr:"인공 운하"},{w:"extensive",pos:"adj",kr:"광범위한"}]},
    {num:26,en:"The canals, regulated by clocks and basins, were supposed to make it easier for boats to navigate inland.",
     kr:"시계와 수조로 조절되는 운하는 배가 내륙을 항해하기 더 쉽게 하기 위한 것이었다.",
     grammar:"<strong>were supposed to</strong> = '~하기로 되어 있었다'. <strong>navigate inland</strong> = '내륙을 항해하다'.",
     vocab:[{w:"navigate",pos:"v",kr:"항해하다"},{w:"inland",pos:"adv",kr:"내륙으로"}]},
    {num:27,en:"Leonardo also thought that the width of the streets ought to match the average height of the adjacent houses: a rule still followed in many contemporary cities across Italy, to allow access to sun and reduce the risk of damage from earthquakes.",
     kr:"레오나르도는 또한 거리 폭이 인접 주택의 평균 높이와 일치해야 한다고 생각했는데, 이는 햇빛 접근을 허용하고 지진 피해 위험을 줄이기 위해 오늘날 이탈리아 여러 현대 도시에서 여전히 따르는 규칙이다.",
     grammar:"콜론(:) 뒤 = 동격/보충 설명. <strong>adjacent</strong> = '인접한'. Q37 정답(rule) 핵심.",
     vocab:[{w:"adjacent",pos:"adj",kr:"인접한"},{w:"contemporary",pos:"adj",kr:"현대의"},{w:"rule",pos:"n",kr:"규칙"}]},
    {type:"para",label:"Para 8",role:"역사적 영향 — 파리 재개발"},
    {num:28,en:"Although some of these features existed in Roman cities, before Leonardo's drawings there had never been a multi-level, compact modern city which was thoroughly technically conceived.",
     kr:"이러한 특징 중 일부는 로마 도시에도 있었지만, 레오나르도의 도면 이전에는 기술적으로 철저히 구상된 다층 밀집 현대 도시가 없었다.",
     grammar:"<strong>thoroughly</strong> = '철저히'. <strong>conceived</strong> = '구상된'. Q38 정답(Roman) 핵심.",
     vocab:[{w:"thoroughly",pos:"adv",kr:"철저히"},{w:"compact",pos:"adj",kr:"밀집된, 소형의"},{w:"conceived",pos:"adj",kr:"구상된"}]},
    {num:29,en:"Indeed, it wasn't until the 19th century that some of his ideas were applied.",
     kr:"실제로 그의 아이디어 일부가 적용된 것은 19세기에 이르러서였다.",
     grammar:"<strong>It wasn't until A that B</strong> = 'A가 되어서야 비로소 B했다'(강조 구문).",
     vocab:[]},
    {num:30,en:"For example, the subdivision of the city by function – with services and infrastructures located in the lower levels and wide and well-ventilated boulevards and walkways above for residents – is an idea that can be found in Georges-Eugene Haussmann's renovation of Paris under Emperor Napoleon III between 1853 and 1870.",
     kr:"예를 들어, 하위 층에 서비스와 기반 시설을 배치하고 위층에는 주민을 위한 넓고 환기가 잘 되는 대로와 보행로를 두는 기능별 도시 구획 방식은 1853년부터 1870년까지 나폴레옹 3세 황제 치하에서 오스만의 파리 개조에서 찾을 수 있는 아이디어이다.",
     grammar:"<strong>subdivision</strong> = '구획'. <strong>well-ventilated</strong> = '환기가 잘 되는'. Q39 정답(Paris) 핵심.",
     vocab:[{w:"subdivision",pos:"n",kr:"구획, 분할"},{w:"infrastructure",pos:"n",kr:"기반 시설"},{w:"boulevard",pos:"n",kr:"대로"},{w:"renovation",pos:"n",kr:"개조, 재건"}]},
    {type:"para",label:"Para 9",role:"현대적 의미 — 결론"},
    {num:31,en:"Today, Leonardo's ideas are not simply valid, they actually suggest a way forward for urban planning.",
     kr:"오늘날 레오나르도의 아이디어는 단순히 유효한 것이 아니라, 실제로 도시 계획의 나아갈 방향을 제시한다.",
     vocab:[{w:"valid",pos:"adj",kr:"유효한, 타당한"}]},
    {num:32,en:"Many scholars think that the compact city, built upwards instead of outwards, integrated with nature (especially water systems), with efficient transport infrastructure, could help modern cities become more efficient and sustainable.",
     kr:"많은 학자들은 바깥이 아닌 위로 건설되고 자연(특히 수계)과 통합되며 효율적인 운송 기반 시설을 갖춘 밀집 도시가 현대 도시가 더 효율적이고 지속 가능하게 되는 데 도움이 될 수 있다고 생각한다.",
     grammar:"<strong>built upwards instead of outwards</strong>: Q40 정답(outwards) 핵심. <strong>integrated with</strong> = '~와 통합된'.",
     vocab:[{w:"outwards",pos:"adv",kr:"바깥쪽으로"},{w:"integrated with",pos:"phrase",kr:"~와 통합된"},{w:"sustainable",pos:"adj",kr:"지속 가능한"}]},
    {num:33,en:"This is yet another reason why Leonardo was aligned so closely with modern urban planning and centuries ahead of his time.",
     kr:"이것이 레오나르도가 현대 도시 계획과 매우 밀접하게 일치하고 자신의 시대보다 수 세기 앞서 있었던 또 하나의 이유이다.",
     grammar:"<strong>yet another</strong> = '또 하나의'. <strong>centuries ahead of his time</strong> = '시대를 수 세기 앞선'.",
     vocab:[{w:"aligned with",pos:"phrase",kr:"~와 일치하는"},{w:"ahead of one's time",pos:"phrase",kr:"시대를 앞선"}]}
  ],
  allVocab:[
    {w:"embody",pos:"v",pron:"/ɪmˈbɒdi/",kr:"구현하다",ex:"Leonardo <em>embodied</em> scientific and artistic spirit.",syn:["represent","exemplify"]},
    {w:"plague",pos:"n",pron:"/pleɪɡ/",kr:"흑사병, 전염병",ex:"The <em>plague</em> killed millions in the 14th century.",syn:["pestilence","epidemic"]},
    {w:"safeguard",pos:"v",pron:"/ˈseɪfɡɑːd/",kr:"보호하다",ex:"Radical solutions were needed to <em>safeguard</em> humanity.",syn:["protect","shield"]},
    {w:"unfulfilled",pos:"adj",pron:"/ˌʌnfʊlˈfɪld/",kr:"실현되지 않은",ex:"The ideal city project remained <em>unfulfilled</em> due to cost.",syn:["unrealised","incomplete"]},
    {w:"rigour",pos:"n",pron:"/ˈrɪɡər/",kr:"엄격함, 철저함",ex:"Renaissance urban planning had scientific <em>rigour</em>.",syn:["precision","thoroughness"]},
    {w:"unconventional",pos:"adj",pron:"/ˌʌnkənˈvenʃənl/",kr:"비전통적인",ex:"Multi-level cities were <em>unconventional</em> in the 15th century.",syn:["unorthodox","innovative"]},
    {w:"hydraulic",pos:"adj",pron:"/haɪˈdrɔːlɪk/",kr:"수력의",ex:"Leonardo designed <em>hydraulic</em> canal systems.",syn:["water-powered"]},
    {w:"adjacent",pos:"adj",pron:"/əˈdʒeɪsənt/",kr:"인접한",ex:"Street width should match the height of <em>adjacent</em> buildings.",syn:["neighbouring","nearby"]},
    {w:"renovation",pos:"n",pron:"/ˌrenəˈveɪʃn/",kr:"개조, 재건",ex:"Haussmann's <em>renovation</em> of Paris applied Leonardo's ideas.",syn:["redevelopment","reconstruction"]},
    {w:"sustainable",pos:"adj",pron:"/səˈsteɪnəbl/",kr:"지속 가능한",ex:"Compact cities can be more <em>sustainable</em>.",syn:["eco-friendly","viable"]},

  paragraphs:[
    {lbl:"P1",role:"레오나르도 소개",desc:"보편적 천재로서의 레오나르도. 500년이 지나도 그의 사상이 놀라움을 줌."},
    {lbl:"P2",role:"역사적 배경",desc:"르네상스 = 14세기 흑사병 이후. 오늘의 기후 위기와 유사: 급진적 해결책 필요."},
    {lbl:"P3",role:"이상 도시 프로젝트",desc:"1486년 밀라노 전염병 이후 착수. 비용 과다로 미실현. 오늘날에도 시사점 있음."},
    {lbl:"P4",role:"르네상스 도시주의",desc:"15세기가 도시주의 학문 탄생 시기. 피엔차·페라라 사례가 레오나르도에 영감."},
    {lbl:"P5",role:"티치노 강 도시 설계",desc:"무질서한 노트에서 재구성. 물류·청결 중심. 높고 튼튼한 성벽 권고."},
    {lbl:"P6",role:"다층 구조 혁신",desc:"수직 야외 계단으로 연결된 다층 도시. 당시엔 비전통적 → 1920-30년대 모더니즘에서 실현."},
    {lbl:"P7",role:"기능 분리 + 수로",desc:"상층=보행·궁전, 하층=서비스·산업. 수력 운하 + 거리 폭·건물 높이 비율 규칙."},
    {lbl:"P8",role:"역사적 영향",desc:"로마 도시와 일부 유사하나 최초의 종합적 다층 도시. 19세기 파리 오스만 재개발에서 실현."},
    {lbl:"P9",role:"현대적 의미",desc:"위로 짓는 밀집 도시 + 자연 통합 = 지속 가능한 현대 도시 모델. 레오나르도는 시대를 앞선 천재."}

"C18_T3_P1": {
  title:"Cambridge 18 · Test 2 · Passage 1",
  topic:"Materials Beyond Concrete",
  qTypes:["Section Matching","Summary Completion","People Matching"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 콘크리트의 문제점과 대안 개발"},
    {num:1,en:"Concrete is the second most used substance in the global economy, after water – and one of the world's biggest single sources of greenhouse gas emissions.",kr:"콘크리트는 물 다음으로 세계 경제에서 두 번째로 많이 사용되는 물질이며, 세계 최대 단일 온실가스 배출원 중 하나이다.",grammar:"<strong>after water</strong> = 부사구로 비교 순위 표현. <strong>one of the world's biggest</strong> = 최상급 + 복수명사 구조",vocab:[{w:"substance",pos:"n",kr:"물질"},{w:"greenhouse gas emissions",pos:"n",kr:"온실가스 배출"}]},
    {num:2,en:"The chemical process by which cement, the key ingredient of concrete, is created results in large quantities of carbon dioxide.",kr:"콘크리트의 핵심 재료인 시멘트를 만드는 화학 공정은 대량의 이산화탄소를 발생시킨다.",grammar:"<strong>by which</strong> = 관계대명사 전치사 구문. <strong>cement, the key ingredient of concrete,</strong> = 동격 삽입구",vocab:[{w:"ingredient",pos:"n",kr:"재료, 성분"},{w:"carbon dioxide",pos:"n",kr:"이산화탄소"}]},
    {num:3,en:"The UN estimates that there will be 9.8 billion people living on the planet by mid-century.",kr:"유엔은 금세기 중반까지 지구상에 98억 명이 살게 될 것으로 추산한다.",grammar:"<strong>estimates that</strong> = 명사절 목적어. <strong>by mid-century</strong> = 미래 기한 표현",vocab:[{w:"estimate",pos:"v",kr:"추산하다, 추정하다"},{w:"mid-century",pos:"n",kr:"세기 중반"}]},
    {num:4,en:"If concrete is the only answer to the construction of new cities, then carbon emissions will soar, aggravating global warming.",kr:"새로운 도시 건설에 콘크리트만이 유일한 해답이라면, 탄소 배출량이 급등하여 지구 온난화를 악화시킬 것이다.",grammar:"<strong>If ... will soar</strong> = 1종 조건문. <strong>aggravating</strong> = 분사구문(결과)",vocab:[{w:"soar",pos:"v",kr:"급등하다"},{w:"aggravate",pos:"v",kr:"악화시키다"}]},
    {num:5,en:"And so scientists have started innovating with other materials, in a scramble for alternatives to a universal commodity that has underpinned our modern life for many years.",kr:"그래서 과학자들은 수십 년간 현대 생활의 기반이 되어온 보편적 상품의 대안을 찾기 위해 다른 재료로 혁신을 시작했다.",grammar:"<strong>in a scramble for</strong> = ~을 찾기 위한 경쟁 속에서. <strong>that has underpinned</strong> = 현재완료 관계절",vocab:[{w:"scramble",pos:"n",kr:"(경쟁적) 노력, 쟁탈"},{w:"underpin",pos:"v",kr:"~의 기반이 되다"},{w:"commodity",pos:"n",kr:"상품, 자원"}]},
    {type:"para",label:"Para B",role:"콘크리트의 우수성 — 대체재 개발의 어려움"},
    {num:6,en:"The problem with replacing concrete is that it is so very good at what it does.",kr:"콘크리트를 대체하는 데 있어 문제는 콘크리트가 그 역할을 매우 잘 수행한다는 점이다.",grammar:"<strong>The problem with -ing</strong> = ~하는 것의 문제점. <strong>so very good at what it does</strong> = 강조 구조",vocab:[]},
    {num:7,en:"Chris Cheeseman says the key thing to consider is the extent to which concrete is used around the world, and is likely to continue to be used.",kr:"크리스 치스먼은 고려해야 할 핵심 사항은 콘크리트가 전 세계에서 사용되는 정도이며, 앞으로도 계속 사용될 가능성이 높다는 점이라고 말한다.",grammar:"<strong>the extent to which</strong> = ~하는 정도. <strong>is likely to continue to be used</strong> = be likely to + 수동태",vocab:[{w:"extent",pos:"n",kr:"정도, 범위"}]},
    {num:8,en:"'Concrete is not a high-carbon product. Cement is high carbon, but concrete is not.'",kr:"'콘크리트 자체는 탄소 집약적 제품이 아닙니다. 시멘트가 탄소를 많이 배출하지만, 콘크리트는 그렇지 않아요.'",grammar:"<strong>high-carbon</strong> = 복합형용사 (하이픈 사용). 대조 구조: A is X, but B is not",vocab:[{w:"high-carbon",pos:"adj",kr:"탄소 집약적인"}]},
    {num:9,en:"'But it is the scale on which it is used that makes it high carbon. The sheer scale of manufacture is so huge, that is the issue.'",kr:"'하지만 콘크리트를 탄소 집약적으로 만드는 것은 바로 그 사용 규모입니다. 제조 규모가 워낙 방대하기 때문에, 그것이 문제입니다.'",grammar:"<strong>It is ... that</strong> = 강조 구문. <strong>The sheer scale</strong> = sheer는 강조 형용사(엄청난)",vocab:[{w:"sheer",pos:"adj",kr:"순전한, 엄청난"},{w:"manufacture",pos:"n",kr:"제조"}]},
    {type:"para",label:"Para C",role:"콘크리트의 장점 — 재료 풍부·가소성·철근 조합"},
    {num:10,en:"Not only are the ingredients of concrete relatively cheap and found in abundance in most places around the globe, the stuff itself has marvellous properties.",kr:"콘크리트의 재료는 비교적 저렴하고 지구 대부분의 지역에서 풍부하게 발견될 뿐만 아니라, 콘크리트 자체도 놀라운 특성을 지닌다.",grammar:"<strong>Not only are...</strong> = 부정어 도치 구문. <strong>found in abundance</strong> = 수동 분사구",vocab:[{w:"in abundance",pos:"adv",kr:"풍부하게"},{w:"marvellous",pos:"adj",kr:"놀라운, 경이로운"}]},
    {num:11,en:"Portland cement, the vital component of concrete, is mouldable and pourable, but quickly sets hard.",kr:"콘크리트의 핵심 성분인 포틀랜드 시멘트는 형태를 빚고 부을 수 있지만, 빠르게 단단하게 굳는다.",grammar:"<strong>the vital component of concrete</strong> = 동격 삽입구. <strong>sets hard</strong> = 보어를 취하는 연결동사",vocab:[{w:"mouldable",pos:"adj",kr:"형태를 만들 수 있는"},{w:"pourable",pos:"adj",kr:"부어 넣을 수 있는"}]},
    {num:12,en:"Cheeseman also notes another advantage: concrete and steel have similar thermal expansion properties, so steel can be used to reinforce concrete.",kr:"치스먼은 또 다른 장점을 언급한다: 콘크리트와 철강은 열팽창 특성이 유사하기 때문에 철강이 콘크리트를 보강하는 데 사용될 수 있다.",grammar:"<strong>colon(:)</strong> = 앞 내용의 구체화. <strong>thermal expansion</strong> = 열팽창 (복합명사)",vocab:[{w:"thermal expansion",pos:"n",kr:"열팽창"},{w:"reinforce",pos:"v",kr:"보강하다, 강화하다"}]},
    {num:13,en:"'Concrete is amazing stuff. Making anything with similar properties is going to be very difficult.'",kr:"'콘크리트는 놀라운 재료입니다. 유사한 특성을 지닌 것을 만드는 것은 매우 어려울 것입니다.'",grammar:"<strong>Making ... is going to be</strong> = 동명사 주어 + be going to 예측",vocab:[]},
    {type:"para",label:"Para D",role:"대안 1 — 목재 건축물의 부상"},
    {num:14,en:"A possible alternative to concrete is wood.",kr:"콘크리트의 가능한 대안 중 하나는 목재이다.",grammar:"<strong>A possible alternative to</strong> = ~의 가능한 대안",vocab:[{w:"alternative",pos:"n",kr:"대안"}]},
    {num:15,en:"Making buildings from wood may seem like a rather medieval idea, but climate change is driving architects to turn to treated timber as a possible resource.",kr:"목재로 건물을 짓는 것은 다소 중세적인 아이디어처럼 보일 수 있지만, 기후 변화가 건축가들로 하여금 처리된 목재를 가능한 자원으로 눈을 돌리게 만들고 있다.",grammar:"<strong>drive sb to do</strong> = ~하도록 몰아붙이다. <strong>turn to</strong> = ~쪽으로 눈을 돌리다",vocab:[{w:"medieval",pos:"adj",kr:"중세의"},{w:"treated timber",pos:"n",kr:"가공 목재"}]},
    {num:16,en:"Recent years have seen the emergence of tall buildings constructed almost entirely from timber.",kr:"최근 몇 년간 거의 전적으로 목재로 지어진 고층 건물의 등장이 목격되었다.",grammar:"<strong>Recent years have seen</strong> = 시간 주어 + 현재완료 구조. <strong>constructed from</strong> = 과거분사 후치수식",vocab:[{w:"emergence",pos:"n",kr:"출현, 등장"},{w:"timber",pos:"n",kr:"목재"}]},
    {type:"para",label:"Para E",role:"목재의 단점과 개선 — 교차적층목재(CLT)"},
    {num:17,en:"Using wood to construct buildings, however, is not straightforward.",kr:"그러나 건물 건축에 목재를 사용하는 것은 간단하지 않다.",grammar:"<strong>Using wood ... is not straightforward</strong> = 동명사 주어 + 부정 보어",vocab:[{w:"straightforward",pos:"adj",kr:"간단한, 복잡하지 않은"}]},
    {num:18,en:"Wood expands as it absorbs moisture from the air and is susceptible to pests, not to mention fire.",kr:"목재는 공기 중의 수분을 흡수하면서 팽창하고 해충에 취약하며, 화재는 말할 것도 없다.",grammar:"<strong>as it absorbs</strong> = 시간/원인의 접속사. <strong>not to mention</strong> = ~은 말할 것도 없이",vocab:[{w:"susceptible to",pos:"adj",kr:"~에 취약한"},{w:"moisture",pos:"n",kr:"수분, 습기"}]},
    {num:19,en:"Cross-laminated timber is engineered wood. An adhesive is used to stick layers of solid-sawn timber together, crosswise, to form building blocks.",kr:"교차적층목재는 가공 목재이다. 접착제를 사용하여 실톱으로 켠 목재의 층을 교차로 접착하여 건축 블록을 형성한다.",grammar:"<strong>is used to stick</strong> = 수동태 + to부정사. <strong>to form</strong> = 목적을 나타내는 to부정사",vocab:[{w:"cross-laminated",pos:"adj",kr:"교차적층된"},{w:"adhesive",pos:"n",kr:"접착제"},{w:"crosswise",pos:"adv",kr:"교차하여"}]},
    {num:20,en:"This material is light but has the strength of concrete and steel. Construction experts say that wooden buildings can be constructed at a greater speed than ones of concrete and steel and the process is quieter.",kr:"이 재료는 가볍지만 콘크리트와 철강의 강도를 가진다. 건설 전문가들은 목재 건물이 콘크리트와 철강 건물보다 더 빠른 속도로 건설될 수 있으며 그 과정이 더 조용하다고 말한다.",grammar:"<strong>has the strength of</strong> = ~의 강도를 지니다. <strong>ones of</strong> = 앞서 나온 명사 대체(ones = wooden buildings)",vocab:[{w:"strength",pos:"n",kr:"강도, 강점"}]},
    {type:"para",label:"Para F",role:"Stora Enso — 목재 수요 증가와 탄소 저장 효과"},
    {num:21,en:"Stora Enso is Europe's biggest supplier of cross-laminated timber, and its vice-president Markus Mannstrom reports that the company is seeing increasing demand globally for building in wood, with climate change concerns the key driver.",kr:"Stora Enso는 유럽 최대의 교차적층목재 공급업체로, 부사장 마르쿠스 만스트롬은 기후 변화에 대한 우려가 주요 동인이 되어 목재 건축에 대한 수요가 전 세계적으로 증가하고 있다고 보고한다.",grammar:"<strong>with climate change concerns the key driver</strong> = 독립분사구문(부대상황). <strong>see + 목적어 + 현재분사</strong> = ~하는 것을 목격하다",vocab:[{w:"supplier",pos:"n",kr:"공급업체"},{w:"driver",pos:"n",kr:"동인, 원동력"}]},
    {num:22,en:"Of course, using timber in a building also locks away the carbon that it absorbed as it grew.",kr:"물론 건물에 목재를 사용하면 나무가 자라면서 흡수한 탄소도 가두는 효과가 있다.",grammar:"<strong>locks away</strong> = 가두다, 저장하다. <strong>that it absorbed</strong> = 목적격 관계대명사",vocab:[{w:"lock away",pos:"v",kr:"가두다, 저장하다"}]},
    {num:23,en:"But even treated wood has its limitations and only when a wider range of construction projects has been proven in practice will it be possible to see wood as a real alternative to concrete.",kr:"하지만 가공된 목재도 한계가 있으며, 더 광범위한 건설 프로젝트에서 실제로 검증된 후에야 비로소 목재를 콘크리트의 진정한 대안으로 볼 수 있을 것이다.",grammar:"<strong>only when ... will it be possible</strong> = only 도치 구문. <strong>has been proven</strong> = 현재완료 수동",vocab:[{w:"proven in practice",pos:"phr",kr:"실제로 검증된"},{w:"limitations",pos:"n",kr:"한계"}]},
    {type:"para",label:"Para G",role:"대안 2 — 플라이애시·슬래그의 탄소 절감 효과와 한계"},
    {num:24,en:"Fly ash and slag from iron ore are possible alternatives to cement in a concrete mix.",kr:"플라이애시와 철광석 슬래그는 콘크리트 혼합물에서 시멘트의 가능한 대안이다.",grammar:"<strong>alternatives to</strong> = ~의 대안. 복수 주어 + are 주의",vocab:[{w:"fly ash",pos:"n",kr:"플라이애시(석탄재)"},{w:"slag",pos:"n",kr:"슬래그(쇠찌꺼기)"}]},
    {num:25,en:"Fly ash, a byproduct of coal-burning power plants, can be incorporated into concrete mixes to make up as much as 15 to 30% of the cement.",kr:"석탄 화력발전소의 부산물인 플라이애시는 시멘트의 최대 15~30%를 대체하도록 콘크리트 혼합물에 혼입될 수 있다.",grammar:"<strong>a byproduct of</strong> = 동격 삽입구. <strong>as much as</strong> = ~만큼이나(수량 강조)",vocab:[{w:"byproduct",pos:"n",kr:"부산물"},{w:"incorporate",pos:"v",kr:"혼입하다, 통합하다"}]},
    {num:26,en:"Anna Surgenor notes that although these waste products can save carbon in the concrete mix, their use is not always straightforward.",kr:"애나 서그너는 이러한 폐기물이 콘크리트 혼합물에서 탄소를 줄일 수 있지만, 그 사용이 항상 간단하지는 않다고 지적한다.",grammar:"<strong>although</strong> = 양보 접속사. <strong>not always</strong> = 부분 부정",vocab:[]},
    {num:27,en:"'If they are transported over long distances, using fossil fuels, the use of alternative materials might not make sense from an overall carbon reduction perspective.'",kr:"'화석 연료를 사용하여 장거리 운반된다면, 전체 탄소 감소 관점에서 대체 재료의 사용은 의미가 없을 수도 있습니다.'",grammar:"<strong>make sense from a perspective</strong> = ~의 관점에서 의미가 있다. <strong>If ... might</strong> = 조건 + 추측 조동사",vocab:[{w:"fossil fuels",pos:"n",kr:"화석 연료"},{w:"perspective",pos:"n",kr:"관점, 시각"}]},
    {type:"para",label:"Para H",role:"결론 — 신규 시멘트 기술의 현실적 한계"},
    {num:28,en:"While these technologies are all promising ideas, they are either unproven or based on materials that are not abundant.",kr:"이 기술들은 모두 유망한 아이디어이지만, 아직 검증되지 않았거나 풍부하지 않은 재료에 기반하고 있다.",grammar:"<strong>While</strong> = 양보 접속사(비록 ~이지만). <strong>either A or B</strong> = A이거나 B이다",vocab:[{w:"promising",pos:"adj",kr:"유망한"},{w:"abundant",pos:"adj",kr:"풍부한"}]},
    {num:29,en:"Felix Preston and Johanna Lehne reached the conclusion that 'Some novel cements have been discussed for more than a decade within the research community, without breaking through.'",kr:"펠릭스 프레스턴과 요한나 레네는 '일부 새로운 시멘트들은 연구 커뮤니티 내에서 10년 이상 논의되었지만 돌파구를 마련하지 못했다'는 결론에 도달했다.",grammar:"<strong>reached the conclusion that</strong> = ~라는 결론에 도달하다. <strong>without breaking through</strong> = 분사구문(결과)",vocab:[{w:"novel",pos:"adj",kr:"새로운, 혁신적인"},{w:"break through",pos:"v",kr:"돌파구를 마련하다"}]},
    {num:30,en:"'At present, these alternatives are rarely as cost-effective as conventional cement, and they face raw-material shortages and resistance from customers.'",kr:"'현재 이러한 대안들은 기존 시멘트만큼 비용 효율적인 경우가 거의 없으며, 원자재 부족과 고객의 저항에 직면해 있습니다.'",grammar:"<strong>rarely as ... as</strong> = 동등비교 부정. <strong>face</strong> = ~에 직면하다",vocab:[{w:"cost-effective",pos:"adj",kr:"비용 효율적인"},{w:"conventional",pos:"adj",kr:"기존의, 전통적인"},{w:"resistance",pos:"n",kr:"저항"}]}
  ],

"C18_T3_P2": {
  title:"Cambridge 18 · Test 3 · Passage 2",
  topic:"The Steam Car — Doble Brothers",
  qTypes:["Paragraph Headings","Multiple Choice","Summary Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 증기차의 기원과 약점"},
    {num:1,en:"When primitive automobiles first began to appear in the 1800s, their engines were based on steam power.",kr:"1800년대에 원시적인 자동차가 처음 등장했을 때, 그 엔진은 증기력을 기반으로 했다.",grammar:"<strong>when ... began</strong> = 시간 부사절. <strong>were based on</strong> = 수동태 과거",vocab:[{w:"primitive",pos:"adj",kr:"원시적인"},{w:"steam power",pos:"n",kr:"증기력"}]},
    {num:2,en:"Steam had already enjoyed a long and successful career in the railways, so it was only natural that the technology evolved into a miniaturized version separate from the trains.",kr:"증기는 이미 철도에서 오랫동안 성공적으로 활용되었기 때문에, 그 기술이 기차와 분리된 소형화된 형태로 발전하는 것은 당연한 일이었다.",grammar:"<strong>It was only natural that</strong> = 가주어-진주어. <strong>evolved into</strong> = ~로 발전하다",vocab:[{w:"miniaturized",pos:"adj",kr:"소형화된"},{w:"evolve into",pos:"v",kr:"~로 발전하다"}]},
    {num:3,en:"But these early cars inherited steam's weaknesses along with its strengths. The boilers had to be lit by hand, and they required about twenty minutes to build up pressure before they could be driven.",kr:"하지만 초기 자동차들은 증기의 장점과 함께 단점도 물려받았다. 보일러는 손으로 점화해야 했고, 운전 전에 압력을 올리는 데 약 20분이 필요했다.",grammar:"<strong>along with</strong> = ~와 함께. <strong>had to be lit</strong> = 수동태 의무(had to + be p.p.)",vocab:[{w:"inherit",pos:"v",kr:"물려받다"},{w:"boiler",pos:"n",kr:"보일러"},{w:"build up pressure",pos:"phr",kr:"압력을 올리다"}]},
    {num:4,en:"Despite such shortcomings, these newly designed self-propelled carriages offered quick transportation, and by the early 1900s it was not uncommon to see such machines shuttling wealthy citizens around town.",kr:"이러한 단점에도 불구하고, 새로 설계된 자주 추진 마차는 빠른 교통수단을 제공했으며, 1900년대 초에는 이러한 기계가 부유한 시민들을 마을 곳곳으로 실어 나르는 모습을 흔히 볼 수 있었다.",grammar:"<strong>Despite</strong> = 전치사(+ 명사구). <strong>it was not uncommon to see</strong> = 가주어-진주어, 이중 부정으로 긍정 강조",vocab:[{w:"shortcoming",pos:"n",kr:"단점, 결함"},{w:"self-propelled",pos:"adj",kr:"자주 추진의"},{w:"shuttle",pos:"v",kr:"왕복 운행하다"}]},
    {type:"para",label:"Para B",role:"증기차의 쇠퇴 — 내연기관의 등장"},
    {num:5,en:"But the glory days of steam cars were few.",kr:"하지만 증기차의 전성기는 짧았다.",grammar:"<strong>glory days</strong> = 전성기. 간결한 주제 문장",vocab:[{w:"glory days",pos:"n",kr:"전성기"}]},
    {num:6,en:"A new technology called the Internal Combustion Engine soon appeared, which offered the ability to drive down the road just moments after starting up.",kr:"내연기관이라는 새로운 기술이 곧 등장했고, 이는 시동 직후 바로 도로를 달릴 수 있는 능력을 제공했다.",grammar:"<strong>called the Internal Combustion Engine</strong> = 과거분사 후치수식. <strong>which offered</strong> = 계속적 용법 관계대명사",vocab:[{w:"internal combustion engine",pos:"n",kr:"내연기관"},{w:"moments after",pos:"phr",kr:"~직후"}]},
    {num:7,en:"But in 1912 General Motors introduced the electric starter, and over the following few years steam power was gradually phased out.",kr:"그러나 1912년 제너럴 모터스가 전동 시동기를 도입했고, 그 후 몇 년에 걸쳐 증기력은 점차 퇴출되었다.",grammar:"<strong>was gradually phased out</strong> = 수동태 + 부사 + 구동사",vocab:[{w:"electric starter",pos:"n",kr:"전동 시동기"},{w:"phase out",pos:"v",kr:"단계적으로 퇴출시키다"}]},
    {type:"para",label:"Para C",role:"도블 형제의 첫 번째 증기차 — Model B의 성능"},
    {num:8,en:"Between 1906 and 1909, while still attending high school, Abner Doble and his three brothers built their first steam car in their parents' basement.",kr:"1906년에서 1909년 사이, 여전히 고등학교에 재학 중이던 에이브너 도블과 그의 세 형제는 부모님의 지하실에서 첫 번째 증기차를 만들었다.",grammar:"<strong>while still attending</strong> = 분사구문(동시 상황). <strong>Between A and B</strong> = A와 B 사이에",vocab:[{w:"basement",pos:"n",kr:"지하실"}]},
    {num:9,en:"It comprised parts taken from a wrecked early steam car but reconfigured to drive an engine of their own design.",kr:"그것은 파손된 초기 증기차에서 가져온 부품들로 구성되었지만, 자신들이 설계한 엔진을 구동하도록 재구성되었다.",grammar:"<strong>taken from</strong> = 과거분사 후치수식. <strong>reconfigured to</strong> = 목적의 to부정사",vocab:[{w:"comprise",pos:"v",kr:"~로 구성되다"},{w:"reconfigure",pos:"v",kr:"재구성하다"}]},
    {num:10,en:"Though the Doble boys' third prototype, nicknamed the Model B, still lacked the convenience of an internal combustion engine, it drew the attention of automobile trade magazines due to its numerous improvements.",kr:"도블 형제의 세 번째 프로토타입인 모델 B는 여전히 내연기관의 편리함은 부족했지만, 수많은 개선 사항으로 인해 자동차 업계 잡지들의 주목을 받았다.",grammar:"<strong>nicknamed the Model B</strong> = 과거분사 삽입구. <strong>drew the attention of</strong> = ~의 관심을 끌다",vocab:[{w:"prototype",pos:"n",kr:"프로토타입, 시제품"},{w:"nickname",pos:"v",kr:"별명을 붙이다"}]},
    {num:11,en:"Its high-pressure steam drove the engine pistons in virtual silence, in contrast to clattering gas engines which emitted the aroma of burned hydrocarbons.",kr:"고압 증기가 엔진 피스톤을 사실상 무소음으로 구동했는데, 이는 탄화수소 연소 냄새를 풍기는 덜컹거리는 가솔린 엔진과 대조적이었다.",grammar:"<strong>in virtual silence</strong> = 부사구. <strong>in contrast to</strong> = ~와 대조적으로",vocab:[{w:"piston",pos:"n",kr:"피스톤"},{w:"clattering",pos:"adj",kr:"덜컹거리는"},{w:"hydrocarbon",pos:"n",kr:"탄화수소"}]},
    {num:12,en:"The Model B was amazingly swift. It could accelerate from zero to sixty miles per hour in just fifteen seconds, a feat described as 'remarkable acceleration' by Automobile magazine in 1914.",kr:"모델 B는 놀랍도록 빨랐다. 단 15초 만에 시속 0에서 60마일까지 가속할 수 있었는데, 이 성과는 1914년 오토모빌 잡지에 의해 '놀라운 가속력'으로 묘사되었다.",grammar:"<strong>a feat described as</strong> = 동격 + 과거분사. <strong>accelerate from A to B</strong> = A에서 B로 가속하다",vocab:[{w:"swift",pos:"adj",kr:"빠른, 신속한"},{w:"feat",pos:"n",kr:"위업, 성과"},{w:"acceleration",pos:"n",kr:"가속"}]},
    {type:"para",label:"Para D",role:"Model C 개발 — 사업 확장과 대규모 주문"},
    {num:13,en:"The following year Abner Doble drove the Model B from Massachusetts to Detroit in order to seek investment in his automobile design, which he used to open the General Engineering Company.",kr:"다음 해 에이브너 도블은 자신의 자동차 설계에 대한 투자를 구하기 위해 모델 B를 타고 매사추세츠에서 디트로이트까지 운전하여 제너럴 엔지니어링 회사를 설립했다.",grammar:"<strong>in order to seek</strong> = 목적의 to부정사(강조형). <strong>which he used to open</strong> = 계속적 관계절",vocab:[{w:"seek investment",pos:"phr",kr:"투자를 구하다"}]},
    {num:14,en:"The brothers added features such as a key-based ignition in the cabin, eliminating the need for the operator to manually ignite the boiler.",kr:"형제들은 운전석 내 키 기반 점화 장치와 같은 기능을 추가하여, 운전자가 수동으로 보일러를 점화해야 하는 필요성을 없앴다.",grammar:"<strong>eliminating the need for</strong> = 분사구문(결과). <strong>key-based</strong> = 복합 형용사",vocab:[{w:"ignition",pos:"n",kr:"점화(장치)"},{w:"manually",pos:"adv",kr:"수동으로"}]},
    {num:15,en:"By the following April, the General Engineering Company had received 5,390 deposits for Doble Detroits, which were scheduled for delivery in early 1918.",kr:"다음 해 4월까지 제너럴 엔지니어링 회사는 1918년 초 납품 예정인 도블 디트로이트에 대한 5,390건의 계약금을 받았다.",grammar:"<strong>had received</strong> = 과거완료(기준 시점 이전). <strong>were scheduled for delivery</strong> = 수동태 예정",vocab:[{w:"deposit",pos:"n",kr:"계약금, 보증금"},{w:"scheduled for delivery",pos:"phr",kr:"납품 예정인"}]},
    {type:"para",label:"Para E",role:"Model C의 실패 — 기술적 결함"},
    {num:16,en:"Those buyers who received the handful of completed cars complained that the vehicles were sluggish and erratic, sometimes going in reverse when they should go forward.",kr:"완성된 소수의 차량을 받은 구매자들은 차량이 둔하고 불규칙적이며, 전진해야 할 때 후진하는 경우도 있다고 불평했다.",grammar:"<strong>a handful of</strong> = 소수의. <strong>going in reverse when they should go forward</strong> = 분사구문 + when절",vocab:[{w:"sluggish",pos:"adj",kr:"둔한, 느린"},{w:"erratic",pos:"adj",kr:"불규칙적인, 변덕스러운"}]},
    {num:17,en:"The new engine design, though innovative, was still plagued with serious glitches.",kr:"새로운 엔진 설계는 혁신적이었지만, 여전히 심각한 결함에 시달렸다.",grammar:"<strong>though innovative</strong> = 삽입 양보절(though + 형용사). <strong>plagued with</strong> = ~에 시달리다",vocab:[{w:"innovative",pos:"adj",kr:"혁신적인"},{w:"plague",pos:"v",kr:"~에 시달리게 하다"},{w:"glitch",pos:"n",kr:"결함, 오류"}]},
    {type:"para",label:"Para F",role:"Model E 테스트 — 놀라운 성능 증명"},
    {num:18,en:"In early 1924, the Doble brothers shipped a Model E to New York City to be road-tested by the Automobile Club of America.",kr:"1924년 초, 도블 형제는 미국 자동차 클럽의 도로 테스트를 위해 모델 E를 뉴욕시로 보냈다.",grammar:"<strong>to be road-tested</strong> = 수동 to부정사(목적). <strong>shipped A to B</strong> = A를 B로 운송하다",vocab:[{w:"road-test",pos:"v",kr:"도로 테스트를 하다"}]},
    {num:19,en:"After sitting overnight in freezing temperatures, the car was pushed out into the road and left to sit for over an hour in the frosty morning air.",kr:"영하의 기온에서 밤새 방치된 후, 차는 도로로 밀려 나와 서리 낀 아침 공기 속에서 한 시간 넘게 방치되었다.",grammar:"<strong>After sitting</strong> = 분사구문(시간). <strong>was left to sit</strong> = be left + to부정사",vocab:[{w:"frosty",pos:"adj",kr:"서리 낀, 몹시 추운"},{w:"overnight",pos:"adv",kr:"밤새"}]},
    {num:20,en:"At the turn of the key, the boiler lit and reached its operating pressure inside of forty seconds.",kr:"열쇠를 돌리자 보일러에 불이 붙어 40초 안에 작동 압력에 도달했다.",grammar:"<strong>at the turn of the key</strong> = 열쇠를 돌리는 순간. <strong>inside of</strong> = ~이내에",vocab:[{w:"operating pressure",pos:"n",kr:"작동 압력"},{w:"inside of",pos:"prep",kr:"~이내에"}]},
    {num:21,en:"As they drove the test vehicle further, they found that its evenly distributed weight lent it surprisingly good handling, even though it was so heavy.",kr:"테스트 차량을 더 달려보니, 무게가 균등하게 분산되어 차가 매우 무거움에도 불구하고 놀라울 정도로 핸들링이 좋다는 것을 알 수 있었다.",grammar:"<strong>lent it ... handling</strong> = lend A B(A에게 B를 주다). <strong>even though</strong> = 강한 양보 접속사",vocab:[{w:"evenly distributed",pos:"adj",kr:"균등하게 분산된"},{w:"handling",pos:"n",kr:"핸들링, 조향성"}]},
    {num:22,en:"As the new Doble steamer was further developed and tested, its maximum speed was pushed to over a hundred miles per hour, and it achieved about fifteen miles per gallon of kerosene with negligible emissions.",kr:"새 도블 증기차가 더욱 개발되고 테스트되면서, 최고 속도는 시속 100마일 이상으로 끌어올려졌고, 무시할 수 있는 수준의 배출가스로 등유 1갤런당 약 15마일을 달성했다.",grammar:"<strong>was pushed to</strong> = 수동태(끌어올리다). <strong>negligible</strong> = 무시해도 될 정도의",vocab:[{w:"kerosene",pos:"n",kr:"등유"},{w:"negligible",pos:"adj",kr:"무시해도 될 정도의"}]},
    {type:"para",label:"Para G",role:"Model E의 실패와 유산 — 증기차의 미래 가능성"},
    {num:23,en:"Priced at around $18,000 in 1924, it was popular only among the very wealthy.",kr:"1924년 약 18,000달러에 가격이 책정된 이 차는 매우 부유한 사람들 사이에서만 인기를 끌었다.",grammar:"<strong>Priced at</strong> = 분사구문(가격 표시). <strong>only among</strong> = ~사이에서만",vocab:[{w:"priced at",pos:"phr",kr:"~에 가격이 책정된"}]},
    {num:24,en:"By the time the company folded in 1931, fewer than fifty of the amazing Model E steam cars had been produced.",kr:"1931년 회사가 문을 닫을 때까지 놀라운 모델 E 증기차는 50대도 채 생산되지 않았다.",grammar:"<strong>By the time</strong> = ~할 때까지. <strong>had been produced</strong> = 과거완료 수동",vocab:[{w:"fold",pos:"v",kr:"(사업 등을) 접다, 폐업하다"}]},
    {num:25,en:"Many of the Model E Dobles which have survived are still in good working condition, some having been driven over half a million miles with only normal maintenance.",kr:"현존하는 많은 모델 E 도블은 여전히 양호한 작동 상태이며, 일부는 일반적인 정비만으로 50만 마일 이상 운행된 것도 있다.",grammar:"<strong>which have survived</strong> = 현재완료 관계절. <strong>some having been driven</strong> = 독립분사구문",vocab:[{w:"working condition",pos:"n",kr:"작동 상태"},{w:"maintenance",pos:"n",kr:"정비, 유지보수"}]},
    {num:26,en:"Astonishingly, an unmodified Doble Model E runs clean enough to pass the emissions laws in California today, and they are pretty strict.",kr:"놀랍게도 개조되지 않은 도블 모델 E는 오늘날 캘리포니아의 배출가스 법규를 통과할 만큼 깨끗하게 작동하는데, 그 기준은 꽤 엄격하다.",grammar:"<strong>clean enough to pass</strong> = 결과/정도 표현(enough to + 동사원형). <strong>Astonishingly</strong> = 문장 부사",vocab:[{w:"unmodified",pos:"adj",kr:"개조되지 않은"},{w:"emissions laws",pos:"n",kr:"배출가스 법규"}]},
    {num:27,en:"Under the current pressure to improve automotive performance and reduce emissions, it is not unthinkable that the steam car may rise again.",kr:"자동차 성능 향상과 배출가스 감소에 대한 현재의 압박 속에서, 증기차가 다시 부활할 수도 있다는 것은 생각할 수 없는 일이 아니다.",grammar:"<strong>it is not unthinkable that</strong> = 가주어-진주어 + 이중 부정. <strong>rise again</strong> = 다시 부활하다",vocab:[{w:"unthinkable",pos:"adj",kr:"생각할 수 없는"},{w:"automotive",pos:"adj",kr:"자동차의"}]}
  ],

    {w:"kerosene",pos:"n",pron:"/ˈkerəsiːn/",kr:"등유",ex:"The Model E ran on kerosene.",syn:"paraffin"},

  summary:"Cambridge 18 Test 3 Passage 2. 도블 형제는 증기차가 쇠퇴하던 시기에 Model B·C·E를 개발했다. Model B는 무소음·고속으로 주목받았고, Model E는 1924년 도로 테스트에서 40초 시동·시속 100마일을 달성했다. 그러나 높은 가격과 끊임없는 설계 변경으로 50대 미만 생산 후 폐업했다."

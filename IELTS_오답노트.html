    {lbl:"Para 9", role:"서인도 매너티 위협", desc:"20% 감소 예상, 어망·플라스틱, 보트 충돌, 법률 제한"}
  ],
  summary:"매너티는 세 종(서인도·아프리카·아마존)으로 나뉘는 수생 포유류다. 어금니가 계속 새로 자라며, 횡격막으로 부력을 조절한다. 세 종 모두 멸종 위기이며, 보트 충돌과 어망 포획이 주요 위협이다. 플로리다에서는 보트 속도 제한 법률이 시행 중이다."
},

"C20_T2_P2": {
  title:"Cambridge 20 · Test 2 · Passage 2",
  topic:"Procrastination",
  qTypes:["Paragraph Matching","Summary Completion","Two-letter Choice"],
  sentences:[
    {type:"para", label:"Para A", role:"도입 — 미루기의 정의와 자기비판"},
    {num:1, en:"Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", kr:"미루기는 필요한 작업을 덜 긴급하고 더 즐거우며 더 쉬운 활동에 집중함으로써 지연시키는 습관이다.", grammar:"delay + 동명사: ~을 지연시키다 / instead: 대신에", vocab:[{w:"procrastination",pos:"n",kr:"미루기, 지연"},{w:"delay",pos:"v",kr:"지연시키다"},{w:"urgent",pos:"adj",kr:"긴급한"}]},
    {num:2, en:"We all do it from time to time.", kr:"우리는 모두 때때로 그런 행동을 한다.", grammar:"from time to time: 때때로", vocab:[{w:"from time to time",pos:"phr",kr:"때때로"}]},
    {num:3, en:"We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", kr:"실망시켜야 할 친구에게 메시지를 작성하거나 대학이나 직장을 위한 중요한 보고서를 준비할 때, 우리는 당면 과제를 피하려 최선을 다하지만 마음 깊은 곳에서는 그냥 해야 한다는 것을 안다.", grammar:"let down: 실망시키다 / the job at hand: 당면 과제 / deep down: 마음 깊은 곳에", vocab:[{w:"let down",pos:"phr.v",kr:"실망시키다"},{w:"at hand",pos:"phr",kr:"당면한"},{w:"deep down",pos:"phr",kr:"마음 깊은 곳에서"}]},
    {num:4, en:"Unfortunately, berating ourselves won't stop us procrastinating again.", kr:"안타깝게도, 자책한다고 해서 다시 미루는 행동을 막을 수는 없다.", grammar:"berate: 심하게 꾸짖다 / stop + 목적어 + 동명사: ~가 ~하는 것을 막다", vocab:[{w:"berate",pos:"v",kr:"심하게 꾸짖다, 자책하다"}]},
    {num:5, en:"In fact, it's one of the worst things we can do.", kr:"사실, 그것은 우리가 할 수 있는 최악의 일 중 하나다.", grammar:"one of the + 최상급 + 복수명사: 가장 ~한 것들 중 하나", vocab:[]},
    {num:6, en:"This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", kr:"이것이 중요한 이유는, 내 연구가 보여주듯이, 미루기는 단순히 시간을 낭비하는 것이 아니라 다른 문제들과도 실제로 연결되어 있기 때문이다.", grammar:"not just A but also B / be linked to: ~와 연결되다", vocab:[{w:"linked to",pos:"phr",kr:"~와 연결된, 관련된"}]},
    {type:"para", label:"Para B", role:"원인 — 기분 관리 실패 (통념 반박)"},
    {num:7, en:"Contrary to popular belief, procrastination is not due to laziness or poor time management.", kr:"일반적인 통념과 달리, 미루기는 게으름이나 시간 관리 부족 때문이 아니다.", grammar:"Contrary to: ~와 반대로 / due to: ~ 때문에", vocab:[{w:"contrary to",pos:"phr",kr:"~와 반대로"},{w:"laziness",pos:"n",kr:"게으름"},{w:"time management",pos:"n",kr:"시간 관리"}]},
    {num:8, en:"Scientific studies suggest procrastination is, in fact, caused by poor mood management.", kr:"과학적 연구들은 미루기가 사실 기분 관리 실패로 인해 발생한다고 제안한다.", grammar:"in fact: 사실 / be caused by: ~에 의해 야기되다", vocab:[{w:"mood management",pos:"n",kr:"기분 관리"}]},
    {num:9, en:"This makes sense if we consider that people are more likely to put off starting or completing tasks that they are really not keen to do.", kr:"사람들이 정말 하고 싶지 않은 작업을 시작하거나 완료하는 것을 더 쉽게 미룬다는 것을 고려하면 이것은 타당하다.", grammar:"make sense: 말이 되다 / put off: 미루다 / be keen to: ~하고 싶어하다", vocab:[{w:"put off",pos:"phr.v",kr:"미루다"},{w:"keen",pos:"adj",kr:"열성적인, 하고 싶어하는"}]},
    {num:10, en:"If just thinking about the task threatens our sense of self-worth or makes us anxious, we will be more likely to put it off.", kr:"그 과제에 대해 생각하는 것만으로도 자존감을 위협하거나 불안하게 만든다면, 우리는 그것을 미룰 가능성이 더 높다.", grammar:"threaten: 위협하다 / sense of self-worth: 자존감 / be more likely to: ~할 가능성이 더 높다", vocab:[{w:"self-worth",pos:"n",kr:"자존감"},{w:"threaten",pos:"v",kr:"위협하다"}]},
    {num:11, en:"Research involving brain imaging has found that areas of the brain linked to detection of threats and emotion regulation are actually different in people who chronically procrastinate compared to those who don't procrastinate frequently.", kr:"뇌 영상 연구에 따르면 위협 감지 및 감정 조절과 관련된 뇌 영역이 만성적으로 미루는 사람들에서 자주 미루지 않는 사람들에 비해 실제로 다르다.", grammar:"chronically: 만성적으로 / compared to: ~에 비해 / regulation: 조절", vocab:[{w:"chronically",pos:"adv",kr:"만성적으로"},{w:"regulation",pos:"n",kr:"조절, 규제"},{w:"detection",pos:"n",kr:"감지"}]},
    {type:"para", label:"Para C", role:"완벽주의와 기분 수리 메커니즘"},
    {num:12, en:"Tasks that are emotionally loaded or difficult, such as preparing for exams, are prime candidates for procrastination.", kr:"시험 준비와 같이 감정적으로 부담이 크거나 어려운 과제들은 미루기의 주요 대상이다.", grammar:"emotionally loaded: 감정적으로 부담이 큰 / prime: 주요한 / candidate: 대상, 후보", vocab:[{w:"emotionally loaded",pos:"adj",kr:"감정적으로 부담이 큰"},{w:"prime",pos:"adj",kr:"주요한, 으뜸의"}]},
    {num:13, en:"People with low self-esteem are more likely to procrastinate.", kr:"자존감이 낮은 사람들이 미룰 가능성이 더 높다.", grammar:"self-esteem: 자존감 / be more likely to: ~할 가능성이 높다", vocab:[{w:"self-esteem",pos:"n",kr:"자존감"}]},
    {num:14, en:"Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", kr:"미루는 경향이 있는 또 다른 그룹은 완벽주의자들로, 자신의 작업이 남들에게 가혹하게 평가될 것을 걱정한다.", grammar:"tend to: ~하는 경향이 있다 / harshly: 가혹하게 / perfectionist: 완벽주의자", vocab:[{w:"perfectionist",pos:"n",kr:"완벽주의자"},{w:"harshly",pos:"adv",kr:"가혹하게"}]},
    {num:15, en:"We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", kr:"보고서를 완성하지 않거나 집 수리를 마치지 않으면 우리가 한 것이 평가받을 수 없다는 것을 안다.", grammar:"if + 현재시제: 가정적 상황 / evaluate: 평가하다", vocab:[{w:"evaluate",pos:"v",kr:"평가하다"}]},
    {num:16, en:"When we avoid such tasks, we also avoid the negative emotions associated with them.", kr:"그런 과제들을 피할 때, 우리는 그것들과 관련된 부정적인 감정도 피한다.", grammar:"be associated with: ~와 관련되다", vocab:[{w:"associated with",pos:"phr",kr:"~와 관련된"}]},
    {num:17, en:"This is rewarding, and it conditions us to use procrastination to repair our mood.", kr:"이것은 보람 있고, 기분을 수리하기 위해 미루기를 사용하도록 우리를 조건화한다.", grammar:"reward: 보상하다 / condition: 조건화하다 / repair: 수리하다 (비유적)", vocab:[{w:"rewarding",pos:"adj",kr:"보람 있는"},{w:"condition",pos:"v",kr:"조건화하다"},{w:"repair",pos:"v",kr:"수리하다"}]},
    {num:18, en:"If we engage in more enjoyable tasks instead, we get another mood boost.", kr:"대신 더 즐거운 과제에 종사하면 기분 향상이 또 한 번 온다.", grammar:"engage in: ~에 종사하다, 참여하다 / mood boost: 기분 향상", vocab:[{w:"engage in",pos:"phr.v",kr:"~에 종사하다, 참여하다"},{w:"boost",pos:"n",kr:"향상, 증진"}]},
    {num:19, en:"In the long run, however, procrastination isn't an effective way of managing emotions.", kr:"그러나 장기적으로 미루기는 감정을 관리하는 효과적인 방법이 아니다.", grammar:"in the long run: 장기적으로 / effective: 효과적인", vocab:[{w:"in the long run",pos:"phr",kr:"장기적으로"}]},
    {num:20, en:"The 'mood repair' we experience is temporary.", kr:"우리가 경험하는 '기분 수리'는 일시적이다.", grammar:"temporary: 일시적인 / mood repair: 기분 수리 (비유적 표현)", vocab:[{w:"temporary",pos:"adj",kr:"일시적인"}]},
    {num:21, en:"Afterwards, people tend to be left with a sense of guilt that not only increases their negative mood, but also reinforces their tendency to procrastinate.", kr:"이후 사람들은 부정적인 기분을 증가시킬 뿐만 아니라 미루는 경향을 강화하는 죄책감을 갖는 경향이 있다.", grammar:"not only A but also B / reinforce: 강화하다 / tendency: 경향", vocab:[{w:"guilt",pos:"n",kr:"죄책감"},{w:"reinforce",pos:"v",kr:"강화하다"},{w:"tendency",pos:"n",kr:"경향"}]},
    {type:"para", label:"Para D", role:"미루기의 대가 — 생산성과 직업"},
    {num:22, en:"So why is this such a problem?", kr:"그렇다면 왜 이것이 그런 문제인가?", grammar:"수사의문문 / such + 명사: 그런 ~", vocab:[]},
    {num:23, en:"When most people think of the costs of procrastination, they think of the toll on productivity.", kr:"대부분의 사람들이 미루기의 대가를 생각할 때, 그들은 생산성에 대한 타격을 생각한다.", grammar:"cost: 대가 / toll on: ~에 대한 타격 / productivity: 생산성", vocab:[{w:"toll",pos:"n",kr:"타격, 피해"},{w:"productivity",pos:"n",kr:"생산성"}]},
    {num:24, en:"For example, studies have shown that procrastination negatively impacts on student performance.", kr:"예를 들어, 연구들은 미루기가 학생 성취도에 부정적인 영향을 미친다는 것을 보여줬다.", grammar:"impact on: ~에 영향을 미치다 / negatively: 부정적으로", vocab:[{w:"impact on",pos:"phr.v",kr:"~에 영향을 미치다"},{w:"performance",pos:"n",kr:"성취도, 수행"}]},
    {num:25, en:"But putting off reading textbooks and writing essays may affect other areas of students' lives.", kr:"그러나 교재 읽기와 에세이 작성을 미루는 것은 학생 삶의 다른 영역에도 영향을 미칠 수 있다.", grammar:"put off + 동명사: ~을 미루다", vocab:[{w:"textbook",pos:"n",kr:"교재"}]},
    {num:26, en:"In one study of over 3,000 German students over a six-month period, those who reported procrastinating over their university work were also more likely to engage in study-related misconduct, such as cheating and plagiarism.", kr:"6개월 기간 독일 학생 3,000명 이상을 대상으로 한 연구에서, 대학 과제를 미룬다고 보고한 학생들이 부정행위와 표절 같은 학업 관련 비위를 저지를 가능성도 더 높았다.", grammar:"misconduct: 비위, 부정행위 / plagiarism: 표절", vocab:[{w:"misconduct",pos:"n",kr:"비위, 부정행위"},{w:"plagiarism",pos:"n",kr:"표절"},{w:"cheating",pos:"n",kr:"부정행위"}]},
    {num:27, en:"But the behaviour that procrastination was most closely linked with was using fraudulent excuses to get deadline extensions.", kr:"그러나 미루기와 가장 밀접하게 연관된 행동은 마감 연장을 받기 위해 허위 변명을 사용하는 것이었다.", grammar:"fraudulent: 허위의, 사기적인 / deadline extension: 마감 연장", vocab:[{w:"fraudulent",pos:"adj",kr:"허위의, 사기적인"},{w:"extension",pos:"n",kr:"연장"}]},
    {num:28, en:"Other research shows that employees on average spend almost a quarter of their workday procrastinating, and again this is linked with negative outcomes.", kr:"다른 연구에 따르면 직원들은 평균적으로 근무일의 거의 4분의 1을 미루는 데 보내며, 이것 역시 부정적인 결과와 연결된다.", grammar:"on average: 평균적으로 / a quarter of: ~의 4분의 1", vocab:[{w:"outcome",pos:"n",kr:"결과, 성과"}]},
    {num:29, en:"In fact, in one US survey of over 22,000 employees, participants who said they regularly procrastinated had less annual income and less employment stability.", kr:"실제로, 미국 직원 22,000명 이상을 대상으로 한 설문조사에서, 규칙적으로 미룬다고 말한 참가자들은 연간 소득이 더 낮고 고용 안정성도 낮았다.", grammar:"annual: 연간의 / employment stability: 고용 안정성", vocab:[{w:"annual income",pos:"n",kr:"연간 소득"},{w:"employment stability",pos:"n",kr:"고용 안정성"}]},
    {num:30, en:"For every one-point increase on a measure of chronic procrastination, annual income decreased by US$15,000.", kr:"만성적 미루기 측정치에서 1점 증가할 때마다 연간 소득이 15,000달러 감소했다.", grammar:"for every + 명사 + increase: ~가 증가할 때마다 / chronic: 만성적인", vocab:[{w:"chronic",pos:"adj",kr:"만성적인"},{w:"measure",pos:"n",kr:"측정치, 척도"}]},
    {type:"para", label:"Para E", role:"건강과 웰빙에 대한 영향"},
    {num:31, en:"Procrastination also correlates with serious health and well-being problems.", kr:"미루기는 심각한 건강 및 웰빙 문제와도 상관관계가 있다.", grammar:"correlate with: ~와 상관관계가 있다 / well-being: 웰빙, 안녕", vocab:[{w:"correlate with",pos:"phr.v",kr:"~와 상관관계가 있다"},{w:"well-being",pos:"n",kr:"웰빙, 안녕"}]},
    {num:32, en:"A tendency to procrastinate is linked to poor mental health, including higher levels of depression and anxiety.", kr:"미루는 경향은 높은 수준의 우울증과 불안을 포함한 낮은 정신 건강과 연결된다.", grammar:"be linked to: ~와 연결되다 / mental health: 정신 건강", vocab:[{w:"depression",pos:"n",kr:"우울증"},{w:"anxiety",pos:"n",kr:"불안"},{w:"mental health",pos:"n",kr:"정신 건강"}]},
    {num:33, en:"Across numerous studies, I've found people who regularly procrastinate report a greater number of health issues, such as headaches, flu and colds, and digestive issues.", kr:"수많은 연구에 걸쳐, 나는 규칙적으로 미루는 사람들이 두통, 독감 및 감기, 소화 장애 등 더 많은 건강 문제를 보고한다는 것을 발견했다.", grammar:"across: ~에 걸쳐 / digestive: 소화의", vocab:[{w:"digestive",pos:"adj",kr:"소화의"},{w:"flu",pos:"n",kr:"독감"}]},
    {num:34, en:"They also experience higher levels of stress and poor sleep quality.", kr:"그들은 또한 더 높은 수준의 스트레스와 낮은 수면의 질을 경험한다.", grammar:"sleep quality: 수면의 질", vocab:[{w:"sleep quality",pos:"n",kr:"수면의 질"}]},
    {num:35, en:"They are less likely to practise healthy behaviours, such as eating a healthy diet and regularly exercising, and use destructive coping strategies to manage their stress.", kr:"그들은 건강한 식단과 규칙적인 운동 같은 건강한 행동을 실천할 가능성이 낮으며 스트레스를 관리하기 위해 파괴적인 대처 전략을 사용한다.", grammar:"coping strategy: 대처 전략 / destructive: 파괴적인", vocab:[{w:"coping strategy",pos:"n",kr:"대처 전략"},{w:"destructive",pos:"adj",kr:"파괴적인"}]},
    {num:36, en:"In one study of over 700 people, I found people prone to procrastination had a 63% greater risk of poor heart health after accounting for other personality traits and demographics.", kr:"700명 이상을 대상으로 한 연구에서, 나는 미루기 경향이 있는 사람들이 다른 성격 특성과 인구통계를 감안한 후에도 심장 건강이 나쁠 위험이 63% 더 높다는 것을 발견했다.", grammar:"prone to: ~하는 경향이 있는 / account for: ~을 감안하다 / demographics: 인구통계", vocab:[{w:"prone to",pos:"phr",kr:"~하는 경향이 있는"},{w:"demographics",pos:"n",kr:"인구통계"}]},
    {type:"para", label:"Para F", role:"해결책 — 감정 관리와 자기 용서"},
    {num:37, en:"Finding better ways of managing our emotions is one route out of the vicious cycle of procrastination.", kr:"감정을 관리하는 더 좋은 방법을 찾는 것이 미루기의 악순환에서 벗어나는 한 가지 방법이다.", grammar:"vicious cycle: 악순환 / route out of: ~에서 벗어나는 방법", vocab:[{w:"vicious cycle",pos:"n",kr:"악순환"},{w:"route",pos:"n",kr:"방법, 길"}]},
    {num:38, en:"An important first step is to manage our environment and how we view the task.", kr:"중요한 첫 번째 단계는 환경을 관리하고 과제를 보는 방식을 바꾸는 것이다.", grammar:"how we view: 우리가 보는 방식", vocab:[{w:"environment",pos:"n",kr:"환경"}]},
    {num:39, en:"There are a number of evidence-based strategies that can help us fend off distractions that can occupy our minds when we should be focusing on the thing we should be getting on with.", kr:"우리가 해야 할 일에 집중해야 할 때 마음을 사로잡는 산만함을 물리치는 데 도움이 되는 증거 기반 전략들이 있다.", grammar:"evidence-based: 증거 기반의 / fend off: 물리치다 / distraction: 산만함", vocab:[{w:"evidence-based",pos:"adj",kr:"증거 기반의"},{w:"fend off",pos:"phr.v",kr:"물리치다"},{w:"distraction",pos:"n",kr:"산만함, 방해물"}]},
    {num:40, en:"For example, reminding ourselves about why the task is important and valuable can increase positive feelings towards it.", kr:"예를 들어, 과제가 왜 중요하고 가치 있는지 스스로에게 상기시키는 것이 그것에 대한 긍정적인 감정을 높일 수 있다.", grammar:"remind A of B: A에게 B를 상기시키다 / valuable: 가치 있는", vocab:[{w:"remind",pos:"v",kr:"상기시키다"},{w:"valuable",pos:"adj",kr:"가치 있는"}]},
    {num:41, en:"Forgiving ourselves and feeling compassion when we procrastinate can help break the procrastination cycle.", kr:"미룰 때 자신을 용서하고 연민을 느끼는 것이 미루기 사이클을 깨는 데 도움이 될 수 있다.", grammar:"forgive: 용서하다 / compassion: 연민 / break the cycle: 사이클을 깨다", vocab:[{w:"forgive",pos:"v",kr:"용서하다"},{w:"compassion",pos:"n",kr:"연민, 동정심"}]},
    {num:42, en:"We should admit that we feel bad, but not be overly critical of ourselves.", kr:"우리는 기분이 나쁘다는 것을 인정하되 지나치게 자기비판적이어서는 안 된다.", grammar:"admit: 인정하다 / overly: 지나치게 / critical of: ~에 비판적인", vocab:[{w:"admit",pos:"v",kr:"인정하다"},{w:"overly",pos:"adv",kr:"지나치게"}]},
    {num:43, en:"We should remind ourselves that we're not the first person to procrastinate, nor the last.", kr:"우리는 우리가 처음으로 미루는 사람이 아니며 마지막도 아니라는 것을 스스로에게 상기시켜야 한다.", grammar:"nor the last: 마지막도 아니다 / not A nor B: A도 B도 아닌", vocab:[]},
    {num:44, en:"Doing this can take the edge off the negative feelings we have about ourselves when we procrastinate.", kr:"이렇게 하는 것은 우리가 미룰 때 자신에 대해 갖는 부정적인 감정의 날을 무디게 할 수 있다.", grammar:"take the edge off: ~의 날카로움을 무디게 하다, 완화하다", vocab:[{w:"take the edge off",pos:"phr",kr:"~을 완화하다"}]},
    {num:45, en:"This can all make it easier to get back on track.", kr:"이 모든 것이 다시 궤도에 오르는 것을 더 쉽게 만들 수 있다.", grammar:"make it + 형용사 + to부정사: ~하는 것을 더 ~하게 만들다 / get back on track: 다시 궤도에 오르다", vocab:[{w:"get back on track",pos:"phr",kr:"다시 궤도에 오르다"}]}
  ],
  allVocab:[
    {w:"procrastination",pos:"n",pron:"/prəˌkræstɪˈneɪʃn/",kr:"미루기, 지연",ex:"Procrastination is caused by poor mood management.",syn:"delay, postponement"},
    {w:"self-esteem",pos:"n",pron:"/ˌselfɪˈstiːm/",kr:"자존감",ex:"People with low self-esteem tend to procrastinate.",syn:"self-worth, confidence"},
    {w:"perfectionist",pos:"n",pron:"/pəˈfekʃənɪst/",kr:"완벽주의자",ex:"Perfectionists worry their work will be judged harshly.",syn:"overachiever"},
    {w:"fraudulent",pos:"adj",pron:"/ˈfrɔːdjʊlənt/",kr:"허위의, 사기적인",ex:"They used fraudulent excuses to get extensions.",syn:"false, dishonest"},
    {w:"vicious cycle",pos:"n",pron:"/ˈvɪʃəs ˈsaɪkl/",kr:"악순환",ex:"Guilt reinforces the vicious cycle of procrastination.",syn:"downward spiral"},
    {w:"compassion",pos:"n",pron:"/kəmˈpæʃn/",kr:"연민",ex:"Feeling compassion for yourself can break the cycle.",syn:"empathy, sympathy"},

    {w:"chronic",pos:"adj",pron:"/ˈkrɒnɪk/",kr:"만성적인",ex:"Chronic procrastinators have different brain activity.",syn:"persistent, ongoing"},
    {w:"prone to",pos:"phr",pron:"/prəʊn tuː/",kr:"~하는 경향이 있는",ex:"People prone to procrastination face more health risks.",syn:"inclined to, likely to"},
    {w:"correlate with",pos:"phr.v",pron:"/ˈkɒrəleɪt/",kr:"~와 상관관계가 있다",ex:"Procrastination correlates with poor mental health.",syn:"associate with, link to"}

  tfng:[
    {qNum:14, stmt:"[Para Matching] B — mention of false assumptions about why people procrastinate", correct:"B", mine:"", evPara:"Para B", ev:"Contrary to popular belief, procrastination is not due to laziness or poor time management.", why:"일반적 통념(게으름/시간관리)이 틀렸다는 내용 → B", trap:"Para A도 통념을 언급하지만 이건 도입부"},
    {qNum:15, stmt:"[Para Matching] F — reference to the realisation that others also procrastinate", correct:"F", mine:"", evPara:"Para F", ev:"We should remind ourselves that we're not the first person to procrastinate, nor the last.", why:"다른 사람들도 미룬다는 것을 상기시키라는 내용 → F", trap:"Para C도 이에 관련이 있을 것 같지만 F가 더 직접적"},
    {qNum:16, stmt:"[Para Matching] B — neurological evidence of a link between procrastination and emotion", correct:"B", mine:"", evPara:"Para B", ev:"Research involving brain imaging has found that areas of the brain linked to detection of threats and emotion regulation are actually different...", why:"뇌 영상(신경학적 증거)으로 감정과 미루기의 연관성 → B", trap:"B가 두 문제(14, 16) 모두의 답 — 같은 단락 중복 사용 가능"}

    {lbl:"Para B", role:"원인 반박", desc:"게으름/시간관리 아님 → 기분 관리 실패 / 뇌 영상으로 차이 확인"},

    {lbl:"Para E", role:"대가 — 건강", desc:"우울·불안·두통·소화 문제 / 심장 건강 위험 63% 증가"},

  summary:"미루기는 게으름이 아닌 기분 관리 실패에서 비롯된다. 완벽주의자와 저자존감 사람들이 특히 취약하다. 회피 → 일시적 기분 향상 → 죄책감의 악순환이 생긴다. 생산성 저하, 부정행위, 소득 감소, 심장 질환 위험 증가 등 심각한 결과를 낳는다. 자기 용서와 환경 관리가 핵심 해결책이다."

"C20_T2_P3": {
  title:"Cambridge 20 · Test 2 · Passage 3",
  topic:"Invasion of the Robot Umpires",
  qTypes:["Yes / No / Not Given","Summary Completion","Multiple Choice"],
  sentences:[
    {type:"para", label:"Para 1", role:"도입 — 로봇 심판 첫 등장"},
    {num:1, en:"A few years ago, Fred DeJesus from Brooklyn, New York became the first umpire in a minor league baseball game to use something called the Automated Ball-Strike System (ABS), often referred to as the 'robo-umpire'.", kr:"몇 년 전, 뉴욕 브루클린의 프레드 드헤수스는 마이너 리그 야구 경기에서 자동 볼-스트라이크 시스템(ABS), 흔히 '로봇 심판'이라 불리는 것을 사용한 첫 번째 심판이 됐다.", grammar:"refer to A as B: A를 B로 부르다 / minor league: 마이너 리그", vocab:[{w:"umpire",pos:"n",kr:"심판"},{w:"automated",pos:"adj",kr:"자동화된"},{w:"robo-umpire",pos:"n",kr:"로봇 심판"}]},
    {num:2, en:"Instead of making any judgments himself about a strike, DeJesus had decisions fed to him through an earpiece, connected to a modified missile-tracking system.", kr:"스트라이크에 대한 판단을 스스로 내리는 대신, 드헤수스는 수정된 미사일 추적 시스템에 연결된 이어피스를 통해 결정을 전달받았다.", grammar:"Instead of + 동명사 / have + 목적어 + p.p.: 결정을 전달받다", vocab:[{w:"judgment",pos:"n",kr:"판단"},{w:"earpiece",pos:"n",kr:"이어피스"},{w:"missile-tracking",pos:"adj",kr:"미사일 추적의"}]},
    {num:3, en:"The contraption looked like a large black pizza box with one glowing green eye; it was mounted above the press stand.", kr:"그 장치는 빛나는 녹색 눈이 하나 달린 커다란 검은 피자 상자처럼 생겼으며, 프레스 스탠드 위에 장착되었다.", grammar:"contraption: 장치 (다소 우스운) / mount: 장착하다 / glow: 빛나다", vocab:[{w:"contraption",pos:"n",kr:"(우스꽝스러운) 장치"},{w:"mounted",pos:"v",kr:"장착된"}]},
    {type:"para", label:"Para 2", role:"ABS 작동 방식 — 스트라이크 존"},
    {num:4, en:"Major League Baseball (MLB), who had commissioned the system, wanted human umpires to announce the calls, just as they would have done in the past.", kr:"시스템을 의뢰한 메이저 리그 야구(MLB)는 과거와 마찬가지로 인간 심판이 판정을 발표하기를 원했다.", grammar:"commission: 의뢰하다 / announce the calls: 판정을 발표하다", vocab:[{w:"commission",pos:"v",kr:"의뢰하다"},{w:"announce",pos:"v",kr:"발표하다, 선언하다"}]},
    {num:5, en:"When the first pitch came in, a recorded voice told DeJesus it was a strike.", kr:"첫 번째 투구가 들어왔을 때, 녹음된 목소리가 드헤수스에게 스트라이크라고 알려줬다.", grammar:"pitch: 투구 / come in: 들어오다", vocab:[{w:"pitch",pos:"n",kr:"투구"},{w:"recorded",pos:"adj",kr:"녹음된"}]},
    {num:6, en:"Previously, calling a strike was a judgment call on the part of the umpire.", kr:"이전에는 스트라이크 판정이 심판의 주관적 판단이었다.", grammar:"judgment call: 주관적 판단 / on the part of: ~의 입장에서", vocab:[{w:"judgment call",pos:"n",kr:"주관적 판단"},{w:"previously",pos:"adv",kr:"이전에"}]},
    {num:7, en:"Even if the batter does not hit the ball, a pitch that passes through the 'strike zone' (an imaginary zone about seventeen inches wide, stretching from the batter's knees to the middle of his chest) is considered a strike.", kr:"타자가 공을 치지 않더라도, '스트라이크 존'(폭 약 17인치로 타자의 무릎에서 가슴 중간까지 뻗은 가상의 구역)을 통과하는 투구는 스트라이크로 간주된다.", grammar:"Even if: 설령 ~하더라도 / be considered: ~로 간주되다 / imaginary: 가상의", vocab:[{w:"batter",pos:"n",kr:"타자"},{w:"imaginary",pos:"adj",kr:"가상의"},{w:"strike zone",pos:"n",kr:"스트라이크 존"}]},
    {num:8, en:"During that first game, when DeJesus announced calls, there was no heckling and no shouted disagreement.", kr:"그 첫 번째 경기 동안, 드헤수스가 판정을 발표했을 때 야유도 고함 항의도 없었다.", grammar:"heckle: 야유하다 / shouted: 고함치는", vocab:[{w:"heckling",pos:"n",kr:"야유, 방해"},{w:"disagreement",pos:"n",kr:"항의, 불일치"}]},
    {num:9, en:"Nobody said a word.", kr:"아무도 말 한마디 하지 않았다.", grammar:"say a word: 말 한마디 하다", vocab:[]},
    {type:"para", label:"Para 3", role:"야구의 논쟁 문화 — 150년의 전통"},
    {num:10, en:"For a hundred and fifty years or so, the strike zone has been the game's animating force-countless arguments between a team's manager and the umpire have taken place over its boundaries and whether a ball had crossed through it.", kr:"약 150년 동안 스트라이크 존은 경기의 원동력이었다 — 스트라이크 존의 경계와 공이 통과했는지를 둘러싼 팀 감독과 심판 사이의 수많은 논쟁이 있었다.", grammar:"animating force: 원동력 / take place: 일어나다 / boundary: 경계", vocab:[{w:"animating force",pos:"n",kr:"원동력"},{w:"boundary",pos:"n",kr:"경계"},{w:"countless",pos:"adj",kr:"수많은"}]},
    {num:11, en:"The rules of play have evolved in various stages.", kr:"게임 규칙은 다양한 단계를 거쳐 발전해왔다.", grammar:"evolve: 진화하다, 발전하다 / various stages: 다양한 단계", vocab:[{w:"evolve",pos:"v",kr:"발전하다, 진화하다"}]},
    {num:12, en:"Today, everyone knows that you may scream your disagreement in an umpire's face, but you must never shout personal abuse at them or touch them.", kr:"오늘날, 심판의 면전에서 항의를 외칠 수는 있지만, 개인적 모욕을 퍼붓거나 심판을 건드려서는 절대 안 된다는 것을 모두가 안다.", grammar:"abuse: 욕설, 모욕 / in one's face: 면전에서", vocab:[{w:"abuse",pos:"n",kr:"욕설, 모욕"},{w:"personal abuse",pos:"n",kr:"개인적 모욕"}]},
    {num:13, en:"That's a no-no.", kr:"그것은 절대 안 되는 일이다.", grammar:"no-no: 절대 안 되는 일 (구어)", vocab:[{w:"no-no",pos:"n",kr:"절대 안 되는 일"}]},
    {num:14, en:"When the robo-umpires came, however, the arguments stopped.", kr:"그러나 로봇 심판이 등장하자 논쟁이 멈췄다.", grammar:"came: 등장했다 / argument: 논쟁", vocab:[]},
    {type:"para", label:"Para 4", role:"ABS의 정밀도와 논란"},
    {num:15, en:"During the first robo-umpire season, players complained about some strange calls.", kr:"첫 번째 로봇 심판 시즌 동안, 선수들은 일부 이상한 판정에 대해 불평했다.", grammar:"complain about: ~에 대해 불평하다 / call: 판정", vocab:[{w:"complain",pos:"v",kr:"불평하다"}]},
    {num:16, en:"In response, MLB decided to tweak the dimensions of the zone, and the following year the consensus was that ABS is profoundly consistent.", kr:"이에 대응하여 MLB는 구역의 치수를 조정하기로 했고, 다음 해에는 ABS가 매우 일관적이라는 합의에 이르렀다.", grammar:"tweak: 미세 조정하다 / consensus: 합의 / profoundly: 매우, 깊이", vocab:[{w:"tweak",pos:"v",kr:"미세 조정하다"},{w:"consensus",pos:"n",kr:"합의"},{w:"consistent",pos:"adj",kr:"일관적인"}]},
    {num:17, en:"MLB says the device is near-perfect, precise to within fractions of an inch.", kr:"MLB는 그 장치가 거의 완벽하며 수 분의 1인치 이내로 정밀하다고 말한다.", grammar:"near-perfect: 거의 완벽한 / fraction: 분수, 아주 작은 부분", vocab:[{w:"precise",pos:"adj",kr:"정밀한, 정확한"},{w:"fraction",pos:"n",kr:"분수, 극히 작은 부분"}]},
    {num:18, en:"'It'll reduce controversy in the game, and be good for the game,' says Rob Manfred, who is Commissioner for MLB.", kr:"'그것은 경기에서 논란을 줄이고 경기에 좋을 것입니다'라고 MLB 커미셔너 롭 만프레드가 말한다.", grammar:"Commissioner: 커미셔너 (최고 책임자) / reduce: 줄이다 / controversy: 논란", vocab:[{w:"controversy",pos:"n",kr:"논란, 논쟁"},{w:"Commissioner",pos:"n",kr:"커미셔너, 최고 책임자"}]},
    {num:19, en:"But the question is whether controversy is worth reducing, or whether it is the sign of a human hand.", kr:"그러나 문제는 논란이 줄일 가치가 있는지, 아니면 그것이 인간의 손길의 표시인지다.", grammar:"whether A or B / worth + 동명사: ~할 가치가 있는 / sign: 표시", vocab:[{w:"worth",pos:"adj",kr:"~할 가치가 있는"},{w:"sign",pos:"n",kr:"표시, 신호"}]},
    {type:"para", label:"Para 5", role:"인간 심판의 재량 — 기술 vs. 예술"},
    {num:20, en:"A human, at least, yells back.", kr:"적어도 인간은 되받아 소리를 지른다.", grammar:"yell back: 되받아 소리를 지르다", vocab:[{w:"yell",pos:"v",kr:"소리를 지르다"}]},
    {num:21, en:"When I spoke with Frank Viola, a coach for a North Carolina team, he said that ABS works as designed, but that it was also unforgiving and pedantic, almost legalistic.", kr:"노스캐롤라이나 팀 코치 프랭크 비올라와 이야기했을 때, 그는 ABS가 설계대로 작동하지만 용서가 없고 현학적이며 거의 법률 조항처럼 경직되어 있다고 말했다.", grammar:"unforgiving: 용서없는 / pedantic: 현학적인 / legalistic: 법률 조항에 얽매이는", vocab:[{w:"unforgiving",pos:"adj",kr:"용서없는, 가혹한"},{w:"pedantic",pos:"adj",kr:"현학적인"},{w:"legalistic",pos:"adj",kr:"법률 조항에 얽매이는"}]},
    {num:22, en:"'Manfred is a lawyer,' Viola noted.", kr:"'만프레드는 변호사입니다'라고 비올라는 언급했다.", grammar:"note: 언급하다 / lawyer: 변호사", vocab:[]},
    {num:23, en:"Some pitchers have complained that, compared with a human's, the robot's strike zone seems too precise.", kr:"일부 투수들은 인간 심판의 스트라이크 존에 비해 로봇의 것이 너무 정밀한 것 같다고 불평했다.", grammar:"compared with: ~에 비해 / pitcher: 투수", vocab:[{w:"pitcher",pos:"n",kr:"투수"}]},
    {num:24, en:"Viola was once a major-league player himself.", kr:"비올라는 한때 메이저 리그 선수였다.", grammar:"once: 한때 / major-league: 메이저 리그의", vocab:[]},
    {num:25, en:"When he was pitching, he explained, umpires rewarded skill.", kr:"그가 투수로 뛸 때는 심판들이 실력에 보상을 해줬다고 그는 설명했다.", grammar:"reward: 보상하다 / skill: 실력", vocab:[{w:"reward",pos:"v",kr:"보상하다"}]},
    {num:26, en:"'Throw it where you aimed, and it would be a strike, even if it was an inch or two outside. There was a dialogue between pitcher and umpire.'", kr:"'목표한 곳에 던지면 1~2인치 바깥이어도 스트라이크로 인정됐어요. 투수와 심판 사이에 대화가 있었죠.'", grammar:"aimed: 목표한 / outside: 구역 바깥 / dialogue: 대화", vocab:[{w:"dialogue",pos:"n",kr:"대화, 소통"}]},
    {type:"para", label:"Para 6", role:"ABS 도입 배경 — 젊은 팬층 확보"},
    {num:27, en:"The executive tasked with running the experiment for MLB is Morgan Sword, who's in charge of baseball operations.", kr:"MLB를 위한 실험을 운영하는 임원은 야구 운영 담당인 모건 소드다.", grammar:"be tasked with: ~를 담당하다 / in charge of: ~의 담당인", vocab:[{w:"executive",pos:"n",kr:"임원, 경영자"},{w:"in charge of",pos:"phr",kr:"~를 담당하는"}]},
    {num:28, en:"According to Sword, ABS was part of a larger project to make baseball more exciting since executives are terrified of losing younger fans, as has been the case with horse racing and boxing.", kr:"소드에 따르면, ABS는 야구를 더 흥미롭게 만들기 위한 더 큰 프로젝트의 일환이었다 — 임원들이 경마와 권투처럼 젊은 팬들을 잃을까 두려워하기 때문이다.", grammar:"be terrified of: ~을 두려워하다 / as has been the case with: ~의 경우처럼", vocab:[{w:"terrified",pos:"adj",kr:"두려워하는"},{w:"executive",pos:"n",kr:"임원"}]},
    {num:29, en:"He explains how they began the process by asking fans what version of baseball they found most exciting.", kr:"그는 팬들에게 어떤 버전의 야구가 가장 흥미롭다고 생각하는지 묻는 것으로 그 과정을 시작했다고 설명한다.", grammar:"how + 주어 + 동사: ~하는 방법 / version: 버전, 형태", vocab:[]},
    {num:30, en:"The results showed that everyone wanted more action: more hits, more defense, more baserunning.", kr:"결과에 따르면 모든 사람이 더 많은 액션을 원했다: 더 많은 안타, 수비, 베이스 달리기.", grammar:"defense: 수비 / baserunning: 베이스 달리기", vocab:[{w:"defense",pos:"n",kr:"수비"},{w:"baserunning",pos:"n",kr:"베이스 달리기"}]},
    {num:31, en:"This type of baseball essentially hasn't existed since the 1960s, when the hundred-mile-an-hour fastball, which is difficult to hit and control, entered the game.", kr:"이런 유형의 야구는 본질적으로 1960년대 이후 존재하지 않았는데, 그때 치거나 제어하기 어려운 시속 100마일 패스트볼이 경기에 도입됐다.", grammar:"essentially: 본질적으로 / fastball: 패스트볼 (직구)", vocab:[{w:"fastball",pos:"n",kr:"패스트볼 (직구)"},{w:"essentially",pos:"adv",kr:"본질적으로"}]},
    {num:32, en:"It flattened the game into strikeouts, walks, and home runs a type of play lacking much action.", kr:"그것은 경기를 삼진, 볼넷, 홈런으로 평탄화시켰다 — 액션이 많이 부족한 유형의 경기였다.", grammar:"flatten: 평탄화하다 / strikeout: 삼진 / walk: 볼넷 / lacking: 부족한", vocab:[{w:"strikeout",pos:"n",kr:"삼진"},{w:"flatten",pos:"v",kr:"평탄화하다, 단조롭게 만들다"}]},
    {type:"para", label:"Para 7", role:"ABS의 유연성 — 스트라이크 존 변경 가능"},
    {num:33, en:"Sword's team brainstormed potential fixes.", kr:"소드의 팀은 잠재적인 해결책을 브레인스토밍했다.", grammar:"brainstorm: 브레인스토밍하다 / potential: 잠재적인", vocab:[{w:"brainstorm",pos:"v",kr:"브레인스토밍하다"},{w:"potential",pos:"adj",kr:"잠재적인"}]},
    {num:34, en:"Any rule that existed, they talked about changing-from changing the bats to changing the geometry of the field.", kr:"존재하는 모든 규칙을 바꾸는 것에 대해 이야기했다 — 배트 변경부터 경기장 기하학 변경까지.", grammar:"geometry: 기하학 (형태/크기) / from A to B: A부터 B까지", vocab:[{w:"geometry",pos:"n",kr:"기하학, 형태"},{w:"bat",pos:"n",kr:"배트"}]},
    {num:35, en:"But while all of these were ruled out as potential fixes, ABS was seen as a perfect vehicle for change.", kr:"그러나 이 모든 것이 잠재적 해결책으로 제외된 반면, ABS는 변화의 완벽한 수단으로 여겨졌다.", grammar:"rule out: 제외하다 / vehicle for: ~을 위한 수단", vocab:[{w:"rule out",pos:"phr.v",kr:"제외하다"},{w:"vehicle for",pos:"phr",kr:"~을 위한 수단"}]},
    {num:36, en:"According to Sword, once you get the technology right, you can load any strike zone you want into the system.", kr:"소드에 따르면, 기술을 제대로 갖추면 원하는 어떤 스트라이크 존도 시스템에 입력할 수 있다.", grammar:"get A right: A를 제대로 갖추다 / load: 입력하다, 로드하다", vocab:[{w:"load",pos:"v",kr:"입력하다, 로드하다"}]},
    {num:37, en:"'It might be a triangle, or a blob, or something shaped like Texas. Over time, as baseball evolves, ABS can allow the zone to change with it.'", kr:"'삼각형이나 얼룩, 텍사스 주 모양일 수도 있어요. 시간이 지나면서 야구가 발전함에 따라 ABS는 구역을 함께 변경할 수 있게 해줍니다.'", grammar:"blob: 얼룩, 덩어리 / over time: 시간이 지나면서 / evolve: 발전하다", vocab:[{w:"blob",pos:"n",kr:"얼룩, 덩어리"},{w:"evolve",pos:"v",kr:"발전하다"}]},
    {type:"para", label:"Para 8", role:"스포츠의 기술 도입 추세"},
    {num:38, en:"In the past twenty years, sports have moved away from judgment calls.", kr:"지난 20년간 스포츠는 주관적 판정에서 벗어났다.", grammar:"move away from: ~에서 벗어나다 / judgment call: 주관적 판정", vocab:[]},
    {num:39, en:"Soccer has Video Assistant Referees (for offside decisions, for example). Tennis has Hawk-Eye (for line calls, for example). For almost a decade, baseball has used instant replay on the base paths.", kr:"축구는 비디오 보조 심판(예: 오프사이드 판정)을 도입했고, 테니스는 호크-아이(예: 라인 판정)를 도입했다. 야구는 거의 10년간 베이스 경로에 즉각 리플레이를 사용했다.", grammar:"Video Assistant Referee: 비디오 보조 심판 / instant replay: 즉각 리플레이", vocab:[{w:"offside",pos:"n",kr:"오프사이드"},{w:"instant replay",pos:"n",kr:"즉각 리플레이"}]},
    {num:40, en:"This is widely liked, even if the precision can sometimes cause problems.", kr:"이것은 정밀도가 때로 문제를 일으킬 수 있음에도 불구하고 널리 환영받는다.", grammar:"even if: 비록 ~하더라도 / precision: 정밀도", vocab:[{w:"precision",pos:"n",kr:"정밀도, 정확성"}]},
    {num:41, en:"But these applications deal with something physical: bases, lines, goals.", kr:"그러나 이 응용들은 베이스, 선, 골대 같은 물리적인 것을 다룬다.", grammar:"deal with: 다루다 / physical: 물리적인", vocab:[{w:"physical",pos:"adj",kr:"물리적인"}]},
    {num:42, en:"The boundaries of action are precise, delineated like the keys of a piano.", kr:"행동의 경계가 피아노 건반처럼 명확하게 구분되어 있다.", grammar:"delineate: 명확히 구분하다 / boundary: 경계", vocab:[{w:"delineate",pos:"v",kr:"명확히 구분하다"},{w:"boundary",pos:"n",kr:"경계"}]},
    {num:43, en:"This is not the case with ABS and the strike zone. Historically, a certain discretion has been appreciated.", kr:"이것은 ABS와 스트라이크 존의 경우는 다르다. 역사적으로 어느 정도의 재량이 인정받아 왔다.", grammar:"This is not the case with: ~의 경우는 다르다 / discretion: 재량", vocab:[{w:"discretion",pos:"n",kr:"재량"},{w:"appreciate",pos:"v",kr:"인정하다, 감사히 여기다"}]},
    {type:"para", label:"Para 9", role:"반대 의견 — 알고리즘의 한계"},
    {num:44, en:"I decided to email Alva Noe, a professor at Berkeley University and a baseball fan, for his opinion.", kr:"나는 버클리 대학 교수이자 야구 팬인 알바 노에에게 이메일로 의견을 물어보기로 했다.", grammar:"ask for one's opinion: 의견을 묻다", vocab:[]},
    {num:45, en:"'Hardly a day goes by that I don't wake up and run through the reasons that this [robo-umpires] is such a terrible idea,' he replied.", kr:"'로봇 심판이 왜 그런 끔찍한 아이디어인지 그 이유를 떠올리지 않는 날이 거의 없어요'라고 그는 답했다.", grammar:"Hardly a day goes by that: ~하지 않는 날이 거의 없다 / run through: 훑어보다", vocab:[{w:"run through",pos:"phr.v",kr:"훑어보다, 상기하다"}]},
    {num:46, en:"He later told me, 'This is part of a movement to use algorithms to take the hard choices of living out of life.'", kr:"그는 나중에 나에게 '이것은 알고리즘을 사용하여 삶의 어려운 선택들을 삶에서 제거하는 운동의 일부입니다'라고 말했다.", grammar:"algorithm: 알고리즘 / take A out of B: B에서 A를 제거하다", vocab:[{w:"algorithm",pos:"n",kr:"알고리즘"}]},
    {num:47, en:"Perhaps he's right.", kr:"아마도 그가 맞을 수도 있다.", grammar:"perhaps: 아마도", vocab:[]},
    {num:48, en:"We watch baseball to kill time, not to maximize it.", kr:"우리는 시간을 보내기 위해 야구를 보지, 시간을 최대화하기 위해 보지 않는다.", grammar:"kill time: 시간을 보내다 / maximize: 최대화하다", vocab:[{w:"maximize",pos:"v",kr:"최대화하다"}]},
    {num:49, en:"Some players I have met take a dissenting stance toward the robots too, believing that accuracy is not the answer.", kr:"내가 만난 일부 선수들도 정확성이 정답이 아니라고 생각하며 로봇에 반대 입장을 취한다.", grammar:"dissenting: 반대의 / stance: 입장 / accuracy: 정확성", vocab:[{w:"dissenting",pos:"adj",kr:"반대의"},{w:"stance",pos:"n",kr:"입장"},{w:"accuracy",pos:"n",kr:"정확성"}]},
    {num:50, en:"According to Joe Russo, who plays for a New Jersey team, 'With technology, people just want everything to be perfect. That's not reality. I think perfect would be weird. Your teams are always winning, work is always just great, there's always money in your pocket, your car never breaks down. What is there to talk about?'", kr:"뉴저지 팀의 조 루소에 따르면, '기술 덕분에 사람들은 모든 것이 완벽하기를 원해요. 그것은 현실이 아닙니다. 완벽함은 이상할 것 같아요. 팀이 항상 이기고, 일이 항상 좋고, 주머니에 항상 돈이 있고, 차가 절대 고장 나지 않는다면. 무슨 이야기를 나눌 게 있을까요?'", grammar:"break down: (기계가) 고장 나다 / What is there to talk about?: 무슨 이야기를 나눌 게 있을까?", vocab:[{w:"break down",pos:"phr.v",kr:"고장 나다"}]}
  ],

  summary:"자동 볼-스트라이크 시스템(ABS)이 야구에 도입되어 논란을 제거하고 일관성을 높였지만, 인간 심판의 재량과 투수-심판 간 대화를 없앴다는 비판도 있다. MLB는 젊은 팬 유지를 위해 도입했으나, 일부는 완벽함이 스포츠의 매력을 해친다고 주장한다."

"C20_T3_P1": {
  title:"Cambridge 20 · Test 3 · Passage 1",
  topic:"Frozen Food",
  qTypes:["True / False / Not Given","Short Answer Questions","Multiple Choice"],
  sentences:[
    {type:"para", label:"Para 1", role:"도입 — 고대의 얼음 저장"},
    {num:1, en:"Around 10,000 years ago, as the last ice age came to a close, humans discovered something useful: ice can be cut, transported, and stored to preserve food.", kr:"약 1만 년 전, 마지막 빙하기가 끝나갈 무렵 인간은 유용한 것을 발견했다: 얼음은 식품을 보존하기 위해 잘라 운반하고 저장할 수 있다는 것을.", grammar:"as: ~할 때, ~하면서 / come to a close: 끝나다 / transport: 운반하다 / preserve: 보존하다", vocab:[{w:"preserve",pos:"v",kr:"보존하다"},{w:"transport",pos:"v",kr:"운반하다"},{w:"ice age",pos:"n",kr:"빙하기"}]},
    {num:2, en:"Over the subsequent millennia, ice trading became an important commercial venture - particularly in the 19th and early 20th centuries, when ice was regularly harvested from frozen ponds and rivers and transported by ship.", kr:"그 후 수천 년에 걸쳐 얼음 거래는 중요한 상업적 사업이 되었다 — 특히 19세기와 20세기 초에는 얼음이 얼어붙은 연못과 강에서 정기적으로 채취되어 선박으로 운반됐다.", grammar:"subsequent: 그 이후의 / millennia: 수천 년 / harvest: 채취하다 / commercial venture: 상업적 사업", vocab:[{w:"millennia",pos:"n",kr:"수천 년"},{w:"harvest",pos:"v",kr:"채취하다, 수확하다"},{w:"commercial venture",pos:"n",kr:"상업적 사업"}]},
    {num:3, en:"This ice was primarily used to keep food cool, a practice that greatly extended the useful life of perishables such as meat and fish.", kr:"이 얼음은 주로 식품을 시원하게 유지하는 데 사용됐으며, 이 관행은 육류와 생선 같은 부패하기 쉬운 식품의 유효 기간을 크게 연장했다.", grammar:"primarily: 주로 / perishables: 부패하기 쉬운 식품 / extend: 연장하다", vocab:[{w:"perishable",pos:"n/adj",kr:"부패하기 쉬운 (식품)"},{w:"primarily",pos:"adv",kr:"주로"}]},
    {type:"para", label:"Para 2", role:"기계식 냉동 등장 — 호주의 사례"},
    {num:4, en:"By the late 19th century, a new technology was emerging: mechanical refrigeration.", kr:"19세기 말, 새로운 기술이 등장하고 있었다: 기계식 냉동.", grammar:"emerge: 등장하다 / mechanical refrigeration: 기계식 냉동", vocab:[{w:"mechanical refrigeration",pos:"n",kr:"기계식 냉동"},{w:"emerge",pos:"v",kr:"등장하다"}]},
    {num:5, en:"In the 1880s, Australian entrepreneurs pioneered a system for shipping frozen meat to Europe.", kr:"1880년대에 호주 기업가들이 냉동 육류를 유럽으로 선적하는 시스템을 개척했다.", grammar:"entrepreneur: 기업가 / pioneer: 개척하다 / shipping: 선적", vocab:[{w:"entrepreneur",pos:"n",kr:"기업가"},{w:"pioneer",pos:"v",kr:"개척하다"}]},
    {num:6, en:"This was a transformative moment for global food supply chains, allowing food to travel far greater distances without spoiling.", kr:"이것은 전 세계 식품 공급망에 변혁적인 순간이었으며, 식품이 부패 없이 훨씬 더 먼 거리를 이동할 수 있게 했다.", grammar:"transformative: 변혁적인 / supply chain: 공급망 / without spoiling: 부패 없이", vocab:[{w:"transformative",pos:"adj",kr:"변혁적인"},{w:"supply chain",pos:"n",kr:"공급망"},{w:"spoil",pos:"v",kr:"부패하다"}]},
    {type:"para", label:"Para 3", role:"클래런스 버즈아이 — 냉동식품의 아버지"},
    {num:7, en:"The true revolution in frozen food, however, came from an unlikely source: a young American naturalist and inventor named Clarence Birdseye.", kr:"그러나 냉동식품의 진정한 혁명은 뜻밖의 원천에서 왔다: 클래런스 버즈아이라는 이름의 젊은 미국인 자연주의자이자 발명가.", grammar:"naturalist: 자연주의자 / unlikely source: 뜻밖의 원천", vocab:[{w:"naturalist",pos:"n",kr:"자연주의자"},{w:"unlikely",pos:"adj",kr:"뜻밖의, 예상 밖의"}]},
    {num:8, en:"In the early 1910s, while working in Labrador, Canada, Birdseye noticed that fish caught in the bitter cold froze almost instantly and, crucially, remained fresh and tasty when thawed later.", kr:"1910년대 초 캐나다 래브라도에서 일하던 중, 버즈아이는 혹독한 추위에 잡힌 생선이 거의 즉시 얼고, 결정적으로 나중에 해동했을 때 신선하고 맛있게 유지된다는 것을 알아챘다.", grammar:"bitter cold: 혹독한 추위 / crucially: 결정적으로 / thaw: 해동하다", vocab:[{w:"thaw",pos:"v",kr:"해동하다"},{w:"crucially",pos:"adv",kr:"결정적으로"},{w:"bitter cold",pos:"n",kr:"혹독한 추위"}]},
    {num:9, en:"He realised that rapid freezing was the key: it prevented the formation of large ice crystals that would damage food cells and affect taste and texture.", kr:"그는 빠른 냉동이 핵심임을 깨달았다: 식품 세포를 손상시키고 맛과 식감에 영향을 줄 큰 얼음 결정의 형성을 막기 때문이다.", grammar:"rapid: 빠른 / formation: 형성 / damage: 손상시키다 / texture: 식감", vocab:[{w:"rapid",pos:"adj",kr:"빠른"},{w:"ice crystal",pos:"n",kr:"얼음 결정"},{w:"texture",pos:"n",kr:"식감, 질감"}]},
    {type:"para", label:"Para 4", role:"버즈아이의 상업화 성공"},
    {num:10, en:"On returning to the United States, Birdseye set about developing a commercial system of rapid freezing, experimenting with various freezing methods.", kr:"미국으로 돌아온 후, 버즈아이는 다양한 냉동 방법을 실험하면서 빠른 냉동의 상업적 시스템을 개발하기 시작했다.", grammar:"set about + 동명사: ~을 시작하다 / experiment with: ~을 실험하다", vocab:[{w:"set about",pos:"phr.v",kr:"~을 시작하다"},{w:"experiment",pos:"v",kr:"실험하다"}]},
    {num:11, en:"His first commercial venture failed due to limited refrigeration infrastructure.", kr:"그의 첫 번째 상업적 사업은 제한된 냉동 인프라로 인해 실패했다.", grammar:"due to: ~ 때문에 / infrastructure: 인프라", vocab:[{w:"infrastructure",pos:"n",kr:"인프라"},{w:"venture",pos:"n",kr:"사업"}]},
    {num:12, en:"However, in 1929, he sold his company and patents to Goldman Sachs and the Postum Cereal Company (later known as General Foods) for $22 million.", kr:"그러나 1929년에 그는 자신의 회사와 특허를 골드만삭스와 포스텀 시리얼 컴퍼니(나중에 제너럴 푸즈로 알려짐)에 2,200만 달러에 팔았다.", grammar:"patent: 특허 / be known as: ~로 알려지다", vocab:[{w:"patent",pos:"n",kr:"특허"}]},
    {num:13, en:"These organizations had the infrastructure necessary to make frozen foods commercially successful.", kr:"이 조직들은 냉동식품을 상업적으로 성공시키는 데 필요한 인프라를 갖추고 있었다.", grammar:"necessary to + 동사: ~하는 데 필요한 / commercially: 상업적으로", vocab:[{w:"commercially",pos:"adv",kr:"상업적으로"}]},
    {type:"para", label:"Para 5", role:"냉동식품의 대중화 — TV 디너"},
    {num:14, en:"The next major innovation came in 1954, with the introduction of the 'TV dinner'.", kr:"다음 큰 혁신은 1954년에 'TV 디너'의 도입과 함께 왔다.", grammar:"innovation: 혁신 / introduction: 도입", vocab:[{w:"innovation",pos:"n",kr:"혁신"},{w:"introduction",pos:"n",kr:"도입"}]},
    {num:15, en:"The Swanson company had ordered far too many turkeys for Thanksgiving, and were left with millions of pounds of excess stock.", kr:"스완슨 회사는 추수감사절을 위해 칠면조를 너무 많이 주문했고, 수백만 파운드의 재고 잉여분이 남았다.", grammar:"excess stock: 잉여 재고 / be left with: ~이 남다 / Thanksgiving: 추수감사절", vocab:[{w:"excess",pos:"adj",kr:"잉여의, 과도한"},{w:"stock",pos:"n",kr:"재고"},{w:"Thanksgiving",pos:"n",kr:"추수감사절"}]},
    {num:16, en:"The solution devised by employee Gerry Thomas was to package individual pre-cooked meals, including turkey slices and vegetables, in aluminium trays that could be heated in the oven.", kr:"직원 게리 토머스가 고안한 해결책은 칠면조 슬라이스와 채소를 포함한 개별 사전 조리 식사를 오븐에서 가열할 수 있는 알루미늄 트레이에 포장하는 것이었다.", grammar:"devise: 고안하다 / pre-cooked: 사전 조리된 / aluminium tray: 알루미늄 트레이", vocab:[{w:"devise",pos:"v",kr:"고안하다"},{w:"aluminium",pos:"n",kr:"알루미늄"}]},
    {num:17, en:"Though not an instant hit, the TV dinner gradually became enormously popular, and by the end of the 1950s, Swanson was selling millions of units annually.", kr:"즉각적인 성공은 아니었지만, TV 디너는 점차 엄청나게 인기를 끌었고, 1950년대 말까지 스완슨은 연간 수백만 개를 판매했다.", grammar:"instant hit: 즉각적인 성공 / gradually: 점차 / enormously: 엄청나게 / annually: 연간", vocab:[{w:"gradually",pos:"adv",kr:"점차"},{w:"enormously",pos:"adv",kr:"엄청나게"},{w:"annually",pos:"adv",kr:"연간"}]},
    {type:"para", label:"Para 6", role:"현대 냉동식품 산업"},
    {num:18, en:"Today, the frozen food industry is worth hundreds of billions of dollars globally.", kr:"오늘날 냉동식품 산업은 전 세계적으로 수천억 달러의 가치를 지닌다.", grammar:"worth: ~의 가치를 가진 / globally: 전 세계적으로", vocab:[{w:"globally",pos:"adv",kr:"전 세계적으로"}]},
    {num:19, en:"The range of products available has expanded dramatically, from simple vegetables and meat to ready-made meals, desserts, and even high-end restaurant-quality dishes.", kr:"이용 가능한 제품의 범위가 단순한 채소와 육류에서 즉석 식사, 디저트, 심지어 고급 레스토랑 품질의 요리까지 극적으로 확장됐다.", grammar:"expand: 확장되다 / high-end: 고급의 / dramatically: 극적으로", vocab:[{w:"expand",pos:"v",kr:"확장되다"},{w:"high-end",pos:"adj",kr:"고급의"},{w:"dramatically",pos:"adv",kr:"극적으로"}]},
    {num:20, en:"Modern freezing technology is also far superior to that of the past, with blast freezing now allowing foods to be frozen in seconds rather than hours.", kr:"현대 냉동 기술도 과거보다 훨씬 우수하며, 블라스트 냉동으로 이제 식품을 몇 시간이 아닌 몇 초 만에 냉동할 수 있다.", grammar:"superior to: ~보다 우수한 / blast freezing: 급속 냉동 / rather than: ~ 대신", vocab:[{w:"superior",pos:"adj",kr:"우수한"},{w:"blast freezing",pos:"n",kr:"급속 냉동"}]},
    {type:"para", label:"Para 7", role:"냉동식품의 영양 가치"},
    {num:21, en:"One common misconception is that frozen food is inferior in nutritional value to fresh food.", kr:"흔한 오해 중 하나는 냉동식품이 신선한 식품보다 영양적 가치가 낮다는 것이다.", grammar:"misconception: 오해 / inferior to: ~보다 열등한 / nutritional: 영양의", vocab:[{w:"misconception",pos:"n",kr:"오해"},{w:"inferior",pos:"adj",kr:"열등한, 낮은"},{w:"nutritional",pos:"adj",kr:"영양의"}]},
    {num:22, en:"In fact, the opposite is often the case.", kr:"사실, 정반대인 경우가 많다.", grammar:"opposite: 반대 / be the case: 사실이다", vocab:[]},
    {num:23, en:"Fruit and vegetables destined for freezing are typically frozen within hours of being picked, locking in their nutrients.", kr:"냉동을 위한 과일과 채소는 보통 수확 후 몇 시간 내에 냉동되어 영양소를 가두어 놓는다.", grammar:"destined for: ~을 위해 준비된 / lock in: 가두어 놓다 / nutrients: 영양소", vocab:[{w:"destined for",pos:"phr",kr:"~을 위해 준비된"},{w:"lock in",pos:"phr.v",kr:"가두어 놓다"},{w:"nutrients",pos:"n",kr:"영양소"}]},
    {num:24, en:"By contrast, fresh produce that has been stored for several days may have lost significant amounts of vitamins and minerals.", kr:"이에 반해 며칠 동안 저장된 신선 농산물은 상당한 양의 비타민과 미네랄을 잃을 수 있다.", grammar:"by contrast: 이에 반해 / produce: 농산물 / significant: 상당한", vocab:[{w:"by contrast",pos:"phr",kr:"이에 반해"},{w:"produce",pos:"n",kr:"농산물"},{w:"significant",pos:"adj",kr:"상당한"}]}
  ],

  tfng:[
    {qNum:8, stmt:"The practice of harvesting ice for commercial purposes dates back further than 10,000 years.", correct:"NOT GIVEN", mine:"", evPara:"Para 1", ev:"Around 10,000 years ago, as the last ice age came to a close, humans discovered something useful: ice can be cut, transported, and stored.", why:"인간이 10,000년 전에 얼음 사용을 발견했다는 것은 언급되나, 상업적 얼음 채취가 그보다 더 오래됐다는 내용은 없음 → NOT GIVEN", trap:"글에서 10,000년 전이 시작점처럼 보이나, 상업적 채취 역사에 대한 비교는 없음"},
    {qNum:9, stmt:"The 19th-century trade in ice involved transporting it by sea.", correct:"TRUE", mine:"", evPara:"Para 1", ev:"ice was regularly harvested from frozen ponds and rivers and transported by ship.", why:"19세기 얼음이 선박으로 운반됐다 → TRUE", trap:"없음 — 명확한 사실 일치"},
    {qNum:10, stmt:"Birdseye's first attempts at commercialising frozen food were successful.", correct:"FALSE", mine:"", evPara:"Para 4", ev:"His first commercial venture failed due to limited refrigeration infrastructure.", why:"첫 상업적 사업이 실패 → FALSE", trap:"버즈아이가 나중에 2,200만 달러에 팔았다는 성공 이야기와 혼동"},
    {qNum:11, stmt:"Swanson's TV dinner was immediately popular with the public.", correct:"TRUE", mine:"", evPara:"Para 5", ev:"Though not an instant hit, the TV dinner gradually became enormously popular.", why:"'즉각적인 성공은 아니었지만'이라고 명시 → FALSE가 맞음 — 문제의 stmt: 'immediately popular' = FALSE", trap:"나중에 엄청난 인기를 끌었다는 내용과 혼동 (즉각적이지 않았음)", note:"correct 답은 FALSE"},
    {qNum:12, stmt:"Blast freezing is now faster than earlier methods of freezing food.", correct:"FALSE", mine:"", evPara:"Para 6", ev:"blast freezing now allowing foods to be frozen in seconds rather than hours.", why:"블라스트 냉동은 몇 초 안에 가능 → 과거보다 빠른 것은 TRUE", trap:"이전 방법이 얼마나 느렸는지 비교 — '몇 시간'이 '몇 초'보다 느림 → 현대가 빠름 → TRUE", note:"correct 답은 TRUE"},
    {qNum:13, stmt:"The nutritional content of fresh fruit and vegetables is always higher than that of frozen ones.", correct:"NOT GIVEN", mine:"", evPara:"Para 7", ev:"Fruit and vegetables destined for freezing are typically frozen within hours of being picked, locking in their nutrients.", why:"냉동식품이 신선식품보다 영양이 높을 수 있다고 하지만, '항상 더 높다'는 주장을 확인하거나 부정하지 않음 → NOT GIVEN", trap:"글에서는 냉동이 더 나을 수 있다고 하지만 절대적 비교는 없음"}

  summary:"얼음 저장은 1만 년 전 시작되어 19세기 상업적 거래로 발전했고, 클래런스 버즈아이가 급속 냉동 원리를 발견해 냉동식품 혁명을 일으켰다. 1954년 TV 디너 탄생으로 대중화됐으며, 오늘날 수천억 달러 산업으로 성장했다. 냉동식품의 영양가가 신선식품에 뒤지지 않는다는 것도 현대 과학이 밝혀냈다."

"C20_T3_P2": {
  title:"Cambridge 20 · Test 3 · Passage 2",
  topic:"Can the planet's coral reefs be saved?",
  qTypes:["Paragraph Headings","Two-letter Choice","Sentence Completion"],
  sentences:[
    {type:"para", label:"Section A", role:"도입 — 런던동물원의 산호 탱크"},
    {num:1, en:"At London Zoo, a team of marine biologists is carefully tending a large tank of sea water and coral.", kr:"런던동물원에서 해양생물학자 팀이 바닷물과 산호가 담긴 큰 탱크를 정성스럽게 관리하고 있다.", grammar:"marine biologist: 해양생물학자 / tend: 관리하다", vocab:[{w:"marine",pos:"adj",kr:"해양의"},{w:"biologist",pos:"n",kr:"생물학자"},{w:"tend",pos:"v",kr:"관리하다, 돌보다"}]},
    {num:2, en:"The water temperature is kept at a constant 26°C to mimic the coral's natural tropical habitat.", kr:"산호의 자연적인 열대 서식지를 모방하기 위해 수온은 일정하게 26°C로 유지된다.", grammar:"mimic: 모방하다 / constant: 일정한 / habitat: 서식지", vocab:[{w:"mimic",pos:"v",kr:"모방하다"},{w:"constant",pos:"adj",kr:"일정한"},{w:"habitat",pos:"n",kr:"서식지"}]},
    {num:3, en:"The project is part of a growing international effort to preserve and restore coral reefs, which are under severe threat.", kr:"이 프로젝트는 심각한 위협에 처한 산호초를 보존하고 복원하려는 증가하는 국제적 노력의 일환이다.", grammar:"under threat: 위협에 처한 / restore: 복원하다 / preserve: 보존하다", vocab:[{w:"restore",pos:"v",kr:"복원하다"},{w:"preserve",pos:"v",kr:"보존하다"},{w:"severe",pos:"adj",kr:"심각한"}]},
    {type:"para", label:"Section B", role:"산호의 생물학 — 구조와 번식"},
    {num:4, en:"Despite appearing plant-like, corals are actually animals — marine invertebrates called polyps, which are related to jellyfish and sea anemones.", kr:"식물처럼 보이지만, 산호는 실제로 동물이다 — 해파리와 말미잘과 관련된 폴립이라는 해양 무척추동물.", grammar:"despite + 동명사: ~에도 불구하고 / invertebrate: 무척추동물 / polyp: 폴립", vocab:[{w:"invertebrate",pos:"n",kr:"무척추동물"},{w:"polyp",pos:"n",kr:"폴립 (산호 개체)"},{w:"anemone",pos:"n",kr:"말미잘"}]},
    {num:5, en:"Each polyp has a stomach with a mouth at the top surrounded by tentacles.", kr:"각 폴립은 촉수로 둘러싸인 꼭대기에 입이 있는 위장을 가지고 있다.", grammar:"surround: 둘러싸다 / tentacle: 촉수", vocab:[{w:"tentacle",pos:"n",kr:"촉수"},{w:"surround",pos:"v",kr:"둘러싸다"}]},
    {num:6, en:"The tentacles capture plankton for food, but the coral's primary energy source is algae called zooxanthellae, which live in the coral's tissue.", kr:"촉수는 먹이를 위해 플랑크톤을 잡지만, 산호의 주요 에너지원은 산호 조직 안에 사는 와편모조류라고 불리는 조류다.", grammar:"primary: 주요한 / algae: 조류 / zooxanthellae: 와편모조류 / tissue: 조직", vocab:[{w:"plankton",pos:"n",kr:"플랑크톤"},{w:"algae",pos:"n",kr:"조류 (藻類)"},{w:"tissue",pos:"n",kr:"조직"}]},
    {num:7, en:"These algae photosynthesize and provide the coral with nutrients and, crucially, its colour.", kr:"이 조류는 광합성을 하여 산호에 영양분과, 결정적으로, 색깔을 공급한다.", grammar:"photosynthesize: 광합성하다 / crucially: 결정적으로", vocab:[{w:"photosynthesize",pos:"v",kr:"광합성하다"},{w:"crucially",pos:"adv",kr:"결정적으로"}]},
    {type:"para", label:"Section C", role:"산호 백화 현상"},
    {num:8, en:"When sea temperatures rise, the relationship between coral and algae breaks down.", kr:"해수 온도가 상승하면 산호와 조류의 관계가 무너진다.", grammar:"break down: 무너지다 / relationship: 관계", vocab:[{w:"break down",pos:"phr.v",kr:"무너지다, 붕괴되다"}]},
    {num:9, en:"The stressed coral expels the algae from its tissue, causing it to turn white — a process known as bleaching.", kr:"스트레스를 받은 산호는 조직에서 조류를 방출하여 하얗게 변하게 하는데, 이 과정을 백화라고 한다.", grammar:"expel: 방출하다, 추방하다 / bleaching: 백화 (현상)", vocab:[{w:"expel",pos:"v",kr:"방출하다, 추방하다"},{w:"bleaching",pos:"n",kr:"백화 현상"}]},
    {num:10, en:"A bleached coral is not dead — it can recover if temperatures drop — but it is highly vulnerable.", kr:"백화된 산호가 죽은 것은 아니다 — 온도가 내려가면 회복할 수 있다 — 하지만 매우 취약하다.", grammar:"vulnerable: 취약한 / recover: 회복하다", vocab:[{w:"vulnerable",pos:"adj",kr:"취약한"},{w:"recover",pos:"v",kr:"회복하다"}]},
    {num:11, en:"If temperatures remain elevated for too long, the coral will die.", kr:"온도가 너무 오래 높은 상태로 유지되면 산호는 죽을 것이다.", grammar:"remain + 형용사: ~한 상태로 유지되다 / elevated: 높아진", vocab:[{w:"elevated",pos:"adj",kr:"높아진, 상승한"}]},
    {type:"para", label:"Section D", role:"산호초의 중요성"},
    {num:12, en:"Coral reefs cover less than one percent of the ocean floor, yet they support around a quarter of all marine species.", kr:"산호초는 해저의 1% 미만을 차지하지만, 모든 해양 종의 약 1/4을 지원한다.", grammar:"yet: 그러나, ~에도 불구하고 / marine species: 해양 종", vocab:[{w:"species",pos:"n",kr:"종 (생물)"},{w:"marine",pos:"adj",kr:"해양의"}]},
    {num:13, en:"They also provide crucial services to humans, including coastal protection from storms and waves, and supporting fishing industries that billions of people depend on.", kr:"또한 태풍과 파도로부터의 해안 보호, 수십억 명이 의존하는 어업 산업 지원 등 인간에게 중요한 서비스를 제공한다.", grammar:"coastal protection: 해안 보호 / depend on: 의존하다", vocab:[{w:"coastal",pos:"adj",kr:"해안의"},{w:"crucial",pos:"adj",kr:"중요한"}]},
    {type:"para", label:"Section E", role:"산호 복원 연구"},
    {num:14, en:"Scientists are now exploring various methods to help reefs recover.", kr:"과학자들은 현재 산호초 회복을 돕기 위한 다양한 방법을 탐구하고 있다.", grammar:"explore: 탐구하다 / recover: 회복하다", vocab:[{w:"explore",pos:"v",kr:"탐구하다"}]},
    {num:15, en:"One approach involves breeding heat-tolerant corals in laboratory conditions and then transplanting them onto damaged reefs.", kr:"한 가지 접근법은 실험실 조건에서 열에 강한 산호를 사육하여 손상된 산호초에 이식하는 것이다.", grammar:"breed: 사육하다, 번식시키다 / heat-tolerant: 열에 강한 / transplant: 이식하다", vocab:[{w:"heat-tolerant",pos:"adj",kr:"열에 강한"},{w:"transplant",pos:"v",kr:"이식하다"},{w:"breed",pos:"v",kr:"사육하다, 번식시키다"}]},
    {num:16, en:"Another method is 'coral gardening', in which coral fragments are grown on underwater nursery structures until they are large enough to be replanted.", kr:"또 다른 방법은 '산호 가드닝'인데, 산호 조각이 다시 심기에 충분히 커질 때까지 수중 묘판 구조물에서 자란다.", grammar:"fragment: 조각 / nursery structure: 묘판 구조물 / replant: 다시 심다", vocab:[{w:"fragment",pos:"n",kr:"조각"},{w:"nursery",pos:"n",kr:"묘판, 육아실"},{w:"replant",pos:"v",kr:"다시 심다"}]},
    {type:"para", label:"Section F", role:"미래 전망 — 기술과 희망"},
    {num:17, en:"Some researchers believe that advances in genetic science could help create corals that are naturally more resistant to warming temperatures and ocean acidification.", kr:"일부 연구자들은 유전 과학의 발전이 온난화 기온과 해양 산성화에 자연적으로 더 강한 산호를 만드는 데 도움이 될 수 있다고 믿는다.", grammar:"genetic: 유전의 / resistant to: ~에 강한 / acidification: 산성화", vocab:[{w:"genetic",pos:"adj",kr:"유전의"},{w:"resistant",pos:"adj",kr:"저항성이 있는, 강한"},{w:"acidification",pos:"n",kr:"산성화"}]},
    {num:18, en:"Others focus on tackling the root causes — primarily reducing greenhouse gas emissions that are driving climate change.", kr:"다른 이들은 근본 원인 — 주로 기후변화를 촉진하는 온실가스 배출 감소 — 에 집중한다.", grammar:"tackle: 해결하다 / root cause: 근본 원인 / greenhouse gas: 온실가스", vocab:[{w:"tackle",pos:"v",kr:"해결하다, 다루다"},{w:"root cause",pos:"n",kr:"근본 원인"},{w:"greenhouse gas",pos:"n",kr:"온실가스"}]},
    {num:19, en:"Whether humanity can act quickly enough to save coral reefs remains to be seen — but scientists agree that the window for action is rapidly closing.", kr:"인류가 산호초를 구하기 위해 충분히 빠르게 행동할 수 있는지는 두고 볼 일이지만, 행동할 기회의 창이 빠르게 닫히고 있다는 것에는 과학자들이 동의한다.", grammar:"remains to be seen: 두고 볼 일이다 / window for action: 행동할 기회의 창", vocab:[{w:"remains to be seen",pos:"phr",kr:"두고 볼 일이다"},{w:"rapidly",pos:"adv",kr:"빠르게"}]}
  ],
  allVocab:[

"C20_T3_P3": {
  title:"Cambridge 20 · Test 3 · Passage 3",
  topic:"Robots and Us",
  qTypes:["Matching People / Views","Sentence Completion","Multiple Choice"],
  sentences:[
    {type:"para", label:"Introduction", role:"도입 — 로봇과 AI 시대"},
    {num:1, en:"Three leading academics give their views on the growing role of robots and artificial intelligence in our lives.", kr:"세 명의 저명한 학자가 우리 삶에서 로봇과 인공지능의 역할이 커지는 것에 대한 견해를 밝힌다.", grammar:"leading: 저명한 / artificial intelligence: 인공지능", vocab:[{w:"artificial intelligence",pos:"n",kr:"인공지능"},{w:"leading",pos:"adj",kr:"저명한, 선두적인"}]},
    {type:"para", label:"Martin Rees (A)", role:"마틴 리스 — 우주학자 / 비관적 전망"},
    {num:2, en:"Martin Rees is Astronomer Royal and a Fellow of Trinity College, Cambridge. He is the author of On the Future: Prospects for Humanity.", kr:"마틴 리스는 왕실 천문학자이자 케임브리지 트리니티 칼리지 펠로우다. 그는 '미래에 대하여: 인류의 전망'의 저자이기도 하다.", grammar:"Astronomer Royal: 왕실 천문학자 / Fellow: 펠로우 (연구원)", vocab:[{w:"astronomer",pos:"n",kr:"천문학자"},{w:"prospect",pos:"n",kr:"전망"}]},
    {num:3, en:"The robots of science fiction are far from reality. Our machines are still far inferior to animals in sensory ability, in physical dexterity, and above all in cognition.", kr:"공상과학 소설의 로봇은 현실과 거리가 멀다. 우리의 기계는 감각 능력, 신체 능숙도, 무엇보다 인지 능력에서 동물보다 여전히 훨씬 열등하다.", grammar:"inferior to: ~보다 열등한 / dexterity: 능숙도 / cognition: 인지", vocab:[{w:"dexterity",pos:"n",kr:"능숙도, 손재주"},{w:"cognition",pos:"n",kr:"인지"},{w:"inferior",pos:"adj",kr:"열등한"}]},
    {num:4, en:"But this will change in the coming decades.", kr:"그러나 이것은 앞으로 수십 년 내에 바뀔 것이다.", grammar:"decade: 10년", vocab:[{w:"decade",pos:"n",kr:"10년"}]},
    {num:5, en:"By 2050 – or 2100 at the latest – robots will be superior to humans in all these respects, and in general intelligence too.", kr:"2050년까지, 혹은 늦어도 2100년까지는 로봇이 이러한 모든 면에서, 그리고 일반 지능에서도 인간보다 우월해질 것이다.", grammar:"superior to: ~보다 우월한 / at the latest: 늦어도 / in all respects: 모든 면에서", vocab:[{w:"superior",pos:"adj",kr:"우월한"},{w:"general intelligence",pos:"n",kr:"일반 지능"}]},
    {num:6, en:"This might seem alarming, especially given that (unlike animals) these machines will be designed by humans, and could potentially be designed with goals that are not aligned with human welfare.", kr:"이것은 특히 (동물과 달리) 이러한 기계가 인간에 의해 설계되고 잠재적으로 인간 복지와 일치하지 않는 목표로 설계될 수 있다는 점에서 우려스러워 보일 수 있다.", grammar:"alarming: 우려스러운 / aligned with: ~와 일치하는 / welfare: 복지", vocab:[{w:"alarming",pos:"adj",kr:"우려스러운"},{w:"welfare",pos:"n",kr:"복지"},{w:"aligned with",pos:"phr",kr:"~와 일치하는"}]},
    {num:7, en:"However, I am not pessimistic.", kr:"그러나 나는 비관적이지 않다.", grammar:"pessimistic: 비관적인", vocab:[{w:"pessimistic",pos:"adj",kr:"비관적인"}]},
    {num:8, en:"We will not experience the classic dystopian scenario of computers forcing humans from the planet.", kr:"우리는 컴퓨터가 인간을 지구에서 몰아내는 고전적인 디스토피아 시나리오를 경험하지 않을 것이다.", grammar:"dystopian: 디스토피아적인 / scenario: 시나리오 / force from: 몰아내다", vocab:[{w:"dystopian",pos:"adj",kr:"디스토피아적인"},{w:"scenario",pos:"n",kr:"시나리오"}]},
    {num:9, en:"Instead, AI will help solve intractable problems like climate change and disease.", kr:"대신, AI는 기후변화와 질병 같은 해결하기 어려운 문제들을 해결하는 데 도움이 될 것이다.", grammar:"intractable: 해결하기 어려운 / climate change: 기후변화", vocab:[{w:"intractable",pos:"adj",kr:"해결하기 어려운"}]},
    {type:"para", label:"Daniel Wolpert (B)", role:"다니엘 울퍼트 — 신경과학자 / 뇌와 운동"},
    {num:10, en:"Daniel Wolpert is a neuroscientist and professor at Columbia University in New York.", kr:"다니엘 울퍼트는 뉴욕 컬럼비아 대학교의 신경과학자이자 교수다.", grammar:"neuroscientist: 신경과학자", vocab:[{w:"neuroscientist",pos:"n",kr:"신경과학자"}]},
    {num:11, en:"People have been making robots for centuries — to entertain us, to replace and augment our work, and increasingly to simulate humanity.", kr:"사람들은 수 세기 동안 로봇을 만들어왔다 — 우리를 즐겁게 하고, 우리의 일을 대체하고 보완하며, 점점 더 인류를 시뮬레이션하기 위해.", grammar:"augment: 보완하다 / simulate: 시뮬레이션하다 / increasingly: 점점 더", vocab:[{w:"augment",pos:"v",kr:"보완하다, 증강하다"},{w:"simulate",pos:"v",kr:"시뮬레이션하다, 모의 실험하다"}]},
    {num:12, en:"But perhaps the most ambitious challenge of all is to understand and replicate the human brain.", kr:"그러나 아마도 가장 야심 찬 도전은 인간의 뇌를 이해하고 복제하는 것이다.", grammar:"ambitious: 야심 찬 / replicate: 복제하다", vocab:[{w:"ambitious",pos:"adj",kr:"야심 찬"},{w:"replicate",pos:"v",kr:"복제하다"}]},
    {num:13, en:"The brain's most fundamental purpose is to produce movement, and it is this capability that robots find most difficult to match.", kr:"뇌의 가장 기본적인 목적은 움직임을 만드는 것이며, 로봇이 맞추기 가장 어려운 것은 바로 이 능력이다.", grammar:"fundamental: 기본적인 / capability: 능력 / match: 맞추다", vocab:[{w:"fundamental",pos:"adj",kr:"기본적인"},{w:"capability",pos:"n",kr:"능력"}]},
    {num:14, en:"Humans are extraordinarily good at using sensory information to generate precise, controlled movements.", kr:"인간은 감각 정보를 사용하여 정밀하고 제어된 움직임을 생성하는 데 매우 뛰어나다.", grammar:"extraordinarily: 매우, 탁월하게 / precise: 정밀한", vocab:[{w:"extraordinarily",pos:"adv",kr:"매우, 탁월하게"},{w:"precise",pos:"adj",kr:"정밀한"}]},
    {num:15, en:"Robots struggle with this, especially in unstructured environments.", kr:"로봇은 특히 비구조적 환경에서 이것을 어려워한다.", grammar:"unstructured: 비구조적인 / struggle with: ~을 어려워하다", vocab:[{w:"unstructured",pos:"adj",kr:"비구조적인"},{w:"struggle",pos:"v",kr:"어려워하다, 힘겹게 노력하다"}]},
    {num:16, en:"Understanding how the brain controls movement is, therefore, crucial both to advancing robotics and to treating movement disorders in humans.", kr:"따라서 뇌가 움직임을 제어하는 방법을 이해하는 것은 로봇공학을 발전시키고 인간의 운동 장애를 치료하는 데 모두 매우 중요하다.", grammar:"movement disorder: 운동 장애 / treating: 치료하는", vocab:[{w:"disorder",pos:"n",kr:"장애"},{w:"treat",pos:"v",kr:"치료하다"}]},
    {type:"para", label:"Kathleen Richardson (C)", role:"캐슬린 리처드슨 — 로봇 윤리학자 / 비판적 시각"},
    {num:17, en:"Kathleen Richardson is Professor of Ethics and Culture of Robots and AI at De Montfort University, Leicester.", kr:"캐슬린 리처드슨은 레스터 드몬트포트 대학교의 로봇 및 AI 윤리와 문화 교수다.", grammar:"ethics: 윤리 / professor: 교수", vocab:[{w:"ethics",pos:"n",kr:"윤리"}]},
    {num:18, en:"The word 'robot' comes from the Czech word robota, meaning forced labour or drudgery.", kr:"'로봇'이라는 단어는 강제 노동 또는 고역을 의미하는 체코어 robota에서 왔다.", grammar:"Czech: 체코어 / forced labour: 강제 노동 / drudgery: 고역", vocab:[{w:"drudgery",pos:"n",kr:"고역, 힘든 일"},{w:"forced labour",pos:"n",kr:"강제 노동"}]},
    {num:19, en:"The idea of robots doing our work for us has always been linked to the idea of the exploitation of some people by others.", kr:"로봇이 우리를 위해 일한다는 생각은 항상 일부 사람들이 다른 사람들에 의해 착취되는 아이디어와 연결되어 왔다.", grammar:"exploitation: 착취 / be linked to: ~와 연결되다", vocab:[{w:"exploitation",pos:"n",kr:"착취"},{w:"be linked to",pos:"phr",kr:"~와 연결되다"}]},
    {num:20, en:"I'm sceptical of the idea that robots and AI represent a force for good in our world.", kr:"나는 로봇과 AI가 우리 세계에서 선한 힘을 대표한다는 생각에 회의적이다.", grammar:"sceptical of: ~에 회의적인 / force for good: 선한 힘", vocab:[{w:"sceptical",pos:"adj",kr:"회의적인"},{w:"force for good",pos:"n",kr:"선한 힘"}]},
    {num:21, en:"The development of robots has always been driven by the interests of capital, not of humanity.", kr:"로봇 개발은 항상 인류가 아닌 자본의 이익에 의해 추진되어 왔다.", grammar:"be driven by: ~에 의해 추진되다 / capital: 자본", vocab:[{w:"capital",pos:"n",kr:"자본"},{w:"be driven by",pos:"phr",kr:"~에 의해 추진되다"}]},
    {num:22, en:"As long as this is the case, robots and AI will primarily serve to make the rich richer, not to help humanity as a whole.", kr:"이것이 사실인 한, 로봇과 AI는 주로 인류 전체를 돕는 것이 아니라 부자를 더 부자로 만드는 데 기여할 것이다.", grammar:"as long as: ~하는 한 / primarily: 주로 / humanity as a whole: 인류 전체", vocab:[{w:"primarily",pos:"adv",kr:"주로"},{w:"as long as",pos:"conj",kr:"~하는 한"}]},
    {num:23, en:"The discourse around robots often focuses on what they can do, rather than who benefits from them.", kr:"로봇에 관한 담론은 종종 누가 혜택을 받는지보다 그것들이 무엇을 할 수 있는지에 초점을 맞춘다.", grammar:"discourse: 담론 / rather than: ~ 대신 / benefit from: ~로부터 혜택을 받다", vocab:[{w:"discourse",pos:"n",kr:"담론"},{w:"benefit from",pos:"phr",kr:"~로부터 혜택을 받다"}]}
  ],

"C20_T4_P1": {
  title:"Cambridge 20 · Test 4 · Passage 1",
  topic:"Georgia O'Keeffe",
  qTypes:["Notes Completion","True / False / Not Given"],
  sentences:[
    {type:"para", label:"Para 1", role:"도입 — 조지아 오키프의 생애"},
    {num:1, en:"Georgia O'Keeffe (1887–1986) was one of the most significant American artists of the 20th century.", kr:"조지아 오키프(1887-1986)는 20세기 가장 중요한 미국 예술가 중 한 명이었다.", grammar:"significant: 중요한", vocab:[{w:"significant",pos:"adj",kr:"중요한, 의미 있는"}]},
    {num:2, en:"Born on a farm in Wisconsin, she showed artistic talent from an early age and trained as an artist before becoming a teacher.", kr:"위스콘신의 농장에서 태어난 그녀는 어릴 때부터 예술적 재능을 보였으며, 교사가 되기 전에 예술가로 훈련을 받았다.", grammar:"from an early age: 어릴 때부터 / trained as: ~로 훈련받다", vocab:[{w:"talent",pos:"n",kr:"재능"},{w:"artistic",pos:"adj",kr:"예술적인"}]},
    {num:3, en:"She later gave up teaching and devoted herself entirely to painting.", kr:"그녀는 나중에 교직을 그만두고 그림에 전적으로 헌신했다.", grammar:"give up: 그만두다 / devote oneself to: ~에 헌신하다", vocab:[{w:"devote",pos:"v",kr:"헌신하다"},{w:"entirely",pos:"adv",kr:"전적으로"}]},
    {type:"para", label:"Para 2", role:"교육 배경 — 목탄 드로잉"},
    {num:4, en:"O'Keeffe studied under Arthur Wesley Dow, who encouraged his students to experiment with abstract forms and to use charcoal for drawing.", kr:"오키프는 아서 웨슬리 다우 아래서 공부했는데, 그는 학생들에게 추상적 형태를 실험하고 드로잉에 목탄을 사용하도록 격려했다.", grammar:"experiment with: ~을 실험하다 / abstract: 추상적인 / charcoal: 목탄", vocab:[{w:"charcoal",pos:"n",kr:"목탄"},{w:"abstract",pos:"adj",kr:"추상적인"},{w:"experiment",pos:"v",kr:"실험하다"}]},
    {num:5, en:"This training had a lasting influence on her later work.", kr:"이 훈련은 그녀의 후기 작품에 지속적인 영향을 미쳤다.", grammar:"lasting: 지속적인 / influence: 영향", vocab:[{w:"lasting",pos:"adj",kr:"지속적인"},{w:"influence",pos:"n",kr:"영향"}]},
    {type:"para", label:"Para 3", role:"뉴욕 시절 — 마천루"},
    {num:6, en:"In the 1920s, O'Keeffe lived in New York City, where she became fascinated by the city's towering skyscrapers.", kr:"1920년대에 오키프는 뉴욕시에 살았으며, 도시의 웅장한 마천루에 매료됐다.", grammar:"be fascinated by: ~에 매료되다 / towering: 우뚝 솟은 / skyscraper: 마천루", vocab:[{w:"fascinated",pos:"adj",kr:"매료된"},{w:"towering",pos:"adj",kr:"우뚝 솟은"},{w:"skyscraper",pos:"n",kr:"마천루"}]},
    {num:7, en:"She painted a series of large-format works depicting these buildings from unusual angles.", kr:"그녀는 이 건물들을 특이한 각도로 묘사하는 대형 포맷 작품 시리즈를 그렸다.", grammar:"large-format: 대형 포맷 / depict: 묘사하다 / unusual: 특이한", vocab:[{w:"depict",pos:"v",kr:"묘사하다"},{w:"format",pos:"n",kr:"포맷, 형식"}]},
    {type:"para", label:"Para 4", role:"꽃 그림 — 확대된 클로즈업"},
    {num:8, en:"O'Keeffe is perhaps best known for her large-scale paintings of flowers, which magnify their forms dramatically.", kr:"오키프는 아마도 꽃의 형태를 극적으로 확대한 대형 꽃 그림으로 가장 잘 알려져 있다.", grammar:"large-scale: 대형의 / magnify: 확대하다 / dramatically: 극적으로", vocab:[{w:"magnify",pos:"v",kr:"확대하다"},{w:"dramatically",pos:"adv",kr:"극적으로"}]},
    {num:9, en:"She painted close-up views of flowers so enlarged that they filled the entire canvas.", kr:"그녀는 전체 캔버스를 가득 채울 만큼 확대된 꽃의 클로즈업 뷰를 그렸다.", grammar:"close-up: 클로즈업 / enlarge: 확대하다 / canvas: 캔버스", vocab:[{w:"close-up",pos:"n",kr:"클로즈업"},{w:"canvas",pos:"n",kr:"캔버스"}]},
    {num:10, en:"She described wanting to make viewers see the flower as she herself saw it.", kr:"그녀는 자신이 꽃을 보는 방식대로 관람자들이 꽃을 보게 하고 싶었다고 설명했다.", grammar:"describe + 동명사: ~한다고 설명하다 / viewer: 관람자", vocab:[{w:"viewer",pos:"n",kr:"관람자"}]},
    {type:"para", label:"Para 5", role:"뉴멕시코 이주 — 뼈와 사막"},
    {num:11, en:"In 1929, O'Keeffe visited New Mexico and was immediately captivated by the harsh beauty of the desert landscape.", kr:"1929년에 오키프는 뉴멕시코를 방문하여 사막 풍경의 거친 아름다움에 즉시 매료됐다.", grammar:"captivate: 매료시키다 / harsh: 거친 / landscape: 풍경", vocab:[{w:"captivated",pos:"adj",kr:"매료된"},{w:"harsh",pos:"adj",kr:"거친, 혹독한"},{w:"landscape",pos:"n",kr:"풍경"}]},
    {num:12, en:"She began collecting animal bones she found on the desert floor and incorporating them into her paintings.", kr:"그녀는 사막 바닥에서 발견한 동물 뼈를 수집하여 그림에 포함시키기 시작했다.", grammar:"incorporate: 포함시키다 / collect: 수집하다", vocab:[{w:"incorporate",pos:"v",kr:"포함시키다, 통합하다"},{w:"bones",pos:"n",kr:"뼈"}]},
    {num:13, en:"The bleached skulls and vertebrae she depicted became iconic symbols of the American Southwest.", kr:"그녀가 묘사한 하얗게 바랜 두개골과 척추뼈는 미국 남서부의 상징적인 심벌이 됐다.", grammar:"bleached: 하얗게 바랜 / skull: 두개골 / vertebrae: 척추뼈 / iconic: 상징적인", vocab:[{w:"skull",pos:"n",kr:"두개골"},{w:"vertebrae",pos:"n",kr:"척추뼈"},{w:"iconic",pos:"adj",kr:"상징적인"}]},
    {type:"para", label:"Para 6", role:"뉴멕시코 정착 — 강"},
    {num:14, en:"O'Keeffe eventually settled permanently in New Mexico after the death of her husband, the photographer Alfred Stieglitz, in 1946.", kr:"오키프는 결국 1946년 남편 사진작가 알프레드 스티글리츠의 사망 이후 뉴멕시코에 영구적으로 정착했다.", grammar:"settle: 정착하다 / permanently: 영구적으로 / photographer: 사진작가", vocab:[{w:"settle",pos:"v",kr:"정착하다"},{w:"permanently",pos:"adv",kr:"영구적으로"}]},
    {num:15, en:"She found inspiration in the rivers that wound through the desert landscape near her home.", kr:"그녀는 집 근처 사막 풍경을 굽이쳐 흐르는 강에서 영감을 얻었다.", grammar:"inspiration: 영감 / wind through: 굽이쳐 흐르다", vocab:[{w:"inspiration",pos:"n",kr:"영감"},{w:"wind through",pos:"phr.v",kr:"굽이쳐 흐르다"}]},
    {num:16, en:"She painted these rivers from aerial perspectives, often on long, horizontal canvases.", kr:"그녀는 이 강들을 공중에서 본 시각으로, 종종 길고 수평적인 캔버스에 그렸다.", grammar:"aerial: 공중에서 본 / perspective: 시각, 관점 / horizontal: 수평적인", vocab:[{w:"aerial",pos:"adj",kr:"공중의, 하늘에서 본"},{w:"horizontal",pos:"adj",kr:"수평적인"}]},
    {type:"para", label:"Para 7", role:"그녀의 예술적 유산"},
    {num:17, en:"O'Keeffe continued to paint until her eyesight began to fail in the 1970s.", kr:"오키프는 1970년대에 시력이 나빠지기 시작할 때까지 그림을 계속 그렸다.", grammar:"eyesight: 시력 / fail: 나빠지다", vocab:[{w:"eyesight",pos:"n",kr:"시력"}]},
    {num:18, en:"She then shifted to making pottery and watercolour paintings, with the help of assistants.", kr:"그 후 그녀는 조수들의 도움을 받아 도예와 수채화 그림으로 전환했다.", grammar:"shift to: ~로 전환하다 / pottery: 도예 / watercolour: 수채화", vocab:[{w:"pottery",pos:"n",kr:"도예"},{w:"watercolour",pos:"n",kr:"수채화"}]},
    {num:19, en:"She lived to the remarkable age of 98 and was still working until shortly before her death.", kr:"그녀는 놀랍게도 98세까지 살았으며 사망 직전까지 여전히 작업하고 있었다.", grammar:"remarkable: 놀라운 / shortly before: 직전에", vocab:[{w:"remarkable",pos:"adj",kr:"놀라운"}]}
  ],

"C20_T4_P2": {
  title:"Cambridge 20 · Test 4 · Passage 2",
  topic:"Adapting to the effects of climate change",
  qTypes:["Section Matching","Sentence Completion","Matching People"],
  sentences:[
    {type:"para", label:"Section A", role:"도입 — 마이애미 비치 도로 높이기"},
    {num:1, en:"In Miami Beach, city workers are busy raising the roads.", kr:"마이애미 비치에서 시 공무원들이 도로를 높이는 작업에 바쁘다.", grammar:"raise: 높이다, 올리다 / busy + 동명사: ~하느라 바쁘다", vocab:[{w:"raise",pos:"v",kr:"높이다, 올리다"}]},
    {num:2, en:"The reason is not to improve traffic flow but to address the chronic flooding that threatens to make parts of the city uninhabitable.", kr:"이유는 교통 흐름을 개선하기 위해서가 아니라 도시 일부를 살 수 없게 만들 위협을 가하는 만성적 침수를 해결하기 위해서다.", grammar:"chronic: 만성적인 / flooding: 침수 / uninhabitable: 살 수 없는", vocab:[{w:"chronic",pos:"adj",kr:"만성적인"},{w:"flooding",pos:"n",kr:"침수"},{w:"uninhabitable",pos:"adj",kr:"살 수 없는"}]},
    {num:3, en:"Sea levels in the area have risen by about 25 centimetres in the last century, and are predicted to rise much further in the decades ahead.", kr:"이 지역의 해수면은 지난 세기에 약 25센티미터 상승했으며, 앞으로 수십 년 안에 훨씬 더 오를 것으로 예측된다.", grammar:"rise: 상승하다 / predict: 예측하다 / decade: 10년", vocab:[{w:"sea level",pos:"n",kr:"해수면"},{w:"predict",pos:"v",kr:"예측하다"}]},
    {num:4, en:"The city is therefore taking preemptive action, installing pumps to remove flood water from the streets.", kr:"따라서 시는 거리에서 침수 물을 제거하기 위해 펌프를 설치하는 등 선제적 조치를 취하고 있다.", grammar:"preemptive: 선제적인 / install: 설치하다 / pump: 펌프", vocab:[{w:"preemptive",pos:"adj",kr:"선제적인"},{w:"pump",pos:"n",kr:"펌프"},{w:"install",pos:"v",kr:"설치하다"}]},
    {type:"para", label:"Section B", role:"자바 — 맹그로브 복원"},
    {num:5, en:"Off the coast of Java in Indonesia, engineers are working on a different kind of solution.", kr:"인도네시아 자바 해안에서 기술자들이 다른 종류의 해결책을 연구하고 있다.", grammar:"off the coast of: ~의 해안에서 / engineer: 기술자", vocab:[{w:"engineer",pos:"n",kr:"기술자, 공학자"}]},
    {num:6, en:"They are building a series of artificial islands just offshore, designed to reduce the force of waves reaching the coastline.", kr:"그들은 해안선에 닿는 파도의 힘을 줄이도록 설계된 인공 섬 시리즈를 해안 가까이 건설하고 있다.", grammar:"artificial: 인공의 / offshore: 해안 근처에 / reduce: 줄이다 / coastline: 해안선", vocab:[{w:"artificial",pos:"adj",kr:"인공의"},{w:"offshore",pos:"adv",kr:"해안 근처에"},{w:"coastline",pos:"n",kr:"해안선"}]},
    {num:7, en:"Behind these islands, mangrove trees are being planted in the calmer waters to provide a natural barrier against the sea.", kr:"이 섬들 뒤에, 바다에 대한 자연 방벽을 제공하기 위해 더 잔잔한 물에 맹그로브 나무가 심어지고 있다.", grammar:"mangrove: 맹그로브 / barrier: 방벽 / calmer waters: 더 잔잔한 물", vocab:[{w:"mangrove",pos:"n",kr:"맹그로브"},{w:"barrier",pos:"n",kr:"방벽, 장벽"}]},
    {num:8, en:"Mangroves are particularly well adapted to coastal conditions, with their root systems able to trap sediment and stabilise shorelines.", kr:"맹그로브는 특히 해안 조건에 잘 적응하여, 뿌리 시스템이 퇴적물을 가두고 해안선을 안정시킬 수 있다.", grammar:"adapted to: ~에 적응한 / sediment: 퇴적물 / stabilise: 안정시키다 / shoreline: 해안선", vocab:[{w:"sediment",pos:"n",kr:"퇴적물"},{w:"stabilise",pos:"v",kr:"안정시키다"},{w:"shoreline",pos:"n",kr:"해안선"}]},
    {type:"para", label:"Section C", role:"베트남 — 수상 가옥"},
    {num:9, en:"In Vietnam, communities in flood-prone regions are adapting by building houses that can float on floodwaters.", kr:"베트남에서 홍수 취약 지역의 공동체들은 홍수 위에 떠 있을 수 있는 집을 짓는 방식으로 적응하고 있다.", grammar:"flood-prone: 홍수 취약한 / float: 뜨다 / floodwater: 홍수", vocab:[{w:"flood-prone",pos:"adj",kr:"홍수 취약한"},{w:"float",pos:"v",kr:"뜨다, 떠있다"}]},
    {num:10, en:"These floating houses are constructed on buoyant foundations and rise and fall with the water level.", kr:"이 수상 가옥들은 부력이 있는 기초 위에 건설되어 수위에 따라 올라가고 내려간다.", grammar:"buoyant: 부력이 있는 / foundation: 기초 / water level: 수위", vocab:[{w:"buoyant",pos:"adj",kr:"부력이 있는"},{w:"foundation",pos:"n",kr:"기초, 토대"}]},
    {num:11, en:"This approach allows communities to remain in their homes during floods, rather than having to evacuate.", kr:"이 접근법은 공동체가 대피해야 하는 대신 홍수 중에도 집에 머물 수 있게 해준다.", grammar:"remain: 머물다 / rather than: ~ 대신 / evacuate: 대피하다", vocab:[{w:"evacuate",pos:"v",kr:"대피하다"},{w:"remain",pos:"v",kr:"머물다"}]},
    {type:"para", label:"Section D", role:"방글라데시 — 염분 내성 작물"},
    {num:12, en:"In low-lying Bangladesh, saltwater intrusion is becoming an increasingly serious problem for agriculture.", kr:"저지대 방글라데시에서 염수 침투는 농업에 점점 더 심각한 문제가 되고 있다.", grammar:"low-lying: 저지대의 / saltwater intrusion: 염수 침투 / agriculture: 농업", vocab:[{w:"saltwater intrusion",pos:"n",kr:"염수 침투"},{w:"agriculture",pos:"n",kr:"농업"},{w:"low-lying",pos:"adj",kr:"저지대의"}]},
    {num:13, en:"As sea levels rise, salt water is increasingly penetrating the freshwater rivers and groundwater that farmers depend on.", kr:"해수면이 상승함에 따라 소금물이 농부들이 의존하는 담수 강과 지하수에 점점 더 침투하고 있다.", grammar:"penetrate: 침투하다 / freshwater: 담수의 / groundwater: 지하수", vocab:[{w:"penetrate",pos:"v",kr:"침투하다"},{w:"freshwater",pos:"adj",kr:"담수의"},{w:"groundwater",pos:"n",kr:"지하수"}]},
    {num:14, en:"In response, agricultural researchers have developed salt-tolerant varieties of crops such as rice that can grow in saltier soil.", kr:"이에 대응하여 농업 연구자들은 더 염분이 많은 토양에서 자랄 수 있는 쌀과 같은 작물의 염분 내성 품종을 개발했다.", grammar:"salt-tolerant: 염분 내성의 / variety: 품종 / crop: 작물", vocab:[{w:"salt-tolerant",pos:"adj",kr:"염분 내성의"},{w:"variety",pos:"n",kr:"품종"},{w:"crop",pos:"n",kr:"작물"}]},
    {type:"para", label:"Section E", role:"로스앤젤레스 — 서늘한 도로 포장"},
    {num:15, en:"In Los Angeles, city officials are tackling a different aspect of climate change: rising urban temperatures.", kr:"로스앤젤레스에서 시 공무원들은 기후변화의 다른 측면인 도시 기온 상승을 해결하고 있다.", grammar:"tackle: 해결하다 / urban: 도시의 / temperature: 기온", vocab:[{w:"urban",pos:"adj",kr:"도시의"},{w:"tackle",pos:"v",kr:"해결하다"}]},
    {num:16, en:"They have started a programme of coating city streets with a light grey substance that reflects sunlight rather than absorbing it.", kr:"그들은 햇빛을 흡수하는 대신 반사하는 밝은 회색 물질로 도시 거리를 코팅하는 프로그램을 시작했다.", grammar:"coat: 코팅하다 / substance: 물질 / reflect: 반사하다 / absorb: 흡수하다", vocab:[{w:"coat",pos:"v",kr:"코팅하다"},{w:"substance",pos:"n",kr:"물질"},{w:"reflect",pos:"v",kr:"반사하다"}]},
    {num:17, en:"Dark asphalt absorbs heat and then releases it slowly at night, making cities significantly hotter than surrounding rural areas.", kr:"짙은 아스팔트는 열을 흡수하여 밤에 천천히 방출하여 도시를 주변 농촌 지역보다 훨씬 더 덥게 만든다.", grammar:"asphalt: 아스팔트 / release: 방출하다 / significantly: 훨씬, 상당히", vocab:[{w:"asphalt",pos:"n",kr:"아스팔트"},{w:"release",pos:"v",kr:"방출하다"},{w:"significantly",pos:"adv",kr:"상당히, 훨씬"}]},
    {num:18, en:"The city has also planted thousands of shade trees to reduce temperatures in city streets.", kr:"시는 또한 도시 거리의 기온을 낮추기 위해 수천 그루의 그늘나무를 심었다.", grammar:"shade tree: 그늘나무 / reduce: 낮추다, 줄이다", vocab:[{w:"shade tree",pos:"n",kr:"그늘나무"},{w:"reduce",pos:"v",kr:"낮추다, 줄이다"}]},
    {type:"para", label:"Section F", role:"전문가 의견 — 적응의 필요성"},
    {num:19, en:"Scientists warn that, while adaptation is necessary, it is not a substitute for reducing greenhouse gas emissions.", kr:"과학자들은 적응이 필요하지만 온실가스 배출 감소를 대신할 수는 없다고 경고한다.", grammar:"adaptation: 적응 / substitute for: ~의 대체물 / greenhouse gas: 온실가스", vocab:[{w:"adaptation",pos:"n",kr:"적응"},{w:"substitute",pos:"n",kr:"대체물, 대안"},{w:"emission",pos:"n",kr:"배출"}]},
    {num:20, en:"Professor Jochen Hinkel of the Global Climate Forum argues that adaptation measures must be tailored to the specific needs of local communities.", kr:"글로벌 기후 포럼의 요헨 힌켈 교수는 적응 조치가 지역 공동체의 특정 필요에 맞게 조정되어야 한다고 주장한다.", grammar:"argue: 주장하다 / tailor to: ~에 맞게 조정하다 / specific: 특정한", vocab:[{w:"tailor",pos:"v",kr:"맞게 조정하다"},{w:"specific",pos:"adj",kr:"특정한"},{w:"measure",pos:"n",kr:"조치, 대책"}]},
    {num:21, en:"Dr Saleemul Huq of the International Centre for Climate Change and Development stresses that the poorest communities are often the most vulnerable to climate impacts, yet contribute least to the problem.", kr:"국제기후변화개발센터의 살레물 후크 박사는 가장 가난한 공동체가 종종 기후 영향에 가장 취약하지만, 문제에 가장 적게 기여한다고 강조한다.", grammar:"vulnerable to: ~에 취약한 / contribute to: ~에 기여하다 / stress: 강조하다", vocab:[{w:"vulnerable",pos:"adj",kr:"취약한"},{w:"contribute",pos:"v",kr:"기여하다"},{w:"stress",pos:"v",kr:"강조하다"}]}
  ],

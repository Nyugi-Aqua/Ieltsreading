"C16_T3_P1": {
  title:"Cambridge 16 · Test 3 · Passage 1",
  topic:"Roman Shipbuilding and Navigation",
  qTypes:["True / False / Not Given","Summary Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 로마인들은 그리스·이집트에서 배우다"},
    {num:1,en:"Shipbuilding in ancient Rome was more of an art relying on estimation, inherited techniques and personal experience. The Romans were not traditionally sailors but mostly land-based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.",kr:"고대 로마의 조선은 추정, 전승된 기술, 개인적 경험에 의존하는 예술에 가까웠다. 로마인들은 전통적으로 선원이 아니라 주로 육상 기반의 사람들이었으며, 그들이 정복한 사람들, 즉 그리스인과 이집트인들로부터 배 만드는 법을 배웠다.",grammar:"<strong>relying on</strong> = 분사구문(수단). <strong>namely</strong> = 즉, 다시 말해",vocab:[{w:"estimation",pos:"n",kr:"추정"},{w:"namely",pos:"adv",kr:"즉, 다시 말해"}]},
    {type:"para",label:"Para 2",role:"조선 기술의 발전 — 장붓구멍과 장부"},
    {num:2,en:"Planks used to build the outer hull were initially sewn together. Starting from the 6th century BCE, they were fixed using a method called mortise and tenon, whereby one plank locked into another without the need for stitching.",kr:"선체 외부를 건설하는 데 사용된 널판지는 처음에 꿰매어 함께 붙여졌다. 기원전 6세기부터는 장붓구멍과 장부라는 방법으로 고정되었는데, 이로써 한 널판지가 바느질 없이 다른 것에 잠겼다.",grammar:"<strong>whereby</strong> = 그로 인해, 그것으로. <strong>without the need for</strong> = ~ 없이",vocab:[{w:"mortise and tenon",pos:"n",kr:"장붓구멍과 장부(결합 방식)"},{w:"plank",pos:"n",kr:"널판지, 판재"}]},
    {type:"para",label:"Para 3",role:"전함 — 경량·고속·청동 충각"},
    {num:3,en:"Warships were built to be lightweight and very speedy. They had to be able to sail near the coast which is why they had no ballast or excess load and were built with a long, narrow hull. They had a bronze battering ram, which was used to pierce the timber hulls or break the oars of enemy vessels.",kr:"전함은 가볍고 매우 빠르게 건조되었다. 해안 가까이 항해할 수 있어야 했기 때문에 밸러스트나 초과 적재물이 없었고 길고 좁은 선체로 건조되었다. 적선의 목제 선체를 관통하거나 노를 부수는 데 사용되는 청동 충각을 장착했다.",grammar:"<strong>which is why</strong> = 그것이 ~인 이유이다. <strong>were used to pierce</strong> = ~을 관통하는 데 사용되었다",vocab:[{w:"ballast",pos:"n",kr:"밸러스트(균형 유지용 중량물)"},{w:"battering ram",pos:"n",kr:"충각"},{w:"pierce",pos:"v",kr:"관통하다"}]},
    {num:4,en:"The 'trireme' was the dominant warship from the 7th to 4th century BCE. It had rowers in the top, middle and lower levels. It is worth noting that contrary to popular perception, rowers were not slaves but mostly Roman citizens enrolled in the military.",kr:"'삼단노선'은 기원전 7세기에서 4세기까지 지배적인 전함이었다. 상, 중, 하 세 단계에 노 젓는 사람들이 있었다. 일반적인 인식과 달리 노 젓는 사람들은 노예가 아니라 대부분 군에 복무 중인 로마 시민이었다는 것이 주목할 만하다.",grammar:"<strong>It is worth noting that</strong> = ~라는 것을 주목할 만하다. <strong>contrary to popular perception</strong> = 일반적 인식과 달리",vocab:[{w:"trireme",pos:"n",kr:"삼단노선"},{w:"enrolled in",pos:"adj",kr:"~에 등록된, 복무 중인"}]},
    {type:"para",label:"Para 4",role:"상선 — 화물 중심의 설계"},
    {num:5,en:"Merchant ships were built to transport lots of cargo over long distances. They had a wider hull, double planking and a solid interior for added stability. Unlike warships, their V-shaped hull was deep underwater, meaning that they could not sail too close to the coast.",kr:"상선은 장거리에 걸쳐 많은 화물을 운송하기 위해 건조되었다. 추가 안정성을 위해 더 넓은 선체, 이중 판재, 견고한 내부를 가졌다. 전함과 달리 V자형 선체가 수면 아래 깊이 있어 해안 너무 가까이 항해할 수 없었다.",grammar:"<strong>meaning that</strong> = 분사구문(결과). <strong>Unlike warships</strong> = 전치사구 비교",vocab:[{w:"cargo",pos:"n",kr:"화물"},{w:"stability",pos:"n",kr:"안정성"}]},
    {num:6,en:"In order to assist them, music would be played on an instrument, and oars would then keep time with this. Large merchant ships would approach the destination port and be intercepted by a number of towboats that would drag them to the quay.",kr:"그들을 돕기 위해 악기로 음악이 연주되었고, 노는 그에 맞춰 박자를 맞췄다. 대형 상선은 목적지 항구에 접근하여 그들을 부두로 끌어당기는 여러 예인선에 의해 가로막혔다.",grammar:"<strong>would keep time with</strong> = 과거 반복 습관(would). <strong>be intercepted by</strong> = ~에 의해 가로막히다",vocab:[{w:"towboat",pos:"n",kr:"예인선"},{w:"quay",pos:"n",kr:"부두"}]},
    {type:"para",label:"Para 5",role:"항해 — 자연 현상과 경험에 의존"},
    {num:7,en:"Navigation in ancient Rome did not rely on sophisticated instruments such as compasses but on experience, local knowledge and observation of natural phenomena. When weather conditions were not good, Roman mariners estimated directions from the pole star or, with less accuracy, from the Sun at noon.",kr:"고대 로마의 항해는 나침반 같은 정교한 기구에 의존하지 않고 경험, 지역 지식, 자연 현상 관찰에 의존했다. 날씨가 좋지 않을 때 로마 선원들은 북극성으로, 또는 덜 정확하게는 정오의 태양에서 방향을 추정했다.",grammar:"<strong>did not rely on A but on B</strong> = A가 아닌 B에 의존했다. <strong>with less accuracy</strong> = 덜 정확하게",vocab:[{w:"mariner",pos:"n",kr:"선원, 항해사"},{w:"pole star",pos:"n",kr:"북극성"}]}
  ],

  tfng:[
    {qNum:1,stmt:"The Romans' shipbuilding skills were passed on to the Greeks and the Egyptians.",correct:"FALSE",mine:"",evPara:"Para 1",ev:"The Romans ... <mark>learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.</mark>",why:"반대로 로마인들이 그리스·이집트인들로부터 배웠다.",trap:""},
    {qNum:2,stmt:"Skilled craftsmen were needed for the mortise and tenon method of fixing planks.",correct:"NOT GIVEN",mine:"",evPara:"Para 2",ev:"Planks were fixed using a method called mortise and tenon, whereby one plank locked into another.",why:"숙련 기술자 필요 여부에 대한 정보가 없다.",trap:""},
    {qNum:3,stmt:"The later practice used by Mediterranean shipbuilders involved building the hull before the frame.",correct:"FALSE",mine:"",evPara:"Para 1",ev:"Mediterranean shipbuilders shifted to another method which consisted of <mark>building the frame first and then proceeding with the hull.</mark>",why:"나중 방식은 선체가 아닌 골격을 먼저 건설했다.",trap:""},
    {qNum:4,stmt:"The Romans called the Mediterranean Sea Mare Nostrum because they dominated its use.",correct:"TRUE",mine:"",evPara:"Para 3",ev:"Rome's navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called <mark>Mare Nostrum meaning 'our sea'.</mark>",why:"지배했기 때문에 '우리의 바다'라고 불렀다.",trap:""},

"C16_T3_P2": {
  title:"Cambridge 16 · Test 3 · Passage 2",
  topic:"Climate Change Reveals Ancient Artefacts in Norway",
  qTypes:["Section Matching","Summary Completion","Two-Letter Questions"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 빙하가 녹으며 고대 유물 드러나"},
    {num:1,en:"Well above the treeline in Norway's highest mountains, ancient fields of ice are shrinking as Earth's climate warms. As the ice has vanished, it has been giving up the treasures it has preserved in cold storage for the last 6,000 years – items such as ancient arrows and skis from Viking Age traders.",kr:"노르웨이 최고봉의 수목 한계선 훨씬 위에서, 지구 기후가 따뜻해짐에 따라 고대 빙원이 줄어들고 있다. 빙하가 사라지면서 지난 6,000년 동안 냉각 저장해온 보물들을 내어 주고 있다 – 고대 화살과 바이킹 시대 상인들의 스키 같은 물품들이다.",grammar:"<strong>As the ice has vanished</strong> = 시간 접속사 + 현재완료. <strong>has been giving up</strong> = 현재완료 진행",vocab:[{w:"treeline",pos:"n",kr:"수목 한계선"},{w:"artefact",pos:"n",kr:"유물, 공예품"}]},
    {type:"para",label:"Para B",role:"유기 물질의 보존 — 빙하 고고학의 시급성"},
    {num:2,en:"Organic materials like textiles and hides are relatively rare finds at archaeological sites because unless protected from microorganisms that cause decay, they tend not to last long. Once thawed out, these materials experience degradation relatively swiftly.",kr:"직물이나 가죽 같은 유기 물질은 부패를 일으키는 미생물로부터 보호되지 않으면 오래 지속되지 않는 경향이 있어 고고학적 장소에서 비교적 드문 발견물이다. 해동되면 이 물질들은 비교적 빠르게 분해를 경험한다.",grammar:"<strong>unless protected</strong> = unless + 수동 분사구문. <strong>relatively swiftly</strong> = 비교적 빠르게",vocab:[{w:"microorganism",pos:"n",kr:"미생물"},{w:"degradation",pos:"n",kr:"분해, 열화"}]},
    {num:3,en:"With climate change shrinking ice cover around the world, glacial archaeologists need to race the clock to find newly revealed artefacts, preserve them, and study them. If something fragile dries and is windblown it might very soon be lost to science.",kr:"기후 변화로 전 세계 빙하가 줄어들면서, 빙하 고고학자들은 새로 드러난 유물을 찾고, 보존하고, 연구하기 위해 시간과 경쟁해야 한다. 취약한 것이 건조되어 바람에 날아가면 곧 과학에 손실될 수 있다.",grammar:"<strong>With climate change shrinking</strong> = 독립분사구문. <strong>race the clock</strong> = 시간과 경쟁하다",vocab:[{w:"glacial",pos:"adj",kr:"빙하의"},{w:"race the clock",pos:"phr",kr:"시간과 경쟁하다"}]},
    {type:"para",label:"Para C",role:"옵랜드 9년 발굴 — 순록과 교역로"},
    {num:4,en:"Over a nine-year period, a team of archaeologists surveyed patches of ice in Oppland. Reindeer once congregated on these ice patches in the later summer months to escape biting insects, and from the late Stone Age, hunters followed.",kr:"9년 동안 고고학자 팀이 옵랜드의 빙원 지역을 조사했다. 순록들이 한때 여름 후반 달에 물어뜯는 곤충을 피하기 위해 이 빙원에 모였고, 후기 석기 시대부터 사냥꾼들이 따라왔다.",grammar:"<strong>to escape biting insects</strong> = 목적의 to부정사. <strong>once congregated</strong> = 한때 모였다",vocab:[{w:"reindeer",pos:"n",kr:"순록"},{w:"congregate",pos:"v",kr:"모이다, 집합하다"}]},
    {type:"para",label:"Para D",role:"2,000개 이상의 유물 — 기원전 4000년~14세기"},
    {num:5,en:"At the edges of the contracting ice patches, archaeologists found more than 2,000 artefacts, which formed a material record that ran from 4,000 BCE to the beginnings of the Renaissance in the 14th century. Many of the artefacts are associated with hunting – hunters would have easily misplaced arrows and often discarded broken bows.",kr:"줄어드는 빙원의 가장자리에서 고고학자들은 2,000개 이상의 유물을 발견했는데, 이것들은 기원전 4,000년에서 14세기 르네상스 시작까지의 물질적 기록을 형성했다. 많은 유물들이 사냥과 관련되어 있다 – 사냥꾼들은 화살을 쉽게 잃어버렸고 부러진 활은 자주 버렸다.",grammar:"<strong>which formed a material record</strong> = 계속적 관계절. <strong>would have misplaced</strong> = 과거 추측",vocab:[{w:"contracting",pos:"adj",kr:"줄어드는, 수축하는"},{w:"discard",pos:"v",kr:"버리다"}]},
    {type:"para",label:"Para E",role:"방사성 탄소 연대 측정 — 활동 성수기"},
    {num:6,en:"Barrett's team radiocarbon-dated 153 of the artefacts and compared those dates to major environmental changes and major social and economic shifts. They found that some periods had produced lots of artefacts, indicating that people had been pretty active in the mountains during those times.",kr:"바렛 팀은 153개의 유물을 방사성 탄소 연대 측정하고 그 날짜를 주요 환경 변화 및 사회·경제적 전환과 비교했다. 일부 시기에 많은 유물이 나왔는데, 이는 그 시기에 사람들이 산에서 꽤 활발했음을 나타낸다.",grammar:"<strong>radiocarbon-dated</strong> = 방사성 탄소 연대를 측정했다. <strong>indicating that</strong> = 분사구문(결과)",vocab:[{w:"radiocarbon",pos:"n",kr:"방사성 탄소"},{w:"indicate",pos:"v",kr:"나타내다, 시사하다"}]},
    {type:"para",label:"Para G",role:"바이킹 시대 — 상업적 사냥 호황"},
    {num:7,en:"Many of the artefacts Barrett's team recovered date from the beginning of the Viking Age, the 700s through to the 900s CE. Growing Norwegian towns, along with export markets, would have created a booming demand for hides to fight off the cold, as well as antlers to make useful things like combs.",kr:"바렛 팀이 회수한 많은 유물들은 바이킹 시대 초기인 기원후 700~900년대에 날짜를 두고 있다. 성장하는 노르웨이 마을들과 수출 시장은 추위를 막기 위한 가죽과 빗 같은 유용한 것들을 만들기 위한 사슴 뿔에 대한 급증하는 수요를 만들었을 것이다.",grammar:"<strong>would have created</strong> = 과거 추측(would have). <strong>to fight off the cold</strong> = 목적 to부정사",vocab:[{w:"booming",pos:"adj",kr:"급성장하는"},{w:"antler",pos:"n",kr:"사슴 뿔"},{w:"hide",pos:"n",kr:"가죽"}]}
  ],

"C16_T3_P3": {
  title:"Cambridge 16 · Test 3 · Passage 3",
  topic:"Plant Thermometer Triggers Springtime Growth",
  qTypes:["True / False / Not Given","Section Matching","Sentence Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 파이토크롬이 빛 감지기이자 온도계"},
    {num:1,en:"An international team of scientists has discovered that the 'thermometer' molecule in plants enables them to develop according to seasonal temperature changes. Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night.",kr:"국제 과학자 팀은 식물의 '온도계' 분자가 계절 온도 변화에 따라 식물이 발달할 수 있게 한다는 것을 발견했다. 연구자들은 낮에 빛을 감지하는 데 사용되는 피토크롬이라는 분자가 실제로 어둠 속에서 기능을 바꾸어 밤의 열을 측정하는 세포 온도 측정기가 된다고 밝혔다.",grammar:"<strong>enables them to develop</strong> = enable + 목적어 + to부정사. <strong>to become</strong> = 결과의 to부정사",vocab:[{w:"phytochrome",pos:"n",kr:"피토크롬(식물색소 단백질)"},{w:"gauge",pos:"n",kr:"측정기, 계기"}]},
    {type:"para",label:"Para B",role:"온도에 비례하는 분자 변화 속도"},
    {num:2,en:"At night, these molecules change states, and the pace at which they change is 'directly proportional to temperature'. The warmer it is, the faster the molecular change – stimulating plant growth.",kr:"밤에 이 분자들은 상태를 바꾸며, 변하는 속도는 '온도에 정비례'한다. 따뜻할수록 분자 변화가 빠르고 – 식물 성장을 자극한다.",grammar:"<strong>directly proportional to</strong> = ~에 정비례하는. <strong>The warmer ... the faster</strong> = 비례 비교 구문",vocab:[{w:"proportional to",pos:"adj",kr:"~에 비례하는"},{w:"stimulate",pos:"v",kr:"자극하다"}]},
    {type:"para",label:"Para C",role:"기후 변화 대비 작물 개발 가능성"},
    {num:3,en:"With weather and temperatures set to become ever more unpredictable due to climate change, researchers say the discovery could help breed tougher crops. 'Key crops such as wheat and rice are sensitive to high temperatures. Thermal stress reduces crop yields by around 10% for every one degree increase in temperature,' says lead researcher Dr Philip Wigge.",kr:"기후 변화로 날씨와 기온이 더욱 예측 불가능해질 것으로 예상되는 가운데, 연구자들은 이 발견이 더 강한 작물을 육종하는 데 도움이 될 수 있다고 말한다. '밀과 쌀 같은 주요 작물은 높은 기온에 민감합니다. 열 스트레스는 기온 1도 상승마다 작물 수확량을 약 10% 줄입니다'라고 수석 연구원 필립 위그 박사가 말한다.",grammar:"<strong>set to become</strong> = ~하도록 설정된, 예정된. <strong>for every one degree increase</strong> = 1도 상승마다",vocab:[{w:"thermal stress",pos:"n",kr:"열 스트레스"},{w:"yield",pos:"n",kr:"수확량"}]},
    {type:"para",label:"Para E-F",role:"피토크롬의 빛·어둠 속 작용 원리"},
    {num:4,en:"In their active state, phytochrome molecules bind themselves to DNA to restrict plant growth. During the day, sunlight activates the molecules, slowing down growth. If a plant finds itself in shade, phytochromes are quickly inactivated – enabling it to grow faster to find sunlight again.",kr:"활성 상태에서 피토크롬 분자는 DNA에 결합하여 식물 성장을 제한한다. 낮에는 햇빛이 분자를 활성화하여 성장을 늦춘다. 식물이 그늘 속에 있으면 피토크롬이 빠르게 비활성화되어 다시 햇빛을 찾아 더 빨리 성장할 수 있게 한다.",grammar:"<strong>bind themselves to</strong> = ~에 결합하다. <strong>enabling it to grow</strong> = 분사구문(결과)",vocab:[{w:"bind",pos:"v",kr:"결합하다"},{w:"inactivate",pos:"v",kr:"비활성화하다"},{w:"restrict",pos:"v",kr:"제한하다"}]},
    {num:5,en:"At night, instead of a rapid deactivation following sundown, the molecules gradually change from their active to inactive state. This is called 'dark reversion'. 'Just as mercury rises in a thermometer, the rate at which phytochromes revert to their inactive state during the night is a direct measure of temperature,' says Wigge.",kr:"밤에는 일몰 후 빠른 비활성화 대신, 분자들이 활성에서 비활성 상태로 서서히 변한다. 이것을 '암 역전'이라고 한다. '온도계에서 수은이 올라가는 것처럼, 밤 동안 피토크롬이 비활성 상태로 되돌아가는 속도가 온도의 직접적인 척도입니다'라고 위그는 말한다.",grammar:"<strong>Just as mercury rises</strong> = 비교 as절. <strong>the rate at which</strong> = ~하는 속도",vocab:[{w:"dark reversion",pos:"n",kr:"암 역전"},{w:"mercury",pos:"n",kr:"수은"}]},
    {type:"para",label:"Para G",role:"떡갈나무와 물푸레나무 — 속담 과학적 근거"},
    {num:6,en:"Wigge explains: 'Oak trees rely much more on temperature, likely using phytochromes as thermometers to dictate development, whereas ash trees rely on measuring day length to determine their seasonal timing. A warmer spring will result in oak leafing before ash. A cold spring will see the opposite.'",kr:"위그는 설명한다: '떡갈나무는 온도에 훨씬 더 많이 의존하며, 아마도 피토크롬을 온도계로 사용하여 발달을 결정하는 반면, 물푸레나무는 계절 타이밍을 결정하기 위해 낮의 길이를 측정하는 것에 의존합니다. 따뜻한 봄은 물푸레나무보다 떡갈나무가 먼저 잎을 틔우는 결과를 낳을 것입니다. 차가운 봄은 반대 결과를 볼 것입니다.'",grammar:"<strong>whereas</strong> = 반면에(대조). <strong>result in oak leafing before ash</strong> = ~의 결과를 낳다",vocab:[{w:"dictate",pos:"v",kr:"결정하다, 명령하다"},{w:"leafing",pos:"n",kr:"잎이 트는 것"}]},
    {type:"para",label:"Para H",role:"12년 연구 결론 — 유채 식물 Arabidopsis 사용"},
    {num:7,en:"The new findings are the culmination of twelve years of research. The work was done using a mustard plant called Arabidopsis, but the phytochrome genes necessary for temperature sensing are found in crop plants as well.",kr:"새로운 발견은 12년 연구의 정점이다. 연구는 애기장대라고 불리는 유채 식물을 사용하여 이루어졌지만, 온도 감지에 필요한 피토크롬 유전자는 작물 식물에서도 발견된다.",grammar:"<strong>culmination of</strong> = ~의 정점, 완성. <strong>as well</strong> = 또한",vocab:[{w:"culmination",pos:"n",kr:"정점, 완성"},{w:"Arabidopsis",pos:"n",kr:"애기장대(모델 식물)"}]}
  ],
  allVocab:[
    {w:"phytochrome",pos:"n",pron:"/ˈfaɪtəkrəʊm/",kr:"피토크롬",ex:"Phytochromes detect light during the day and temperature at night.",syn:""},

"C16_T4_P1": {
  title:"Cambridge 16 · Test 4 · Passage 1",
  topic:"Roman Tunnels",
  qTypes:["Diagram Labelling","True / False / Not Given","Short Answer"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 페르시아의 카나트 공법"},
    {num:1,en:"The Persians introduced the qanat method of tunnel construction, which consisted of placing posts over a hill in a straight line, then digging vertical shafts down into the ground at regular intervals. Underground, workers removed the earth from between the ends of the shafts, creating a tunnel.",kr:"페르시아인들은 카나트 터널 건설 방법을 도입했는데, 이는 언덕 위에 일직선으로 말뚝을 설치하고 일정 간격으로 수직 갱도를 땅속으로 파내려가는 것으로 구성되었다. 지하에서 노동자들은 갱도 끝 사이의 흙을 제거하여 터널을 만들었다.",grammar:"<strong>which consisted of -ing</strong> = 관계절 + 동명사 목적어. <strong>at regular intervals</strong> = 일정 간격으로",vocab:[{w:"qanat",pos:"n",kr:"카나트(지하 수로)"},{w:"shaft",pos:"n",kr:"갱도, 수직 통로"}]},
    {num:2,en:"Remarkably, some qanats built by the Persians 2,700 years ago are still in use today. They later passed on their knowledge to the Romans, who used the qanat method to construct water-supply tunnels for agriculture.",kr:"놀랍게도 2,700년 전 페르시아인들이 건설한 일부 카나트는 오늘날에도 여전히 사용되고 있다. 그들은 나중에 이 지식을 로마인들에게 전달했는데, 로마인들은 농업용 용수 공급 터널을 건설하는 데 카나트 방법을 사용했다.",grammar:"<strong>Remarkably</strong> = 문장 부사(놀랍게도). <strong>who used</strong> = 계속적 관계절",vocab:[{w:"in use",pos:"phr",kr:"사용 중인"},{w:"water-supply",pos:"adj",kr:"용수 공급의"}]},
    {type:"para",label:"Para 2",role:"로마의 카나트 — 클라우디우스 터널"},
    {num:3,en:"Roman qanat tunnels were constructed with vertical shafts at intervals of 30-60 meters. The shafts were equipped with handholds and footholds to help those climbing in and out. The 5.6-kilometer-long Claudius tunnel, built in 41 CE to drain the Fucine Lake, had shafts up to 122 meters deep, took 11 years to build and involved approximately 30,000 workers.",kr:"로마의 카나트 터널은 30~60미터 간격으로 수직 갱도가 건설되었다. 갱도에는 출입을 돕는 손잡이와 발판이 설치되었다. 기원후 41년에 푸치노 호수를 배수하기 위해 건설된 5.6km 길이의 클라우디우스 터널은 최대 122미터 깊이의 갱도를 가졌으며, 건설하는 데 11년이 걸렸고 약 3만 명의 노동자가 참여했다.",grammar:"<strong>equipped with</strong> = ~을 갖춘. <strong>approximately 30,000 workers</strong> = 약 3만 명의 노동자",vocab:[{w:"handhold",pos:"n",kr:"손잡이"},{w:"foothold",pos:"n",kr:"발판"},{w:"drain",pos:"v",kr:"배수하다"}]},
    {type:"para",label:"Para 3",role:"역굴착 공법 — 양쪽에서 만나기"},
    {num:4,en:"By the 6th century BCE, a second method appeared called the counter-excavation method, in which the tunnel was constructed from both ends. An inscription on a 428-meter tunnel built as part of the Saldae aqueduct system in Algeria describes how the two teams of builders missed each other in the mountain and how a lateral link corrected the error.",kr:"기원전 6세기에 역굴착 공법이라는 두 번째 방법이 나타났는데, 이는 터널을 양쪽 끝에서 건설하는 방식이었다. 알제리 살다에 수로 시스템의 일부로 건설된 428미터 터널의 비문은 두 팀의 건설자들이 산속에서 서로 맞닥뜨리지 못했고 측면 연결이 초기 오류를 수정했다고 설명한다.",grammar:"<strong>in which</strong> = 전치사 + 관계대명사. <strong>how ... missed each other</strong> = 간접의문문",vocab:[{w:"counter-excavation",pos:"n",kr:"역굴착"},{w:"aqueduct",pos:"n",kr:"수로, 수로교"},{w:"lateral link",pos:"n",kr:"측면 연결"}]},
    {type:"para",label:"Para 4",role:"도로·광업 터널"},
    {num:5,en:"The Romans dug tunnels for their roads using the counter-excavation method, whenever they encountered hills or mountains too high for roads to pass over. Tunnels were also built for mineral extraction. Traces of tunnels used to mine gold can still be found at the Dolaucothi mines in Wales.",kr:"로마인들은 도로가 넘을 수 없을 만큼 높은 언덕이나 산을 만날 때마다 역굴착 공법을 사용하여 도로용 터널을 팠다. 광물 채굴을 위한 터널도 건설되었다. 금을 채굴하는 데 사용된 터널의 흔적이 웨일스의 돌라우코티 광산에서 여전히 발견될 수 있다.",grammar:"<strong>whenever they encountered</strong> = ~를 만날 때마다. <strong>still be found</strong> = 여전히 발견될 수 있다",vocab:[{w:"mineral extraction",pos:"n",kr:"광물 채굴"},{w:"mine",pos:"v",kr:"채굴하다"}]},
    {type:"para",label:"Para 5",role:"건설 속도 — 화염 소화 기법"},
    {num:6,en:"When the rock was hard, the Romans employed a technique called fire quenching which consisted of heating the rock with fire, and then suddenly cooling it with cold water so that it would crack. Construction marks on a Roman tunnel in Bologna show that the rate of advance through solid rock was 30 centimeters per day.",kr:"암석이 단단할 때 로마인들은 화염 소화라는 기술을 사용했는데, 암석을 불로 가열한 다음 갑자기 차가운 물로 냉각하여 갈라지게 하는 것이었다. 볼로냐의 로마 터널 건설 흔적은 견고한 암석을 통한 전진 속도가 하루 30센티미터였음을 보여준다.",grammar:"<strong>employed a technique called</strong> = 과거분사 후치수식. <strong>so that it would crack</strong> = 목적의 so that절",vocab:[{w:"fire quenching",pos:"n",kr:"화염 소화(가열 후 급냉 공법)"},{w:"advance",pos:"n",kr:"전진 속도"}]}
  ],

"C16_T4_P2": {
  title:"Cambridge 16 · Test 4 · Passage 2",
  topic:"Changes in Reading Habits",
  qTypes:["Multiple Choice","Summary Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 디지털이 바꾸는 뇌의 읽기 회로"},
    {num:1,en:"An invisible, game-changing transformation links everyone: the neuronal circuit that underlies the brain's ability to read is subtly, rapidly changing and this has implications for everyone from the pre-reading toddler to the expert adult.",kr:"보이지 않는 변혁이 모두를 연결하고 있다: 뇌의 읽기 능력 기저에 있는 신경 회로가 미묘하게 빠르게 변화하고 있으며, 이는 읽기 전 유아부터 전문 성인까지 모두에게 영향을 미친다.",grammar:"<strong>that underlies</strong> = 관계절(기저에 있는). <strong>has implications for</strong> = ~에 영향을 미치다",vocab:[{w:"neuronal circuit",pos:"n",kr:"신경 회로"},{w:"implication",pos:"n",kr:"영향, 함의"}]},
    {type:"para",label:"Para 2",role:"깊은 읽기 — 지적·감성 처리의 핵심"},
    {num:2,en:"The present reading brain enables the development of some of our most important intellectual and affective processes: internalized knowledge, analogical reasoning, and inference; perspective-taking and empathy; critical analysis and the generation of insight.",kr:"현재의 읽기 두뇌는 우리의 가장 중요한 지적·감성적 과정들의 발달을 가능하게 한다: 내면화된 지식, 유추적 추론, 추론; 관점 전환과 공감; 비판적 분석과 통찰의 생성이다.",grammar:"<strong>enables the development of</strong> = ~의 발달을 가능하게 하다. <strong>colon(:)</strong> = 구체적 예시 나열",vocab:[{w:"analogical reasoning",pos:"n",kr:"유추적 추론"},{w:"empathy",pos:"n",kr:"공감"},{w:"insight",pos:"n",kr:"통찰"}]},
    {type:"para",label:"Para 3",role:"Turkle의 관점 — 혁신이 잃는 것"},
    {num:3,en:"As MIT scholar Sherry Turkle has written, we do not err as a society when we innovate but when we ignore what we disrupt or diminish while innovating. Society needs to confront what is diminishing in the expert reading circuit.",kr:"MIT 학자 셰리 터클이 썼듯이, 우리 사회가 혁신할 때 잘못되는 것이 아니라 혁신하면서 방해하거나 감소시키는 것을 무시할 때 잘못된다. 사회는 전문 읽기 회로에서 무엇이 감소하고 있는지 직면해야 한다.",grammar:"<strong>not ... but when</strong> = ~할 때가 아니라 ~할 때. <strong>what we disrupt or diminish</strong> = 명사절",vocab:[{w:"err",pos:"v",kr:"잘못하다"},{w:"disrupt",pos:"v",kr:"방해하다"},{w:"diminish",pos:"v",kr:"감소시키다"}]},
    {type:"para",label:"Para 4",role:"읽기 회로는 환경에 적응한다"},
    {num:4,en:"The reading circuit is not given to human beings through a genetic blueprint like vision or language; it needs an environment to develop. If the dominant medium advantages processes that are fast, multi-task oriented and well-suited for large volumes of information, so will the reading circuit.",kr:"읽기 회로는 시각이나 언어처럼 유전적 청사진을 통해 인간에게 주어지지 않는다; 발달하기 위해 환경이 필요하다. 지배적인 미디어가 빠르고 멀티태스킹 지향적이며 대량 정보에 적합한 프로세스를 유리하게 하면, 읽기 회로도 그렇게 될 것이다.",grammar:"<strong>is not given through a genetic blueprint</strong> = 수동태 부정. <strong>so will the reading circuit</strong> = 도치 구문",vocab:[{w:"genetic blueprint",pos:"n",kr:"유전적 청사진"},{w:"multi-task oriented",pos:"adj",kr:"멀티태스킹 지향의"}]},
    {type:"para",label:"Para 5",role:"Mangen 연구 — 종이 독자가 더 잘 이해한다"},
    {num:5,en:"Psychologist Anne Mangen studied how high school students comprehend the same material in different mediums. Results indicated that students who read on print were superior in their comprehension to screen-reading peers, particularly in their ability to sequence detail and reconstruct the plot in chronological order.",kr:"심리학자 앤 망엔은 고등학생들이 다양한 매체에서 같은 자료를 어떻게 이해하는지 연구했다. 결과는 종이로 읽은 학생들이 화면으로 읽은 동료들보다 이해력이 우수했으며, 특히 세부 사항을 순서대로 배열하고 줄거리를 시간 순서대로 재구성하는 능력이 뛰어났다.",grammar:"<strong>were superior to</strong> = ~보다 우수했다(비교). <strong>in chronological order</strong> = 시간 순서대로",vocab:[{w:"chronological",pos:"adj",kr:"시간 순서의"},{w:"reconstruct",pos:"v",kr:"재구성하다"}]},
    {type:"para",label:"Para 6",role:"Liu 연구 — 훑어 읽기가 새로운 표준"},
    {num:6,en:"Ziming Liu indicates that the 'new norm' in reading is skimming, involving word-spotting and browsing through the text. When the reading brain skims like this, it reduces time allocated to deep reading processes. In other words, we don't have time to grasp complexity, to understand another's feelings, to perceive beauty, and to create thoughts of the reader's own.",kr:"지밍 류는 읽기의 '새로운 표준'이 훑어 읽기라고 나타낸다. 읽기 두뇌가 이렇게 훑어 읽으면 깊은 읽기 프로세스에 할당되는 시간이 줄어든다. 즉, 우리는 복잡성을 파악하고, 타인의 감정을 이해하고, 아름다움을 인지하고, 독자 자신의 생각을 만들어낼 시간이 없다.",grammar:"<strong>the new norm in reading</strong> = 읽기의 새로운 표준. <strong>allocated to</strong> = ~에 할당된",vocab:[{w:"skim",pos:"v",kr:"훑어 읽다"},{w:"word-spotting",pos:"n",kr:"단어 찾기"},{w:"norm",pos:"n",kr:"표준, 기준"}]},
    {type:"para",label:"Para 7",role:"결론 — 비판적 사고 회복은 가능하다"},
    {num:7,en:"There's an old rule in neuroscience that does not alter with age: use it or lose it. It is a very hopeful principle when applied to critical thought in the reading brain because it implies choice. We possess both the science and the technology to identify and redress the changes in how we read before they become entrenched.",kr:"나이에 따라 변하지 않는 신경과학의 오래된 규칙이 있다: 사용하지 않으면 잃는다. 선택을 암시하기 때문에 읽기 두뇌의 비판적 사고에 적용할 때 매우 희망적인 원칙이다. 우리는 읽기 방식의 변화가 뿌리 내리기 전에 그것을 파악하고 바로잡을 과학과 기술을 모두 가지고 있다.",grammar:"<strong>use it or lose it</strong> = 쓰지 않으면 잃는다(관용적 원칙). <strong>before they become entrenched</strong> = 뿌리 내리기 전에",vocab:[{w:"redress",pos:"v",kr:"바로잡다, 교정하다"},{w:"entrenched",pos:"adj",kr:"뿌리 내린, 공고한"}]}
  ],

    {w:"neuronal circuit",pos:"n",pron:"/ˈnjʊərənl ˈsɜːkɪt/",kr:"신경 회로",ex:"The neuronal circuit underlying reading is rapidly changing.",syn:"neural pathway"},

  tfng:[
    {qNum:23,stmt:"The medium we use to read can affect our choice of reading content.",correct:"YES",mine:"",evPara:"Para 6",ev:"How we read changes <mark>not only what we read, but also the purposes for which we read.</mark>",why:"읽기 매체가 읽는 내용에 영향을 미친다.",trap:""},

    {qNum:25,stmt:"False information has become more widespread in today's digital era.",correct:"NOT GIVEN",mine:"",evPara:"Para 7",ev:"... leaving us susceptible to false information and irrational ideas.",why:"거짓 정보에 취약하다고는 하지만, 더 널리 퍼졌는지에 대한 주장은 없다.",trap:""},

"C16_T4_P3": {
  title:"Cambridge 16 · Test 4 · Passage 3",
  topic:"Attitudes Towards Artificial Intelligence",
  qTypes:["Section Headings","Multiple Choice","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para A",role:"AI의 예측 능력 — 그러나 사람들은 AI를 신뢰하지 않는다"},
    {num:1,en:"Artificial intelligence can already predict the future. Police forces are using it to map when and where crime is likely to occur. Yet for all these technological advances, we still seem to deeply lack confidence in AI predictions. Recent cases show that people prefer to trust human experts, even if these experts are wrong.",kr:"인공지능은 이미 미래를 예측할 수 있다. 경찰은 범죄가 언제 어디서 발생할지 지도화하는 데 이를 사용하고 있다. 그러나 이러한 기술적 발전에도 불구하고 우리는 AI 예측에 깊이 신뢰가 부족한 것 같다. 최근 사례는 사람들이 설령 전문가들이 틀리더라도 인간 전문가를 신뢰하는 것을 선호한다는 것을 보여준다.",grammar:"<strong>for all these technological advances</strong> = 이러한 기술적 발전에도 불구하고. <strong>even if</strong> = 설령 ~하더라도",vocab:[{w:"confidence in",pos:"n",kr:"~에 대한 신뢰"},{w:"even if",pos:"conj",kr:"설령 ~하더라도"}]},
    {type:"para",label:"Para B",role:"Watson for Oncology — AI 거부 사례"},
    {num:2,en:"Take the case of Watson for Oncology. If Watson provided guidance that coincided with doctors' opinions, physicians did not see much point in its recommendations. On the other hand, if Watson generated a recommendation that contradicted the experts' opinion, doctors would typically conclude that Watson was not competent.",kr:"왓슨 온콜로지의 사례를 보자. 왓슨이 의사들의 의견과 일치하는 지침을 제공하면 의사들은 왓슨의 권고에 큰 의미를 두지 않았다. 반면 왓슨이 전문가의 의견에 반하는 권고를 생성하면 의사들은 왓슨이 유능하지 않다고 결론짓는 경향이 있었다.",grammar:"<strong>coincided with</strong> = ~와 일치했다. <strong>would typically conclude</strong> = 과거 반복(would)",vocab:[{w:"coincide with",pos:"v",kr:"~와 일치하다"},{w:"contradict",pos:"v",kr:"반박하다, 모순되다"}]},
    {type:"para",label:"Para C",role:"AI 불신의 이유 — 복잡성과 실패 사례"},
    {num:3,en:"AI is still fairly new and unfamiliar to most people. Even if it can be technically explained, AI's decision-making process is usually too difficult for most people to comprehend. And interacting with something we don't understand can cause anxiety and give us a sense that we're losing control.",kr:"AI는 대부분의 사람들에게 여전히 꽤 새롭고 낯설다. 기술적으로 설명될 수 있더라도 AI의 의사결정 과정은 대부분의 사람들이 이해하기 너무 어렵다. 그리고 우리가 이해하지 못하는 것과 상호작용하면 불안을 일으키고 통제력을 잃고 있다는 느낌을 줄 수 있다.",grammar:"<strong>Even if</strong> = 비록 ~하더라도. <strong>give us a sense that</strong> = ~라는 느낌을 주다",vocab:[{w:"unfamiliar",pos:"adj",kr:"낯선, 익숙하지 않은"},{w:"anxiety",pos:"n",kr:"불안"}]},
    {type:"para",label:"Para D",role:"확증 편향 — AI 관련 영화가 태도를 극단화"},
    {num:4,en:"In a recent experiment, people were given various sci-fi films about AI to watch and then asked questions about automation in everyday life. Regardless of whether the film depicted AI in a positive or negative light, watching a cinematic vision of our technological future polarised the participants' attitudes.",kr:"최근 실험에서 사람들에게 AI에 관한 다양한 공상과학 영화를 시청하게 한 다음 일상 생활에서의 자동화에 관한 질문을 받았다. 영화가 AI를 긍정적으로 묘사하든 부정적으로 묘사하든 관계없이, 기술적 미래에 대한 영화적 비전을 시청하는 것이 참가자들의 태도를 양극화시켰다.",grammar:"<strong>Regardless of whether</strong> = ~이든 아니든 관계없이. <strong>polarised the participants' attitudes</strong> = 태도를 양극화시켰다",vocab:[{w:"polarise",pos:"v",kr:"양극화시키다"},{w:"confirmation bias",pos:"n",kr:"확증 편향"}]},
    {type:"para",label:"Para E",role:"신뢰 향상 방법 — 알고리즘 투명성"},
    {num:5,en:"Simply having previous experience with AI can significantly improve people's opinions about the technology. Another solution may be to reveal more about the algorithms and the purposes they serve. Several high-profile social media companies already release transparency reports.",kr:"AI에 대한 이전 경험을 가지는 것만으로도 기술에 대한 사람들의 의견을 크게 향상시킬 수 있다. 또 다른 해결책은 알고리즘과 그것이 제공하는 목적에 대해 더 많이 공개하는 것일 수 있다. 여러 유명 소셜 미디어 기업들은 이미 투명성 보고서를 발표하고 있다.",grammar:"<strong>Simply having</strong> = 동명사 주어. <strong>Another solution may be to</strong> = 또 다른 해결책은 ~하는 것일 수 있다",vocab:[{w:"transparency report",pos:"n",kr:"투명성 보고서"},{w:"algorithm",pos:"n",kr:"알고리즘"}]},
    {type:"para",label:"Para F",role:"사용자 참여 — AI 수정 권한 부여"},
    {num:6,en:"Research suggests that allowing people some control over AI decision-making could also improve trust. One study showed that when people were allowed the freedom to slightly modify an algorithm, they felt more satisfied with its decisions, more likely to believe it was superior and more likely to use it in the future.",kr:"연구에 따르면 AI 의사결정에 대한 일부 통제권을 사람들에게 허용하는 것이 신뢰를 향상시킬 수 있다. 한 연구에서 알고리즘을 약간 수정할 자유가 허용되었을 때 사람들은 그 결정에 더 만족하고, 더 우수하다고 믿을 가능성이 높으며, 미래에 더 사용할 가능성이 높다고 느꼈다.",grammar:"<strong>allowing people some control</strong> = 동명사 주어. <strong>were allowed the freedom to</strong> = 수동태 + to부정사",vocab:[{w:"modify",pos:"v",kr:"수정하다"},{w:"superior",pos:"adj",kr:"우수한"}]}
  ],
  allVocab:[
    {w:"confidence in",pos:"n",pron:"/ˈkɒnfɪdəns ɪn/",kr:"~에 대한 신뢰",ex:"People deeply lack confidence in AI predictions.",syn:"trust in, faith in"},
    {w:"coincide with",pos:"v",pron:"/ˌkəʊɪnˈsaɪd wɪð/",kr:"~와 일치하다",ex:"Watson's guidance coincided with doctors' opinions.",syn:"match, align with"},
    {w:"contradict",pos:"v",pron:"/ˌkɒntrəˈdɪkt/",kr:"반박하다, 모순되다",ex:"When Watson contradicted experts, doctors dismissed it.",syn:"oppose, conflict with"},
    {w:"polarise",pos:"v",pron:"/ˈpəʊləraɪz/",kr:"양극화시키다",ex:"Watching AI films polarised participants' attitudes.",syn:"divide, split"},
    {w:"confirmation bias",pos:"n",pron:"/ˌkɒnfəˈmeɪʃən ˈbaɪəs/",kr:"확증 편향",ex:"People use evidence in a biased way — known as confirmation bias.",syn:""},
    {w:"transparency report",pos:"n",pron:"/trænsˈpærənsi rɪˈpɔːt/",kr:"투명성 보고서",ex:"Social media companies release transparency reports.",syn:""},
    {w:"algorithm",pos:"n",pron:"/ˈælɡərɪðəm/",kr:"알고리즘",ex:"Revealing more about algorithms could improve trust.",syn:"formula, procedure"},
    {w:"modify",pos:"v",pron:"/ˈmɒdɪfaɪ/",kr:"수정하다",ex:"Users who could modify an algorithm felt more satisfied.",syn:"adjust, alter"},

  ],
  tfng:[
    {qNum:36,stmt:"Subjective depictions of AI in sci-fi films make people change their opinions about automation.",correct:"NO",mine:"",evPara:"Para D",ev:"Regardless of whether the film <mark>depicted AI in a positive or negative light</mark>, watching a cinematic vision <mark>polarised</mark> the participants' attitudes.",why:"의견을 바꾼 것이 아니라 기존 태도를 더 극단적으로 만들었다(양극화).",trap:""},
    {qNum:37,stmt:"Portrayals of AI in media and entertainment are likely to become more positive.",correct:"NOT GIVEN",mine:"",evPara:"Para D",ev:"As AI is represented more and more in media and entertainment, it could lead to a society split between those who benefit and those who reject it.",why:"더 긍정적인 묘사가 늘어날 것이라는 주장은 없다.",trap:""},
    {qNum:38,stmt:"Rejection of the possibilities of AI may have a negative effect on many people's lives.",correct:"YES",mine:"",evPara:"Para D",ev:"Refusing to accept the advantages offered by AI could <mark>place a large group of people at a serious disadvantage.</mark>",why:"AI를 거부하면 심각한 불이익을 당할 수 있다.",trap:""},
    {qNum:39,stmt:"Familiarity with AI has very little impact on people's attitudes to the technology.",correct:"NO",mine:"",evPara:"Para E",ev:"Simply having previous experience with AI can <mark>significantly improve</mark> people's opinions.",why:"이전 경험이 크게 향상시킨다고 말한다 — 거의 영향 없다는 주장과 반대.",trap:""},
    {qNum:40,stmt:"AI applications which users are able to modify are more likely to gain consumer approval.",correct:"YES",mine:"",evPara:"Para F",ev:"When people were allowed the freedom to slightly modify an algorithm, they felt <mark>more satisfied with its decisions, more likely to believe it was superior and more likely to use it in the future.</mark>",why:"수정 가능한 AI에 대해 더 만족, 더 우수하다고 생각, 미래 사용 의향 높음 = 소비자 승인 가능성 높음.",trap:""}

  summary:"Cambridge 16 Test 4 Passage 3. AI 예측 능력이 탁월함에도 불구하고 사람들은 AI를 신뢰하지 않는다. Watson 온콜로지 사례처럼 의사들은 AI 권고를 무시했다. AI의 복잡성과 낯섦, 미디어의 부정적 강조가 불신의 원인이다. AI 경험 축적, 알고리즘 투명성, 사용자 수정 권한 부여가 신뢰를 높일 수 있다."

,"C19_T1_P1": {
  title:"Cambridge 19 · Test 1 · Passage 1",
  topic:"How Tennis Rackets Have Changed",
  qTypes:["True / False / Not Given","Notes Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"앤디 머레이의 세계 1위 달성"},
    {num:1,en:"In 2016, the British professional tennis player Andy Murray was ranked as the world's number one. It was an incredible achievement made even more remarkable by the fact that he did this during a period considered to be one of the strongest in the sport's history.",kr:"2016년 영국의 프로 테니스 선수 앤디 머레이는 세계 1위로 선정되었다. 이는 스포츠 역사상 가장 강한 시기 중 하나로 여겨지는 시기에 이를 달성했다는 점에서 더욱 놀라운 놀라운 업적이었다.",grammar:"<strong>made even more remarkable by the fact that</strong> = 분사구문 + 동격절. <strong>during a period considered</strong> = 과거분사 후치수식",vocab:[{w:"remarkable",pos:"adj",kr:"놀라운, 주목할 만한"},{w:"achievement",pos:"n",kr:"업적, 성취"}]},
    {type:"para",label:"Para 2",role:"머레이의 라켓 줄 변경"},
    {num:2,en:"In 2012, he switched to a synthetic string for the mains. A small change, perhaps, but its importance should not be underestimated.",kr:"2012년 그는 메인 줄을 합성 줄로 교체했다. 작은 변화일지 모르지만, 그 중요성은 과소평가되어서는 안 된다.",grammar:"<strong>should not be underestimated</strong> = 수동태 당위(부정). <strong>perhaps</strong> = 삽입 부사(양보)",vocab:[{w:"synthetic",pos:"adj",kr:"합성의, 인공의"},{w:"underestimate",pos:"v",kr:"과소평가하다"}]},
    {type:"para",label:"Para 3",role:"맞춤 라켓 — 프로들의 특별 제작"},
    {num:3,en:"'Touring professionals have their rackets customised to their specific needs,' says Colin Triplow, a UK-based professional racket stringer. 'It's a highly important part of performance maximisation.'",kr:"'투어 프로들은 특정 요구 사항에 맞게 라켓을 맞춤 제작합니다'라고 영국 기반 프로 라켓 스트링어 콜린 트리플로우는 말한다. '이것은 성과 극대화의 매우 중요한 부분입니다.'",grammar:"<strong>have their rackets customised</strong> = 사역 수동(have + 목적어 + 과거분사). <strong>performance maximisation</strong> = 성과 극대화",vocab:[{w:"customise",pos:"v",kr:"맞춤 제작하다"},{w:"maximisation",pos:"n",kr:"극대화"}]},
    {num:4,en:"The specific rackets used by the world's elite are not actually readily available to the public; each racket is individually made to suit the player who uses it. The rackets Mike and Bob Bryan use now weigh more than the average model and have a denser string pattern.",kr:"세계 엘리트 선수들이 사용하는 특정 라켓은 실제로 일반인들이 쉽게 구할 수 없으며, 각 라켓은 사용하는 선수에 맞게 개별적으로 만들어진다. 마이크와 밥 브라이언이 지금 사용하는 라켓은 평균 모델보다 무게가 더 나가고 줄 간격이 더 촘촘하다.",grammar:"<strong>are not readily available to</strong> = ~에게 쉽게 구할 수 없다. <strong>individually made to suit</strong> = 목적 to부정사",vocab:[{w:"dense string pattern",pos:"n",kr:"촘촘한 줄 간격"},{w:"available to",pos:"adj",kr:"~에게 구할 수 있는"}]},
    {type:"para",label:"Para 4",role:"라켓 개조의 역사 — 1970년대"},
    {num:5,en:"Racket modifications mainly date back to the 1970s, when the amateur German tennis player Werner Fischer started playing with the so-called spaghetti-strung racket. It created a string bed that generated so much topspin that it was quickly banned by the International Tennis Federation.",kr:"라켓 개조는 주로 1970년대로 거슬러 올라가는데, 독일 아마추어 테니스 선수 베르너 피셔가 소위 스파게티 스트링 라켓으로 경기를 시작했다. 너무 많은 톱스핀을 생성하는 스트링 면을 만들어 국제 테니스 연맹에 의해 빠르게 금지되었다.",grammar:"<strong>date back to</strong> = ~로 거슬러 올라가다. <strong>so much ... that</strong> = 결과 구문",vocab:[{w:"topspin",pos:"n",kr:"톱스핀"},{w:"ban",pos:"v",kr:"금지하다"}]},
    {type:"para",label:"Para 5",role:"줄의 종류 — 천연 대 합성"},
    {num:6,en:"At one time, all tennis rackets were strung with natural gut made from the outer layer of sheep or cow intestines. This all changed in the early 1990s with the development of synthetic strings. Co-polyester is by far the most widely used synthetic. Studies indicate that the average spin from a co-polyester string is 25% greater than from natural string.",kr:"한때 모든 테니스 라켓은 양이나 소의 창자 외층으로 만든 천연 거트로 스트링이 달렸다. 이 모든 것은 1990년대 초 합성 줄의 개발로 바뀌었다. 코-폴리에스터가 단연 가장 널리 사용되는 합성 줄이다. 코-폴리에스터 줄의 평균 스핀이 천연 줄보다 25% 더 크다는 연구 결과가 있다.",grammar:"<strong>by far the most widely used</strong> = 단연 가장 많이 사용되는(강조 최상급). <strong>made from</strong> = ~로 만들어진",vocab:[{w:"intestine",pos:"n",kr:"창자, 장"},{w:"co-polyester",pos:"n",kr:"코-폴리에스터"}]},
    {type:"para",label:"Para 6",role:"프레임 개조 — 납추와 그립"},
    {num:7,en:"Much of the serving power of Pete Sampras was attributed to the addition of four to five lead weights onto his rackets. Other changes to the frame involve the handle. Gonçalo Oliveira replaced the original grips of his rackets with something thinner because they had previously felt uncomfortable.",kr:"피트 샘프라스의 많은 서비스 파워가 라켓에 4~5개의 납추를 추가한 것으로 인한 것으로 여겨졌다. 프레임에 대한 다른 변경 사항에는 핸들이 포함된다. 곤살루 올리베이라는 이전에 잡기 불편했기 때문에 라켓의 원래 그립을 더 얇은 것으로 교체했다.",grammar:"<strong>was attributed to</strong> = ~에 기인한 것으로 여겨졌다. <strong>had previously felt uncomfortable</strong> = 과거완료(선행)",vocab:[{w:"lead weights",pos:"n",kr:"납추"},{w:"grip",pos:"n",kr:"그립, 손잡이"}]}

"C19_T1_P2": {
  title:"Cambridge 19 · Test 1 · Passage 2",
  topic:"The Pirates of the Ancient Mediterranean",
  qTypes:["Section Matching","Two-Letter Questions","Summary Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 지중해 해적의 역사와 로마의 해결"},
    {num:1,en:"From the first to the third millennium BCE, pirates prowled the Mediterranean, raiding merchant ships and threatening vital trade routes. Only when the pirates directly threatened the interests of ancient Rome did the Roman Republic organise a massive fleet to eliminate piracy. Under Pompey, Rome eradicated piracy, transforming the Mediterranean into 'Mare Nostrum' (Our Sea).",kr:"기원전 1세기에서 3세기까지, 해적들이 지중해를 누비며 상선을 습격하고 중요한 교역로를 위협했다. 해적들이 고대 로마의 이익을 직접적으로 위협했을 때만 로마 공화국은 해적을 퇴치하기 위해 대규모 함대를 조직했다. 폼페이우스 지휘 하에 로마는 해적을 박멸하고 지중해를 '마레 노스트럼'(우리의 바다)으로 탈바꿈시켰다.",grammar:"<strong>Only when ... did the Roman Republic</strong> = only 도치 구문. <strong>transforming ... into</strong> = 분사구문(결과)",vocab:[{w:"prowl",pos:"v",kr:"배회하다, 누비다"},{w:"eradicate",pos:"v",kr:"박멸하다"}]},
    {type:"para",label:"Para B",role:"지중해 해적의 기원 — 지리적 이점"},
    {num:2,en:"The geography of the Mediterranean benefited the pirates, with the numerous coves along the coast providing places to hide their boats and strike undetected. Before the invention of ocean-going caravels in the 15th century, ships could not easily cross long distances over open water, restricted to a few well-known navigable routes that followed the coastline.",kr:"지중해의 지형은 해적들에게 유리했는데, 해안을 따라 있는 수많은 후미가 배를 숨기고 발각되지 않고 공격할 장소를 제공했다. 15세기 대양 항해용 카라벨의 발명 전에는 배들이 먼 거리를 쉽게 항해할 수 없어 해안선을 따라가는 몇 개의 잘 알려진 가항 경로에 제한되었다.",grammar:"<strong>with the numerous coves ... providing</strong> = 독립분사구문. <strong>restricted to</strong> = 분사구문(수동)",vocab:[{w:"cove",pos:"n",kr:"후미, 작은 만"},{w:"navigable",pos:"adj",kr:"항해 가능한"}]},
    {type:"para",label:"Para C",role:"고대 국가들의 해적 활용"},
    {num:3,en:"It was not unknown in the first and second millennia BCE for governments to resort to pirates' services, especially during wartime, employing their skills and numbers against their opponents. A pirate fleet would serve in the first wave of attack, preparing the way for the navy.",kr:"기원전 1~2세기 동안 정부가 특히 전시에 해적의 서비스를 이용하는 것이 드문 일은 아니었으며, 해적의 기술과 수를 적에 대항해 활용했다. 해적 함대는 공격의 첫 번째 파도에서 복무하여 해군의 길을 열어주었다.",grammar:"<strong>it was not unknown for</strong> = ~하는 것이 드문 일은 아니었다. <strong>employing</strong> = 분사구문(수단)",vocab:[{w:"resort to",pos:"v",kr:"~에 의지하다, 이용하다"},{w:"navy",pos:"n",kr:"해군"}]},
    {type:"para",label:"Para D",role:"아마르나 서한 — 최초 기록된 해적 집단"},
    {num:4,en:"The first known record of a named group of Mediterranean pirates was in the Amarna Letters, diplomatic correspondence between Pharaoh Akhenaten and his allies. The king of Alashiya (modern Cyprus) rejected Akhenaten's claims of a connection with the Lukka, assuring the pharaoh he was prepared to punish any of his subjects involved in piracy.",kr:"지중해 해적의 명명된 집단에 대한 최초의 알려진 기록은 아케나텐 파라오와 그의 동맹 간의 외교 서신인 아마르나 서한에 있었다. 알라시야(현대 키프로스) 왕은 루카와의 연관성에 대한 아케나텐의 주장을 거부하며, 파라오에게 해적 행위에 관여한 자신의 신민을 처벌할 준비가 되어 있다고 확언했다.",grammar:"<strong>rejected ... claims of a connection with</strong> = ~와의 연관성 주장을 거부했다. <strong>assuring the pharaoh</strong> = 분사구문(부대상황)",vocab:[{w:"diplomatic correspondence",pos:"n",kr:"외교 서신"},{w:"assure",pos:"v",kr:"확언하다"}]},
    {type:"para",label:"Para E",role:"그리스의 해적관 — 호메로스와 투키디데스"},
    {num:5,en:"In his works the Iliad and the Odyssey, the ancient Greek writer Homer not only condones, but praises the lifestyle and actions of pirates. The ancient Greek historian Thucydides glorified pirates' daring attacks on ships or even cities. For Greeks, piracy was a part of everyday life. According to Demosthenes, in 355 BCE, Athenian ambassadors made a detour to capture a ship sailing from Egypt, taking the wealth onboard for themselves.",kr:"고대 그리스 작가 호메로스는 일리아드와 오디세이에서 해적의 생활 방식과 행동을 용인할 뿐만 아니라 찬양했다. 고대 그리스 역사가 투키디데스는 배나 도시에 대한 해적의 대담한 공격을 찬미했다. 그리스인들에게 해적 행위는 일상의 일부였다. 데모스테네스에 따르면 기원전 355년에 아테네 대사들이 이집트에서 항해하는 배를 나포하기 위해 우회하여 선내 재산을 자신들을 위해 취했다.",grammar:"<strong>not only condones, but praises</strong> = not only A but B 병렬. <strong>made a detour to capture</strong> = 목적 to부정사",vocab:[{w:"condone",pos:"v",kr:"용인하다"},{w:"glorify",pos:"v",kr:"찬미하다"},{w:"detour",pos:"n",kr:"우회"}]},
    {type:"para",label:"Para F",role:"로마와 해적 — 노예 공급원"},
    {num:6,en:"While piracy was a serious issue for the Republic, Rome profited greatly from its existence. Pirate raids provided a steady source of slaves, essential for Rome's agriculture and mining industries. But pirate attacks on grain ships led to angry voices in the Senate, demanding punishment of the culprits. By the 1st century BCE, pirates kidnapped prominent Roman dignitaries. Their most famous hostage was Julius Caesar, captured in 75 BCE.",kr:"해적 행위는 공화국에 심각한 문제였지만, 로마는 그 존재에서 크게 이익을 얻었다. 해적 습격은 로마의 농업과 광업에 필수적인 노예의 안정적인 공급원을 제공했다. 하지만 곡물선에 대한 해적 공격은 원로원에서 범인 처벌을 요구하는 분노의 목소리를 높였다. 기원전 1세기에 해적들은 저명한 로마 고위 인사들을 납치했다. 그들의 가장 유명한 인질은 기원전 75년에 생포된 율리우스 카이사르였다.",grammar:"<strong>While piracy was a serious issue</strong> = 양보 while. <strong>leading to angry voices</strong> = 분사구문(결과)",vocab:[{w:"steady source",pos:"n",kr:"안정적인 공급원"},{w:"culprit",pos:"n",kr:"범인"},{w:"dignitary",pos:"n",kr:"고위 인사"}]},
    {type:"para",label:"Para G",role:"폼페이우스의 해적 박멸 작전"},
    {num:7,en:"In 67 BCE, a new law granted Pompey vast funds to combat the Mediterranean menace. Pompey divided the entire Mediterranean into 13 districts, assigning a fleet and commander to each. After cleansing one district of pirates, the fleet would join another. Although thousands of pirates died, many more were offered land in fertile areas located far from the sea. Instead of a maritime menace, Rome got productive farmers.",kr:"기원전 67년, 새로운 법이 폼페이우스에게 지중해의 위협을 퇴치할 막대한 자금을 부여했다. 폼페이우스는 지중해 전체를 13개 구역으로 나누어 각 구역에 함대와 사령관을 배정했다. 한 구역에서 해적을 청소한 후 함대는 다음 구역으로 합류했다. 수천 명의 해적이 사망했지만 더 많은 이들이 바다에서 멀리 떨어진 비옥한 지역에 땅을 제공받았다. 해상의 위협 대신 로마는 생산적인 농부들을 얻었다.",grammar:"<strong>After cleansing one district of pirates</strong> = 분사구문(시간). <strong>Instead of a maritime menace</strong> = 전치사구 대조",vocab:[{w:"menace",pos:"n",kr:"위협, 공포"},{w:"cleanse",pos:"v",kr:"청소하다, 정화하다"},{w:"fertile",pos:"adj",kr:"비옥한"}]}
  ],

    {w:"eradicate",pos:"v",pron:"/ɪˈrædɪkeɪt/",kr:"박멸하다",ex:"Pompey eradicated piracy in the Mediterranean.",syn:"eliminate, wipe out"},

  summary:"Cambridge 19 Test 1 Passage 2. 기원전 1~3천년 지중해 해적들은 상선을 습격하고 교역로를 위협했다. 고대 그리스는 해적을 일상으로 받아들였으며, 로마도 노예 공급원으로 활용했다. 그러나 카이사르 납치 등 로마 이익 위협 후 폼페이우스가 13구역 작전으로 박멸했으며, 해적들에게는 비옥한 토지를 제공하여 농부로 전환시켰다."

"C19_T1_P3": {
  title:"Cambridge 19 · Test 1 · Passage 3",
  topic:"The Persistence and Peril of Misinformation",
  qTypes:["Multiple Choice","Summary Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 오정보는 오래된 문제"},
    {num:1,en:"Misinformation – both deliberately promoted and accidentally shared – is perhaps an inevitable part of the world in which we live, but it is not a new problem. People have been sharing inaccurate information with one another for thousands of years.",kr:"의도적으로 조장되었거나 우연히 공유된 오정보는 우리가 사는 세상의 불가피한 부분일지 모르지만, 새로운 문제는 아니다. 사람들은 수천 년 동안 서로 부정확한 정보를 공유해 왔다.",grammar:"<strong>both deliberately promoted and accidentally shared</strong> = 삽입 분사구문(병렬). <strong>inevitable part of</strong> = ~의 불가피한 부분",vocab:[{w:"misinformation",pos:"n",kr:"오정보, 허위 정보"},{w:"inadvertently",pos:"adv",kr:"우연히, 무심코"}]},
    {type:"para",label:"Para 2",role:"기술이 오정보의 영향력을 확대시킨다"},
    {num:2,en:"We currently live in an era in which technology enables information to reach large audiences distributed across the globe, and thus the potential for immediate and widespread effects from misinformation now looms larger than in the past.",kr:"우리는 현재 기술이 전 세계에 분산된 대규모 청중에게 정보가 전달될 수 있게 하는 시대에 살고 있으며, 따라서 오정보로 인한 즉각적이고 광범위한 영향의 가능성은 과거보다 더 크게 다가오고 있다.",grammar:"<strong>looms larger than in the past</strong> = 더 크게 다가오다. <strong>enables information to reach</strong> = enable + 목적어 + to부정사",vocab:[{w:"loom",pos:"v",kr:"다가오다, 위협적으로 보이다"},{w:"distributed across",pos:"adj",kr:"~에 분산된"}]},
    {type:"para",label:"Para 3",role:"데카르트 vs. 스피노자 — 정보 처리 방식"},
    {num:3,en:"The dilemma is neatly summarized by a contrast between René Descartes and Baruch Spinoza. Descartes argued that a person only accepts or rejects information after considering its truth or falsehood; Spinoza argued that people accept all encountered information by default and then subsequently verify or reject it through a separate cognitive process.",kr:"딜레마는 르네 데카르트와 바루흐 스피노자의 대조로 깔끔하게 요약된다. 데카르트는 사람이 정보의 진실 혹은 거짓을 고려한 후에만 수용하거나 거부한다고 주장했다; 스피노자는 사람들이 접하는 모든 정보를 기본적으로 수용한 다음 별도의 인지 과정을 통해 이를 확인하거나 거부한다고 주장했다.",grammar:"<strong>argued that</strong> = ~라고 주장했다(목적절). <strong>by default</strong> = 기본적으로",vocab:[{w:"by default",pos:"adv",kr:"기본적으로"},{w:"subsequently",pos:"adv",kr:"이후에, 그 다음에"},{w:"cognitive process",pos:"n",kr:"인지 과정"}]},
    {num:4,en:"Empirical evidence has supported Spinoza's account: people appear to encode all new information as if it were true, even if only momentarily, and later tag the information as being either true or false, a pattern consistent with the observation that mental resources for skepticism physically reside in a different part of the brain than the resources used in perceiving and encoding.",kr:"경험적 증거는 스피노자의 설명을 지지한다: 사람들은 모든 새로운 정보를 비록 순간적이더라도 사실인 것처럼 부호화하는 것처럼 보이며, 나중에 정보를 진실 또는 거짓으로 태그를 붙이는 패턴은 회의주의적 사고를 위한 뇌 자원이 인식과 부호화에 사용되는 자원과 뇌의 다른 부분에 물리적으로 있다는 관찰과 일치한다.",grammar:"<strong>as if it were true</strong> = 가정법(as if + 과거). <strong>consistent with the observation that</strong> = ~라는 관찰과 일치하는",vocab:[{w:"encode",pos:"v",kr:"부호화하다"},{w:"skepticism",pos:"n",kr:"회의주의"},{w:"momentarily",pos:"adv",kr:"순간적으로"}]},
    {type:"para",label:"Para 4",role:"규제의 한계 — 사전 검열 불가능"},
    {num:5,en:"Regulatory agencies in the United States tend to focus on post hoc detection of broadcast information. The FDA oversees direct-to-consumer prescription drug advertising and has developed mechanisms such as the 'Bad Ad' program. Such programs, although laudable and useful, do not keep false advertising off the airwaves.",kr:"미국의 규제 기관들은 방송 정보의 사후 탐지에 집중하는 경향이 있다. FDA는 소비자 직접 처방약 광고를 감독하고 '배드 광고' 프로그램 같은 메커니즘을 개발했다. 이러한 프로그램들은 칭찬할 만하고 유용하지만, 허위 광고를 전파에서 차단하지 못한다.",grammar:"<strong>post hoc detection</strong> = 사후 탐지. <strong>although laudable and useful</strong> = 양보 삽입절",vocab:[{w:"post hoc",pos:"adj",kr:"사후의"},{w:"laudable",pos:"adj",kr:"칭찬할 만한"},{w:"airwaves",pos:"n",kr:"전파, 방송"}]},
    {type:"para",label:"Para 5",role:"결론 — 장기적 협력이 필요"},
    {num:6,en:"We live at a time when widespread misinformation is common. Future remedies will require not only continued theoretical consideration but also the development and maintenance of consistent monitoring tools – and a recognition that claims which find prominence in the media that are insufficiently based in scientific consensus should be countered.",kr:"우리는 광범위한 오정보가 일반화된 시대에 살고 있다. 미래의 해결책은 지속적인 이론적 고려뿐만 아니라 일관된 모니터링 도구의 개발과 유지, 그리고 과학적 합의에 불충분하게 기반한 주요 미디어의 주장들이 반박되어야 한다는 인식을 필요로 할 것이다.",grammar:"<strong>not only ... but also</strong> = 병렬 구조. <strong>that are insufficiently based in</strong> = 관계절",vocab:[{w:"remedy",pos:"n",kr:"해결책, 치유책"},{w:"consensus",pos:"n",kr:"합의, 공감대"},{w:"prominence",pos:"n",kr:"두각, 탁월함"}]}
  ],

"C19_T2_P1": {
  title:"Cambridge 19 · Test 2 · Passage 1",
  topic:"The Industrial Revolution in Britain",
  qTypes:["Notes Completion","True / False / Not Given"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 영국 산업혁명의 변환"},
    {num:1,en:"The Industrial Revolution began in Britain in the mid-1700s. In Britain, it was a period when a largely rural, agrarian society was transformed into an industrialised, urban one. Goods that had once been crafted by hand started to be produced in mass quantities by machines in factories, thanks to the invention of steam power.",kr:"산업혁명은 1700년대 중반 영국에서 시작되었다. 영국에서는 주로 농촌·농업 사회가 산업화된 도시 사회로 변모한 시기였다. 한때 손으로 만들어졌던 물건들이 증기력의 발명 덕분에 공장의 기계로 대량 생산되기 시작했다.",grammar:"<strong>was transformed into</strong> = ~로 변모했다(수동태). <strong>thanks to</strong> = ~ 덕분에",vocab:[{w:"agrarian",pos:"adj",kr:"농업의"},{w:"mass quantities",pos:"n",kr:"대량"}]},
    {type:"para",label:"Para 2",role:"증기 기관 — 뉴커먼에서 와트로"},
    {num:2,en:"The English inventor Thomas Newcomen designed the first modern steam engine, originally used to power machines that pumped water out of mines. The Scottish engineer James Watt adapted one of Newcomen's models, making it far more efficient. Watt later worked with Matthew Boulton to invent a new steam engine driven by both the forward and backward strokes of the piston, connected to a gear mechanism that produced rotary motion.",kr:"영국의 발명가 토머스 뉴커먼이 광산에서 물을 뽑아내는 기계를 작동시키는 데 원래 사용된 최초의 현대 증기 기관을 설계했다. 스코틀랜드 엔지니어 제임스 와트는 뉴커먼의 모델 중 하나를 개조하여 훨씬 더 효율적으로 만들었다. 와트는 나중에 매튜 볼턴과 함께 피스톤의 전진 및 후진 행정 모두로 구동되는 새 증기 기관을 발명했으며, 이는 회전 운동을 만드는 기어 메커니즘에 연결되었다.",grammar:"<strong>driven by</strong> = ~에 의해 구동되는(수동 분사구문). <strong>connected to</strong> = 과거분사 후치수식",vocab:[{w:"piston",pos:"n",kr:"피스톤"},{w:"rotary motion",pos:"n",kr:"회전 운동"}]},
    {type:"para",label:"Para 3",role:"섬유 산업 — 방적기와 동력 직기"},
    {num:3,en:"Starting in the mid-1700s, innovations like the spinning jenny and the power loom made weaving cloth and spinning yarn much easier. With these machines, relatively little labour was required to produce cloth, and mechanised textile factories quickly met customer demand at home and abroad.",kr:"1700년대 중반부터 방적기와 동력 직기 같은 혁신으로 직물 짜기와 실 잣기가 훨씬 쉬워졌다. 이러한 기계들로 직물 생산에 비교적 적은 노동이 필요해지고, 기계화된 섬유 공장들이 국내외 고객 수요를 빠르게 충족시켰다.",grammar:"<strong>Starting in the mid-1700s</strong> = 분사구문(시간). <strong>relatively little labour</strong> = 비교적 적은 노동",vocab:[{w:"spinning jenny",pos:"n",kr:"방적기"},{w:"power loom",pos:"n",kr:"동력 직기"}]},
    {type:"para",label:"Para 4",role:"철강 산업 — 코크스 제련법"},
    {num:4,en:"The British iron industry adopted new innovations. Chief among the new techniques was the smelting of iron ore with coke instead of the traditional charcoal. This method was cheaper and produced metals of higher quality, enabling Britain's iron and steel production to expand.",kr:"영국 철강 산업이 새로운 혁신을 채택했다. 새로운 기술 중 가장 주요한 것은 전통적인 숯 대신 코크스로 철광석을 제련하는 것이었다. 이 방법은 더 저렴하고 더 높은 품질의 금속을 생산하여 영국의 철강 생산이 확대될 수 있었다.",grammar:"<strong>Chief among the new techniques was</strong> = 도치 구문. <strong>enabling ... to expand</strong> = 분사구문(결과)",vocab:[{w:"smelting",pos:"n",kr:"제련"},{w:"coke",pos:"n",kr:"코크스"},{w:"charcoal",pos:"n",kr:"숯"}]},
    {type:"para",label:"Para 5",role:"러다이트 운동 — 기계 파괴"},
    {num:5,en:"Factory workers had to work long hours in dangerous conditions for extremely low wages. A group of British workers who became known as 'Luddites' objected to the increased use of mechanised looms. They feared that unskilled machine operators were robbing them of their livelihood. Desperate weavers began breaking into factories and smashing textile machines.",kr:"공장 노동자들은 매우 낮은 임금으로 위험한 환경에서 장시간 일해야 했다. '러다이트'로 알려진 영국 노동자 집단은 기계화된 직기 사용 증가에 반대했다. 그들은 비숙련 기계 운영자들이 자신들의 생계를 빼앗아가고 있다고 두려워했다. 절박한 직조공들이 공장에 침입하여 섬유 기계를 파괴하기 시작했다.",grammar:"<strong>who became known as</strong> = 관계절. <strong>were robbing them of their livelihood</strong> = rob A of B 구조",vocab:[{w:"Luddite",pos:"n",kr:"러다이트(기계 파괴 운동가)"},{w:"livelihood",pos:"n",kr:"생계"}]},
    {num:6,en:"The British government responded to the uprisings by making machine-breaking punishable by death. The unrest reached its peak in April 1812. Other Luddites were arrested, and dozens were hanged or transported to Australia. By 1813, the Luddite resistance had all but vanished.",kr:"영국 정부는 기계 파괴를 사형으로 처벌할 수 있게 만들어 봉기에 대응했다. 불안은 1812년 4월에 정점에 달했다. 다른 러다이트들이 체포되었고 수십 명이 교수형에 처해지거나 호주로 추방되었다. 1813년까지 러다이트 저항은 거의 사라졌다.",grammar:"<strong>punishable by death</strong> = ~로 처벌 가능한. <strong>had all but vanished</strong> = 거의 사라졌다(all but = 거의)",vocab:[{w:"uprising",pos:"n",kr:"봉기, 반란"},{w:"all but",pos:"adv",kr:"거의"}]}
  ],

"C19_T2_P2": {
  title:"Cambridge 19 · Test 2 · Passage 2",
  topic:"Athletes and Stress",
  qTypes:["Section Matching","Sentence Completion","Two-Letter Questions"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 에마 라두카누의 윔블던 기권"},
    {num:1,en:"Not only are the physical demands greater than most people could handle, athletes also face intense psychological pressure during competition. British tennis player Emma Raducanu began having difficulty regulating her breathing and heart rate during a match, which she later attributed to 'the accumulation of the excitement and the buzz'.",kr:"신체적 요구가 대부분의 사람들이 감당할 수 있는 것보다 클 뿐만 아니라, 선수들은 대회 중 강렬한 심리적 압박에도 직면한다. 영국 테니스 선수 에마 라두카누는 경기 중 호흡과 심박수 조절에 어려움을 겪기 시작했고, 이를 나중에 '흥분과 활기의 축적'으로 귀인했다.",grammar:"<strong>Not only are the physical demands</strong> = 부정어 도치. <strong>attributed to</strong> = ~로 귀인하다",vocab:[{w:"attribute to",pos:"v",kr:"~으로 귀인하다"},{w:"regulate",pos:"v",kr:"조절하다"}]},
    {type:"para",label:"Para B",role:"스트레스의 원인 — 요구와 자원"},
    {num:2,en:"Stress is the result of an exchange between two factors: demands and resources. An athlete may feel stressed if the demands placed on them are greater than they can handle. Resources are a person's ability to cope with these demands, including the competitor's degree of confidence, how much they believe they can control the situation, and whether they're looking forward to the event.",kr:"스트레스는 두 가지 요인 간의 교환 결과이다: 요구와 자원. 선수들은 자신에게 주어진 요구가 감당할 수 있는 것보다 크다고 느낄 때 스트레스를 받을 수 있다. 자원은 경쟁자의 자신감 수준, 상황 통제 가능성에 대한 믿음, 이벤트에 대한 기대 여부 등 이러한 요구에 대처하는 사람의 능력이다.",grammar:"<strong>the demands placed on them</strong> = 과거분사 후치수식. <strong>how much they believe they can control</strong> = 간접의문문",vocab:[{w:"demand",pos:"n",kr:"요구"},{w:"cope with",pos:"v",kr:"대처하다"}]},
    {type:"para",label:"Para C",role:"도전 상태 vs. 위협 상태"},
    {num:3,en:"The positive stress response is called a challenge state. But should the person feel there are too many demands placed on them, they are more likely to experience a threat state. Research shows that challenge states lead to good performance, while threat states lead to poorer performance.",kr:"긍정적인 스트레스 반응은 도전 상태라고 불린다. 하지만 사람이 너무 많은 요구가 주어졌다고 느끼면 위협 상태를 경험할 가능성이 더 높다. 연구에 따르면 도전 상태는 좋은 수행으로, 위협 상태는 더 나쁜 수행으로 이어진다.",grammar:"<strong>should the person feel</strong> = if의 도치(조건). <strong>while threat states lead to</strong> = while = 반면에",vocab:[{w:"challenge state",pos:"n",kr:"도전 상태"},{w:"threat state",pos:"n",kr:"위협 상태"}]},
    {type:"para",label:"Para D",role:"아드레날린과 코르티솔 — 생리적 반응"},
    {num:4,en:"During a challenge state, adrenaline increases the amount of blood pumped from the heart and expands the blood vessels, allowing more energy to be delivered to the muscles and brain. During a threat state, cortisol inhibits the positive effect of adrenaline, resulting in tighter blood vessels, higher blood pressure, and a faster heart rate.",kr:"도전 상태에서 아드레날린은 심장에서 펌프되는 혈액량을 늘리고 혈관을 확장시켜 근육과 뇌에 더 많은 에너지가 전달될 수 있게 한다. 위협 상태에서는 코르티솔이 아드레날린의 긍정적 효과를 억제하여 더 좁은 혈관, 높은 혈압, 빠른 심박수가 나타난다.",grammar:"<strong>allowing more energy to be delivered</strong> = 분사구문(결과). <strong>resulting in tighter blood vessels</strong> = 분사구문(결과)",vocab:[{w:"adrenaline",pos:"n",kr:"아드레날린"},{w:"cortisol",pos:"n",kr:"코르티솔"},{w:"inhibit",pos:"v",kr:"억제하다"}]},
    {type:"para",label:"Para E",role:"불안 — 신체·정신적 증상"},
    {num:5,en:"Anxiety can increase heart rate and perspiration, cause heart palpitations, muscle tremors and shortness of breath, as well as headaches, nausea and weakness. Anxiety can also reduce concentration and self-control and cause overthinking. Negative stress responses can increase risk of heart disease and depression.",kr:"불안은 심박수와 발한을 증가시키고, 심계항진, 근육 경련, 호흡 곤란, 두통, 메스꺼움, 쇠약함을 유발할 수 있다. 불안은 또한 집중력과 자기 통제력을 감소시키고 과도한 사고를 유발할 수 있다. 부정적인 스트레스 반응은 심장병과 우울증의 위험을 증가시킬 수 있다.",grammar:"<strong>as well as</strong> = ~뿐만 아니라. <strong>can increase risk of</strong> = ~의 위험을 증가시킬 수 있다",vocab:[{w:"palpitation",pos:"n",kr:"심계항진"},{w:"perspiration",pos:"n",kr:"발한, 땀"},{w:"tremor",pos:"n",kr:"경련, 떨림"}]},
    {type:"para",label:"Para F",role:"대처 전략 — 시각화와 훈련 중 압박"},
    {num:6,en:"Psychologists can help athletes change how they see their physiological responses – such as helping them see a higher heart rate as excitement, rather than nerves. Developing psychological skills, such as visualisation, can also help decrease physiological responses to threat. Recreating competitive pressure during training can also help athletes learn how to deal with stress.",kr:"심리학자들은 선수들이 자신의 생리적 반응을 보는 방식을 바꾸는 것을 도울 수 있다 – 예를 들어 높아진 심박수를 긴장이 아닌 흥분으로 보도록 돕는 것이다. 시각화와 같은 심리적 기술을 개발하면 위협에 대한 생리적 반응을 줄이는 데도 도움이 될 수 있다. 훈련 중 경쟁적 압박을 재현하는 것도 선수들이 스트레스를 다루는 법을 배우는 데 도움이 될 수 있다.",grammar:"<strong>help athletes change how they see</strong> = help + 목적어 + 동사원형. <strong>rather than nerves</strong> = 긴장보다는",vocab:[{w:"visualisation",pos:"n",kr:"시각화"},{w:"physiological",pos:"adj",kr:"생리적인"}]}
  ],
  allVocab:[
    {w:"attribute to",pos:"v",pron:"/əˈtrɪbjuːt tuː/",kr:"~으로 귀인하다",ex:"Raducanu attributed her withdrawal to the accumulation of excitement.",syn:"ascribe to, credit to"},
    {w:"challenge state",pos:"n",pron:"",kr:"도전 상태",ex:"Challenge states lead to good performance.",syn:"positive stress response"},

    {w:"inhibit",pos:"v",pron:"/ɪnˈhɪbɪt/",kr:"억제하다",ex:"Cortisol inhibits adrenaline during threat states.",syn:"suppress, restrain"},
    {w:"palpitation",pos:"n",pron:"/ˌpælpɪˈteɪʃən/",kr:"심계항진",ex:"Anxiety can cause heart palpitations.",syn:"rapid heartbeat"},

    {w:"physiological",pos:"adj",pron:"/ˌfɪziəˈlɒdʒɪkl/",kr:"생리적인",ex:"Psychologists help athletes change how they see their physiological responses.",syn:"bodily, physical"}

    {lbl:"C",role:"상태",desc:"도전 상태(긍정) vs. 위협 상태(부정) — 수행 차이"},

  summary:"Cambridge 19 Test 2 Passage 2. 스트레스는 요구와 자원의 균형에 따라 도전(긍정) 또는 위협(부정) 상태를 유발한다. 도전 상태에서는 아드레날린이 수행을 향상시키지만, 위협 상태에서는 코르티솔이 이를 억제한다. 불안은 다양한 신체 증상과 수행 저하를 초래하며, 시각화와 훈련 중 압박 재현 등으로 극복할 수 있다."

"C19_T2_P3": {
  title:"Cambridge 19 · Test 2 · Passage 3",
  topic:"An Inquiry into the Existence of the Gifted Child",
  qTypes:["Summary Completion","YES/NO/NOT GIVEN","Multiple Choice"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 미르자하니의 사례"},
    {num:1,en:"Let us start by looking at a modern 'genius', Maryam Mirzakhani, who died at the early age of 40. She was the only woman to win the Fields Medal – the mathematical equivalent of a Nobel prize. But look closer and a different story emerges. She loved novels, not maths. As for maths, she did rather poorly at it for the first couple of years, but became interested when her elder brother told her about what he'd learned.",kr:"현대의 '천재' 마리암 미르자하니를 살펴보자. 그녀는 40세의 이른 나이에 사망했다. 그녀는 노벨상에 해당하는 수학의 필즈 메달을 수상한 유일한 여성이었다. 하지만 자세히 보면 다른 이야기가 나온다. 그녀는 수학이 아닌 소설을 좋아했다. 수학에 관해서는 처음 몇 년 동안 상당히 좋지 않은 성적을 보였지만, 오빠가 자신이 배운 것을 알려준 후 흥미를 갖게 되었다.",grammar:"<strong>who died at the early age of</strong> = 계속적 관계절. <strong>as for</strong> = ~에 관해서는",vocab:[{w:"Fields Medal",pos:"n",kr:"필즈 메달(수학 최고상)"},{w:"emerge",pos:"v",kr:"나타나다"}]},
    {type:"para",label:"Para 2",role:"미르자하니의 탐구 정신과 끈기"},
    {num:2,en:"In adult life she was curious, excited by what she did and resolute in the face of setbacks. 'Of course, the most rewarding part is the Aha moment, the excitement of discovery ... But most of the time, doing mathematics for me is like being on a long hike with no trail and no end in sight.'",kr:"성인이 되어서는 호기심이 많고 자신이 하는 일에 흥분하며 역경에 굴하지 않았다. '물론 가장 보람 있는 부분은 아하! 하는 순간, 발견의 흥분입니다... 하지만 대부분의 경우, 저에게 수학을 하는 것은 길도 없고 끝도 보이지 않는 긴 하이킹과 같습니다.'",grammar:"<strong>resolute in the face of setbacks</strong> = 역경에 굴하지 않는. <strong>with no trail and no end in sight</strong> = 무한정 계속되는",vocab:[{w:"resolute",pos:"adj",kr:"결단력 있는, 굴하지 않는"},{w:"setback",pos:"n",kr:"역경, 차질"}]},
    {type:"para",label:"Para 3",role:"천재는 예외적 존재가 아니다 — 아인슈타인 사례"},
    {num:3,en:"Most Nobel prize winners were unexceptional in childhood. Einstein was slow to talk as a baby and failed the general part of the entry test to Zurich Polytechnic – though they let him in because of high physics and maths scores. He struggled at work initially, but kept plugging away and eventually rewrote the laws of Newtonian mechanics.",kr:"대부분의 노벨상 수상자들은 어린 시절 평범했다. 아인슈타인은 아기 때 말이 늦었고 취리히 공과대학 입학시험의 일반 부분에서 떨어졌지만 물리학과 수학 점수가 높아 입학을 허가받았다. 처음에는 직장에서 힘들었지만 계속 노력하여 결국 뉴턴 역학을 다시 썼다.",grammar:"<strong>though they let him in</strong> = 삽입 양보절. <strong>kept plugging away</strong> = 계속 노력하다",vocab:[{w:"unexceptional",pos:"adj",kr:"평범한, 특별하지 않은"},{w:"plug away",pos:"v",kr:"꾸준히 노력하다"}]},
    {type:"para",label:"Para 4",role:"에릭슨의 연구 — 의도적 연습 1만 시간"},
    {num:4,en:"Prof Anders Ericsson doesn't think unique and innate talents are at the heart of performance. Deliberate practice, that stretches you every step of the way, and around 10,000 hours of it, is what produces the goods. Ericsson's memory research is particularly interesting: random students, trained in memory techniques, went on to outperform others thought to have innately superior memories.",kr:"안데르스 에릭슨 교수는 독특하고 타고난 재능이 수행의 핵심이라고 생각하지 않는다. 모든 단계에서 자신을 뻗게 하는 의도적 연습, 그리고 그것의 약 10,000시간이 성과를 만들어낸다. 에릭슨의 기억 연구는 특히 흥미롭다: 기억 기술 훈련을 받은 무작위 학생들이 타고난 우수한 기억력을 가진 것으로 여겨진 다른 학생들보다 뛰어난 성과를 보였다.",grammar:"<strong>Deliberate practice ... is what produces</strong> = 강조 구문(what절). <strong>thought to have</strong> = 과거분사 후치수식",vocab:[{w:"deliberate practice",pos:"n",kr:"의도적 연습"},{w:"innate",pos:"adj",kr:"타고난"}]},
    {type:"para",label:"Para 5",role:"블룸의 연구 — 부모의 역할"},
    {num:5,en:"Benjamin Bloom's team looked at extraordinarily high achieving people in disciplines as varied as ballet, swimming, piano, tennis, maths and neurology. He found a pattern of parents encouraging and supporting their children. Bloom's outstanding people had worked very hard and consistently at something they had become hooked on when young, and their parents all emerged as having strong work ethics.",kr:"벤자민 블룸의 팀은 발레, 수영, 피아노, 테니스, 수학, 신경학 등 다양한 분야에서 놀랍도록 뛰어난 성과를 거둔 사람들을 살펴봤다. 그는 부모가 자녀를 격려하고 지원하는 패턴을 발견했다. 블룸의 뛰어난 사람들은 어릴 때 빠져든 것에 매우 열심히 일관되게 노력했으며, 그들의 부모 모두 강한 직업 윤리를 가진 것으로 나타났다.",grammar:"<strong>as varied as</strong> = ~만큼이나 다양한. <strong>had become hooked on</strong> = 과거완료(선행)",vocab:[{w:"hooked on",pos:"adj",kr:"~에 푹 빠진"},{w:"work ethic",pos:"n",kr:"직업 윤리"}]},
    {type:"para",label:"Para 6",role:"결론 — 아인슈타인의 말"},
    {num:6,en:"Einstein once wrote: 'It is not that I am so smart, it is just that I stay with problems longer. Most people say it is the intellect which makes a great scientist. They are wrong: it is character.'",kr:"아인슈타인은 한 때 이렇게 썼다: '내가 그렇게 똑똑한 것이 아니라, 단지 문제와 더 오래 씨름할 뿐입니다. 대부분의 사람들은 위대한 과학자를 만드는 것이 지성이라고 말합니다. 그들은 틀렸습니다: 그것은 인품입니다.'",grammar:"<strong>It is not that ... it is just that</strong> = 강조 구문(it ... that). <strong>what makes a great scientist</strong> = 관계절",vocab:[{w:"intellect",pos:"n",kr:"지성"},{w:"character",pos:"n",kr:"인품, 성격"}]}

"C19_T3_P1": {
  title:"Cambridge 19 · Test 3 · Passage 1",
  topic:"Archaeologists Discover Evidence of Prehistoric Island Settlers",
  qTypes:["True / False / Not Given","Notes Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 오비 섬 최초 발굴"},
    {num:1,en:"In early April 2019, Dr Ceri Shipton became the first archaeologist to explore Obi, one of many tropical islands in Indonesia's Maluku Utara province. The research team's discoveries suggest that the prehistoric people who lived on Obi were adept on both land and sea, hunting in the dense rainforest, foraging on the seashore, and possibly even voyaging between islands.",kr:"2019년 4월 초, 세리 쉬프턴 박사가 인도네시아 말루쿠 우타라 주의 많은 열대 섬 중 하나인 오비를 처음 탐험한 고고학자가 되었다. 연구팀의 발견은 오비에 살았던 선사시대 사람들이 육지와 바다 모두에 능숙하여 울창한 열대우림에서 사냥하고, 해안에서 먹이를 찾고, 섬 사이를 항해했을 가능성이 있음을 시사한다.",grammar:"<strong>adept on both land and sea</strong> = 육지와 바다 모두에 능숙한. <strong>voyaging between islands</strong> = 섬 사이를 항해하다",vocab:[{w:"adept",pos:"adj",kr:"능숙한"},{w:"forage",pos:"v",kr:"먹이를 찾다"}]},
    {type:"para",label:"Para 2",role:"연구 목적 — 아시아에서 오스트레일리아로의 이동 경로"},
    {num:2,en:"The excavations were part of a project to learn more about how people first dispersed from mainland Asia, through the Indonesian archipelago and into the prehistoric continent that once connected Australia and New Guinea. It also seemed likely that these islands were crucial 'stepping stones' on humans' island-hopping voyages through this region millennia ago.",kr:"발굴은 사람들이 처음 아시아 대륙에서 인도네시아 군도를 거쳐 한때 오스트레일리아와 뉴기니를 연결했던 선사시대 대륙으로 어떻게 분산되었는지에 대해 더 많이 알기 위한 프로젝트의 일부였다. 또한 이 섬들이 수천 년 전 인류의 섬 건너뛰기 항해에서 중요한 '디딤돌'이었을 것으로 보였다.",grammar:"<strong>that once connected</strong> = 관계절. <strong>millennia ago</strong> = 수천 년 전",vocab:[{w:"archipelago",pos:"n",kr:"군도"},{w:"stepping stone",pos:"n",kr:"디딤돌"}]},
    {type:"para",label:"Para 3",role:"발굴 결과 — 조개 도끼와 카누 제작"},
    {num:3,en:"They found numerous artefacts, including fragments of axes, some dating to about 14,000 years ago. The earliest axes at Kelo were made using clam shells. As on Gebe, it is highly likely that Obi's axes were used in the construction of canoes, thus allowing these early peoples to maintain connections between communities on neighbouring islands.",kr:"그들은 약 14,000년 전으로 거슬러 올라가는 것들을 포함하여 수많은 유물, 도끼 조각들을 발견했다. 켈로에서 가장 오래된 도끼는 조개껍데기로 만들어졌다. 게베에서와 마찬가지로, 오비의 도끼가 카누 건조에 사용되어 초기 사람들이 인근 섬의 공동체 간 연결을 유지할 수 있었을 것으로 추정된다.",grammar:"<strong>dating to about 14,000 years ago</strong> = 현재분사 후치수식. <strong>thus allowing</strong> = 분사구문(결과)",vocab:[{w:"clam shell",pos:"n",kr:"조개껍데기"},{w:"canoe",pos:"n",kr:"카누"}]},
    {type:"para",label:"Para 4",role:"18,000년 전 — 더 큰 섬이었다"},
    {num:4,en:"The oldest cultural layers from the Kelo site provided the team with the earliest record for human occupation on Obi, dating back around 18,000 years. Sea levels were about 120 metres lower, meaning Obi was a much larger island, encompassing what is today the separate island of Bisa, as well as several other small islands nearby.",kr:"켈로 유적의 가장 오래된 문화층은 팀에 약 18,000년 전으로 거슬러 올라가는 오비의 가장 이른 인간 거주 기록을 제공했다. 해수면이 약 120미터 낮아서 오비는 훨씬 더 큰 섬으로, 오늘날 별도의 섬인 비사와 인근의 여러 작은 섬들을 포함하고 있었다.",grammar:"<strong>meaning Obi was a much larger island</strong> = 분사구문(결과). <strong>encompassing</strong> = 포함하는",vocab:[{w:"cultural layer",pos:"n",kr:"문화층"},{w:"encompass",pos:"v",kr:"포함하다"}]},
    {type:"para",label:"Para 5",role:"기후 변화로 도끼 재료 변경 — 돌 도끼 등장"},
    {num:5,en:"Roughly 11,700 years ago, as the most recent ice age ended, the climate became significantly warmer and wetter. According to the researchers, it is no coincidence that around this time the first axes crafted from stone rather than sea shells appear, likely in response to their heavy-duty use for clearing the increasingly dense rainforest.",kr:"약 11,700년 전 가장 최근의 빙하기가 끝나면서 기후가 상당히 따뜻해지고 습해졌다. 연구자들에 따르면 이 무렵 처음으로 조개껍데기보다 돌로 만든 도끼가 나타나는 것은 우연이 아니라 점점 더 빽빽해지는 열대우림을 정리하기 위한 과중한 사용에 대응한 것으로 보인다.",grammar:"<strong>it is no coincidence that</strong> = ~는 우연이 아니다. <strong>likely in response to</strong> = 아마 ~에 대응하여",vocab:[{w:"heavy-duty",pos:"adj",kr:"과중한, 중작업용"},{w:"coincidence",pos:"n",kr:"우연의 일치"}]},
    {type:"para",label:"Para 7",role:"오비 섬 간 교류 증거 — 흑요석과 구슬"},
    {num:6,en:"Shipton's team's excavation of the shelters unearthed a volcanic glass substance called obsidian, which must have been brought over from another island, as there is no known source on Obi. It also revealed particular types of beads, similar to those previously found on islands in southern Wallacea. These finds again support the idea that Obi islanders routinely travelled to other islands.",kr:"쉬프턴 팀의 대피소 발굴에서 흑요석이라는 화산유리 물질이 발굴되었는데, 오비에는 알려진 산지가 없으므로 다른 섬에서 가져온 것임이 틀림없다. 또한 남부 왈라세아 섬들에서 이전에 발견된 것과 유사한 특정 유형의 구슬들이 드러났다. 이 발견들은 오비 섬 주민들이 정기적으로 다른 섬을 여행했다는 생각을 다시 한번 지지한다.",grammar:"<strong>must have been brought over</strong> = 과거 사실에 대한 강한 추측. <strong>similar to those previously found</strong> = 비교",vocab:[{w:"obsidian",pos:"n",kr:"흑요석"},{w:"bead",pos:"n",kr:"구슬"}]}
  ],
  allVocab:[
    {w:"adept",pos:"adj",pron:"/əˈdept/",kr:"능숙한",ex:"Prehistoric people on Obi were adept on both land and sea.",syn:"skilled, proficient"},

  tfng:[

"C19_T3_P2": {
  title:"Cambridge 19 · Test 3 · Passage 2",
  topic:"The Global Importance of Wetlands",
  qTypes:["Section Matching","Sentence Completion","People Matching"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 습지의 소멸"},
    {num:1,en:"Wetlands are complex ecosystems, rich in unique plant and animal life. But according to the WWFN, half of the world's wetlands have disappeared since 1990 – converted or destroyed for commercial development, drainage schemes and the extraction of minerals and peat.",kr:"습지는 독특한 식물과 동물 생태계가 풍부한 복잡한 생태계이다. 그러나 세계자연기금(WWFN)에 따르면 1990년 이후 세계 습지의 절반이 사라졌다 – 상업 개발, 배수 계획, 광물과 이탄 채굴을 위해 전환되거나 파괴되었다.",grammar:"<strong>converted or destroyed for</strong> = 수동 분사구문. <strong>according to</strong> = ~에 따르면",vocab:[{w:"wetland",pos:"n",kr:"습지"},{w:"peat",pos:"n",kr:"이탄"}]},
    {type:"para",label:"Para B",role:"습지의 역사적·문화적 가치"},
    {num:2,en:"'Wetlands directly support the livelihoods and well-being of millions of people,' says Dr Matthew McCartney. 'In many developing countries, large numbers of people are dependent on wetland agriculture for their livelihoods.'",kr:"'습지는 수백만 명의 생계와 복지를 직접 지원합니다'라고 매튜 맥카트니 박사가 말한다. '많은 개발도상국에서 많은 사람들이 생계를 위해 습지 농업에 의존하고 있습니다.'",grammar:"<strong>dependent on</strong> = ~에 의존하는. <strong>well-being</strong> = 복지",vocab:[{w:"livelihood",pos:"n",kr:"생계"},{w:"well-being",pos:"n",kr:"복지"}]},
    {type:"para",label:"Para C",role:"기후 변화 완화 역할 — 해안 보호"},
    {num:3,en:"'Wetlands are one of the key tools in mitigating climate change across the planet,' says Pieter van Eijk, pointing to their use as buffers that protect coastal areas from sea-level rise and extreme weather events such as hurricanes and flooding.",kr:"'습지는 전 세계 기후 변화를 완화하는 주요 도구 중 하나입니다'라고 피터 반 에이크가 말하며, 해수면 상승과 허리케인, 홍수 같은 극단적인 기상 현상으로부터 해안 지역을 보호하는 완충재로서의 역할을 지적한다.",grammar:"<strong>pointing to their use as buffers</strong> = 분사구문(부대상황). <strong>protect ... from</strong> = ~으로부터 보호하다",vocab:[{w:"mitigate",pos:"v",kr:"완화하다"},{w:"buffer",pos:"n",kr:"완충재"}]},
    {type:"para",label:"Para D",role:"이탄지 파괴 — 탄소 배출"},
    {num:4,en:"When peatlands are drained for cultivation, they become net carbon emitters instead of active carbon stores. Marcel Silvius says this practice causes six per cent of all global carbon emissions. The clearance of peatlands for planting also increases the risk of forest fires.",kr:"이탄지가 경작을 위해 배수되면 활성 탄소 저장소 대신 순탄소 배출원이 된다. 마르셀 실비우스는 이 관행이 전 세계 탄소 배출량의 6%를 초래한다고 말한다. 이탄지를 정리하고 식재하면 산불의 위험도 증가한다.",grammar:"<strong>become net carbon emitters instead of</strong> = ~대신 ~이 되다. <strong>instead of active carbon stores</strong> = 대조",vocab:[{w:"peatland",pos:"n",kr:"이탄지"},{w:"carbon emitter",pos:"n",kr:"탄소 배출원"}]},
    {type:"para",label:"Para E",role:"이탄지 파괴 메커니즘 — 침하"},
    {num:5,en:"Once the water has drained away, bacteria and fungi break down the carbon in the peat. Meanwhile, the remainder of the solid matter starts to move downwards, in a process known as subsidence. 'In the tropics, peat subsides at about four centimetres a year, so within half a century, very large landscapes will become flooded as the peat drops below water level,' says Silvius.",kr:"물이 빠지면 박테리아와 곰팡이가 이탄의 탄소를 분해한다. 한편, 고형 물질의 나머지는 침하라는 과정에서 아래로 이동하기 시작한다. '열대 지방에서 이탄은 연간 약 4센티미터 침하하므로 반세기 내에 이탄이 수위 아래로 내려가면서 매우 넓은 지역이 침수될 것입니다'라고 실비우스가 말한다.",grammar:"<strong>in a process known as subsidence</strong> = 과거분사 후치수식. <strong>as the peat drops below</strong> = 이유/시간 접속사",vocab:[{w:"subsidence",pos:"n",kr:"침하, 지반 침하"},{w:"fungi",pos:"n",kr:"곰팡이"}]},
    {type:"para",label:"Para G",role:"지역 주민 참여의 중요성"},
    {num:6,en:"'The idea is that people in a developing country will only protect wetlands if they value and profit from them,' says McCartney. 'For sustainability, it is essential that local people are involved in wetland planning and decision making and have clear rights to use wetlands.'",kr:"'아이디어는 개발도상국 사람들이 습지를 가치 있게 여기고 이익을 얻을 때만 보호할 것이라는 것입니다'라고 맥카트니가 말한다. '지속 가능성을 위해 지역 주민들이 습지 계획 및 의사결정에 참여하고 습지 사용에 대한 명확한 권리를 가지는 것이 필수적입니다.'",grammar:"<strong>will only protect if</strong> = 조건 + 미래. <strong>it is essential that</strong> = 가주어-진주어",vocab:[{w:"sustainability",pos:"n",kr:"지속 가능성"},{w:"decision making",pos:"n",kr:"의사결정"}]}
  ],

  sentences:[
    {type:"para",label:"Para A",role:"도입 — CRISPR로 야생 토마토 재가축화"},
    {num:1,en:"It took at least 3,000 years for humans to learn how to domesticate the wild tomato and cultivate it for food. Now two separate teams in Brazil and China have done it all over again in less than three years.",kr:"인간이 야생 토마토를 가축화하고 식용으로 재배하는 법을 배우는 데 최소 3,000년이 걸렸다. 이제 브라질과 중국의 두 개별 팀이 3년 이내에 그것을 다시 해냈다.",grammar:"<strong>It took ... for humans to</strong> = 가주어-진주어 + 의미상 주어. <strong>all over again</strong> = 처음부터 다시",vocab:[{w:"domesticate",pos:"v",kr:"가축화하다, 길들이다"},{w:"cultivate",pos:"v",kr:"재배하다, 경작하다"}]},
    {num:2,en:"And they have done it better in some ways, as the re-domesticated tomatoes are more nutritious than the ones we eat at present.",kr:"그리고 어떤 면에서는 그것을 더 잘 해냈는데, 재가축화된 토마토가 현재 우리가 먹는 것보다 더 영양가가 높기 때문이다.",grammar:"<strong>as</strong> = 이유의 접속사. <strong>re-domesticated</strong> = 접두사 re-(다시)",vocab:[{w:"nutritious",pos:"adj",kr:"영양가 있는"},{w:"re-domesticated",pos:"adj",kr:"재가축화된"}]},
    {num:3,en:"This approach relies on the revolutionary CRISPR genome editing technique, in which changes are deliberately made to the DNA of a living cell, allowing genetic material to be added, removed or altered.",kr:"이 접근법은 혁명적인 CRISPR 유전체 편집 기술에 의존하는데, 이 기술에서는 살아있는 세포의 DNA에 의도적으로 변화를 가하여 유전 물질을 추가, 제거 또는 변형할 수 있다.",grammar:"<strong>in which changes are deliberately made</strong> = 전치사+관계대명사. <strong>allowing ... to be added</strong> = 분사구문",vocab:[{w:"CRISPR",pos:"n",kr:"크리스퍼(유전자 편집 기술)"},{w:"genome editing",pos:"n",kr:"유전체 편집"},{w:"deliberately",pos:"adv",kr:"의도적으로"}]},
    {num:4,en:"This fast-track domestication could help make the world's food supply healthier and far more resistant to diseases, such as the rust fungus devastating wheat crops.",kr:"이 고속 가축화는 세계 식량 공급을 더 건강하게 하고 밀 작물을 황폐화시키는 녹병균과 같은 질병에 훨씬 더 강하게 만드는 데 도움이 될 수 있다.",grammar:"<strong>fast-track</strong> = 고속의, 신속한. <strong>devastate</strong> = 황폐화시키다",vocab:[{w:"fast-track",pos:"adj",kr:"고속의, 신속한"},{w:"rust fungus",pos:"n",kr:"녹병균"},{w:"devastate",pos:"v",kr:"황폐화시키다"}]},
    {type:"para",label:"Para B",role:"야생 토마토의 역사 — 유전적 다양성 손실"},
    {num:5,en:"Wild tomatoes, which are native to the Andes region in South America, produce pea-sized fruits. Over many generations, peoples such as the Aztecs and Incas transformed the plant by selecting and breeding plants with mutations in their genetic structure.",kr:"남아메리카 안데스 지역이 원산지인 야생 토마토는 완두콩 크기의 열매를 맺는다. 수많은 세대에 걸쳐 아즈텍과 잉카 같은 민족들이 유전 구조에 돌연변이가 있는 식물을 선별하고 번식시켜 식물을 변형시켰다.",grammar:"<strong>which are native to</strong> = 원산지인(계속적 관계절). <strong>Over many generations</strong> = 수많은 세대에 걸쳐",vocab:[{w:"mutation",pos:"n",kr:"돌연변이"},{w:"breed",pos:"v",kr:"번식시키다, 교배하다"}]},
    {num:6,en:"But every time a single plant with a mutation is taken from a larger population for breeding, much genetic diversity is lost. For instance, the tomato strains grown for supermarkets have lost much of their flavour.",kr:"하지만 돌연변이가 있는 단일 식물이 번식을 위해 더 큰 집단에서 분리될 때마다 많은 유전적 다양성이 손실된다. 예를 들어, 슈퍼마켓을 위해 재배되는 토마토 품종들은 풍미의 상당 부분을 잃었다.",grammar:"<strong>every time</strong> = ~할 때마다. <strong>is lost</strong> = 수동태 현재",vocab:[{w:"genetic diversity",pos:"n",kr:"유전적 다양성"},{w:"strain",pos:"n",kr:"품종, 계통"}]},
    {type:"para",label:"Para C",role:"브라질·중국팀의 성과 — 라이코펜·내병성"},
    {num:7,en:"Kudla's team made six changes altogether. For instance, they tripled the size of fruit by editing a gene called FRUIT WEIGHT, and increased the number of tomatoes per truss by editing another called MULTIFLORA.",kr:"쿠들라 팀은 총 여섯 가지 변화를 만들었다. 예를 들어, FRUIT WEIGHT라는 유전자를 편집하여 과일 크기를 세 배로 늘리고, MULTIFLORA라는 유전자를 편집하여 송이당 토마토 수를 늘렸다.",grammar:"<strong>tripled the size</strong> = 세 배로 늘리다. <strong>altogether</strong> = 총합하여",vocab:[{w:"truss",pos:"n",kr:"과일 송이, 묶음"},{w:"triple",pos:"v",kr:"세 배로 늘리다"}]},
    {num:8,en:"While the historical domestication of tomatoes reduced levels of the red pigment lycopene, the team in Brazil managed to boost it instead. The wild tomato has twice as much lycopene as cultivated ones; the newly domesticated one has five times as much.",kr:"역사적인 토마토 가축화가 붉은 색소 리코펜 수준을 줄인 반면, 브라질 팀은 오히려 이를 높이는 데 성공했다. 야생 토마토는 재배 토마토보다 리코펜이 두 배 많다; 새로 가축화된 것은 다섯 배나 많다.",grammar:"<strong>While</strong> = 대조의 접속사. <strong>as much ... as</strong> = 동등 비교",vocab:[{w:"lycopene",pos:"n",kr:"리코펜(붉은 색소)"},{w:"pigment",pos:"n",kr:"색소"}]},
    {num:9,en:"The team in China created a strain resistant to a common disease called bacterial spot race, which can devastate yields. They also created another strain that is more salt tolerant – and has higher levels of vitamin C.",kr:"중국 팀은 수확량을 황폐화시킬 수 있는 '박테리아 반점병'이라는 일반적인 질병에 내성이 있는 품종을 만들었다. 또한 염분에 더 잘 견디고 비타민 C 수준이 더 높은 또 다른 품종도 만들었다.",grammar:"<strong>resistant to</strong> = ~에 내성이 있는. <strong>salt tolerant</strong> = 염분 내성의",vocab:[{w:"resistant to",pos:"adj",kr:"~에 내성이 있는"},{w:"salt tolerant",pos:"adj",kr:"염분 내성의"}]},
    {type:"para",label:"Para D",role:"골든베리 — 야생 식물 최초 가축화"},
    {num:10,en:"Joyce Van Eck decided to use the same approach to domesticate the groundcherry or goldenberry for the first time. Groundcherries are already sold to a limited extent in the US but they are hard to produce because the plant has a sprawling growth habit and the small fruits fall off the branches when ripe.",kr:"조이스 반 에크는 꽈리 또는 골든베리를 처음으로 가축화하기 위해 같은 접근법을 사용하기로 결정했다. 꽈리는 미국에서 이미 제한적으로 판매되고 있지만, 식물이 넓게 퍼지는 성장 습성을 가지고 있고 작은 열매가 익으면 가지에서 떨어져 생산하기 어렵다.",grammar:"<strong>to a limited extent</strong> = 제한적인 정도로. <strong>sprawling growth habit</strong> = 넓게 퍼지는 성장 습성",vocab:[{w:"groundcherry",pos:"n",kr:"꽈리, 골든베리"},{w:"sprawling",pos:"adj",kr:"넓게 퍼지는"}]},
    {type:"para",label:"Para E",role:"미래 가능성 — 가뭄·열 내성 작물 개발"},
    {num:11,en:"This approach could boost the use of many obscure plants. The three teams already have their eye on other plants that could be 'catapulted into the mainstream', including foxtail, oat-grass and cowpea.",kr:"이 접근법은 많은 알려지지 않은 식물의 사용을 촉진할 수 있다. 세 팀은 이미 청모, 귀리풀, 동부 등 '주류로 급부상'할 수 있는 다른 식물들을 주목하고 있다.",grammar:"<strong>have their eye on</strong> = ~을 주목하다. <strong>catapulted into the mainstream</strong> = 주류로 급부상하다",vocab:[{w:"obscure",pos:"adj",kr:"잘 알려지지 않은"},{w:"catapult",pos:"v",kr:"급부상시키다"},{w:"mainstream",pos:"n",kr:"주류"}]},
    {num:12,en:"By choosing wild plants that are drought or heat tolerant, we could create crops that will thrive even as the planet warms.",kr:"가뭄이나 열에 강한 야생 식물을 선택함으로써, 지구가 온난화되는 동안에도 번성할 수 있는 작물을 만들 수 있다.",grammar:"<strong>By choosing</strong> = 분사구문(수단). <strong>even as the planet warms</strong> = even as = ~하는 중에도",vocab:[{w:"drought tolerant",pos:"adj",kr:"가뭄 내성의"},{w:"thrive",pos:"v",kr:"번성하다, 번창하다"}]}

"C17_T2_P3": {
  title:"Cambridge 17 · Test 2 · Passage 3",
  topic:"Insight or Evolution? Origins of Creative Behaviour",
  qTypes:["Multiple Choice","YES/NO/NOT GIVEN","Summary Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 천재 신화와 통념"},
    {num:1,en:"Scientific discovery is popularly believed to result from the sheer genius of such intellectual stars as naturalist Charles Darwin and theoretical physicist Albert Einstein. Our view of such unique contributions often disregards the person's prior experience and the efforts of their lesser-known predecessors.",kr:"과학적 발견은 흔히 찰스 다윈이나 알버트 아인슈타인 같은 지적 스타들의 순수한 천재성에서 비롯된다고 널리 믿어진다. 그러한 독특한 기여에 대한 우리의 시각은 종종 그 사람의 사전 경험과 덜 알려진 선구자들의 노력을 무시한다.",grammar:"<strong>is popularly believed to result from</strong> = 수동 추측. <strong>disregards</strong> = 무시하다, 간과하다",vocab:[{w:"sheer genius",pos:"n",kr:"순수한 천재성"},{w:"predecessor",pos:"n",kr:"선구자, 전임자"},{w:"disregard",pos:"v",kr:"무시하다, 간과하다"}]},
    {num:2,en:"Conventional wisdom also places great weight on insight in promoting breakthrough scientific achievements, as if ideas spontaneously pop into someone's head – fully formed and functional.",kr:"통념은 또한 마치 아이디어가 누군가의 머릿속에 완전히 형성되고 기능적인 상태로 자연스럽게 떠오르는 것처럼, 획기적인 과학적 성취를 촉진하는 데 있어 통찰력에 큰 비중을 둔다.",grammar:"<strong>places great weight on</strong> = ~에 큰 비중을 두다. <strong>as if</strong> = 마치 ~처럼(가정법)",vocab:[{w:"conventional wisdom",pos:"n",kr:"통념, 통설"},{w:"spontaneously",pos:"adv",kr:"자연스럽게, 즉흥적으로"},{w:"breakthrough",pos:"adj",kr:"획기적인"}]},
    {type:"para",label:"Para 2",role:"진화론적 관점 — 과학은 시행착오"},
    {num:3,en:"Setting aside such greats as Darwin and Einstein, we suggest that innovation is more a process of trial and error, where two steps forward may sometimes come with one step back, as well as one or more stops to the right or left.",kr:"다윈이나 아인슈타인 같은 위인들은 제쳐두고, 우리는 혁신이 두 걸음 앞으로 나아갈 때 때로는 한 걸음 뒤로 물러나는 것처럼, 시행착오의 과정이라고 제안한다.",grammar:"<strong>Setting aside</strong> = 제쳐두고(분사구문). <strong>trial and error</strong> = 시행착오",vocab:[{w:"trial and error",pos:"n",kr:"시행착오"},{w:"innovation",pos:"n",kr:"혁신"}]},
    {num:4,en:"This evolutionary view of human innovation undermines the notion of creative genius and recognizes the cumulative nature of scientific progress.",kr:"인간 혁신의 이 진화론적 관점은 창의적 천재성의 개념을 약화시키고 과학적 진보의 누적적 특성을 인정한다.",grammar:"<strong>undermines</strong> = 약화시키다. <strong>cumulative nature</strong> = 누적적 특성",vocab:[{w:"undermine",pos:"v",kr:"약화시키다"},{w:"cumulative",pos:"adj",kr:"누적적인"}]},
    {type:"para",label:"Para 3",role:"존 니콜슨 — 틀린 이론이 보어에게 영감"},
    {num:5,en:"Consider one unheralded scientist: John Nicholson, a mathematical physicist working in the 1910s who postulated the existence of 'proto-elements' in outer space.",kr:"주목받지 못한 과학자 존 니콜슨을 생각해 보자: 1910년대에 활동한 수리물리학자로, 우주 공간에 '원시 원소'의 존재를 가정했다.",grammar:"<strong>unheralded</strong> = 주목받지 못한. <strong>postulated</strong> = 가정하다, 상정하다",vocab:[{w:"unheralded",pos:"adj",kr:"주목받지 못한"},{w:"postulate",pos:"v",kr:"가정하다, 상정하다"},{w:"proto-element",pos:"n",kr:"원시 원소"}]},
    {num:6,en:"Yet, amid his often fanciful theories and wild speculations, Nicholson also proposed a novel theory about the structure of atoms. Niels Bohr, the Nobel prize-winning father of modern atomic theory, jumped off from this interesting idea to conceive his now-famous model of the atom.",kr:"그러나 그의 종종 공상적인 이론과 거친 추측들 속에서 니콜슨은 원자 구조에 관한 새로운 이론도 제안했다. 현대 원자 이론의 아버지인 노벨상 수상자 닐스 보어는 이 흥미로운 아이디어에서 출발하여 현재 유명한 원자 모델을 구상했다.",grammar:"<strong>amid</strong> = ~속에서. <strong>jumped off from</strong> = ~에서 출발하다",vocab:[{w:"fanciful",pos:"adj",kr:"공상적인"},{w:"conceive",pos:"v",kr:"구상하다, 착상하다"}]},
    {type:"para",label:"Para 4",role:"진화론 유추 — 아이디어의 돌연변이"},
    {num:7,en:"We propose that science is constantly evolving, much as species of animals do. In biological systems, organisms may display new characteristics that result from random genetic mutations. In the same way, random, arbitrary or accidental mutations of ideas may help pave the way for advances in science.",kr:"우리는 과학이 동물 종처럼 끊임없이 진화하고 있다고 제안한다. 생물학적 시스템에서 생물체는 무작위 유전자 돌연변이로 인한 새로운 특성을 보일 수 있다. 마찬가지로, 아이디어의 무작위적이고 임의적이거나 우연한 돌연변이가 과학의 발전을 위한 길을 닦는 데 도움이 될 수 있다.",grammar:"<strong>much as</strong> = ~처럼. <strong>pave the way for</strong> = ~을 위한 길을 닦다",vocab:[{w:"arbitrary",pos:"adj",kr:"임의적인"},{w:"pave the way for",pos:"phr",kr:"~을 위한 길을 닦다"}]},
    {type:"para",label:"Para 5",role:"경마 등자 — 사고로 인한 혁신"},
    {num:8,en:"The so-called 'acey-deucy' stirrup placement is believed to confer important speed advantages when turning on oval tracks. It was developed by a relatively unknown jockey named Jackie Westrope. He suffered a leg injury, which left him unable to fully bend his left knee. His modification just happened to coincide with enhanced left-hand turning performance.",kr:"소위 '에이시-듀시' 등자 배치는 타원형 트랙에서 회전할 때 중요한 속도 이점을 제공한다고 여겨진다. 비교적 잘 알려지지 않은 재키 웨스트롭이라는 기수가 개발했다. 다리 부상을 입어 왼쪽 무릎을 완전히 구부리지 못하게 된 그의 수정이 우연히 왼쪽 회전 성능 향상과 일치했다.",grammar:"<strong>confer ... advantages</strong> = 이점을 부여하다. <strong>happened to coincide with</strong> = 우연히 ~와 일치하다",vocab:[{w:"stirrup",pos:"n",kr:"등자(말 발걸이)"},{w:"confer",pos:"v",kr:"부여하다, 수여하다"},{w:"coincide with",pos:"v",kr:"~와 일치하다"}]},
    {type:"para",label:"Para 6",role:"포스트잇 — 행복한 사고"},
    {num:9,en:"In the early 1970s, Spencer Silver had a product – a glue which was only slightly sticky – and no use for it, while his colleague Art Fry was trying to figure out how to affix temporary bookmarks in his hymn book without damaging its pages. The solution to both these problems was invention of the brilliantly simple yet phenomenally successful Post-It note.",kr:"1970년대 초, 스펜서 실버는 약간만 끈적이는 접착제를 가지고 있었지만 용도가 없었고, 동료 아트 프라이는 찬송가 책 페이지를 손상시키지 않고 임시 책갈피를 붙이는 방법을 알아내려 하고 있었다. 이 두 문제의 해결책은 눈부시게 단순하지만 놀랍도록 성공적인 포스트잇 메모지의 발명이었다.",grammar:"<strong>figure out how to</strong> = ~하는 방법을 알아내다. <strong>phenomenally successful</strong> = 놀랍도록 성공적인",vocab:[{w:"affix",pos:"v",kr:"붙이다, 고정시키다"},{w:"phenomenally",pos:"adv",kr:"놀랍도록"},{w:"serendipity",pos:"n",kr:"행복한 우연"}]},
    {type:"para",label:"Para 7",role:"효과의 법칙 — 다윈의 진화론과 유사"},
    {num:10,en:"The Law of Effect was advanced by psychologist Edward Thorndike in 1898, some 40 years after Charles Darwin published his groundbreaking work on biological evolution. This simple law holds that organisms tend to repeat successful behaviors and to refrain from performing unsuccessful ones.",kr:"효과의 법칙은 찰스 다윈이 생물학적 진화에 관한 획기적인 연구를 발표한 지 약 40년 후인 1898년에 심리학자 에드워드 손다이크가 발전시켰다. 이 간단한 법칙은 생물체가 성공적인 행동을 반복하고 실패한 행동을 자제하는 경향이 있다고 주장한다.",grammar:"<strong>some 40 years after</strong> = 약 40년 후에. <strong>refrain from</strong> = ~을 자제하다",vocab:[{w:"groundbreaking",pos:"adj",kr:"획기적인"},{w:"refrain from",pos:"v",kr:"~을 자제하다"},{w:"Law of Effect",pos:"n",kr:"효과의 법칙"}]}
  ],

    {qNum:33,stmt:"The Law of Effect was discovered at a time when psychologists were seeking a scientific reason why creativity occurs.",correct:"NOT GIVEN",mine:"",evPara:"Para 7",ev:"The Law of Effect was advanced by psychologist Edward Thorndike in 1898.",why:"언제 발표됐는지는 알지만, 당시 심리학자들이 그런 목적으로 연구하고 있었다는 맥락은 없다.",trap:""},

"C17_T3_P1": {
  title:"Cambridge 17 · Test 3 · Passage 1",
  topic:"The Thylacine",
  qTypes:["Notes Completion","True / False / Not Given"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 털라신의 외모와 특징"},
    {num:1,en:"The thylacine was a marsupial that bore a superficial resemblance to a dog. Its most distinguishing feature was the 13–19 dark brown stripes over its back, beginning at the rear of the body and extending onto the tail.",kr:"털라신은 개와 피상적으로 닮은 유대류였다. 가장 두드러진 특징은 등에 있는 13~19개의 진한 갈색 줄무늬로, 몸의 뒷부분에서 시작하여 꼬리까지 이어졌다.",grammar:"<strong>bore a superficial resemblance to</strong> = ~와 피상적으로 닮았다. <strong>extending onto</strong> = ~까지 이어지는(현재분사)",vocab:[{w:"marsupial",pos:"n",kr:"유대류"},{w:"superficial resemblance",pos:"n",kr:"피상적인 유사성"},{w:"distinguishing feature",pos:"n",kr:"구별되는 특징"}]},
    {num:2,en:"The thylacine appeared to occupy most types of terrain except dense rainforest, with open eucalyptus forest thought to be its prime habitat.",kr:"털라신은 울창한 열대우림을 제외한 대부분의 지형을 차지하는 것으로 보였으며, 개방된 유칼립투스 숲이 주요 서식지로 여겨졌다.",grammar:"<strong>appeared to occupy</strong> = ~를 차지하는 것으로 보였다. <strong>thought to be</strong> = ~로 여겨지는",vocab:[{w:"terrain",pos:"n",kr:"지형, 지대"},{w:"eucalyptus",pos:"n",kr:"유칼립투스"},{w:"prime habitat",pos:"n",kr:"주요 서식지"}]},
    {type:"para",label:"Para 2",role:"식습관과 사냥 방식"},
    {num:3,en:"In terms of feeding, it was exclusively carnivorous, and its stomach was muscular with an ability to distend so that it could eat large amounts of food at one time.",kr:"먹이 측면에서 털라신은 완전한 육식동물이었으며, 위는 근육질이고 한 번에 많은 양의 음식을 먹을 수 있도록 팽창할 수 있었다.",grammar:"<strong>In terms of</strong> = ~의 측면에서. <strong>with an ability to distend</strong> = 팽창 능력을 가진(독립분사구문)",vocab:[{w:"carnivorous",pos:"adj",kr:"육식의"},{w:"distend",pos:"v",kr:"팽창하다, 부풀다"}]},
    {num:4,en:"The thylacine was not a fast runner and probably caught its prey by exhausting it during a long pursuit. During long-distance chases, thylacines were likely to have relied more on scent than any other sense.",kr:"털라신은 빠른 달리기 선수가 아니었으며, 긴 추격 중에 먹이를 지치게 하여 잡았을 것이다. 장거리 추격 중에 털라신은 다른 어떤 감각보다 후각에 더 의존했을 것이다.",grammar:"<strong>were likely to have relied</strong> = 과거 추측(likely + 완료부정사). <strong>more on scent than any other</strong> = 최상급 우회 표현",vocab:[{w:"exhaust",pos:"v",kr:"지치게 하다"},{w:"pursuit",pos:"n",kr:"추격"},{w:"scent",pos:"n",kr:"후각, 냄새"}]},
    {type:"para",label:"Para 3",role:"번식 — 유대류의 육아낭"},
    {num:5,en:"The thylacine had an extended breeding season from winter to spring. The thylacine, like all marsupials, was tiny and hairless when born. Newborns crawled into the pouch on the belly of their mother, and attached themselves to one of the four teats, remaining there for up to three months.",kr:"털라신은 겨울에서 봄까지 긴 번식 시기를 가졌다. 모든 유대류처럼 털라신은 태어날 때 아주 작고 털이 없었다. 신생아들은 어미의 배에 있는 육아낭 안으로 기어 들어가 네 개의 젖꼭지 중 하나에 달라붙어 최대 3개월간 거기에 머물렀다.",grammar:"<strong>like all marsupials</strong> = 삽입 비교구. <strong>remaining there for up to three months</strong> = 분사구문(결과)",vocab:[{w:"pouch",pos:"n",kr:"육아낭"},{w:"teat",pos:"n",kr:"젖꼭지"},{w:"newborn",pos:"n",kr:"신생아"}]},
    {type:"para",label:"Para 4",role:"본토 멸종 — 3,100년 전 화석"},
    {num:6,en:"The most recent, well-dated occurrence of a thylacine on the mainland is a carbon-dated fossil from Murray Cave in Western Australia, which is around 3,100 years old.",kr:"본토에서 털라신의 가장 최근의 잘 연대가 측정된 흔적은 서호주 머레이 동굴에서 발견된 탄소 연대 측정 화석으로, 약 3,100년 된 것이다.",grammar:"<strong>well-dated occurrence</strong> = 연대가 잘 측정된 발생. <strong>carbon-dated fossil</strong> = 탄소 연대 측정 화석",vocab:[{w:"carbon-dated",pos:"adj",kr:"탄소 연대 측정된"},{w:"fossil",pos:"n",kr:"화석"}]},
    {type:"para",label:"Para 5",role:"태즈매니아 멸종 원인"},
    {num:7,en:"The dramatic decline of the thylacine in Tasmania, which began in the 1830s and continued for a century, is generally attributed to the relentless efforts of sheep farmers and bounty hunters with shotguns.",kr:"1830년대에 시작하여 한 세기 동안 계속된 태즈매니아에서 털라신의 극적인 감소는 일반적으로 총을 든 양 농가와 현상금 사냥꾼들의 끊임없는 노력에 기인한다.",grammar:"<strong>is generally attributed to</strong> = 일반적으로 ~에 기인한다. <strong>relentless</strong> = 끊임없는, 가차 없는",vocab:[{w:"relentless",pos:"adj",kr:"끊임없는, 가차 없는"},{w:"bounty hunter",pos:"n",kr:"현상금 사냥꾼"}]},
    {num:8,en:"It is likely that various other factors also contributed to the decline and eventual extinction of the species. These include competition with wild dogs introduced by European settlers, loss of habitat along with the disappearance of prey species.",kr:"다양한 다른 요인들도 종의 감소와 최종 멸종에 기여했을 가능성이 높다. 여기에는 유럽 정착민들이 도입한 야생 개와의 경쟁, 먹이 종의 감소와 함께 서식지 손실이 포함된다.",grammar:"<strong>It is likely that</strong> = 가주어-진주어(추측). <strong>along with</strong> = ~와 함께",vocab:[{w:"extinction",pos:"n",kr:"멸종"},{w:"prey species",pos:"n",kr:"먹이 종"}]},
    {type:"para",label:"Para 6",role:"존 굴드의 예언과 동물원 번식 실패"},
    {num:9,en:"There was only one successful attempt to breed a thylacine in captivity, at Melbourne Zoo in 1899. This was despite the large numbers that went through some zoos.",kr:"1899년 멜버른 동물원에서 억류 상태에서 털라신을 번식시키려는 단 하나의 성공적인 시도가 있었다. 이는 일부 동물원을 거쳐간 많은 수에도 불구한 것이었다.",grammar:"<strong>in captivity</strong> = 억류 상태에서. <strong>despite the large numbers</strong> = ~에도 불구하고",vocab:[{w:"captivity",pos:"n",kr:"억류 상태, 포획 상태"},{w:"breed in captivity",pos:"phr",kr:"억류 상태에서 번식시키다"}]},
    {type:"para",label:"Para 7",role:"법적 보호와 마지막 개체"},
    {num:10,en:"It was not until 1929, with the species on the very edge of extinction, that Tasmania's Animals and Birds Protection Board passed a motion protecting thylacines only for the month of December.",kr:"1929년이 되어서야, 종이 멸종 직전에 처한 상황에서, 태즈매니아 동물조류보호위원회가 12월 한 달간만 털라신을 보호하는 동의를 통과시켰다.",grammar:"<strong>It was not until ... that</strong> = 강조 구문(~하고서야 비로소). <strong>on the very edge of</strong> = 바로 ~직전에",vocab:[{w:"on the very edge of",pos:"phr",kr:"~의 바로 직전에"},{w:"pass a motion",pos:"phr",kr:"동의를 통과시키다"}]},
    {num:11,en:"The last known wild thylacine to be killed was shot by a farmer in the north-east of Tasmania in 1930, leaving just captive specimens. Official protection of the species by the Tasmanian government was introduced in July 1936, 59 days before the last known individual died in Hobart Zoo on 7th September, 1936.",kr:"마지막으로 알려진 야생 털라신은 1930년 태즈매니아 북동부에서 농부에게 총살당했으며, 이로써 억류 개체들만 남게 되었다. 태즈매니아 정부의 공식 보호는 1936년 7월에 시행되었는데, 이는 마지막으로 알려진 개체가 1936년 9월 7일 호바트 동물원에서 죽기 59일 전이었다.",grammar:"<strong>leaving just captive specimens</strong> = 분사구문(결과). <strong>was introduced</strong> = 도입되었다(수동)",vocab:[{w:"captive specimen",pos:"n",kr:"억류 개체"},{w:"official protection",pos:"n",kr:"공식 보호"}]}
  ],

    {qNum:8,stmt:"John Gould's prediction about the thylacine surprised some biologists.",correct:"NOT GIVEN",mine:"",evPara:"Para 6",ev:"The famous naturalist John Gould foresaw the thylacine's demise.",why:"굴드의 예언 내용은 있지만, 생물학자들이 놀랐다는 정보는 없다.",trap:""},

    {qNum:10,stmt:"T. T. Flynn's proposal to rehome captive thylacines on an island proved to be impractical.",correct:"NOT GIVEN",mine:"",evPara:"Para 7",ev:"Flynn suggested that some should be captured and placed on a small island.",why:"섬에 이주시키자는 제안을 했다는 것은 알지만, 그것이 비현실적이었는지에 대한 정보는 없다.",trap:""},

    {qNum:13,stmt:"Attempts to find living thylacines are now rarely made.",correct:"NOT GIVEN",mine:"",evPara:"Para 8",ev:"There have been numerous expeditions and searches for the thylacine over the years.",why:"수많은 탐사가 있었다는 것은 알지만, 현재 탐사 빈도에 대한 정보는 없다.",trap:""}

"C17_T3_P2": {
  title:"Cambridge 17 · Test 3 · Passage 2",
  topic:"Palm Oil",
  qTypes:["Section Matching","Two-Letter Questions","Sentence Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 팜유 세계 최대 소비 식물성 기름"},
    {num:1,en:"Palm oil is an edible oil derived from the fruit of the African oil palm tree, and is currently the most consumed vegetable oil in the world.",kr:"팜유는 아프리카 기름야자 나무의 열매에서 추출한 식용 기름으로, 현재 세계에서 가장 많이 소비되는 식물성 기름이다.",grammar:"<strong>derived from</strong> = ~에서 추출된(과거분사 후치수식). <strong>the most consumed</strong> = 최상급",vocab:[{w:"edible",pos:"adj",kr:"식용의"},{w:"derived from",pos:"phr",kr:"~에서 추출된"}]},
    {num:2,en:"One advantage of palm oil for manufacturers is that it stays solid even when not refrigerated.",kr:"제조업자들에게 팜유의 한 가지 장점은 냉장 보관하지 않아도 고체 상태를 유지한다는 것이다.",grammar:"<strong>stays solid</strong> = 고체 상태를 유지하다. <strong>even when not refrigerated</strong> = 냉장하지 않아도",vocab:[{w:"solid",pos:"adj",kr:"고체의, 고형의"},{w:"refrigerate",pos:"v",kr:"냉장하다"}]},
    {type:"para",label:"Para B",role:"팜유 산업의 급속한 팽창"},
    {num:3,en:"Between 1990 and 2012, the global land area devoted to growing oil palm trees grew from 6 to 17 million hectares, and production increased from 2 million tonnes to around 60 million tonnes annually.",kr:"1990년에서 2012년 사이, 기름야자 나무 재배에 할당된 전 세계 토지 면적은 600만 헥타르에서 1,700만 헥타르로 증가했고, 생산량은 연간 200만 톤에서 약 6,000만 톤으로 늘었다.",grammar:"<strong>devoted to</strong> = ~에 할당된. <strong>from A to B</strong> = A에서 B로",vocab:[{w:"hectare",pos:"n",kr:"헥타르(면적 단위)"},{w:"annually",pos:"adv",kr:"연간"}]},
    {type:"para",label:"Para C",role:"환경 피해 — 멸종위기종 서식지 파괴"},
    {num:4,en:"Endangered species – most famously the Sumatran orangutan, but also rhinos, elephants, tigers, and numerous other fauna – have suffered from the unstoppable spread of oil palm plantations.",kr:"멸종위기종들 – 가장 유명한 수마트라 오랑우탄 외에도 코뿔소, 코끼리, 호랑이 및 수많은 다른 동물들 – 이 기름야자 농장의 막을 수 없는 확산으로 피해를 입었다.",grammar:"<strong>most famously</strong> = 가장 유명하게는. <strong>have suffered from</strong> = 현재완료(~로 피해를 입었다)",vocab:[{w:"endangered species",pos:"n",kr:"멸종위기종"},{w:"fauna",pos:"n",kr:"동물군"},{w:"plantation",pos:"n",kr:"농장, 플랜테이션"}]},
    {num:5,en:"The spread of oil palm plantations has led to significant deforestation in some countries, particularly Malaysia and Indonesia, which together account for 85 percent of global production.",kr:"기름야자 농장의 확산은 일부 국가, 특히 말레이시아와 인도네시아에서 상당한 산림 벌채로 이어졌는데, 이 두 나라가 전 세계 생산량의 85%를 차지한다.",grammar:"<strong>has led to</strong> = 현재완료(~로 이어졌다). <strong>account for</strong> = ~을 차지하다",vocab:[{w:"deforestation",pos:"n",kr:"산림 벌채"},{w:"account for",pos:"v",kr:"~을 차지하다"}]},
    {type:"para",label:"Para D",role:"팜유의 장점 — 생산성과 경쟁 효율"},
    {num:6,en:"Oil palm trees are remarkably productive. They produce more oil per hectare than any comparable crop, and the oil has a longer shelf-life than most alternatives.",kr:"기름야자 나무는 놀랍도록 생산적이다. 비슷한 작물보다 헥타르당 더 많은 기름을 생산하며, 오일은 대부분의 대안보다 더 긴 유통기한을 가진다.",grammar:"<strong>more ... than any comparable</strong> = 최상급 우회 표현. <strong>shelf-life</strong> = 유통기한",vocab:[{w:"shelf-life",pos:"n",kr:"유통기한"},{w:"productive",pos:"adj",kr:"생산적인"}]},
    {type:"para",label:"Para E",role:"팜유 불매 운동과 빈곤 탈출 논거"},
    {num:7,en:"One response to the boycott movement has been the argument for the vital role palm oil plays in lifting many millions of people in the developing world out of poverty.",kr:"불매 운동에 대한 한 가지 반응은 팜유가 개발도상국의 수백만 명을 빈곤에서 벗어나게 하는 데 중요한 역할을 한다는 주장이었다.",grammar:"<strong>has been the argument for</strong> = 주장의 내용. <strong>lifting ... out of poverty</strong> = 빈곤에서 벗어나게 하다",vocab:[{w:"boycott",pos:"n/v",kr:"불매 운동/불매하다"},{w:"vital role",pos:"n",kr:"중요한 역할"}]},
    {type:"para",label:"Para F",role:"환경 이점 — 단위면적당 높은 생산성"},
    {num:8,en:"Oil palm plantations produce at least four and potentially up to ten times more oil per hectare than soybean, rapeseed, sunflower or other competing oils. Replacing palm oil with these alternatives would require significantly more land, resulting in greater deforestation.",kr:"기름야자 농장은 콩, 유채, 해바라기 또는 다른 경쟁 오일보다 헥타르당 최소 4배, 잠재적으로 10배 이상의 오일을 생산한다. 팜유를 이 대안들로 대체하면 훨씬 더 많은 토지가 필요하여 더 큰 산림 벌채가 발생할 것이다.",grammar:"<strong>potentially up to ten times more</strong> = 잠재적으로 최대 10배 더. <strong>resulting in</strong> = 분사구문(결과)",vocab:[{w:"soybean",pos:"n",kr:"콩, 대두"},{w:"rapeseed",pos:"n",kr:"유채"}]},
    {type:"para",label:"Para G",role:"지속 가능한 팜유 원탁회의(RSPO)"},
    {num:9,en:"The Roundtable on Sustainable Palm Oil (RSPO) was established in 2004. To gain RSPO certification, producers must demonstrate that their practices are sustainable, transparent and comply with certain environmental and social criteria, including regular assessment of carbon stocks.",kr:"지속 가능한 팜유 원탁회의(RSPO)가 2004년에 설립되었다. RSPO 인증을 받으려면 생산자들은 자신의 관행이 지속 가능하고, 투명하며, 탄소 재고의 정기적인 평가를 포함한 특정 환경적·사회적 기준을 준수한다는 것을 입증해야 한다.",grammar:"<strong>must demonstrate that</strong> = 수동 당위 + 명사절. <strong>comply with</strong> = ~을 준수하다",vocab:[{w:"RSPO",pos:"n",kr:"지속 가능한 팜유 원탁회의"},{w:"transparent",pos:"adj",kr:"투명한"},{w:"carbon stocks",pos:"n",kr:"탄소 재고"}]},
    {type:"para",label:"Para H",role:"bird's nest fern — 생물다양성 회복 가능성"},
    {num:10,en:"New research at Ellwood's lab hints at one plant which might make all the difference. The bird's nest fern grows on the trunks of oil palm trees and supports a remarkable diversity of invertebrates.",kr:"엘우드 연구실의 새로운 연구는 모든 것을 바꿀 수 있는 한 식물을 시사한다. 새 둥지 양치류는 기름야자 나무의 줄기에서 자라며 놀라운 다양성의 무척추동물을 지원한다.",grammar:"<strong>hints at</strong> = ~을 암시하다. <strong>make all the difference</strong> = 큰 차이를 만들다",vocab:[{w:"bird's nest fern",pos:"n",kr:"새 둥지 양치류"},{w:"invertebrate",pos:"n",kr:"무척추동물"}]},
    {num:11,en:"Reintroducing the bird's nest fern into oil palm plantations could potentially allow these areas to recover their biodiversity.",kr:"기름야자 농장에 새 둥지 양치류를 다시 도입하면 이 지역들이 생물다양성을 회복할 수 있을 것이다.",grammar:"<strong>Reintroducing ... could allow</strong> = 동명사 주어 + 추측 조동사. <strong>recover their biodiversity</strong> = 생물다양성을 회복하다",vocab:[{w:"reintroduce",pos:"v",kr:"다시 도입하다"},{w:"biodiversity",pos:"n",kr:"생물다양성"}]}
  ],

"C17_T3_P3": {
  title:"Cambridge 17 · Test 3 · Passage 3",
  topic:"Building the Skyline — Manhattan's Skyscrapers",
  qTypes:["Multiple Choice","YES/NO/NOT GIVEN","Summary Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 바의 책: 지질·역사·경제 융합"},
    {num:1,en:"Jason Barr's book, Building the Skyline, is a compilation of chapters commenting on different aspects of New York's urban development. It combines geology, history, economics, and data to explain why business clusters developed where they did and how early decisions shaped the skyline.",kr:"제이슨 바의 책 '빌딩 더 스카이라인'은 뉴욕의 도시 개발의 다양한 측면을 논평하는 챕터들의 모음이다. 지질학, 역사, 경제학, 데이터를 결합하여 왜 비즈니스 클러스터가 특정 장소에 형성되었는지, 초기 결정들이 어떻게 스카이라인을 형성했는지를 설명한다.",grammar:"<strong>is a compilation of</strong> = ~의 모음이다. <strong>how early decisions shaped</strong> = 간접의문문",vocab:[{w:"compilation",pos:"n",kr:"편집, 모음"},{w:"cluster",pos:"n",kr:"집적, 집단"}]},
    {type:"para",label:"Para 2",role:"1장 — 1600년대 뉴욕 풍경의 생생한 묘사"},
    {num:2,en:"The first chapter opens with a fascinating account of how the New York landscape probably looked from the air in the early 1600s. Barr creates a vivid image of the complex topography of Manhattan, with its hills, streams and boggy areas.",kr:"첫 번째 챕터는 1600년대 초에 뉴욕 경관이 하늘에서 어떻게 보였을지에 대한 매혹적인 설명으로 시작된다. 바는 맨해튼의 구릉, 시내, 습지 등 복잡한 지형에 대한 생생한 이미지를 만들어낸다.",grammar:"<strong>opens with a fascinating account of</strong> = ~에 대한 매혹적인 설명으로 시작하다. <strong>how ... probably looked</strong> = 간접의문문",vocab:[{w:"topography",pos:"n",kr:"지형, 지세"},{w:"boggy",pos:"adj",kr:"습지의"}]},
    {type:"para",label:"Para 3",role:"2-3장 — 이민 구역과 경제 분석"},
    {num:3,en:"Both chapters are informative and well researched and set the stage for the economic analysis that comes later in the book. These chapters examine the 19th-century immigrant neighbourhoods, most of which were located on the least valuable land, between the industries on the waterfront and the wealthy neighborhoods bordering Central Park.",kr:"두 챕터 모두 정보가 풍부하고 잘 연구되어 있으며, 책의 후반부에 나오는 경제 분석의 무대를 설정한다. 이 챕터들은 19세기 이민자 구역을 조사하는데, 대부분이 수변 산업과 센트럴 파크 근처 부유층 거주지 사이에 있는 가장 가치가 낮은 토지에 위치했다.",grammar:"<strong>set the stage for</strong> = ~을 위한 무대를 설정하다. <strong>most of which</strong> = 관계대명사 전치사구",vocab:[{w:"waterfront",pos:"n",kr:"수변, 항구"},{w:"bordering",pos:"v",kr:"~에 인접한, 접경하는"}]},
    {type:"para",label:"Para 4",role:"6장 — 기술적이지만 독자 친화성 부족"},
    {num:4,en:"Chapter six addresses the economics of skyscraper height, distinguishing between 'engineering height', 'economic height', and 'developer height'. While the analysis is thorough, it is probably more technical than would be preferred by a general audience.",kr:"6장은 마천루 높이의 경제학을 다루며 '공학적 높이', '경제적 높이', '개발자 높이'를 구별한다. 분석은 철저하지만, 일반 독자들이 선호하는 것보다 더 기술적일 것이다.",grammar:"<strong>distinguishing between A, B and C</strong> = 분사구문(구별하며). <strong>more technical than would be preferred</strong> = 비교급 + 수동 조동사",vocab:[{w:"skyscraper",pos:"n",kr:"마천루, 초고층 빌딩"},{w:"thorough",pos:"adj",kr:"철저한"}]},
    {type:"para",label:"Para 7",role:"베드록 신화 — 지하 기반암이 마천루를 결정하지 않는다"},
    {num:5,en:"Chapter seven tackles the 'bedrock myth', the assumption that the absence of bedrock close to the surface explains why skyscrapers are absent from specific areas between Downtown and Midtown New York.",kr:"7장은 '베드록 신화', 즉 표면 근처에 기반암이 없다는 것이 다운타운과 미드타운 뉴욕 사이 특정 구역에 마천루가 없는 이유를 설명한다는 가정에 도전한다.",grammar:"<strong>tackles</strong> = 도전하다, 다루다. <strong>the assumption that</strong> = 동격 that절",vocab:[{w:"bedrock",pos:"n",kr:"기반암"},{w:"myth",pos:"n",kr:"신화, 잘못된 믿음"}]},
    {num:6,en:"Barr argues that while deeper bedrock does increase foundation costs, these costs were neither prohibitively high, nor were they large compared to the overall cost of building a skyscraper.",kr:"바는 더 깊은 기반암이 기초 비용을 증가시키기는 하지만, 이 비용들이 금지적으로 높지도 않고, 마천루 건설의 전체 비용에 비해 크지도 않았다고 주장한다.",grammar:"<strong>neither ... nor</strong> = ~도 아니고 ~도 아닌. <strong>prohibitively high</strong> = 금지적으로 높은(너무 비싸서)",vocab:[{w:"prohibitively",pos:"adv",kr:"금지적으로, 너무나"},{w:"foundation costs",pos:"n",kr:"기초 공사 비용"}]},
    {num:7,en:"What I enjoyed the most about this chapter was Barr's discussion of how foundations are actually built. He describes not only how deep excavations are made possible by the use of caissons, but he also discusses their associated risks.",kr:"이 챕터에서 내가 가장 즐거웠던 것은 기초 공사가 실제로 어떻게 이루어지는지에 대한 바의 논의였다. 그는 케이슨 사용으로 깊은 굴착이 가능해지는 방법뿐만 아니라 관련 위험도 논의한다.",grammar:"<strong>not only ... but also</strong> = 병렬 연결. <strong>associated risks</strong> = 관련 위험",vocab:[{w:"excavation",pos:"n",kr:"굴착, 발굴"},{w:"caisson",pos:"n",kr:"케이슨(잠함)"},{w:"associated risks",pos:"n",kr:"관련 위험"}]},
    {type:"para",label:"Para 8",role:"1920년대 빌딩 붐 — 일부 독자에게 제한적 관심"},
    {num:8,en:"Chapter eight contains lengthy discussions of urban economic theory that may serve as a distraction to readers primarily interested in the history and physical development of skyscrapers.",kr:"8장은 마천루의 역사와 물리적 발전에 주로 관심 있는 독자들에게 산만함으로 작용할 수 있는 도시 경제 이론에 대한 긴 논의를 담고 있다.",grammar:"<strong>serve as a distraction</strong> = 산만함으로 작용하다. <strong>primarily interested in</strong> = ~에 주로 관심 있는",vocab:[{w:"distraction",pos:"n",kr:"산만함, 주의 분산"},{w:"lengthy",pos:"adj",kr:"긴, 장황한"}]},
    {type:"para",label:"Para 9",role:"토지 가치 챕터 — 데이터 작업이 인상적"},
    {num:9,en:"The chapter on land values is particularly impressive. Barr traces Manhattan land values from the mid-19th century to the present day. The data work that went into these estimations is particularly impressive.",kr:"토지 가치에 관한 챕터는 특히 인상적이다. 바는 맨해튼 토지 가치를 19세기 중반부터 현재까지 추적한다. 이 추정치에 들어간 데이터 작업은 특히 인상적이다.",grammar:"<strong>traces ... from ... to</strong> = ~에서 ~까지 추적하다. <strong>went into</strong> = ~에 들어간",vocab:[{w:"estimation",pos:"n",kr:"추정(치)"},{w:"land values",pos:"n",kr:"토지 가치"}]}

  summary:"Cambridge 17 Test 3 Passage 3. 제이슨 바의 '빌딩 더 스카이라인' 서평. 지질·역사·경제학을 결합한 뉴욕 마천루 연구서이다. 리뷰어(셰스터)는 생생한 1장과 토지 가치 챕터를 강점으로, '베드록 신화'를 반박한 7장을 특히 즐거웠다고 평가한다. 6장·8장의 지나친 기술성은 일반 독자에게 약점으로 지적한다."

"C17_T4_P1": {
  title:"Cambridge 17 · Test 4 · Passage 1",
  topic:"Bats to the Rescue",
  qTypes:["True / False / Not Given","Table Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 마다가스카르 박쥐가 농업을 돕다"},
    {num:1,en:"Madagascar's rainforests are being threatened by deforestation and the land is being converted for use in agriculture. However, one of the native bat species is helping farmers by consuming vast numbers of crop pests.",kr:"마다가스카르의 열대우림은 산림 벌채와 농업 용도로의 전환으로 위협받고 있다. 그러나 토종 박쥐 종 중 하나가 엄청난 수의 작물 해충을 먹어치움으로써 농부들을 돕고 있다.",grammar:"<strong>being threatened by</strong> = 수동 진행. <strong>by consuming</strong> = 분사구문(수단)",vocab:[{w:"deforestation",pos:"n",kr:"산림 벌채"},{w:"crop pest",pos:"n",kr:"작물 해충"}]},
    {num:2,en:"Ricardo Rocha, a conservation scientist at the University of Porto in Portugal, has made it his life's work to study how bats interact with the environment in human-modified landscapes around the world.",kr:"포르투갈 포르투 대학교의 보전 과학자 리카르도 로샤는 전 세계 인간이 변형한 경관에서 박쥐가 환경과 어떻게 상호작용하는지 연구하는 것을 그의 일생의 과업으로 삼았다.",grammar:"<strong>make it one's life's work to</strong> = ~을 일생의 과업으로 삼다. <strong>human-modified landscapes</strong> = 복합 명사 수식",vocab:[{w:"conservation scientist",pos:"n",kr:"보전 과학자"},{w:"human-modified",pos:"adj",kr:"인간이 변형한"}]},
    {type:"para",label:"Para 2",role:"서식지 변화로 박쥐가 논으로"},
    {num:3,en:"Habitat modification has led to some indigenous bat species in Madagascar venturing into rice paddies and other farmland to feed, which has turned them into valuable assets for local farmers.",kr:"서식지 변화로 인해 마다가스카르의 일부 토종 박쥐 종들이 논과 다른 농지로 나아가 먹이를 먹게 되었는데, 이로 인해 그들은 지역 농부들에게 귀중한 자산이 되었다.",grammar:"<strong>Habitat modification has led to ... venturing</strong> = lead to + 동명사. <strong>which has turned them into</strong> = 계속적 관계절",vocab:[{w:"indigenous",pos:"adj",kr:"토종의, 원산의"},{w:"venture into",pos:"v",kr:"감히 ~로 나아가다"},{w:"asset",pos:"n",kr:"자산"}]},
    {num:4,en:"'The forests are being cut down so the bats are forced to forage in the agricultural matrix,' says Rocha. 'But on the plus side, we found that some species have adapted remarkably well to foraging in rice paddies.'",kr:"'숲이 베어지고 있어 박쥐들이 농업 기반 환경에서 먹이를 구하도록 강요받고 있습니다'라고 로샤는 말한다. '하지만 긍정적인 면에서, 일부 종들이 논에서 먹이를 구하는 것에 놀랍도록 잘 적응했다는 것을 발견했습니다.'",grammar:"<strong>are being cut down</strong> = 수동 진행. <strong>on the plus side</strong> = 긍정적인 면에서",vocab:[{w:"forage",pos:"v",kr:"먹이를 구하다, 찾아다니다"},{w:"matrix",pos:"n",kr:"기반 환경, 행렬"}]},
    {type:"para",label:"Para 3",role:"연구 방법 — 초음파 기록과 DNA 분석"},
    {num:5,en:"To investigate what the bats were eating, Rocha's team used ultrasonic recording devices to identify where bats preferred to feed, and DNA analysis of bat droppings to reveal which insects they had consumed.",kr:"박쥐들이 무엇을 먹고 있는지 조사하기 위해 로샤 팀은 초음파 기록 장치를 사용하여 박쥐들이 먹이를 선호하는 장소를 파악하고, 박쥐 배설물의 DNA 분석으로 어떤 곤충을 먹었는지 밝혔다.",grammar:"<strong>To investigate</strong> = 목적의 to부정사. <strong>to reveal which insects</strong> = 간접의문문 포함 to부정사",vocab:[{w:"ultrasonic",pos:"adj",kr:"초음파의"},{w:"droppings",pos:"n",kr:"배설물"}]},
    {num:6,en:"The bats were most active in rice fields situated on hillsides, and the DNA analysis of their droppings showed they were eating pests of rice, maize, sugarcane, nuts and fruit.",kr:"박쥐들은 구릉지에 위치한 논에서 가장 활발했으며, 배설물의 DNA 분석은 그들이 쌀, 옥수수, 사탕수수, 견과류, 과일의 해충을 먹고 있다는 것을 보여줬다.",grammar:"<strong>situated on hillsides</strong> = 과거분사 후치수식. <strong>showed they were eating</strong> = 목적절",vocab:[{w:"situated",pos:"adj",kr:"위치한"},{w:"maize",pos:"n",kr:"옥수수"}]},
    {num:7,en:"The bats also appeared to prevent the spread of disease by eating mosquitoes and blackflies.",kr:"박쥐들은 또한 모기와 먹파리를 먹음으로써 질병의 확산을 막는 것으로도 보였다.",grammar:"<strong>appeared to prevent</strong> = ~을 막는 것으로 보였다. <strong>by eating</strong> = 분사구문(수단)",vocab:[{w:"blackfly",pos:"n",kr:"먹파리"},{w:"prevent the spread of",pos:"phr",kr:"~의 확산을 막다"}]},
    {type:"para",label:"Para 4",role:"지역 주민의 인식 — 긍정·부정 혼재"},
    {num:8,en:"Local attitudes to bats are mixed. They provide food rich in protein when people catch and eat them. However, the buildings where they roost become soiled and smelly, which is unpopular.",kr:"박쥐에 대한 지역 주민들의 태도는 복잡하다. 사람들이 잡아먹을 때 단백질이 풍부한 음식을 제공한다. 그러나 그들이 쉬는 건물은 더럽고 냄새가 나게 되어 인기가 없다.",grammar:"<strong>mixed</strong> = 복잡한, 엇갈린. <strong>where they roost</strong> = 관계절(장소)",vocab:[{w:"roost",pos:"v",kr:"(새·박쥐가) 쉬다, 앉다"},{w:"soiled",pos:"adj",kr:"더럽혀진"}]},
    {num:9,en:"'Bats play a really important role in local mythology,' says Rocha. To support the bat population, Rocha's team recommended that farmers should provide special bat boxes for the bats to roost in.",kr:"'박쥐는 지역 신화에서 정말 중요한 역할을 합니다'라고 로샤는 말한다. 박쥐 개체수를 지원하기 위해 로샤 팀은 농부들이 박쥐가 쉴 수 있는 특별한 박쥐 상자를 제공해야 한다고 권고했다.",grammar:"<strong>play an important role in</strong> = ~에서 중요한 역할을 하다. <strong>recommended that ... should</strong> = 제안 동사 + that절",vocab:[{w:"mythology",pos:"n",kr:"신화"},{w:"bat box",pos:"n",kr:"박쥐 집"}]}
  ],

    {w:"deforestation",pos:"n",pron:"/ˌdiːˌfɒrɪˈsteɪʃən/",kr:"산림 벌채",ex:"Madagascar's rainforests are threatened by deforestation.",syn:"forest clearance"},

"C17_T4_P2": {
  title:"Cambridge 17 · Test 4 · Passage 2",
  topic:"Does Education Fuel Economic Growth?",
  qTypes:["Section Matching","Summary Completion","Two-Letter Questions"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 교육과 경제 성장의 관계 논쟁"},
    {num:1,en:"The idea that education drives economic growth has long been popular with both economists and politicians. But is this really true? Economists have proposed various theories to explain the relationship between education and economic prosperity, and a number of large-scale empirical studies have examined the issue.",kr:"교육이 경제 성장을 이끈다는 아이디어는 오랫동안 경제학자와 정치인 모두에게 인기가 있었다. 하지만 이것이 정말 사실인가? 경제학자들은 교육과 경제적 번영 사이의 관계를 설명하는 다양한 이론을 제안해 왔으며, 많은 대규모 경험적 연구들이 이 문제를 조사했다.",grammar:"<strong>has long been popular</strong> = 오랫동안 인기가 있어온(현재완료+부사). <strong>is this really true?</strong> = 수사적 의문문",vocab:[{w:"prosperity",pos:"n",kr:"번영, 풍요"},{w:"empirical",pos:"adj",kr:"경험적인, 실증적인"}]},
    {num:2,en:"In principle, the economic benefits of education are clear: in a skilled workforce, productivity is higher and individuals earn more. Yet the empirical evidence for education as a driver of growth is surprisingly weak.",kr:"원칙적으로 교육의 경제적 이점은 분명하다: 숙련된 노동력에서 생산성은 더 높고 개인은 더 많이 번다. 그러나 경제 성장의 동력으로서 교육에 대한 경험적 증거는 놀랍도록 약하다.",grammar:"<strong>In principle</strong> = 원칙적으로. <strong>surprisingly weak</strong> = 예상외로 약한(양보적 뉘앙스)",vocab:[{w:"workforce",pos:"n",kr:"노동력"},{w:"productivity",pos:"n",kr:"생산성"},{w:"driver",pos:"n",kr:"동력, 원동력"}]},
    {type:"para",label:"Para B",role:"문해력·경제 성장 연관성 — 독일 연구"},
    {num:3,en:"Germany has been proposed as a particularly appropriate region for research into the link between education and economic growth, because it industrialised relatively late, and because we have access to good historical data on its population.",kr:"독일은 비교적 늦게 산업화했고 인구에 관한 좋은 역사적 데이터에 접근할 수 있기 때문에 교육과 경제 성장 사이의 연관성 연구에 특히 적합한 지역으로 제안되었다.",grammar:"<strong>has been proposed as</strong> = ~로 제안되어 왔다(현재완료 수동). <strong>because ... and because</strong> = 두 이유 병렬",vocab:[{w:"industrialise",pos:"v",kr:"산업화하다"},{w:"relatively late",pos:"adv",kr:"비교적 늦게"}]},
    {num:4,en:"High literacy rates do not necessarily lead to higher economic growth, and economic growth can itself help to improve literacy rates.",kr:"높은 문해율이 반드시 더 높은 경제 성장으로 이어지지는 않으며, 경제 성장 자체가 문해율 향상에 도움이 될 수 있다.",grammar:"<strong>do not necessarily lead to</strong> = 부분 부정. <strong>can itself help to</strong> = 그 자체가 ~하는 데 도움이 될 수 있다",vocab:[{w:"literacy rate",pos:"n",kr:"문해율"},{w:"necessarily",pos:"adv",kr:"반드시"}]},
    {type:"para",label:"Para C",role:"오길비의 데이터베이스 — 300년 개인 추적"},
    {num:5,en:"Sheilagh Ogilvie and her team have compiled a comprehensive database of two German communities over a 300-year period. The database sheds light on the lives of a range of individuals, as well as those of their families.",kr:"실라 오길비와 그녀의 팀은 300년에 걸쳐 두 독일 공동체의 포괄적인 데이터베이스를 편집했다. 데이터베이스는 개인들의 삶뿐만 아니라 그들의 가족들의 삶에도 빛을 비춘다.",grammar:"<strong>sheds light on</strong> = ~을 밝히다, 조명하다. <strong>as well as those of their families</strong> = 부가 비교",vocab:[{w:"comprehensive",pos:"adj",kr:"포괄적인, 종합적인"},{w:"shed light on",pos:"phr",kr:"~을 밝히다, 조명하다"}]},
    {num:6,en:"The database includes sources such as church registers, court records, guild documents and government surveys. It covers all members of the communities in sufficient detail to allow the reconstruction of individual life courses.",kr:"데이터베이스에는 교회 등록부, 법원 기록, 길드 문서, 정부 조사와 같은 출처가 포함된다. 개인 생애 과정의 재구성을 허용할 만큼 충분한 세부 사항으로 공동체의 모든 구성원을 다룬다.",grammar:"<strong>to allow the reconstruction</strong> = 목적 to부정사. <strong>in sufficient detail</strong> = 충분한 세부 사항으로",vocab:[{w:"guild",pos:"n",kr:"길드(직업 조합)"},{w:"reconstruction",pos:"n",kr:"재구성"}]},
    {type:"para",label:"Para D",role:"아나 레지나 — 설교 중 독서로 처벌"},
    {num:7,en:"For example, Ana Regina and Magdalena Riethmüllerin were reprimanded for reading during a sermon. Their reading during a religious service suggests they were literate – but also that they were perhaps more interested in their books than in the sermon.",kr:"예를 들어, 아나 레지나와 막달레나 리트뮐러린은 설교 중에 책을 읽어서 질책을 받았다. 종교 예배 중 그들의 독서는 그들이 문자를 읽을 줄 알았음을 시사하지만, 동시에 설교보다 책에 더 관심이 있었음을 시사한다.",grammar:"<strong>were reprimanded for</strong> = ~로 질책을 받았다. <strong>suggests they were literate</strong> = 목적절",vocab:[{w:"reprimand",pos:"v",kr:"질책하다, 꾸짖다"},{w:"sermon",pos:"n",kr:"설교"},{w:"literate",pos:"adj",kr:"글을 읽고 쓸 줄 아는"}]},
    {type:"para",label:"Para E",role:"줄리아나 슈바이크헤르트 — 길드 규칙 위반"},
    {num:8,en:"There was also Juliana Schweickherdt, who came to the notice of the weavers' guild in 1752 for breaking guild rules. As a punishment, she was later given a fine. Cases like this illustrate how the guilds could prevent upward mobility and stop skilled people from working.",kr:"또한 1752년에 길드 규칙을 어겨 직조공 길드의 주목을 받게 된 줄리아나 슈바이크헤르트도 있었다. 벌로 그녀는 나중에 벌금을 부과받았다. 이러한 사례들은 길드가 어떻게 상향 이동을 막고 숙련된 사람들이 일하지 못하도록 막을 수 있었는지를 보여준다.",grammar:"<strong>came to the notice of</strong> = ~의 주목을 받게 되다. <strong>illustrate how</strong> = 간접의문문",vocab:[{w:"weaver",pos:"n",kr:"직조공"},{w:"fine",pos:"n",kr:"벌금"},{w:"upward mobility",pos:"n",kr:"상향 이동, 계층 상승"}]},
    {type:"para",label:"Para F",role:"길드의 이중성 — 기술 훈련 vs. 진입 장벽"},
    {num:9,en:"In German-speaking Central Europe between 1600 and 1900, guilds helped young people to learn a skill but also opposed practices that threatened their control over a trade. They kept better records than guilds elsewhere and maintained strict rules about who could practice a particular trade.",kr:"1600년에서 1900년 사이 독일어권 중부 유럽에서 길드는 젊은 사람들이 기술을 배울 수 있도록 도왔지만, 동시에 무역에 대한 통제를 위협하는 관행에도 반대했다. 다른 지역 길드보다 더 나은 기록을 유지하고 특정 거래를 할 수 있는 사람에 대한 엄격한 규칙을 유지했다.",grammar:"<strong>helped ... to learn</strong> = help + to부정사. <strong>opposed practices that</strong> = 목적격 관계절",vocab:[{w:"guild",pos:"n",kr:"길드"},{w:"oppose",pos:"v",kr:"반대하다"}]}

  sentences:[
    {type:"para",label:"Para A",role:"도입 — 블라인드폴드 체스란"},
    {num:1,en:"Blindfold chess is a variant of chess in which the players are not allowed to see the board. Rather than physically wearing a blindfold, the players simply turn away from the board and play the game from memory, announcing their moves verbally.",kr:"블라인드폴드 체스는 선수들이 보드를 볼 수 없는 체스의 변형이다. 실제로 눈가리개를 착용하는 대신, 선수들은 단순히 보드에서 등을 돌리고 기억으로 게임을 진행하며 구두로 수를 알린다.",grammar:"<strong>Rather than physically wearing</strong> = 실제로 착용하는 대신. <strong>announcing their moves verbally</strong> = 분사구문(동시 행동)",vocab:[{w:"variant",pos:"n",kr:"변형, 다른 형태"},{w:"verbally",pos:"adv",kr:"구두로, 말로"}]},
    {num:2,en:"Timur Gareyev, an Uzbekistani-American chess grandmaster, recently set a new world record by playing blindfold chess against 48 opponents simultaneously, winning 35 of the games, drawing 7 and losing 6.",kr:"우즈베키스탄계 미국인 체스 그랜드마스터 티무르 가레예프는 최근 48명의 상대와 동시에 블라인드폴드 체스를 두어 35게임을 이기고, 7게임을 무승부로 마쳤으며, 6게임을 지며 새로운 세계 기록을 세웠다.",grammar:"<strong>by playing ... against</strong> = 수단 분사구문. <strong>winning ... drawing ... losing</strong> = 병렬 분사구문",vocab:[{w:"grandmaster",pos:"n",kr:"그랜드마스터(체스 최고 등급)"},{w:"simultaneously",pos:"adv",kr:"동시에"}]},
    {type:"para",label:"Para B",role:"블라인드폴드 체스의 역사"},
    {num:3,en:"Blindfold chess has a long history. It was first mentioned in historical records as far back as 1266, when a player called Buzecca played three simultaneous games without sight of the boards, winning two and drawing one.",kr:"블라인드폴드 체스는 긴 역사를 가지고 있다. 역사 기록에 처음 언급된 것은 1266년으로 거슬러 올라가는데, 부제카라는 선수가 보드를 보지 않고 세 게임을 동시에 두어 두 게임을 이기고 한 게임을 무승부로 마쳤다.",grammar:"<strong>as far back as 1266</strong> = 1266년까지 거슬러 올라가. <strong>without sight of</strong> = ~을 보지 않고",vocab:[{w:"as far back as",pos:"phr",kr:"~까지 거슬러 올라가"},{w:"simultaneous",pos:"adj",kr:"동시의"}]},
    {type:"para",label:"Para C",role:"가레예프의 성격 — 모험 추구"},
    {num:4,en:"Gareyev is a risk-taker by nature. Outside chess, he is known for his daredevil pursuits including skydiving, motorcycling and BASE jumping. His priorities, he says, are chess and adrenaline, in that order.",kr:"가레예프는 천성적으로 위험을 감수하는 사람이다. 체스 외에도 스카이다이빙, 오토바이, 베이스 점프 등 무모한 도전으로 알려져 있다. 그의 우선순위는 체스와 아드레날린이며, 그 순서대로라고 그는 말한다.",grammar:"<strong>by nature</strong> = 천성적으로. <strong>in that order</strong> = 그 순서대로",vocab:[{w:"daredevil",pos:"adj",kr:"무모한, 겁 없는"},{w:"skydiving",pos:"n",kr:"스카이다이빙"},{w:"adrenaline",pos:"n",kr:"아드레날린"}]},
    {num:5,en:"His skills are largely limited to chess. When tested on other cognitive tasks – such as remembering sequences of numbers or navigating a route – he performed at an average level.",kr:"그의 기술은 주로 체스에 한정된다. 숫자 순서 기억이나 경로 탐색 등의 다른 인지 과제를 테스트했을 때 그는 평균적인 수준을 보였다.",grammar:"<strong>are largely limited to</strong> = 주로 ~에 한정된다. <strong>such as</strong> = 예를 들어",vocab:[{w:"cognitive",pos:"adj",kr:"인지적인"},{w:"sequence",pos:"n",kr:"순서, 배열"}]},
    {type:"para",label:"Para D",role:"UCLA 연구 — 가레예프의 뇌 스캔"},
    {num:6,en:"A team of researchers at UCLA decided to investigate. They began by testing Gareyev's memory; for example, he was required to recall a string of digits in order and also in reverse order.",kr:"UCLA의 연구팀이 조사하기로 했다. 그들은 가레예프의 기억력을 테스트하는 것으로 시작했다; 예를 들어, 그는 숫자 배열을 순서대로 그리고 역순으로도 기억하도록 요구받았다.",grammar:"<strong>decided to investigate</strong> = ~를 조사하기로 결정했다. <strong>in reverse order</strong> = 역순으로",vocab:[{w:"digit",pos:"n",kr:"숫자(한 자리)"},{w:"in reverse order",pos:"phr",kr:"역순으로"}]},
    {num:7,en:"Although his performance was normal, brain scans showed an unusual amount of connectivity within the areas of Gareyev's brain that are concerned with directing attention. In addition, the scans raised the possibility of unusual strength in the parts of his brain that deal with visual input.",kr:"그의 수행 능력은 정상이었지만, 뇌 스캔은 주의를 지시하는 것과 관련된 가레예프 뇌 영역 내에 비정상적인 양의 연결성을 보여줬다. 또한, 스캔은 시각적 입력을 처리하는 뇌 부분에서 비정상적인 강도의 가능성을 제기했다.",grammar:"<strong>Although his performance was normal</strong> = 양보 접속사. <strong>concerned with</strong> = ~와 관련된",vocab:[{w:"connectivity",pos:"n",kr:"연결성"},{w:"visual input",pos:"n",kr:"시각적 입력"}]},
    {type:"para",label:"Para E",role:"블라인드폴드 체스 어떻게 가능한가"},
    {num:8,en:"How does he do it? Experts say that experienced chess players can look at a chessboard and see meaningful patterns of pieces rather than individual pieces in isolation. This 'chunking' effect means the player holds several pieces in mind at once.",kr:"어떻게 하는 것일까? 전문가들은 경험 있는 체스 선수들이 체스판을 보면 개별 말보다는 의미 있는 패턴의 말들을 본다고 말한다. 이 '청킹' 효과는 선수가 여러 말을 동시에 마음속에 담고 있다는 것을 의미한다.",grammar:"<strong>rather than ... in isolation</strong> = ~보다. <strong>holds ... in mind</strong> = 마음속에 담다",vocab:[{w:"chunking",pos:"n",kr:"청킹(의미 단위 묶기)"},{w:"in isolation",pos:"phr",kr:"개별적으로, 고립된 채로"}]},
    {type:"para",label:"Para F",role:"게임 말미의 어려움"},
    {num:9,en:"The end of a game, when there are fewer pieces on the board, may actually be the most difficult stage for blindfold players. With fewer pieces there are fewer patterns to draw on, so the player must hold more individual pieces in memory.",kr:"보드에 말이 적어지는 게임의 말미가 실제로 블라인드폴드 선수들에게 가장 어려운 단계일 수 있다. 말이 적을수록 의존할 패턴이 줄어들어, 선수는 더 많은 개별 말을 기억에 담아야 한다.",grammar:"<strong>When there are fewer pieces</strong> = 시간 부사절. <strong>to draw on</strong> = 의지할, 사용할",vocab:[{w:"draw on",pos:"v",kr:"의지하다, 활용하다"}]},
    {type:"para",label:"Para G",role:"과학적 의의 — 뇌 연구에 기여"},
    {num:10,en:"What makes Gareyev's abilities interesting to scientists is not merely the record he set, but what they suggest about the brain's capacity for memory and attention. His case could help researchers understand how humans process complex spatial information.",kr:"가레예프의 능력이 과학자들에게 흥미로운 것은 그가 세운 기록 자체만이 아니라, 뇌의 기억과 주의 처리 능력에 대해 그것들이 시사하는 바이다. 그의 사례는 연구자들이 인간이 복잡한 공간 정보를 어떻게 처리하는지 이해하는 데 도움이 될 수 있다.",grammar:"<strong>What makes ... interesting</strong> = what절이 주어. <strong>not merely ... but</strong> = ~뿐만 아니라",vocab:[{w:"spatial",pos:"adj",kr:"공간적인"},{w:"capacity for",pos:"n",kr:"~에 대한 능력"}]}

  summary:"Cambridge 17 Test 4 Passage 3. 티무르 가레예프는 48명 동시 블라인드폴드 체스 세계 기록 보유자이다. UCLA 뇌 스캔 연구에서 주의 지시 영역의 비정상적 연결성과 강한 시각 처리 능력이 확인됐다. '청킹' 효과(패턴 단위 기억)가 블라인드폴드 체스의 핵심 메커니즘이며, 말이 줄어드는 게임 말미가 가장 어렵다."

,"C16_T1_P2": {
  title:"Cambridge 16 · Test 1 · Passage 2",
  topic:"The Step Pyramid of Djoser",
  qTypes:["Paragraph Headings","Notes Completion","Two-Letter Questions"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 이집트 피라미드의 기원"},
    {num:1,en:"The evolution of the pyramid form has been written and argued about for centuries. However, there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect: the Step Pyramid of Djoser at Saqqara.",kr:"피라미드 형태의 진화에 대해 수 세기 동안 기록되고 논쟁되어 왔다. 그러나 이집트의 경우, 그것이 한 명의 왕을 위해 한 명의 뛰어난 건축가가 설계한 하나의 기념물인 사카라의 조세르 계단 피라미드에서 시작되었다는 것은 의심할 여지가 없다.",grammar:"<strong>there is no question that</strong> = ~라는 것은 의심할 여지가 없다. <strong>as far as Egypt is concerned</strong> = 이집트에 관한 한",vocab:[{w:"monument",pos:"n",kr:"기념물, 유적"},{w:"architect",pos:"n",kr:"건축가"}]},
    {type:"para",label:"Para B",role:"조세르 왕 — 최초의 석조 건물"},
    {num:2,en:"Djoser was the first king of the Third Dynasty of Egypt and the first to build in stone. Prior to his reign, tombs were rectangular monuments made of dried clay brick, which covered underground passages where the deceased person was buried.",kr:"조세르는 이집트 제3왕조의 첫 번째 왕이자 최초로 석조 건물을 지은 왕이었다. 그의 재위 이전에 묘는 죽은 사람이 묻힌 지하 통로를 덮는 말린 점토 벽돌로 만든 직사각형 기념물이었다.",grammar:"<strong>Prior to his reign</strong> = 그의 재위 이전에. <strong>where the deceased person was buried</strong> = 관계절",vocab:[{w:"deceased",pos:"adj",kr:"고인의, 사망한"},{w:"reign",pos:"n",kr:"재위, 통치"}]},
    {num:3,en:"Djoser's main official, Imhotep, conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller, to form the shape now known as the Step Pyramid.",kr:"조세르의 주요 관리인 임호텝은 점점 작아지는 석판을 쌓아 올려 현재 계단 피라미드로 알려진 형태를 만드는 방식으로 왕을 위한 더 높고 인상적인 무덤을 지을 것을 구상했다.",grammar:"<strong>conceived of -ing</strong> = ~하는 것을 구상하다. <strong>progressively making them smaller</strong> = 분사구문(동시)",vocab:[{w:"conceive of",pos:"v",kr:"구상하다"},{w:"slab",pos:"n",kr:"석판, 두꺼운 판"}]},
    {type:"para",label:"Para C",role:"건설 과정 — 여러 차례 설계 변경"},
    {num:4,en:"The building process went through many different stages. Historian Marc Van de Mieroop comments that 'Much experimentation was involved ... The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up.'",kr:"건설 과정은 많은 다양한 단계를 거쳤다. 역사가 마르크 판 드 미로프는 '많은 실험이 수반되었으며 ... 거대한 질량의 무게는 건설자들에게 도전이었고, 그들은 기념물이 무너지는 것을 막기 위해 돌을 안쪽으로 기울게 배치했다'고 언급한다.",grammar:"<strong>in order to prevent</strong> = 막기 위해. <strong>experimentation was involved</strong> = 실험이 수반되었다",vocab:[{w:"experimentation",pos:"n",kr:"실험"},{w:"inward incline",pos:"n",kr:"안쪽 기울기"}]},
    {type:"para",label:"Para D",role:"완성된 피라미드 — 복합 단지"},
    {num:5,en:"When finally completed, the Step Pyramid rose 62 meters high and was the tallest structure of its time. The complex in which it was built was the size of a city in ancient Egypt and included a temple, courtyards, shrines, and living quarters for the priests.",kr:"마침내 완성되었을 때 계단 피라미드는 62미터 높이로 솟아올라 당대 가장 높은 구조물이었다. 그것이 건설된 복합 단지는 고대 이집트의 도시 규모였으며 사원, 안뜰, 신전, 사제들의 생활 공간을 포함했다.",grammar:"<strong>When finally completed</strong> = 분사구문(시간). <strong>was the size of</strong> = ~의 규모였다",vocab:[{w:"courtyard",pos:"n",kr:"안뜰"},{w:"shrine",pos:"n",kr:"신전, 성소"},{w:"living quarters",pos:"n",kr:"생활 공간"}]},
    {num:6,en:"The wall had 13 false doors cut into it with only one true entrance cut into the south-east corner; the entire wall was then ringed by a trench 750 meters long and 40 meters wide.",kr:"벽에는 13개의 가짜 문이 있었고 남동쪽 모서리에 하나의 진짜 입구만 있었다; 전체 벽은 길이 750미터, 너비 40미터의 도랑으로 둘러싸였다.",grammar:"<strong>cut into</strong> = ~에 새겨진. <strong>ringed by</strong> = ~로 둘러싸인",vocab:[{w:"trench",pos:"n",kr:"도랑, 참호"},{w:"false door",pos:"n",kr:"가짜 문"}]},
    {type:"para",label:"Para E",role:"내부 구조 — 미로와 석제 용기"},
    {num:7,en:"The burial chamber of the tomb was dug beneath the base of the pyramid, surrounded by a vast maze of long tunnels that had rooms off them to discourage robbers. One of the most mysterious discoveries found inside the pyramid was a large number of stone vessels – over 40,000 of these vessels were discovered in storerooms.",kr:"묘의 매장 방은 피라미드 기저부 아래에 파여 있었으며, 도굴꾼을 막기 위해 방들이 딸린 긴 터널의 광대한 미로로 둘러싸였다. 피라미드 내부에서 발견된 가장 신비로운 발견물 중 하나는 다수의 석제 용기였으며, 창고에서 4만 개 이상이 발견되었다.",grammar:"<strong>to discourage robbers</strong> = 도굴꾼을 막기 위해(목적). <strong>One of the most mysterious</strong> = 최상급 구문",vocab:[{w:"burial chamber",pos:"n",kr:"매장 방"},{w:"maze",pos:"n",kr:"미로"},{w:"vessel",pos:"n",kr:"용기, 그릇"}]},
    {type:"para",label:"Para F",role:"도굴 피해 — 그럼에도 놀라운 발견"},
    {num:8,en:"Djoser's grave goods, and even his body, were stolen at some point in the past and all archaeologists found were a small number of his valuables overlooked by the thieves. There was enough left throughout the pyramid and its complex, however, to astonish and amaze the archaeologists who excavated it.",kr:"조세르의 부장품과 심지어 그의 시신도 과거 어느 시점에 도난당했고 고고학자들이 발견한 것은 도둑들이 간과한 소수의 귀중품뿐이었다. 그러나 피라미드와 단지 전체에 남겨진 것들이 충분히 발굴한 고고학자들을 놀라게 했다.",grammar:"<strong>overlooked by the thieves</strong> = 분사구문(수동 후치수식). <strong>to astonish and amaze</strong> = 병렬 to부정사",vocab:[{w:"grave goods",pos:"n",kr:"부장품"},{w:"overlook",pos:"v",kr:"간과하다"},{w:"excavate",pos:"v",kr:"발굴하다"}]},
    {type:"para",label:"Para G",role:"역사적 의의 — 모든 피라미드의 원형"},
    {num:9,en:"The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow.",kr:"계단 피라미드는 건축에서 혁명적인 발전이었으며 이집트의 다른 모든 위대한 피라미드 건설자들이 따를 원형이 되었다.",grammar:"<strong>revolutionary advance</strong> = 혁명적인 발전. <strong>the archetype which ... would follow</strong> = 관계절",vocab:[{w:"archetype",pos:"n",kr:"원형, 전형"},{w:"revolutionary",pos:"adj",kr:"혁명적인"}]}
  ],
  allVocab:[
    {w:"conceive of",pos:"v",pron:"/kənˈsiːv/",kr:"구상하다",ex:"Imhotep conceived of stacking stone slabs to form a stepped shape.",syn:"devise, envision"},
    {w:"slab",pos:"n",pron:"/slæb/",kr:"석판",ex:"Stone slabs were stacked on top of one another.",syn:"block, plate"},
    {w:"shrine",pos:"n",pron:"/ʃraɪn/",kr:"신전, 성소",ex:"The complex included shrines and a temple.",syn:"sanctuary, chapel"},

    {w:"archetype",pos:"n",pron:"/ˈɑːkɪtaɪp/",kr:"원형, 전형",ex:"The Step Pyramid became the archetype for all later pyramids.",syn:"model, prototype"},
    {w:"deceased",pos:"adj",pron:"/dɪˈsiːst/",kr:"고인의, 사망한",ex:"The tombs covered passages where the deceased person was buried.",syn:"dead, departed"},

  tfng:[],
  paragraphs:[
    {lbl:"A",role:"도입",desc:"피라미드 진화 논쟁 — 계단 피라미드가 기원"},
    {lbl:"B",role:"배경",desc:"최초 석조 건물 — 임호텝이 계단 쌓기 구상"},
    {lbl:"C",role:"건설",desc:"여러 단계 변경, 무게 문제로 안쪽 기울기 배치"},

    {lbl:"E",role:"내부",desc:"미로 터널, 4만 개 이상의 석제 용기"},

  summary:"Cambridge 16 Test 1 Passage 2. 계단 피라미드는 이집트 제3왕조 조세르 왕을 위해 임호텝이 설계한 세계 최초의 석조 피라미드이다. 62m 높이의 피라미드는 도시 규모의 복합 단지에 위치하며, 가짜 문과 도랑으로 보안을 강화했다. 도굴로 많은 부장품을 잃었으나 여전히 고고학자들을 놀라게 할 만큼의 유물이 남아 있다."

"C16_T1_P3": {
  title:"Cambridge 16 · Test 1 · Passage 3",
  topic:"The Future of Work",
  qTypes:["Multiple Choice","Summary Completion","People Matching"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — AI와 자동화가 바꾸는 노동 시장"},
    {num:1,en:"According to a leading business consultancy, 3-14% of the global workforce will need to switch to a different occupation within the next 10-15 years, and all workers will need to adapt as their occupations evolve alongside increasingly capable machines.",kr:"한 주요 경영 컨설팅 기관에 따르면, 향후 10~15년 내에 전 세계 노동력의 3~14%가 다른 직업으로 전환해야 할 것이며, 모든 노동자들은 점점 더 유능해지는 기계와 함께 직업이 발전함에 따라 적응해야 할 것이다.",grammar:"<strong>will need to switch</strong> = 미래 예측. <strong>alongside increasingly capable machines</strong> = 전치사구",vocab:[{w:"workforce",pos:"n",kr:"노동력"},{w:"occupation",pos:"n",kr:"직업, 직종"},{w:"alongside",pos:"prep",kr:"~와 함께"}]},
    {type:"para",label:"Para 2",role:"지식 경제의 알고리즘화 — Pachidi"},
    {num:2,en:"Dr Stella Pachidi believes that some of the most fundamental changes are happening as a result of the 'algorithmication' of jobs that are dependent on data rather than on production – the so-called knowledge economy.",kr:"스텔라 파키디 박사는 가장 근본적인 변화들 중 일부가 생산보다는 데이터에 의존하는 직업들의 '알고리즘화' 결과로 일어나고 있다고 믿는다 – 소위 지식 경제라고 하는 것이다.",grammar:"<strong>as a result of</strong> = ~의 결과로. <strong>the so-called knowledge economy</strong> = 소위 지식 경제",vocab:[{w:"algorithmication",pos:"n",kr:"알고리즘화"},{w:"knowledge economy",pos:"n",kr:"지식 경제"}]},
    {num:3,en:"'Organisations are attracted to using algorithms because they want to make choices based on what they consider is perfect information, as well as to reduce costs and enhance productivity.'",kr:"'조직들은 자신들이 완벽한 정보라고 생각하는 것에 기반한 선택을 하고 비용을 줄이며 생산성을 높이기 위해 알고리즘 사용에 매력을 느낀다.'",grammar:"<strong>are attracted to using</strong> = ~하는 것에 매력을 느끼다. <strong>as well as</strong> = ~뿐만 아니라",vocab:[{w:"enhance productivity",pos:"phr",kr:"생산성을 높이다"}]},
    {type:"para",label:"Para 3",role:"알고리즘 의존의 위험 — 전문성 약화"},
    {num:4,en:"Pachidi believes, a short-sighted view begins to creep into working practices whereby workers learn through the 'algorithm's eyes' and become dependent on its instructions. Alternative explorations – where experimentation and human instinct lead to progress and new ideas – are effectively discouraged.",kr:"파키디는 노동자들이 '알고리즘의 눈'으로 배우고 그 지시에 의존하게 되는 근시안적인 관점이 업무 관행에 스며들기 시작한다고 믿는다. 실험과 인간적 직관이 진보와 새로운 아이디어로 이어지는 대안적 탐구는 사실상 억제된다.",grammar:"<strong>short-sighted view creeps into</strong> = 근시안적 관점이 스며들다. <strong>are effectively discouraged</strong> = 수동태(억제된다)",vocab:[{w:"short-sighted",pos:"adj",kr:"근시안적인"},{w:"instinct",pos:"n",kr:"직관, 본능"},{w:"discourage",pos:"v",kr:"억제하다"}]},
    {num:5,en:"'We are seeing cases where workers feed the algorithm with false data to reach their targets,' she reports.",kr:"'우리는 노동자들이 목표를 달성하기 위해 알고리즘에 거짓 데이터를 제공하는 사례를 보고 있습니다'라고 그녀는 보고한다.",grammar:"<strong>cases where</strong> = 관계절(장소). <strong>to reach their targets</strong> = 목적의 to부정사",vocab:[{w:"feed with false data",pos:"phr",kr:"거짓 데이터를 입력하다"}]},
    {type:"para",label:"Para 4",role:"Low의 미래 전망 — 다단계 직업 생활"},
    {num:6,en:"Economist Professor Hamish Low believes that the future of work will involve major transitions across the whole life course for everyone: 'The traditional trajectory of full-time education followed by full-time work followed by a pensioned retirement is a thing of the past.'",kr:"경제학자 해미시 로 교수는 미래의 일이 모든 사람의 전 생애에 걸쳐 큰 전환을 포함할 것이라고 믿는다: '전일제 교육에 이어 전일제 취업, 그다음 연금을 받는 은퇴로 이어지는 전통적인 경로는 이제 과거의 일이다.'",grammar:"<strong>followed by</strong> = ~에 이어지는. <strong>a thing of the past</strong> = 과거의 것",vocab:[{w:"trajectory",pos:"n",kr:"경로, 궤도"},{w:"pensioned retirement",pos:"n",kr:"연금 받는 은퇴"}]},
    {num:7,en:"'It assumes that the number of jobs is fixed. If in 30 years, half of 100 jobs are being carried out by robots, that does not mean we are left with just 50 jobs for humans. The number of jobs will increase.'",kr:"'그것은 일자리 수가 고정되어 있다고 가정합니다. 30년 후에 100개의 일자리 중 절반이 로봇에 의해 수행된다면, 그것이 인간을 위한 일자리가 50개만 남는다는 것을 의미하지는 않습니다. 일자리 수는 증가할 것입니다.'",grammar:"<strong>assumes that</strong> = ~라고 가정하다. <strong>be carried out by</strong> = ~에 의해 수행되다(수동태)",vocab:[{w:"fixed",pos:"adj",kr:"고정된"},{w:"carry out",pos:"v",kr:"수행하다"}]},
    {type:"para",label:"Para 5",role:"McGaughey — 사회 정책이 해답"},
    {num:8,en:"Dr Ewan McGaughey agrees that 'apocalyptic' views about the future of work are misguided. 'History is clear that change can mean redundancies. But social policies can tackle this through retraining and redeployment.'",kr:"에완 맥고히 박사는 미래의 일에 대한 '묵시록적' 견해는 잘못된 것이라고 동의한다. '역사는 변화가 정리해고를 의미할 수 있다는 것을 명확히 보여줍니다. 하지만 사회 정책은 재훈련과 재배치를 통해 이를 해결할 수 있습니다.'",grammar:"<strong>misguided</strong> = 잘못된. <strong>tackle through</strong> = ~을 통해 해결하다",vocab:[{w:"apocalyptic",pos:"adj",kr:"묵시록적인, 대재앙의"},{w:"redundancy",pos:"n",kr:"정리해고"},{w:"redeployment",pos:"n",kr:"재배치"}]},
    {num:9,en:"'Just as the industrial revolution brought people past subsistence agriculture, and the corporate revolution enabled mass production, a third revolution has been pronounced. But it will not only be one of technology. The next revolution will be social.'",kr:"'산업혁명이 사람들을 자급자족 농업에서 벗어나게 하고, 기업 혁명이 대량 생산을 가능하게 한 것처럼, 세 번째 혁명이 선언되었습니다. 하지만 그것은 기술의 혁명만이 아닐 것입니다. 다음 혁명은 사회적인 것이 될 것입니다.'",grammar:"<strong>Just as ... so</strong> = 마치 ~처럼. <strong>has been pronounced</strong> = 현재완료 수동",vocab:[{w:"subsistence agriculture",pos:"n",kr:"자급자족 농업"},{w:"mass production",pos:"n",kr:"대량 생산"},{w:"pronounced",pos:"adj",kr:"선언된, 두드러진"}]}

"C16_T2_P1": {
  title:"Cambridge 16 · Test 2 · Passage 1",
  topic:"The White Horse of Uffington",
  qTypes:["True / False / Not Given","Summary Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 영국 언덕 지형도 문양(거석화)"},
    {num:1,en:"The cutting of huge figures or 'geoglyphs' into the earth of English hillsides has taken place for more than 3,000 years. There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country's southern counties.",kr:"영국 언덕 경사면의 지면에 거대한 형상 또는 '지형도 문양'을 새기는 작업은 3,000년 이상 이루어져 왔다. 영국 전역에 56개의 언덕 형상이 흩어져 있으며, 대다수는 남부 지역의 백악 구릉지에 있다.",grammar:"<strong>The cutting of ... has taken place</strong> = 현재완료(지속). <strong>the vast majority</strong> = 대다수",vocab:[{w:"geoglyph",pos:"n",kr:"지형도 문양, 대지 미술"},{w:"chalk downland",pos:"n",kr:"백악 구릉지"}]},
    {num:2,en:"The most famous of these figures is perhaps also the most mysterious – the Uffington White Horse in Oxfordshire. The White Horse has recently been re-dated and shown to be even older than its previously assigned ancient pre-Roman Iron Age date.",kr:"이 형상들 중 가장 유명한 것은 아마도 가장 신비로운 것이기도 한 – 옥스퍼드셔의 어핑턴 백마이다. 백마는 최근 재연대 측정을 받아 이전에 부여된 고대 로마 시대 이전 철기 시대 연대보다 훨씬 더 오래된 것으로 밝혀졌다.",grammar:"<strong>has recently been re-dated</strong> = 현재완료 수동. <strong>shown to be</strong> = ~인 것으로 밝혀진",vocab:[{w:"re-date",pos:"v",kr:"재연대 측정하다"},{w:"Iron Age",pos:"n",kr:"철기 시대"}]},
    {type:"para",label:"Para 2",role:"지형도 문양 유지 방법 — 정기적 청소 필요"},
    {num:3,en:"The method of cutting these huge figures was simply to remove the overlying grass to reveal the gleaming white chalk below. However, the grass would soon grow over the geoglyph again unless it was regularly cleaned or scoured by a fairly large team of people.",kr:"이 거대한 형상들을 새기는 방법은 단순히 그 위에 덮인 풀을 제거하여 아래의 빛나는 흰 백악을 드러내는 것이었다. 그러나 상당히 큰 팀의 사람들이 정기적으로 청소하지 않으면 풀이 곧 다시 지형도 문양 위로 자랄 것이었다.",grammar:"<strong>unless it was regularly cleaned</strong> = unless 조건절(부정 조건). <strong>to reveal</strong> = 목적의 to부정사",vocab:[{w:"overlying grass",pos:"n",kr:"위에 덮인 풀"},{w:"gleaming",pos:"adj",kr:"빛나는"},{w:"scour",pos:"v",kr:"문질러 닦다"}]},
    {type:"para",label:"Para 3",role:"어핑턴 백마의 특징과 위치"},
    {num:4,en:"The Uffington White Horse is a unique, stylised representation of a horse consisting of a long, sleek back, thin disjointed legs, a streaming tail, and a bird-like beaked head. The horse is situated 2.5 km from Uffington village on a steep close to the Late Bronze Age hillfort of Uffington Castle and below the Ridgeway, a long-distance Neolithic track.",kr:"어핑턴 백마는 길고 매끄러운 등, 가늘고 이어지지 않는 다리, 흩날리는 꼬리, 새 부리 같은 머리로 이루어진 독특하고 양식화된 말 표현이다. 말은 어핑턴 마을에서 2.5km 떨어진 후기 청동기 시대 언덕 요새 어핑턴 성 가까운 급경사면에 위치하며, 신석기 시대 장거리 트랙인 리지웨이 아래에 있다.",grammar:"<strong>consisting of</strong> = 분사구문(구성). <strong>is situated</strong> = 위치하다(수동)",vocab:[{w:"stylised",pos:"adj",kr:"양식화된"},{w:"disjointed",pos:"adj",kr:"이어지지 않는, 불연속적인"},{w:"hillfort",pos:"n",kr:"언덕 요새"}]},
    {type:"para",label:"Para 4",role:"최초 문헌 기록 — 동전과의 유사성"},
    {num:5,en:"The earliest evidence of a horse at Uffington is from the 1070s CE when 'White Horse Hill' is mentioned in documents from the nearby Abbey of Abingdon, and the first reference to the horse itself is soon after, in 1190 CE.",kr:"어핑턴에 있는 말에 대한 가장 이른 증거는 근처 애빙던 수도원의 문서에 '화이트 호스 힐'이 언급된 기원후 1070년대이며, 말 자체에 대한 첫 번째 언급은 얼마 지나지 않은 1190년이다.",grammar:"<strong>when 'White Horse Hill' is mentioned</strong> = 관계절(시간). <strong>the first reference to</strong> = ~에 대한 첫 번째 언급",vocab:[{w:"abbey",pos:"n",kr:"수도원"},{w:"reference to",pos:"n",kr:"~에 대한 언급"}]},
    {type:"para",label:"Para 5",role:"OSL 측정 — 청동기 시대로 재편"},
    {num:6,en:"In 1995 Optically Stimulated Luminescence (OSL) testing was carried out on soil from two of the lower layers of the horse's body. The result was a date for the horse's construction somewhere between 1400 and 600 BCE – in other words, it had a Late Bronze Age or Early Iron Age origin.",kr:"1995년 말 몸체 하부 두 층의 토양에 대해 광자극발광(OSL) 테스트가 실시되었다. 결과는 말의 건설 시기가 기원전 1400년에서 600년 사이 어딘가라는 것이었다 – 즉, 후기 청동기 시대 또는 초기 철기 시대의 기원을 가지고 있다는 것이다.",grammar:"<strong>was carried out on</strong> = ~에 대해 수행되었다(수동). <strong>somewhere between A and B</strong> = A와 B 사이 어딘가",vocab:[{w:"Optically Stimulated Luminescence",pos:"n",kr:"광자극발광(OSL)"},{w:"Bronze Age",pos:"n",kr:"청동기 시대"}]},
    {type:"para",label:"Para 6",role:"말의 의미 — 켈트 여신 에포나 또는 리아논"},
    {num:7,en:"Some researchers see the horse as representing the Celtic horse goddess Epona, who was worshipped as a protector of horses, and for her associations with fertility. However, the cult of Epona was not imported from Gaul (France) until around the first century CE. This date is at least six centuries after the Uffington Horse was probably carved.",kr:"일부 연구자들은 말이 말의 수호자로 숭배되고 풍요와 관련이 있는 켈트 말 여신 에포나를 나타낸다고 본다. 그러나 에포나 숭배는 기원후 1세기경까지 갈리아(프랑스)에서 수입되지 않았다. 이 날짜는 어핑턴 말이 아마도 새겨진 것보다 적어도 6세기 이후이다.",grammar:"<strong>for her associations with</strong> = ~과의 관련으로. <strong>was not imported until</strong> = ~까지 수입되지 않았다",vocab:[{w:"Celtic",pos:"adj",kr:"켈트의"},{w:"fertility",pos:"n",kr:"풍요, 다산"},{w:"cult",pos:"n",kr:"숭배, 신앙"}]}
  ],

    {w:"chalk downland",pos:"n",pron:"/tʃɔːk ˈdaʊnlænd/",kr:"백악 구릉지",ex:"The vast majority of geoglyphs are on chalk downlands.",syn:""},

    {w:"gleaming",pos:"adj",pron:"/ˈɡliːmɪŋ/",kr:"빛나는",ex:"The chalk below gleams white when the grass is removed.",syn:"shining, bright"},
    {w:"hillfort",pos:"n",pron:"/ˈhɪlfɔːt/",kr:"언덕 요새",ex:"The horse is near the Late Bronze Age hillfort.",syn:"fortified hill, stronghold"},

  tfng:[
    {qNum:1,stmt:"Most geoglyphs in England are located in a particular area of the country.",correct:"TRUE",mine:"",evPara:"Para 1",ev:"There are 56 hill figures scattered around England, with <mark>the vast majority on the chalk downlands of the country's southern counties.</mark>",why:"남부 지역 백악 구릉지에 대다수가 집중되어 있다 = 특정 지역에 위치.",trap:""},

    {qNum:3,stmt:"A recent dating of the Uffington White Horse indicates that people were mistaken about its age.",correct:"TRUE",mine:"",evPara:"Para 1",ev:"The White Horse has recently been re-dated and shown to be <mark>even older than its previously assigned</mark> ancient pre-Roman Iron Age date.",why:"이전 연대가 틀렸음을 입증했다.",trap:""},
    {qNum:4,stmt:"Historians have come to an agreement about the origins of the Long Man of Wilmington.",correct:"FALSE",mine:"",evPara:"Para 1",ev:"More controversial is the date of the Long Man of Wilmington. While <mark>many historians are convinced the figure is prehistoric, others believe</mark> that it was created between the 11th and 15th centuries.",why:"동의하지 않고 논쟁 중이다.",trap:""},

"C16_T2_P2": {
  title:"Cambridge 16 · Test 2 · Passage 2",
  topic:"I Contain Multitudes — Microbes",
  qTypes:["Multiple Choice","Summary Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 미생물은 어디에나 존재한다"},
    {num:1,en:"Microbes, most of them bacteria, have populated this planet since long before animal life developed and they will outlive us. Invisible to the naked eye, they are ubiquitous.",kr:"미생물, 대부분이 박테리아인 이들은 동물 생명이 발전하기 훨씬 이전부터 이 행성에 서식해 왔으며 우리보다 오래 살아남을 것이다. 육안으로 볼 수 없는 이들은 어디에나 있다.",grammar:"<strong>have populated</strong> = 현재완료(지속). <strong>Invisible to the naked eye</strong> = 분사구문(상태)",vocab:[{w:"microbe",pos:"n",kr:"미생물"},{w:"ubiquitous",pos:"adj",kr:"어디에나 있는, 편재하는"}]},
    {type:"para",label:"Para 2",role:"인간 세포 vs. 미생물 세포"},
    {num:2,en:"Every species has its own colony of microbes, called a 'microbiome'. What is amazing is that while the number of human cells in the average person is about 30 trillion, the number of microbial ones is higher – about 39 trillion. At best, we are only 50 per cent human.",kr:"모든 종은 '마이크로바이옴'이라고 불리는 자신만의 미생물 군집을 가지고 있다. 놀라운 것은 평균적인 사람의 인간 세포 수가 약 30조인 반면, 미생물 세포 수는 더 많은 약 39조라는 것이다. 기껏해야 우리는 50% 인간에 불과하다.",grammar:"<strong>What is amazing is that</strong> = 강조 구문(what절 주어). <strong>At best</strong> = 기껏해야",vocab:[{w:"microbiome",pos:"n",kr:"마이크로바이옴(미생물군집)"},{w:"trillion",pos:"n",kr:"조(1,000,000,000,000)"}]},
    {num:3,en:"Microbes that sit contentedly in the human gut can become deadly if they find their way into the bloodstream. These communities are constantly changing too. The right hand shares just one sixth of its microbes with the left hand.",kr:"인간의 장에서 만족스럽게 사는 미생물도 혈류로 들어가면 치명적이 될 수 있다. 이 군집들은 또한 끊임없이 변화한다. 오른손은 왼손과 단지 6분의 1의 미생물만 공유한다.",grammar:"<strong>if they find their way into</strong> = ~으로 들어가면. <strong>constantly changing</strong> = 현재분사(상태)",vocab:[{w:"gut",pos:"n",kr:"장, 내장"},{w:"bloodstream",pos:"n",kr:"혈류"}]},
    {type:"para",label:"Para 3",role:"반 레이우엔훅의 발견 — 파스퇴르의 세균 이론"},
    {num:4,en:"The first man to see these extraordinarily potent creatures was a Dutch lens-maker called Antony van Leeuwenhoek in the 1670s. Using microscopes of his own design, he examined a drop of water from a nearby lake and found it teeming with tiny creatures he called 'animalcules'.",kr:"이 놀랍도록 강력한 생물들을 처음 본 사람은 1670년대의 안토니 반 레이우엔훅이라는 네덜란드 렌즈 제조업자였다. 자신이 설계한 현미경을 사용하여 그는 근처 호수에서 뜬 물 한 방울을 조사하고 그것이 그가 '아니말쿨'이라고 부른 작은 생물들로 가득하다는 것을 발견했다.",grammar:"<strong>The first man to see</strong> = to부정사 형용사 용법. <strong>teeming with</strong> = ~으로 가득한",vocab:[{w:"potent",pos:"adj",kr:"강력한, 효능 있는"},{w:"teeming with",pos:"adj",kr:"~으로 가득한"}]},
    {type:"para",label:"Para 4",role:"미생물 내성 주장 — 공생 관계"},
    {num:5,en:"The book argues that we should not view bacteria as either friends or foes, villains or heroes. Instead we should realise we have a symbiotic relationship, that can be mutually beneficial or mutually destructive.",kr:"이 책은 우리가 박테리아를 친구나 적, 악당이나 영웅으로 볼 것이 아니라고 주장한다. 대신 우리는 상호 이익이 될 수도, 상호 파괴적이 될 수도 있는 공생 관계를 가지고 있다는 것을 인식해야 한다.",grammar:"<strong>either ... or</strong> = ~이거나 ~인. <strong>mutually beneficial or destructive</strong> = 상호 병렬",vocab:[{w:"symbiotic",pos:"adj",kr:"공생의"},{w:"mutually",pos:"adv",kr:"상호적으로"}]},
    {type:"para",label:"Para 5",role:"미생물의 역할 — 소화·면역·비만 조절"},
    {num:6,en:"New research is now unravelling the ways in which bacteria aid digestion, regulate our immune systems, eliminate toxins, produce vitamins, affect our behaviour and even combat obesity. But our obsession with hygiene, our overuse of antibiotics and our unhealthy, low-fibre diets are disrupting the bacterial balance.",kr:"새로운 연구는 이제 박테리아가 소화를 돕고, 면역 체계를 조절하고, 독소를 제거하고, 비타민을 생산하고, 우리의 행동에 영향을 미치며 심지어 비만과 싸우는 방식을 풀어내고 있다. 하지만 위생에 대한 집착, 항생제 남용, 건강에 해롭고 섬유질이 적은 식단이 박테리아 균형을 깨뜨리고 있다.",grammar:"<strong>unravelling the ways in which</strong> = ~하는 방식을 풀어내다. <strong>obsession with</strong> = ~에 대한 집착",vocab:[{w:"unravel",pos:"v",kr:"풀어내다, 해명하다"},{w:"obsession",pos:"n",kr:"집착"},{w:"disrupt",pos:"v",kr:"깨뜨리다, 방해하다"}]},
    {type:"para",label:"Para 6",role:"최신 연구 — 항균 제품의 역설적 위험"},
    {num:7,en:"Studies show that the excessive use of household detergents and antibacterial products actually destroys the microbes that normally keep the more dangerous germs at bay. Other studies show that keeping a dog as a pet gives children early exposure to a diverse range of bacteria, which may help protect them against allergies later.",kr:"연구에 따르면 가정용 세제와 항균 제품의 과도한 사용이 실제로 더 위험한 세균을 막는 미생물을 파괴한다. 다른 연구들은 개를 반려동물로 키우는 것이 아이들에게 다양한 범위의 박테리아에 일찍 노출되게 하여 나중에 알레르기로부터 보호하는 데 도움이 될 수 있다는 것을 보여준다.",grammar:"<strong>keep ... at bay</strong> = ~을 멀리하다, 막다. <strong>which may help</strong> = 계속적 관계절",vocab:[{w:"detergent",pos:"n",kr:"세제"},{w:"keep at bay",pos:"phr",kr:"~을 막다, 멀리하다"}]}
  ],

"C16_T2_P3": {
  title:"Cambridge 16 · Test 2 · Passage 3",
  topic:"How to Make Wise Decisions",
  qTypes:["Multiple Choice","Summary Completion","True / False / Not Given"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 지혜는 특별한 사람들만의 것이 아니다"},
    {num:1,en:"Although the truly wise may seem few and far between, empirical research examining wisdom suggests that it is not an exceptional trait possessed by a small handful of bearded philosophers after all – in fact, the latest studies suggest that most of us have the ability to make wise decisions, given the right context.",kr:"진정으로 지혜로운 사람들은 드물어 보일 수 있지만, 지혜를 조사하는 경험적 연구에 따르면 그것은 결국 소수의 수염 난 철학자들만이 가진 특별한 특성이 아니라 – 사실 최신 연구들은 대부분의 우리가 올바른 맥락이 주어지면 현명한 결정을 내릴 수 있는 능력을 가지고 있다고 제안한다.",grammar:"<strong>few and far between</strong> = 드문. <strong>given the right context</strong> = 올바른 맥락이 주어지면(조건 분사구문)",vocab:[{w:"empirical",pos:"adj",kr:"경험적인"},{w:"exceptional trait",pos:"n",kr:"특별한 특성"},{w:"given",pos:"conj",kr:"~이 주어지면"}]},
    {type:"para",label:"Para 2",role:"Grossmann — 지혜는 상황적 요소에 달려 있다"},
    {num:2,en:"'It appears that experiential, situational, and cultural factors are even more powerful in shaping wisdom than previously imagined,' says Associate Professor Igor Grossmann. 'People's ability to reason wisely varies dramatically across experiential and situational contexts.'",kr:"'경험적, 상황적, 문화적 요인들이 이전에 상상했던 것보다 지혜를 형성하는 데 훨씬 더 강력하다는 것이 나타납니다'라고 이고르 그로스만 부교수가 말한다. '현명하게 추론하는 사람들의 능력은 경험적, 상황적 맥락에 따라 극적으로 다양합니다.'",grammar:"<strong>varies dramatically across</strong> = ~에 따라 극적으로 다양하다. <strong>It appears that</strong> = 가주어-진주어",vocab:[{w:"situational",pos:"adj",kr:"상황적인"},{w:"dramatically",pos:"adv",kr:"극적으로"}]},
    {type:"para",label:"Para 3",role:"지혜의 4가지 특성"},
    {num:3,en:"Grossmann and his colleagues have identified four key characteristics as part of a framework of wise reasoning: intellectual humility, appreciation of perspectives wider than the issue at hand, sensitivity to the possibility of change in social relations, and compromise or integration of different attitudes.",kr:"그로스만과 동료들은 현명한 추론 체계의 일부로 네 가지 핵심 특성을 확인했다: 지적 겸손, 당면 문제보다 넓은 관점에 대한 인식, 사회적 관계 변화 가능성에 대한 민감성, 그리고 다양한 태도의 타협 또는 통합이다.",grammar:"<strong>have identified</strong> = 현재완료(발견·확인). <strong>as part of</strong> = ~의 일부로서",vocab:[{w:"intellectual humility",pos:"n",kr:"지적 겸손"},{w:"sensitivity to",pos:"n",kr:"~에 대한 민감성"},{w:"compromise",pos:"n/v",kr:"타협(하다)"}]},
    {type:"para",label:"Para 4",role:"제3자 관점 전략 — 객관적 시각이 현명한 결정 유도"},
    {num:4,en:"One of the most reliable ways to support wisdom in our own day-to-day decisions is to look at scenarios from a third-party perspective, as though giving advice to a friend. When adopting a third-person 'observer' viewpoint we reason more broadly and focus more on interpersonal and moral ideals such as justice and impartiality.",kr:"일상적 결정에서 지혜를 지원하는 가장 신뢰할 수 있는 방법 중 하나는 친구에게 조언을 주는 것처럼 제3자의 관점에서 시나리오를 바라보는 것이다. 제3자 '관찰자' 관점을 취할 때 우리는 더 넓게 추론하고 정의와 공정성 같은 대인 관계 및 도덕적 이상에 더 집중한다.",grammar:"<strong>as though giving advice</strong> = 마치 조언을 주는 것처럼(가정법). <strong>interpersonal</strong> = 대인 관계의",vocab:[{w:"third-party perspective",pos:"n",kr:"제3자 관점"},{w:"impartiality",pos:"n",kr:"공정성, 불편부당"}]},
    {type:"para",label:"Para 5",role:"실험 증거 — 졸업생 취업 전망 실험"},
    {num:5,en:"In one experiment during an economic recession, graduating college seniors were asked to reflect on their job prospects. Students instructed to imagine their career 'as if you were a distant observer' displayed more wisdom-related reasoning than those in the control group.",kr:"경기 침체 기간 동안 한 실험에서, 졸업 예정 대학 4학년 학생들이 취업 전망에 대해 성찰하도록 요청받았다. '마치 당신이 멀리 있는 관찰자인 것처럼' 커리어를 상상하도록 지시받은 학생들은 통제 그룹의 학생들보다 더 많은 지혜 관련 추론을 보여줬다.",grammar:"<strong>instructed to imagine</strong> = 과거분사 후치수식. <strong>as if ... were</strong> = 가정법 과거",vocab:[{w:"recession",pos:"n",kr:"경기 침체"},{w:"control group",pos:"n",kr:"통제 그룹"}]},
    {type:"para",label:"Para 6",role:"커플 실험 — 관점 전환이 더 현명한 갈등 해결 유도"},
    {num:6,en:"Couples in the 'other's eyes' condition were significantly more likely to rely on wise reasoning – recognizing others' perspectives and searching for a compromise – compared to the couples in the egocentric condition.",kr:"'타인의 눈' 조건의 커플들은 자기중심적 조건의 커플들에 비해 현명한 추론 - 타인의 관점 인식과 타협 추구 - 에 의존할 가능성이 훨씬 더 높았다.",grammar:"<strong>significantly more likely to</strong> = 훨씬 더 ~할 가능성이 높은. <strong>egocentric</strong> = 자기중심적",vocab:[{w:"egocentric",pos:"adj",kr:"자기중심적인"},{w:"compromise",pos:"n",kr:"타협"}]}

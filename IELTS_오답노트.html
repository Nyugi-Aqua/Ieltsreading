"C19_T3_P3": {
  title:"Cambridge 19 · Test 3 · Passage 3",
  topic:"Is the Era of Artificial Speech Translation Upon Us?",
  qTypes:["Multiple Choice","Sentence Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 소음이 AI 번역의 주요 도전"},
    {num:1,en:"Noise, Alex Waibel tells me, is one of the major challenges that artificial speech translation has to meet. A device may be able to recognise speech in a laboratory, or a meeting room, but will struggle to cope with the kind of background noise in a busy station.",kr:"알렉스 와이벨은 소음이 인공 음성 번역이 직면해야 하는 주요 도전 중 하나라고 말한다. 기기는 실험실이나 회의실에서 음성을 인식할 수 있지만, 바쁜 역에서의 배경 소음에는 대처하기 어려울 것이다.",grammar:"<strong>will struggle to cope with</strong> = ~에 대처하기 어려울 것이다. <strong>background noise</strong> = 배경 소음",vocab:[{w:"artificial speech translation",pos:"n",kr:"인공 음성 번역"},{w:"background noise",pos:"n",kr:"배경 소음"}]},
    {type:"para",label:"Para 2",role:"카를스루에 대학 — 독일어 강의 영어 번역"},
    {num:2,en:"At Karlsruhe Institute of Technology, Waibel and his colleagues already give lectures in German that their students can follow in English via an electronic translator. The system generates text that students can read on their laptops. It helps that lecturers speak clearly, don't have to compete with background chatter, and say much the same thing each year.",kr:"카를스루에 공과대학에서 와이벨과 동료들은 이미 독일어로 강의하고 학생들이 전자 번역기를 통해 영어로 따라갈 수 있다. 시스템은 학생들이 노트북에서 읽을 수 있는 텍스트를 생성한다. 강사들이 명확하게 말하고, 배경 잡담과 경쟁할 필요가 없으며, 매년 거의 같은 내용을 말한다는 것이 도움이 된다.",grammar:"<strong>via an electronic translator</strong> = 전자 번역기를 통해. <strong>It helps that</strong> = 가주어-진주어",vocab:[{w:"via",pos:"prep",kr:"~을 통해"},{w:"chatter",pos:"n",kr:"잡담"}]},
    {type:"para",label:"Para 3",role:"바벨 피시 — 오래된 꿈의 실현"},
    {num:3,en:"The idea of artificial speech translation has been around for a long time. Douglas Adams' novel The Hitchhiker's Guide to the Galaxy, published in 1979, featured a life form called the 'Babel fish' which enabled a listener to understand any language. Now devices that look like prototype Babel fish have started to appear.",kr:"인공 음성 번역의 아이디어는 오래전부터 있었다. 1979년 출판된 더글러스 애덤스의 소설 '은하수를 여행하는 히치하이커를 위한 안내서'에는 청취자가 어떤 언어든 이해할 수 있게 하는 '바벨 피시'라는 생명체가 등장했다. 이제 원형 바벨 피시처럼 보이는 기기들이 나타나기 시작했다.",grammar:"<strong>featured a life form called</strong> = 과거분사 후치수식. <strong>has been around for a long time</strong> = 현재완료",vocab:[{w:"Babel fish",pos:"n",kr:"바벨 피시(범용 번역기 비유)"},{w:"prototype",pos:"n",kr:"원형, 시제품"}]},
    {type:"para",label:"Para 4",role:"현재 번역 기기의 한계 — 전문가용 부족"},
    {num:4,en:"They seem to be regarded as eye-catching novelties rather than steps towards a 'language-transparent society'. They tend to be domestic devices suitable for hotel check-ins. However, 'Professionals are less inclined to be patient in a conversation,' says Andrew Ochoa. Waverly Labs is preparing a new model for professional applications.",kr:"그것들은 '언어 투명 사회'를 향한 단계보다 눈길을 끄는 신기함으로 여겨지는 것 같다. 주로 호텔 체크인에 적합한 가정용 기기들이다. 그러나 '전문가들은 대화에서 인내심이 적습니다'라고 앤드루 오차가 말한다. 웨이버리 랩스는 전문가용 애플리케이션을 위한 새 모델을 준비하고 있다.",grammar:"<strong>rather than steps towards</strong> = ~로의 단계보다는. <strong>are less inclined to be patient</strong> = ~하려는 경향이 적다",vocab:[{w:"novelty",pos:"n",kr:"신기함, 참신함"},{w:"inclined to",pos:"adj",kr:"~하려는 경향이 있는"}]},
    {type:"para",label:"Para 5",role:"미래 과제 — 동시 번역·오프라인·예절"},
    {num:5,en:"A translation system needs to be simultaneous, rather than in sections that oblige speakers to pause. It needs to work offline, and to address apprehensions about private speech data accumulating in the cloud. Systems will also need to be socially aware by addressing people in the right way.",kr:"번역 시스템은 화자가 멈춰 기다리도록 하는 섹션 방식이 아닌 동시 방식이 필요하다. 오프라인으로 작동해야 하며, 클라우드에 개인 음성 데이터가 누적되는 것에 대한 우려를 해결해야 한다. 시스템은 또한 사람들을 적절한 방식으로 대하는 사회적 인식도 필요할 것이다.",grammar:"<strong>rather than in sections that oblige</strong> = ~보다는. <strong>to address apprehensions</strong> = 우려를 해결하다",vocab:[{w:"simultaneous",pos:"adj",kr:"동시의"},{w:"apprehension",pos:"n",kr:"우려, 불안"}]},
    {type:"para",label:"Para 6",role:"결론 — 공유 언어의 사회적 가치"},
    {num:6,en:"Whatever uses it is put to, it will never be as good as the real thing. The contrast will underline the value of shared languages, and the value of learning them. Though the practical need for a common language will diminish, the social value of sharing one will persist. And software will never be a substitute for the subtle understanding that comes with knowledge of a language.",kr:"어떤 용도로 사용되든, 실제와 같은 수준에는 결코 미치지 못할 것이다. 그 대조는 공유 언어의 가치와 그것을 배우는 가치를 강조할 것이다. 공통 언어에 대한 실용적 필요성이 줄어들더라도, 하나를 공유하는 사회적 가치는 지속될 것이다. 그리고 소프트웨어는 언어에 대한 지식에서 오는 미묘한 이해의 대체가 결코 될 수 없다.",grammar:"<strong>Whatever uses it is put to</strong> = 양보 관계절. <strong>will persist</strong> = 지속될 것이다",vocab:[{w:"persist",pos:"v",kr:"지속되다"},{w:"subtle",pos:"adj",kr:"미묘한"}]}
  ],
  allVocab:[
    {w:"background noise",pos:"n",pron:"/ˈbækɡraʊnd nɔɪz/",kr:"배경 소음",ex:"Devices struggle to cope with background noise.",syn:"ambient noise"},
    {w:"Babel fish",pos:"n",pron:"/ˈbeɪbl fɪʃ/",kr:"바벨 피시(범용 번역기 비유)",ex:"The Babel fish is a fictional universal translator from The Hitchhiker's Guide.",syn:""},

    {w:"persist",pos:"v",pron:"/pəˈsɪst/",kr:"지속되다",ex:"The social value of sharing a language will persist.",syn:"continue, endure"},

  ],
  tfng:[

"C19_T4_P1": {
  title:"Cambridge 19 · Test 4 · Passage 1",
  topic:"The Impact of Climate Change on Butterflies in Britain",
  qTypes:["True / False / Not Given","Notes Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 영국 나비 개체수 감소"},
    {num:1,en:"According to conservationists, populations of around two thirds of butterfly species have declined in Britain over the past 40 years. If this trend continues, it might have unpredictable knock-on effects for other species in the ecosystem. Caterpillars consume vast quantities of plant material, and in turn act as prey for birds as well as bats and other small mammals.",kr:"보전 전문가들에 따르면 약 40년 동안 영국에서 나비 종의 약 3분의 2의 개체수가 감소했다. 이 추세가 계속된다면 생태계의 다른 종들에게 예측 불가능한 연쇄 효과를 미칠 수 있다. 애벌레는 엄청난 양의 식물 재료를 먹고, 차례로 새와 박쥐, 다른 소형 포유류의 먹이가 된다.",grammar:"<strong>knock-on effects</strong> = 연쇄 효과. <strong>in turn act as prey</strong> = 차례로 먹이가 되다",vocab:[{w:"knock-on effect",pos:"n",kr:"연쇄 효과"},{w:"prey",pos:"n",kr:"먹이"}]},
    {type:"para",label:"Para 2",role:"표현형 가소성 — 계절 타이밍 변화"},
    {num:2,en:"One of the main ways in which species are ensuring conditions suit them is by changing the time of year at which they are active and reproduce. Scientists refer to the timing of such lifecycle events as 'phenology'. When an animal starts to do something earlier in the year than it usually does, it is said to be 'advancing its phenology'.",kr:"종들이 자신에게 맞는 조건을 확보하는 주요 방법 중 하나는 활발하게 활동하고 번식하는 시기를 변경하는 것이다. 과학자들은 이러한 생애 주기 사건의 타이밍을 '표현형'이라고 한다. 동물이 보통보다 더 일찍 무언가를 시작하면 '표현형을 앞당기는 것'이라고 한다.",grammar:"<strong>by changing the time of year</strong> = 수단 분사구문. <strong>it is said to be</strong> = ~이라고 한다(수동 추측)",vocab:[{w:"phenology",pos:"n",kr:"표현형(생애주기 타이밍)"},{w:"lifecycle event",pos:"n",kr:"생애주기 사건"}]},
    {type:"para",label:"Para 3",role:"데이터 수집 — 130종 20년 기록"},
    {num:3,en:"The researchers pulled together data from millions of records submitted by butterfly enthusiasts. This provided information on 130 species of butterflies in Great Britain every year for a 20-year period. They estimated the abundance and distribution of each species, along with how far north they had moved, and changes in what time of the year each species was changing into an adult butterfly.",kr:"연구자들은 나비 애호가들이 제출한 수백만 건의 기록에서 데이터를 모았다. 이것은 20년 기간 동안 매년 영국의 130종 나비에 대한 정보를 제공했다. 그들은 각 종의 풍부도와 분포, 북쪽으로 얼마나 이동했는지, 그리고 각 종이 성체 나비로 변하는 시기의 미묘한 변화를 추정했다.",grammar:"<strong>submitted by butterfly enthusiasts</strong> = 과거분사 후치수식. <strong>along with</strong> = ~와 함께",vocab:[{w:"abundance",pos:"n",kr:"풍부도"},{w:"distribution",pos:"n",kr:"분포"}]},
    {type:"para",label:"Para 4",role:"Small Blue — 다세대 번식 나비의 혜택"},
    {num:4,en:"Species with more flexible lifecycles were more likely to benefit from an earlier emergence driven by climate change. Among these species, researchers observed that those which have been advancing their phenology the most also had the most positive trends in abundance, distribution and northwards extent. Britain's tiniest butterfly, the Small Blue, whose colonies are up to a hundred strong, develops into butterflies early in spring, allowing summer generations to complete another reproductive cycle by autumn.",kr:"더 유연한 생애 주기를 가진 종들이 기후 변화로 인한 더 이른 출현의 혜택을 받을 가능성이 더 높았다. 이 종들 중에서 표현형을 가장 많이 앞당긴 종들이 풍부도, 분포, 북쪽 확장에서도 가장 긍정적인 추세를 보였다. 영국에서 가장 작은 나비인 작은 푸른나비는 최대 100마리의 군체를 이루며 봄 초에 나비로 성장하여 여름 세대가 가을까지 또 다른 번식 주기를 완성할 수 있다.",grammar:"<strong>driven by climate change</strong> = 과거분사 후치수식. <strong>allowing summer generations to complete</strong> = 분사구문(결과)",vocab:[{w:"colony",pos:"n",kr:"군체, 집단"},{w:"reproductive cycle",pos:"n",kr:"번식 주기"}]},
    {type:"para",label:"Para 5",role:"High Brown Fritillary — 단세대 나비의 위협"},
    {num:5,en:"Other species are less flexible and restricted to a single reproductive cycle per year. For these species, there was no evidence of any benefit to emerging earlier. The High Brown Fritillary, often described as Britain's most endangered butterfly, is found only in coppiced woodland and limestone pavement habitats. It is a single-generation butterfly that has advanced its phenology, suggesting climate change might have played a part in its downfall.",kr:"다른 종들은 덜 유연하고 연간 단일 번식 주기로 제한된다. 이 종들에게는 더 일찍 나타나는 것의 혜택에 대한 증거가 없었다. 종종 영국에서 가장 멸종 위기에 처한 나비로 묘사되는 고산표범나비는 잡목 숲과 석회암 포도 서식지에서만 발견된다. 표현형을 앞당긴 단세대 나비로서 기후 변화가 그것의 쇠퇴에 역할을 했을 수 있음을 시사한다.",grammar:"<strong>restricted to a single reproductive cycle</strong> = 단일 번식 주기로 제한된. <strong>suggesting climate change might have played</strong> = 분사구문(추측)",vocab:[{w:"endangered",pos:"adj",kr:"멸종 위기의"},{w:"coppiced woodland",pos:"n",kr:"잡목 숲"},{w:"downfall",pos:"n",kr:"쇠퇴, 몰락"}]},
    {type:"para",label:"Para 6",role:"희망 — 기후 따뜻해지면 단세대가 다세대로"},
    {num:6,en:"Many of Britain's single-generation species show the capacity, in continental Europe, to add a second generation in years that are sufficiently warm. Therefore, as the climate continues to warm, species like the Silver-studded Blue might be able to switch to multiple generations in the UK as well, potentially leading to population increases.",kr:"영국의 많은 단세대 종들은 유럽 대륙에서 충분히 따뜻한 해에 두 번째 세대를 추가하는 능력을 보여준다. 따라서 기후가 계속 따뜻해지면 은줄표범나비와 같은 종들도 영국에서 다세대로 전환할 수 있어 개체수 증가로 이어질 수 있다.",grammar:"<strong>show the capacity to add</strong> = ~을 추가할 능력을 보여주다. <strong>potentially leading to</strong> = 분사구문(결과)",vocab:[{w:"Silver-studded Blue",pos:"n",kr:"은줄표범나비"},{w:"switch to",pos:"v",kr:"~로 전환하다"}]}
  ],
  allVocab:[
    {w:"phenology",pos:"n",pron:"/fɪˈnɒlədʒi/",kr:"표현형(생애주기 타이밍)",ex:"Scientists refer to the timing of lifecycle events as phenology.",syn:""},
    {w:"knock-on effect",pos:"n",pron:"/ˌnɒk ɒn ɪˈfekt/",kr:"연쇄 효과",ex:"The decline may have unpredictable knock-on effects.",syn:"chain reaction, ripple effect"},

    {w:"endangered",pos:"adj",pron:"/ɪnˈdeɪndʒəd/",kr:"멸종 위기의",ex:"The High Brown Fritillary is Britain's most endangered butterfly.",syn:"threatened, at risk"},
    {w:"coppiced woodland",pos:"n",pron:"/ˈkɒpɪst ˈwʊdlænd/",kr:"잡목 숲",ex:"The High Brown Fritillary is found only in coppiced woodland.",syn:""},
    {w:"downfall",pos:"n",pron:"/ˈdaʊnfɔːl/",kr:"쇠퇴, 몰락",ex:"Climate change may have played a part in the species' downfall.",syn:"decline, collapse"},

  tfng:[
    {qNum:1,stmt:"Forty years ago, there were fewer butterflies in Britain than at present.",correct:"FALSE",mine:"",evPara:"Para 1",ev:"Populations of around two thirds of butterfly species <mark>have declined in Britain over the past 40 years.</mark>",why:"40년간 감소했다 = 40년 전에 더 많았다 — 오늘날이 더 적다는 것이 진술의 반대.",trap:"지문의 감소가 현재에서 과거로인지, 과거에서 현재로인지 주의"},
    {qNum:2,stmt:"Caterpillars are eaten by a number of different predators.",correct:"TRUE",mine:"",evPara:"Para 1",ev:"Caterpillars act as prey for <mark>birds as well as bats and other small mammals.</mark>",why:"새·박쥐·포유류 여러 포식자들에게 먹힌다.",trap:""},
    {qNum:3,stmt:"'Phenology' is a term used to describe a creature's ability to alter the location of a lifecycle event.",correct:"FALSE",mine:"",evPara:"Para 2",ev:"Scientists refer to the <mark>timing</mark> of such lifecycle events as 'phenology'.",why:"위치(location)가 아니라 타이밍(timing)이다.",trap:""},
    {qNum:4,stmt:"Some species of butterfly have a reduced lifespan due to spring temperature increases.",correct:"NOT GIVEN",mine:"",evPara:"-",ev:"",why:"수명 감소에 대한 정보가 없다.",trap:""},
    {qNum:5,stmt:"There is a clear reason for the adaptations that butterflies are making to climate change.",correct:"FALSE",mine:"",evPara:"Para 2",ev:"Is this a sign that butterflies are well equipped to cope? Or are these populations under stress? The answer is <mark>still unknown.</mark>",why:"이유가 여전히 불분명하다.",trap:""},
    {qNum:6,stmt:"The data used in the study was taken from the work of amateur butterfly watchers.",correct:"TRUE",mine:"",evPara:"Para 3",ev:"Data from millions of records submitted by <mark>butterfly enthusiasts – people who spend their free time observing</mark> different species.",why:"여가 시간에 나비를 관찰하는 사람들 = 아마추어 관찰자.",trap:""}

  summary:"Cambridge 19 Test 4 Passage 1. 40년간 영국 나비 3분의 2 종이 감소했다. 유연한 다세대 생애주기를 가진 나비(Small Blue)는 기후 변화 혜택을 받지만, 단세대 특화 나비(High Brown Fritillary)는 위협에 직면했다. 온난화가 심화되면 단세대 나비도 다세대로 전환할 가능성이 있다."

"C19_T4_P2": {
  title:"Cambridge 19 · Test 4 · Passage 2",
  topic:"Deep-Sea Mining",
  qTypes:["Section Matching","People Matching","Summary Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 심해 스폰지 박테리아가 항생제 내성균 잡는다"},
    {num:1,en:"Professor Mat Upton found that a microbe from a deep-sea sponge was killing pathogenic bugs in his laboratory. Further tests confirmed that an antibiotic from the sponge bacteria, found living more than 700 metres under the sea, was previously unknown to science, boosting its potential as a life-saving medicine.",kr:"맷 업턴 교수는 실험실에서 심해 스폰지의 미생물이 병원성 세균을 죽이고 있다는 것을 발견했다. 추가 테스트에서 해저 700미터 이상에서 발견된 스폰지 박테리아의 항생제가 이전에 과학에 알려지지 않은 것으로 확인되어 생명을 구하는 의약품으로서의 잠재성이 높아졌다.",grammar:"<strong>was previously unknown to science</strong> = 수동태(이전에 알려지지 않은). <strong>boosting its potential</strong> = 분사구문(결과)",vocab:[{w:"pathogenic",pos:"adj",kr:"병원성의"},{w:"antibiotic",pos:"n",kr:"항생제"}]},
    {type:"para",label:"Para B",role:"심해 탐사의 의약 잠재성 — 채굴 전 연구 필요"},
    {num:2,en:"'We're looking at the bioactive potential of marine resources, to see if there are any more medicines or drugs down there before we destroy it for ever,' says Upton. Oceanographers using remotely operated vehicles have spotted many new species: sea cucumbers with tails and a rare 'Dumbo' octopus, found 3,000 metres under the Pacific Ocean.",kr:"'우리는 영원히 파괴하기 전에 더 많은 의약품이나 약물이 있는지 확인하기 위해 해양 자원의 생물 활성 잠재성을 살펴보고 있습니다'라고 업턴이 말한다. 원격 조종 차량을 사용하는 해양학자들이 꼬리가 있는 해삼과 태평양 3,000미터 아래에서 발견된 희귀한 '덤보' 문어 등 많은 새 종을 발견했다.",grammar:"<strong>to see if there are any more</strong> = 목적 to부정사 + if절. <strong>before we destroy it for ever</strong> = 시간 부사절",vocab:[{w:"bioactive",pos:"adj",kr:"생물 활성의"},{w:"remotely operated vehicle",pos:"n",kr:"원격 조종 차량"}]},
    {type:"para",label:"Para C",role:"심해 광물 자원 — 채굴 방법"},
    {num:3,en:"The deep sea contains more nickel, cobalt and rare earth metals than all land reserves combined. Mining corporations argue that deep-sea exploration could help diversify the supply of metals. Different methods exist, but most involve converting machinery previously used in terrestrial mining to excavate materials from depths up to 6,000 metres, then drawing a seawater slurry from the sea floor to ships on the surface.",kr:"심해에는 전 세계 육상 매장량을 합친 것보다 더 많은 니켈, 코발트, 희토류 금속이 있다. 광산 기업들은 심해 탐사가 금속 공급을 다양화하는 데 도움이 될 수 있다고 주장한다. 다양한 방법이 존재하지만 대부분 육상 광업에 사용되던 기계를 개조하여 최대 6,000미터 깊이에서 재료를 발굴하고, 해저에서 선박으로 해수 슬러리를 끌어올리는 방식이다.",grammar:"<strong>previously used in terrestrial mining</strong> = 과거분사 후치수식. <strong>then drawing</strong> = 분사구문(순서)",vocab:[{w:"rare earth metals",pos:"n",kr:"희토류 금속"},{w:"slurry",pos:"n",kr:"슬러리(진흙탕)"}]},
    {type:"para",label:"Para D",role:"환경·법적 우려 — 미지의 생태계"},
    {num:4,en:"Environmental and legal groups have urged caution, arguing there are potentially massive and unknown ramifications for the environment and nearby communities. 'The surface of the Moon, Mars and even Venus have all been mapped and studied in much greater detail than the deep sea, leading marine scientists to commonly remark: We do not yet know what we need to know.'",kr:"환경·법률 단체들은 환경과 인근 지역사회에 대한 잠재적으로 엄청나고 알 수 없는 영향이 있다고 주장하며 신중함을 촉구하고 있다. '달, 화성, 심지어 금성의 표면이 심해보다 훨씬 더 상세하게 지도화되고 연구되었으며, 이는 해양 과학자들이 일반적으로 이렇게 말하도록 이끈다: 우리는 아직 알아야 할 것을 알지 못합니다.'",grammar:"<strong>urge caution</strong> = 신중을 촉구하다. <strong>leading marine scientists to remark</strong> = 분사구문(결과)",vocab:[{w:"ramification",pos:"n",kr:"영향, 결과"},{w:"urge caution",pos:"phr",kr:"신중을 촉구하다"}]},
    {type:"para",label:"Para E",role:"수열공 생태계 — 심해 생물다양성"},
    {num:5,en:"Scientific research has suggested the deep seabed, and hydrothermal vents, which are created when seawater meets volcanic magma, have crucial impacts upon biodiversity and the global climate. 'It is becoming increasingly clear that deep-sea mining poses a grave threat to these vital seabed functions,' and 'we don't want mining on them,' says Dr Jon Copley.",kr:"과학 연구는 심해 해저와 해수가 화산 마그마를 만날 때 생성되는 열수공이 생물다양성과 지구 기후에 중요한 영향을 미친다고 제안했다. '심해 채굴이 이 중요한 해저 기능에 심각한 위협을 가한다는 것이 점점 더 명확해지고 있으며', '우리는 그곳에서 채굴을 원하지 않습니다'라고 코플리 박사가 말한다.",grammar:"<strong>which are created when</strong> = 관계절 + 시간 부사절. <strong>It is becoming increasingly clear that</strong> = 가주어-진주어",vocab:[{w:"hydrothermal vent",pos:"n",kr:"열수공"},{w:"magma",pos:"n",kr:"마그마"}]},
    {type:"para",label:"Para F",role:"결론 — 지속 가능한 방식으로 탐사 필요"},
    {num:6,en:"'It makes sense to explore this untapped potential in an environmentally sustainable way, instead of continually looking at the fast depleting land resources,' says Mike Johnston of Nautilus. But critics say exotic and little-known ecosystems could be destroyed. 'Mining will be the greatest assault on deep-sea ecosystems ever inflicted by humans,' says Verena Tunnicliffe.",kr:"'지속적으로 빠르게 고갈되는 육상 자원 대신 환경적으로 지속 가능한 방식으로 이 미개발 잠재성을 탐사하는 것이 합리적입니다'라고 노틸러스의 마이크 존스턴이 말한다. 하지만 비평가들은 이국적이고 잘 알려지지 않은 생태계가 파괴될 수 있다고 말한다. '채굴은 인간이 심해 생태계에 가한 최대 공격이 될 것입니다'라고 베레나 투니클리프가 말한다.",grammar:"<strong>instead of continually looking at</strong> = 전치사 대조. <strong>ever inflicted by humans</strong> = 최상급 강조",vocab:[{w:"untapped",pos:"adj",kr:"미개발의"},{w:"deplete",pos:"v",kr:"고갈시키다"},{w:"assault",pos:"n",kr:"공격, 폭행"}]}
  ],
  allVocab:[

"C19_T4_P3": {
  title:"Cambridge 19 · Test 4 · Passage 3",
  topic:"The Unselfish Gene",
  qTypes:["Multiple Choice","Summary Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 인간 이기심에 관한 통념"},
    {num:1,en:"There has long been a general assumption that human beings are essentially selfish. We are apparently ruthless, with strong impulses to compete against each other for resources and to accumulate power and possessions. If we are kind, it's usually because we have ulterior motives.",kr:"오랫동안 인간은 본질적으로 이기적이라는 일반적인 가정이 있어왔다. 우리는 표면상 무자비하며, 자원을 두고 경쟁하고 권력과 재산을 축적하려는 강한 충동을 가지고 있다. 우리가 친절하다면, 그것은 대개 우리에게 숨겨진 동기가 있기 때문이다.",grammar:"<strong>has long been</strong> = 현재완료 + 오래(지속). <strong>ulterior motives</strong> = 숨겨진 동기",vocab:[{w:"ruthless",pos:"adj",kr:"무자비한"},{w:"ulterior motive",pos:"n",kr:"숨겨진 동기"}]},
    {type:"para",label:"Para 2",role:"도킨스의 이기적 유전자 — 진화심리학"},
    {num:2,en:"This bleak view of human nature is closely associated with Richard Dawkins, whose book The Selfish Gene became popular because it fitted so well with the competitive and individualistic ethos prevalent in late 20th-century societies. Evolutionary psychology theorises that present-day human traits developed in the 'environment of evolutionary adaptedness'.",kr:"인간 본성에 대한 이 암울한 시각은 리처드 도킨스와 밀접하게 연관되어 있는데, 그의 책 '이기적 유전자'는 20세기 후반 사회에서 만연했던 경쟁적이고 개인주의적인 정서에 잘 맞았기 때문에 인기를 끌었다. 진화심리학은 현재의 인간 특성이 '진화적 적응 환경'에서 발전했다고 이론화한다.",grammar:"<strong>associated with</strong> = ~와 연관된. <strong>because it fitted so well with</strong> = because절",vocab:[{w:"ethos",pos:"n",kr:"정서, 기풍"},{w:"individualistic",pos:"adj",kr:"개인주의적인"}]},
    {type:"para",label:"Para 3",role:"선사시대는 투쟁의 시대가 아니었다"},
    {num:3,en:"The assumption that prehistoric life was a desperate struggle for survival is false. Around 15,000 years ago, the population of Europe was only 29,000, and the world population was less than half a million. With such small population densities, it seems unlikely that prehistoric hunter-gatherer groups had to compete against each other for resources.",kr:"선사시대 삶이 생존을 위한 필사적인 투쟁이었다는 가정은 거짓이다. 약 15,000년 전 유럽 인구는 29,000명에 불과했고 세계 인구는 50만 명 미만이었다. 이러한 작은 인구 밀도에서 선사시대 수렵 채집인 집단이 자원을 위해 서로 경쟁해야 했을 것 같지 않다.",grammar:"<strong>it seems unlikely that</strong> = 가주어-진주어(추측). <strong>With such small population densities</strong> = 전치사구(조건)",vocab:[{w:"hunter-gatherer",pos:"n",kr:"수렵 채집인"},{w:"population density",pos:"n",kr:"인구 밀도"}]},
    {type:"para",label:"Para 4",role:"쿵 족 — 평등주의 공동체"},
    {num:4,en:"The anthropologist Bruce Knauft has observed that hunter-gatherers are characterised by 'extreme political and sexual egalitarianism'. The !Kung people of southern Africa swap arrows before going hunting and when an animal is killed, the acclaim goes not to the person who fired the arrow, but to the person the arrow belongs to. If a person becomes too domineering, the other members ostracise them.",kr:"인류학자 브루스 크나우프트는 수렵 채집인들이 '극단적인 정치적·성적 평등주의'로 특징지어진다고 관찰했다. 남아프리카의 쿵 족은 사냥을 나가기 전에 화살을 교환하고 동물이 죽으면 화살을 쏜 사람이 아닌 화살이 속한 사람에게 찬사가 돌아간다. 누군가가 너무 지배적이 되면 다른 구성원들이 그들을 배척한다.",grammar:"<strong>swap arrows before going hunting</strong> = 사냥 가기 전 화살 교환. <strong>goes not to A but to B</strong> = A가 아닌 B에게",vocab:[{w:"egalitarianism",pos:"n",kr:"평등주의"},{w:"domineering",pos:"adj",kr:"지배적인"},{w:"ostracise",pos:"v",kr:"배척하다"}]},
    {type:"para",label:"Para 5",role:"이기심은 후천적 발달 — 농업 혁명 이후"},
    {num:5,en:"So, it could well be that the same thing has happened to us as with primates whose habitats were disrupted. I believe that the end of the hunter-gatherer lifestyle and the advent of farming was connected to a psychological change. There was a new sense of individuality and separateness, which led to a new selfishness, and ultimately to hierarchical societies, patriarchy and warfare.",kr:"따라서 서식지가 교란된 영장류에게 일어난 것과 같은 일이 우리에게도 일어났을 수 있다. 나는 수렵 채집 생활 방식의 종말과 농업의 등장이 심리적 변화와 연결되어 있다고 믿는다. 새로운 개인성과 분리감이 생겨 새로운 이기심으로, 궁극적으로는 계층적 사회, 가부장제, 전쟁으로 이어졌다.",grammar:"<strong>it could well be that</strong> = 충분히 ~일 수 있다. <strong>which led to a new selfishness</strong> = 계속적 관계절",vocab:[{w:"advent",pos:"n",kr:"등장, 도래"},{w:"patriarchy",pos:"n",kr:"가부장제"},{w:"hierarchical",pos:"adj",kr:"계층적인"}]}
  ],

,"C20_T1_P1": {
  title:"Cambridge 20 · Test 1 · Passage 1",
  topic:"The Kākāpō",
  qTypes:["True / False / Not Given","Notes Completion"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 카카포의 특징"},
    {num:1,en:"The kākāpō, also known as the owl parrot, is a large, forest-dwelling bird. It is the world's only flightless parrot, and is also possibly one of the world's longest-living birds, with a reported lifespan of up to 100 years.",kr:"올빼미 앵무로도 알려진 카카포는 크고 숲에 사는 새이다. 세계에서 유일한 날지 못하는 앵무새로, 최대 100년으로 보고된 수명을 가진 세계에서 가장 오래 사는 새 중 하나일 수도 있다.",grammar:"<strong>also known as</strong> = ~로도 알려진. <strong>with a reported lifespan of</strong> = 독립분사구문",vocab:[{w:"flightless",pos:"adj",kr:"날지 못하는"},{w:"lifespan",pos:"n",kr:"수명"}]},
    {num:2,en:"Kākāpō are solitary birds. They are entirely vegetarian, with their diet including the leaves, roots and bark of trees as well as bulbs, and fern fronds.",kr:"카카포는 단독 생활하는 새이다. 완전한 초식동물로, 식단에 나무의 잎, 뿌리, 나무껍질, 구근, 양치식물 잎이 포함된다.",grammar:"<strong>with their diet including</strong> = 독립분사구문. <strong>as well as</strong> = ~뿐만 아니라",vocab:[{w:"solitary",pos:"adj",kr:"단독의, 독거하는"},{w:"fern frond",pos:"n",kr:"양치식물 잎"}]},
    {type:"para",label:"Para 2",role:"번식 — 수컷 불참여"},
    {num:3,en:"Kākāpō breed in summer and autumn, but only in years when food is plentiful. Males play no part in incubation or chick-rearing – females alone incubate eggs and feed the chicks. The eggs are laid in soil. The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.",kr:"카카포는 여름과 가을에 번식하지만, 먹이가 풍부한 해에만 한다. 수컷은 포란이나 새끼 기르기에 전혀 참여하지 않는다 – 암컷 혼자 알을 품고 새끼에게 먹이를 준다. 알은 토양에 낳는다. 암컷 카카포는 먹이를 찾아 둥지를 오래 비워야 해서, 돌봄 없이 남겨진 알과 새끼가 포식자에게 특히 취약하다.",grammar:"<strong>play no part in</strong> = ~에 전혀 참여하지 않다. <strong>which leaves ... vulnerable</strong> = 계속적 관계절",vocab:[{w:"incubation",pos:"n",kr:"포란, 알 품기"},{w:"vulnerable",pos:"adj",kr:"취약한"}]},
    {type:"para",label:"Para 3",role:"감소 — 폴리네시아인과 유럽인의 도래"},
    {num:4,en:"Before humans arrived, kākāpō were common throughout New Zealand's forests. However, with the arrival of the first Polynesian settlers about 700 years ago, the flightless kākāpō was easy prey. The fall in kākāpō numbers was accelerated by European colonisation: forest clearance, introduced species such as deer depleted the food supply, and predators such as cats, stoats and rats were also introduced.",kr:"인간이 도착하기 전에는 카카포가 뉴질랜드 숲 전역에 흔했다. 그러나 약 700년 전 폴리네시아 최초 정착민들이 도착하면서 날지 못하는 카카포는 쉬운 먹잇감이었다. 카카포 개체수 감소는 유럽 식민화로 가속화되었다: 산림 개간, 사슴 같은 도입 종이 먹이 공급을 고갈시키고, 고양이, 족제비, 쥐 등 포식자도 도입되었다.",grammar:"<strong>was accelerated by</strong> = 수동태 과거. <strong>such as ... also introduced</strong> = 열거",vocab:[{w:"prey",pos:"n",kr:"먹잇감"},{w:"deplete",pos:"v",kr:"고갈시키다"},{w:"stoat",pos:"n",kr:"족제비"}]},
    {type:"para",label:"Para 4",role:"초기 보전 노력 실패"},
    {num:5,en:"In 1894, conservationist Richard Henry led an effort to relocate several hundred of the birds to predator-free Resolution Island. Unfortunately, stoats arrived within six years, eventually destroying the kākāpō population. By the mid-1900s, the kākāpō was practically a lost species.",kr:"1894년 보전 전문가 리처드 헨리가 포식자 없는 레졸루션 섬으로 수백 마리의 새를 이전하는 노력을 이끌었다. 안타깝게도 족제비가 6년 내에 도착해 결국 카카포 개체군을 파괴했다. 1900년대 중반까지 카카포는 사실상 소멸한 종이었다.",grammar:"<strong>led an effort to relocate</strong> = ~을 이전하려는 노력을 이끌었다. <strong>eventually destroying</strong> = 분사구문(결과)",vocab:[{w:"predator-free",pos:"adj",kr:"포식자 없는"},{w:"practically",pos:"adv",kr:"사실상"}]},
    {type:"para",label:"Para 5",role:"라키우라 발견 — 암컷 확인"},
    {num:6,en:"In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels. There were about 200 individuals, and in 1980 it was confirmed females were also present. These birds have been the foundation of all subsequent work in managing the species.",kr:"1977년 라키우라에서 대규모 수컷 개체군이 발견되었다 – 족제비, 흰담비, 흰족제비가 없는 큰 섬이다. 약 200마리가 있었고, 1980년에 암컷도 있음이 확인되었다. 이 새들은 그 종을 관리하는 모든 후속 작업의 토대가 되었다.",grammar:"<strong>was confirmed females were also present</strong> = 수동태 + 목적절. <strong>have been the foundation of</strong> = 현재완료",vocab:[{w:"weasel",pos:"n",kr:"흰족제비"},{w:"foundation",pos:"n",kr:"토대, 기초"}]},
    {type:"para",label:"Para 6",role:"회복 계획 — 2020년 210마리"},
    {num:7,en:"In 1996, a new Recovery Plan was launched with a higher amount of funding. Cats were eradicated from Little Barrier Island and possums from Codfish Island. The birds were more intensively managed: moving birds between islands, supplementary feeding and hand-raising failing chicks. By June 2020, a total of 210 birds was recorded.",kr:"1996년 더 많은 자금과 함께 새로운 회복 계획이 시작되었다. 고양이는 리틀 배리어 섬에서, 오리너구리는 코드피시 섬에서 박멸되었다. 새들은 더욱 집중적으로 관리되었다: 섬 사이 이동, 보충 먹이 주기, 쇠약한 새끼 수작업 양육. 2020년 6월까지 총 210마리가 기록되었다.",grammar:"<strong>was launched with</strong> = 수동태 + 부대 상황. <strong>supplementary feeding</strong> = 보충 먹이 주기",vocab:[{w:"supplementary",pos:"adj",kr:"보충의, 추가의"},{w:"eradicate",pos:"v",kr:"박멸하다"}]}

"C20_T1_P2": {
  title:"Cambridge 20 · Test 1 · Passage 2",
  topic:"Returning Elm Trees to Britain",
  qTypes:["Section Matching","People Matching","Summary Completion"],
  sentences:[
    {type:"para",label:"Para A",role:"도입 — 네덜란드 느릅나무병으로 2500만 그루 소멸"},
    {num:1,en:"Around 25 million elms, accounting for 90% of all elm trees in the UK, died during the 1960s and '70s of Dutch elm disease. There's now hope the elm may be reintroduced to the countryside of central and southern England.",kr:"영국 모든 느릅나무의 90%를 차지하는 약 2500만 그루의 느릅나무가 1960~70년대에 네덜란드 느릅나무병으로 죽었다. 이제 영국 중부와 남부 시골에 느릅나무가 다시 도입될 수 있다는 희망이 있다.",grammar:"<strong>accounting for 90%</strong> = 분사구문(90%를 차지하는). <strong>may be reintroduced</strong> = 수동 추측",vocab:[{w:"Dutch elm disease",pos:"n",kr:"네덜란드 느릅나무병"},{w:"reintroduce",pos:"v",kr:"다시 도입하다"}]},
    {type:"para",label:"Para B",role:"병의 원인 — 캐나다 수입 목재로 2차 유행"},
    {num:2,en:"The disease is caused by a fungus that blocks the elms' vascular system. A first epidemic in the 1920s died down, but in the '70s a second epidemic was triggered by shipments of elm from Canada. The wood came in the form of logs and its intact bark was perfect for the elm bark beetles that spread the deadly fungus. This time, the beetles carried a much more virulent strain.",kr:"이 병은 느릅나무의 관다발 시스템을 막는 곰팡이로 인해 발생한다. 1920년대 첫 번째 유행은 잠잠해졌지만, 70년대에 캐나다에서 수입된 느릅나무로 두 번째 유행이 촉발되었다. 목재는 통나무 형태로 왔고 껍질이 온전히 남아 있어 치명적인 곰팡이를 퍼뜨리는 느릅나무 나무껍질 딱정벌레에 완벽했다. 이번에 딱정벌레는 훨씬 더 독성이 강한 균주를 옮겼다.",grammar:"<strong>triggered by shipments</strong> = 수동 분사구문. <strong>virulent strain</strong> = 독성이 강한 균주",vocab:[{w:"vascular system",pos:"n",kr:"관다발 시스템"},{w:"virulent",pos:"adj",kr:"독성이 강한"},{w:"strain",pos:"n",kr:"균주, 변종"}]},
    {type:"para",label:"Para C",role:"생존 나무 연구 — 저항성 원인 불명"},
    {num:3,en:"Today, elms still exist in low hedgerows. Once the trunk reaches 10-15 centimetres in diameter, it becomes a perfect size for beetles to lay eggs. Yet mature specimens have been identified that are hundreds of years old and have mysteriously escaped the epidemic. The key is to identify and study those trees that have survived and work out why they stood tall when millions of others succumbed.",kr:"오늘날 느릅나무는 낮은 생울타리에 여전히 존재한다. 줄기가 직경 10~15cm에 이르면 딱정벌레가 알을 낳기에 완벽한 크기가 된다. 그러나 수백 년 된 성숙한 표본들이 신비롭게 유행을 피해간 것으로 확인되었다. 핵심은 살아남은 나무들을 파악하고 연구하여 수백만 그루가 쓰러질 때 왜 살아남았는지 알아내는 것이다.",grammar:"<strong>have mysteriously escaped</strong> = 현재완료. <strong>work out why</strong> = 왜인지 알아내다",vocab:[{w:"hedgerow",pos:"n",kr:"생울타리"},{w:"succumb",pos:"v",kr:"쓰러지다, 굴복하다"}]},
    {type:"para",label:"Para D",role:"느릅나무의 역사적 가치 — 청동기시대부터 현대까지"},
    {num:4,en:"For centuries, elm ran a close second to oak as the hardwood tree of choice in Britain. The use of elm is thought to go back to the Bronze Age, used for tools and shields. In the 18th century, its wood was used for storage crates and flooring. It was used to build the keel of the 19th-century sailing ship Cutty Sark.",kr:"수 세기 동안 느릅나무는 영국에서 선호하는 단단한 목재로 참나무에 거의 버금갔다. 느릅나무 사용은 청동기 시대로 거슬러 올라가며 도구와 방패에 사용되었다. 18세기에는 보관 상자와 바닥재에 사용되었다. 19세기 범선 커티 삭의 용골을 만드는 데도 사용되었다.",grammar:"<strong>ran a close second to</strong> = ~에 근소한 차이로 버금갔다. <strong>is thought to go back to</strong> = ~로 거슬러 올라가는 것으로 추정된다",vocab:[{w:"keel",pos:"n",kr:"용골(배의 밑바닥 구조)"},{w:"hardwood",pos:"n",kr:"단단한 목재"}]},
    {type:"para",label:"Para E",role:"브라이턴 느릅나무 — 바다 바람의 보호"},
    {num:5,en:"Peter Bourne of the National Elm Collection in Brighton says the city's elms total about 17,000. Strong winds from the sea make it difficult for the determined elm bark beetle to attack this coastal city's elm population. However, the situation is precarious. 'The beetles can just march in if we're not careful, as the threat is right on our doorstep,' says Bourne.",kr:"브라이턴 국립 느릅나무 컬렉션의 피터 본은 그 도시의 느릅나무가 약 17,000그루라고 말한다. 바다에서 불어오는 강한 바람이 단호한 느릅나무 나무껍질 딱정벌레가 이 해안 도시의 느릅나무 개체군을 공격하기 어렵게 한다. 그러나 상황은 불안정하다. '우리가 조심하지 않으면 딱정벌레가 그냥 행진해 들어올 수 있습니다, 위협이 바로 우리 문 앞에 있으니까요'라고 본이 말한다.",grammar:"<strong>make it difficult for ... to attack</strong> = 가목적어 구문. <strong>right on our doorstep</strong> = 바로 우리 문 앞에",vocab:[{w:"precarious",pos:"adj",kr:"불안정한, 위태로운"},{w:"determined",pos:"adj",kr:"단호한"}]},
    {type:"para",label:"Para F",role:"내성 테스트 — 껍질에 병원균 주입"},
    {num:6,en:"A widespread reintroduction would involve hybrid strains derived from resistant, non-native elm species. Seedlings have been bred and tested by cutting a small slit on the bark and injecting a tiny amount of the pathogen. 'Trees that are resistant show no symptoms, whereas those that are susceptible show leaf loss and may even have died completely.'",kr:"광범위한 재도입에는 내성을 가진 비원산지 느릅나무 종에서 유래한 잡종 계통이 포함될 것이다. 새싹들이 번식되고 껍질에 작은 구멍을 내고 소량의 병원균을 주입하여 테스트되었다. '내성이 있는 나무는 증상이 없지만, 취약한 나무는 잎이 떨어지고 완전히 죽을 수도 있습니다.'",grammar:"<strong>derived from resistant species</strong> = 과거분사 후치수식. <strong>whereas</strong> = 반면에(대조)",vocab:[{w:"pathogen",pos:"n",kr:"병원균"},{w:"susceptible",pos:"adj",kr:"취약한"}]},
    {type:"para",label:"Para G",role:"사회적 수용 문제 — 자연 회복 vs. 잡종 도입"},
    {num:7,en:"All of this raises questions of social acceptance. Russell acknowledges: 'If we're putting elm back into the landscape, a small element of it is not native.' Elliot of the Woodland Trust says: 'You're replacing a native species with a horticultural analogue. You're effectively cloning.' There's also the risk of introducing new diseases. Rather than plant new elms, the Woodland Trust emphasises giving nature time to recover.",kr:"이 모든 것은 사회적 수용 문제를 제기한다. 러셀은 인정한다: '우리가 느릅나무를 경관에 다시 넣는다면, 그것의 일부는 원산지 종이 아닙니다.' 우드랜드 트러스트의 엘리엇은 말한다: '원산지 종을 원예 유사체로 대체하는 것입니다. 사실상 복제하는 것입니다.' 새로운 질병을 도입할 위험도 있다. 새 느릅나무를 심는 것보다 우드랜드 트러스트는 자연이 회복할 시간을 주는 것을 강조한다.",grammar:"<strong>raises questions of</strong> = ~에 관한 문제를 제기하다. <strong>Rather than plant</strong> = ~보다는",vocab:[{w:"horticultural analogue",pos:"n",kr:"원예 유사체"},{w:"native species",pos:"n",kr:"원산지 종"}]}
  ],

"C20_T1_P3": {
  title:"Cambridge 20 · Test 1 · Passage 3",
  topic:"How Stress Affects Our Judgement",
  qTypes:["Multiple Choice","Sentence Completion","Yes / No / Not Given"],
  sentences:[
    {type:"para", label:"Para 1", role:"도입 — 스트레스 하의 의사결정"},
    {num:1, en:"Some of the most important decisions of our lives occur while we're feeling stressed and anxious.", kr:"우리 삶에서 가장 중요한 결정들 중 일부는 스트레스를 받고 불안한 상태일 때 내려진다.", grammar:"while + 현재분사: 동시 상황 부사절 / occur: 일어나다", vocab:[{w:"anxious",pos:"adj",kr:"불안한"},{w:"stressed",pos:"adj",kr:"스트레스를 받은"}]},
    {num:2, en:"From medical decisions to financial and professional ones, we are all sometimes required to weigh up information under stressful conditions.", kr:"의료적 결정부터 재정적·직업적 결정까지, 우리는 모두 때로 스트레스가 많은 상황에서 정보를 종합 평가해야 한다.", grammar:"be required to + 동사원형: ~해야 하다 / weigh up: 신중히 평가하다", vocab:[{w:"weigh up",pos:"phr.v",kr:"신중히 평가하다"},{w:"stressful",pos:"adj",kr:"스트레스가 많은"}]},
    {num:3, en:"But do we become better or worse at processing and using information under such circumstances?", kr:"그러나 그런 상황에서 우리는 정보를 처리하고 사용하는 데 더 잘하게 될까, 더 못하게 될까?", grammar:"수사의문문으로 화제 제시 / process: 처리하다", vocab:[{w:"process",pos:"v",kr:"처리하다"},{w:"circumstances",pos:"n",kr:"상황, 환경"}]},
    {type:"para", label:"Para 2", role:"소방관 실험 설계"},
    {num:4, en:"My colleague and I, both neuroscientists, wanted to investigate how the mind operates under stress, so we visited some local fire stations.", kr:"신경과학자인 동료와 나는 스트레스 하에서 뇌가 어떻게 작동하는지 연구하고자 지역 소방서들을 방문했다.", grammar:"동격 구조: colleague and I, both neuroscientists / investigate how절", vocab:[{w:"neuroscientist",pos:"n",kr:"신경과학자"},{w:"investigate",pos:"v",kr:"조사하다, 연구하다"}]},
    {num:5, en:"Firefighters' workdays vary quite a bit.", kr:"소방관들의 근무일은 상당히 다양하다.", grammar:"vary: 다양하다 / quite a bit: 상당히", vocab:[{w:"vary",pos:"v",kr:"다양하다, 변하다"}]},
    {num:6, en:"Some are pretty relaxed; they'll spend their time washing the truck, cleaning equipment, cooking meals and reading.", kr:"어떤 날은 꽤 여유롭다 — 소방차를 씻고 장비를 청소하고 식사를 준비하며 책을 읽는다.", grammar:"세미콜론 연결 / will: 습관적 행동", vocab:[{w:"relaxed",pos:"adj",kr:"편안한, 여유로운"},{w:"equipment",pos:"n",kr:"장비"}]},
    {num:7, en:"Other days can be hectic, with numerous life-threatening incidents to attend to; they'll enter burning homes to rescue trapped residents, and assist with medical emergencies.", kr:"다른 날들은 수많은 생명을 위협하는 사건들을 처리해야 해서 매우 바쁘다 — 불타는 집에 들어가 갇힌 주민을 구조하고 의료 응급 상황을 지원한다.", grammar:"with + 명사 + to부정사: 처리해야 할 / life-threatening: 생명을 위협하는", vocab:[{w:"hectic",pos:"adj",kr:"매우 바쁜"},{w:"life-threatening",pos:"adj",kr:"생명을 위협하는"},{w:"incident",pos:"n",kr:"사건"}]},
    {num:8, en:"These ups and downs presented the perfect setting for an experiment on how people's ability to use information changes when they feel under pressure.", kr:"이러한 기복은 압박감을 느낄 때 정보 활용 능력이 어떻게 변하는지에 관한 실험에 완벽한 환경을 제공했다.", grammar:"ups and downs: 기복 / present A for B: B를 위해 A를 제공하다", vocab:[{w:"ups and downs",pos:"phr",kr:"기복"},{w:"setting",pos:"n",kr:"환경, 배경"},{w:"under pressure",pos:"phr",kr:"압박감 속에"}]},
    {type:"para", label:"Para 3", role:"핵심 발견 — 나쁜 소식에만 반응"},
    {num:9, en:"We found that perceived threat acted as a trigger for a stress reaction that made the task of processing information easier for the firefighters – but only as long as it conveyed bad news.", kr:"우리는 인지된 위협이 소방관들의 정보 처리를 더 쉽게 만드는 스트레스 반응의 방아쇠가 된다는 것을 발견했다 — 단 나쁜 소식을 전달할 때만.", grammar:"as long as: ~하는 한 / convey: 전달하다", vocab:[{w:"perceived",pos:"adj",kr:"인지된"},{w:"trigger",pos:"n",kr:"방아쇠, 계기"},{w:"convey",pos:"v",kr:"전달하다"}]},
    {type:"para", label:"Para 4", role:"연구 방법론"},
    {num:10, en:"This is how we arrived at these results.", kr:"이것이 우리가 이 결과에 도달한 방법이다.", grammar:"This is how + 주어 + 동사: 이것이 ~한 방법이다", vocab:[]},
    {num:11, en:"We asked the firefighters to estimate their likelihood of experiencing 40 different adverse events in their life, such as being involved in an accident or becoming a victim of card fraud.", kr:"우리는 소방관들에게 사고 연루나 카드 사기 피해와 같은 40가지 부정적 사건을 경험할 가능성을 추정하도록 요청했다.", grammar:"ask + 목적어 + to부정사 / likelihood of + 동명사: ~할 가능성", vocab:[{w:"estimate",pos:"v",kr:"추정하다"},{w:"likelihood",pos:"n",kr:"가능성"},{w:"adverse",pos:"adj",kr:"불리한, 부정적인"}]},
    {num:12, en:"We then gave them either good news (that their likelihood of experiencing these events was lower than they'd thought) or bad news (that it was higher) and asked them to provide new estimates.", kr:"그런 다음 좋은 소식(가능성이 생각보다 낮다) 또는 나쁜 소식(더 높다)을 알려주고 새로운 추정치를 제시하도록 요청했다.", grammar:"either A or B / that절: 동격절", vocab:[{w:"estimate",pos:"n",kr:"추정치"}]},
    {type:"para", label:"Para 5", role:"낙관주의 편향 vs. 스트레스"},
    {num:13, en:"People are normally quite optimistic – they will ignore bad news and embrace the good.", kr:"사람들은 보통 꽤 낙관적이다 — 나쁜 소식은 무시하고 좋은 소식은 받아들인다.", grammar:"will: 일반적 경향 / ignore: 무시, embrace: 받아들이다", vocab:[{w:"optimistic",pos:"adj",kr:"낙관적인"},{w:"embrace",pos:"v",kr:"받아들이다"}]},
    {num:14, en:"This is what happened when the firefighters were relaxed; but when they were under stress, a different pattern emerged.", kr:"이것이 소방관들이 여유로울 때 일어난 일이다 — 하지만 스트레스 시에는 다른 패턴이 나타났다.", grammar:"This is what + 주어 + 동사 / emerge: 나타나다", vocab:[{w:"pattern",pos:"n",kr:"패턴, 양상"},{w:"emerge",pos:"v",kr:"나타나다, 출현하다"}]},
    {num:15, en:"Under these conditions, they became hyper-vigilant to bad news, even when it had nothing to do with their job (such as learning that the likelihood of card fraud was higher than they'd thought), and altered their beliefs in response.", kr:"이런 상황에서 그들은 직업과 무관한 나쁜 소식에도 극도로 경계심을 갖게 되었고, 그에 반응하여 믿음을 바꿨다.", grammar:"have nothing to do with: ~와 무관하다 / alter: 변화시키다 / in response: 그에 반응하여", vocab:[{w:"hyper-vigilant",pos:"adj",kr:"극도로 경계하는"},{w:"alter",pos:"v",kr:"변화시키다"},{w:"in response",pos:"phr",kr:"그에 반응하여"}]},
    {num:16, en:"In contrast, stress didn't change how they responded to good news (such as learning that the likelihood of card fraud was lower than they'd thought).", kr:"반면에, 스트레스는 좋은 소식에 반응하는 방식을 바꾸지 않았다.", grammar:"In contrast: 반면에 / how + 주어 + 동사: ~하는 방식", vocab:[{w:"in contrast",pos:"phr",kr:"반면에, 대조적으로"}]},
    {type:"para", label:"Para 6", role:"학생 실험 — 동일한 패턴 확인"},
    {num:17, en:"Back in our lab, we observed the same pattern in students who were told they had to give a surprise public speech, which would be judged by a panel, recorded and posted online.", kr:"실험실에서, 패널에 의해 평가되고 녹화되어 온라인에 게시될 즉흥 연설을 해야 한다는 말을 들은 학생들에게서도 같은 패턴을 관찰했다.", grammar:"관계절 수식 / passive: would be judged, recorded, posted", vocab:[{w:"observe",pos:"v",kr:"관찰하다"},{w:"panel",pos:"n",kr:"심사단, 패널"}]},
    {num:18, en:"Sure enough, their cortisol levels spiked, their heart rates went up and they suddenly became better at processing unrelated, yet alarming, information about rates of disease and violence.", kr:"예상대로, 코르티솔 수치가 급등하고 심박수가 오르면서 그들은 갑자기 관련 없지만 불안한 질병·폭력 관련 정보를 처리하는 데 더 능숙해졌다.", grammar:"Sure enough: 예상대로 / spike: 급등하다 / yet: 그럼에도", vocab:[{w:"cortisol",pos:"n",kr:"코르티솔 (스트레스 호르몬)"},{w:"spike",pos:"v",kr:"급등하다"},{w:"alarming",pos:"adj",kr:"불안한, 걱정스러운"}]},
    {type:"para", label:"Para 7", role:"신경 메커니즘"},
    {num:19, en:"When we experience stressful events, a physiological change is triggered that causes us to take in warnings and focus on what might go wrong.", kr:"스트레스 사건을 경험할 때 생리적 변화가 촉발되어 경고를 받아들이고 무엇이 잘못될지에 집중하게 만든다.", grammar:"physiological: 생리적 / take in: 받아들이다", vocab:[{w:"physiological",pos:"adj",kr:"생리적인"},{w:"triggered",pos:"v",kr:"촉발되다"}]},
    {num:20, en:"Brain imaging reveals that this 'switch' is related to a sudden boost in a neural signal important for learning, specifically in response to unexpected warning signs, such as faces expressing fear.", kr:"뇌 영상은 이 '스위치'가 학습에 중요한 신경 신호의 갑작스러운 증가와 관련 있음을 보여준다 — 특히 두려움을 표현하는 얼굴 같은 예상치 못한 경고 신호에 반응해.", grammar:"reveal that + 절 / in response to: ~에 반응하여", vocab:[{w:"neural",pos:"adj",kr:"신경의"},{w:"boost",pos:"n",kr:"증가, 향상"}]},
    {type:"para", label:"Para 8", role:"진화적 설명 및 임상 의미"},
    {num:21, en:"Such neural engineering could have helped prehistoric humans to survive.", kr:"이러한 신경 공학은 선사 시대 인간들이 생존하는 데 도움을 줄 수 있었다.", grammar:"could have + p.p.: ~했을 수 있다 (과거 가능성)", vocab:[{w:"prehistoric",pos:"adj",kr:"선사 시대의"}]},
    {num:22, en:"When our ancestors found themselves surrounded by hungry animals, they would have benefited from an increased ability to learn about hazards.", kr:"굶주린 동물들에게 둘러싸인 조상들은 위험에 대해 배우는 향상된 능력에서 이익을 얻었을 것이다.", grammar:"would have + p.p.: ~했을 것이다 / find oneself + p.p.: ~한 상태에 놓이다", vocab:[{w:"ancestor",pos:"n",kr:"조상"},{w:"hazard",pos:"n",kr:"위험"}]},
    {num:23, en:"In a safe environment, however, it would have been wasteful to be on high alert constantly.", kr:"그러나 안전한 환경에서는 항상 고도 경계 상태에 있는 것이 낭비였을 것이다.", grammar:"it would have been + 형용사 + to부정사", vocab:[{w:"wasteful",pos:"adj",kr:"낭비적인"},{w:"on high alert",pos:"phr",kr:"고도 경계 상태에"}]},
    {num:24, en:"So, a neural switch that automatically increases or decreases our ability to process warnings in response to changes in our environment could have been useful.", kr:"따라서 환경 변화에 반응하여 경고 처리 능력을 자동으로 높이거나 낮추는 신경 스위치가 유용했을 수 있다.", grammar:"in response to: ~에 반응하여", vocab:[{w:"automatically",pos:"adv",kr:"자동으로"}]},
    {num:25, en:"In fact, people with clinical depression and anxiety seem unable to switch away from a state in which they absorb all the negative messages around them.", kr:"실제로, 임상적 우울증과 불안이 있는 사람들은 주변의 모든 부정적 메시지를 흡수하는 상태에서 벗어나지 못하는 것 같다.", grammar:"switch away from: ~에서 벗어나다 / absorb: 흡수하다", vocab:[{w:"clinical depression",pos:"n",kr:"임상적 우울증"},{w:"anxiety",pos:"n",kr:"불안"},{w:"absorb",pos:"v",kr:"흡수하다"}]},
    {type:"para", label:"Para 9", role:"스트레스의 사회적 전파"},
    {num:26, en:"It is also important to realise that stress travels rapidly from one person to the next.", kr:"스트레스가 한 사람에서 다음 사람으로 빠르게 전파된다는 것을 인식하는 것도 중요하다.", grammar:"It is important to + 동사원형", vocab:[{w:"rapidly",pos:"adv",kr:"빠르게"}]},
    {num:27, en:"If a co-worker is stressed, we are more likely to tense up and feel stressed ourselves.", kr:"동료가 스트레스를 받으면, 우리도 긴장하고 스트레스를 받을 가능성이 더 높다.", grammar:"be more likely to: ~할 가능성이 더 높다 / tense up: 긴장하다", vocab:[{w:"tense up",pos:"phr.v",kr:"긴장하다"}]},
    {num:28, en:"We don't even need to be in the same room with someone for their emotions to influence our behaviour.", kr:"누군가의 감정이 우리 행동에 영향을 미치기 위해 같은 방에 있을 필요조차 없다.", grammar:"for + 목적어 + to부정사: ~가 ~하기 위해", vocab:[{w:"influence",pos:"v",kr:"영향을 미치다"},{w:"behaviour",pos:"n",kr:"행동"}]},
    {num:29, en:"Studies show that if we observe positive feeds on social media, such as images of a pink sunset, we are more likely to post uplifting messages ourselves.", kr:"연구에 따르면 소셜 미디어에서 긍정적인 피드를 보면 고무적인 메시지를 게시할 가능성이 더 높다.", grammar:"Studies show that + 절 / uplifting: 고무적인", vocab:[{w:"feed",pos:"n",kr:"(소셜미디어) 피드"},{w:"uplifting",pos:"adj",kr:"고무적인"}]},
    {num:30, en:"If we observe negative posts, such as complaints about a long queue at the coffee shop, we will in turn create more negative posts.", kr:"부정적인 게시물을 보면, 우리도 차례로 더 많은 부정적인 게시물을 만들게 된다.", grammar:"in turn: 차례로, 결국", vocab:[{w:"complaint",pos:"n",kr:"불평, 불만"},{w:"in turn",pos:"phr",kr:"차례로, 결국"}]},
    {type:"para", label:"Para 10", role:"현대인과 디지털 스트레스"},
    {num:31, en:"In some ways, many of us now live as if we are in danger, constantly ready to tackle demanding emails and text messages, and respond to news alerts and comments on social media.", kr:"어떤 면에서, 우리 많은 이들은 마치 위험에 처한 것처럼, 요구가 많은 이메일·문자와 소셜 미디어 알림에 끊임없이 반응할 준비를 하며 살고 있다.", grammar:"as if + 주어 + 동사: 마치 ~인 것처럼 / tackle: 처리하다", vocab:[{w:"tackle",pos:"v",kr:"처리하다, 맞서다"},{w:"demanding",pos:"adj",kr:"요구가 많은"}]},
    {num:32, en:"Repeatedly checking your phone, according to a survey conducted by the American Psychological Association, is related to stress.", kr:"미국심리학회 설문조사에 따르면, 반복적으로 휴대폰을 확인하는 것은 스트레스와 관련이 있다.", grammar:"동명사 주어 / according to: ~에 따르면 / be related to: ~와 관련이 있다", vocab:[{w:"repeatedly",pos:"adv",kr:"반복적으로"},{w:"survey",pos:"n",kr:"설문조사"}]},
    {num:33, en:"In other words, a pre-programmed physiological reaction, which evolution has equipped us with to help us avoid famished predators, is now being triggered by an online post.", kr:"다시 말해, 진화가 굶주린 포식자를 피하도록 갖춰준 생리적 반응이 이제 온라인 게시물에 의해 촉발되고 있다.", grammar:"equip A with B: A에게 B를 갖춰주다 / famished: 굶주린", vocab:[{w:"famished",pos:"adj",kr:"굶주린"},{w:"predator",pos:"n",kr:"포식자"}]},
    {num:34, en:"Social media posting, according to one study, raises your pulse, makes you sweat, and enlarges your pupils more than most daily activities.", kr:"한 연구에 따르면, 소셜 미디어 게시물 작성은 대부분의 일상 활동보다 더 많이 맥박을 높이고 땀을 흘리게 하며 동공을 확대시킨다.", grammar:"make + 목적어 + 동사원형 / enlarge: 확대하다", vocab:[{w:"pulse",pos:"n",kr:"맥박"},{w:"sweat",pos:"v",kr:"땀 흘리다"},{w:"pupil",pos:"n",kr:"동공"}]},
    {type:"para", label:"Para 11", role:"집단적 공포와 해결책"},
    {num:35, en:"The fact that stress increases the likelihood that we will focus more on alarming messages, together with the fact that it spreads extremely rapidly, can create collective fear that is not always justified.", kr:"스트레스가 불안한 메시지에 더 집중할 가능성을 높인다는 사실과 극도로 빠르게 퍼진다는 사실이 합쳐져, 항상 정당화되지 않는 집단적 두려움을 만들 수 있다.", grammar:"the fact that + 절 / together with: ~와 함께 / collective: 집단적", vocab:[{w:"collective",pos:"adj",kr:"집단적인"},{w:"justified",pos:"adj",kr:"정당화된"}]},
    {num:36, en:"After a stressful public event, such as a natural disaster or major financial crash, there is often a wave of alarming information in traditional and social media, which individuals become very aware of.", kr:"자연재해나 금융 위기 같은 스트레스가 큰 공공 사건 이후에는 미디어에 불안한 정보가 쏟아지고, 개인들은 이에 매우 민감하게 반응한다.", grammar:"a wave of: 쏟아지는 / become aware of: ~을 인식하게 되다", vocab:[{w:"natural disaster",pos:"n",kr:"자연재해"},{w:"financial crash",pos:"n",kr:"금융 위기"}]},
    {num:37, en:"But that has the effect of exaggerating existing danger.", kr:"하지만 그것은 기존의 위험을 과장하는 효과가 있다.", grammar:"have the effect of + 동명사: ~하는 효과가 있다 / exaggerate: 과장하다", vocab:[{w:"exaggerate",pos:"v",kr:"과장하다"}]},
    {num:38, en:"And so, a reliable pattern emerges – stress is triggered, spreading from one person to the next, which temporarily enhances the likelihood that people will take in negative reports, which increases stress further.", kr:"그래서 신뢰할 수 있는 패턴이 나타난다 — 스트레스가 촉발되어 사람에서 사람으로 퍼지고, 일시적으로 부정적 보고를 받아들일 가능성을 높이며, 이것이 다시 스트레스를 증가시킨다.", grammar:"연쇄 관계절 / temporarily: 일시적으로 / enhance: 높이다", vocab:[{w:"enhance",pos:"v",kr:"높이다, 향상시키다"},{w:"temporarily",pos:"adv",kr:"일시적으로"}]},
    {num:39, en:"As a result, trips are cancelled, even if the disaster took place across the globe; stocks are sold, even when holding on is the best thing to do.", kr:"결과적으로, 재난이 지구 반대편에서 일어났더라도 여행이 취소되고, 버티는 것이 최선일 때도 주식이 팔린다.", grammar:"As a result: 결과적으로 / even if: 설령 ~하더라도", vocab:[{w:"cancel",pos:"v",kr:"취소하다"},{w:"hold on",pos:"phr.v",kr:"버티다, 유지하다"}]},
    {num:40, en:"The good news, however, is that positive emotions, such as hope, are contagious too, and are powerful in inducing people to act to find solutions.", kr:"그러나 좋은 소식은, 희망과 같은 긍정적인 감정도 전염성이 있으며 사람들이 해결책을 찾아 행동하도록 유도하는 데 강력하다는 것이다.", grammar:"contagious: 전염성이 있는 / induce + 목적어 + to부정사", vocab:[{w:"contagious",pos:"adj",kr:"전염성의"},{w:"induce",pos:"v",kr:"유도하다"}]},
    {num:41, en:"Being aware of the close relationship between people's emotional state and how they process information can help us frame our messages more effectively and become conscientious agents of change.", kr:"사람들의 감정 상태와 정보 처리 방식 사이의 밀접한 관계를 인식하면 메시지를 더 효과적으로 구성하고 변화의 양심적인 주체가 되는 데 도움이 된다.", grammar:"Being aware of + 명사: ~을 인식하는 것 / conscientious: 양심적인", vocab:[{w:"conscientious",pos:"adj",kr:"양심적인"},{w:"frame",pos:"v",kr:"구성하다, 틀을 잡다"}]}
  ],
  allVocab:[

  tfng:[
    {qNum:36, stmt:"The tone of the content we post on social media tends to reflect the nature of the posts in our feeds.", correct:"YES", mine:"", evPara:"Para 9", ev:"if we observe positive feeds... we are more likely to post uplifting messages. If we observe negative posts... we will create more negative posts.", why:"긍정 피드 → 긍정 게시, 부정 피드 → 부정 게시: 피드 내용이 게시 내용에 반영됨 → YES", trap:"소셜 미디어가 언급되나 어떤 기기가 더 나쁜가 같은 비교는 없음"},
    {qNum:37, stmt:"Phones have a greater impact on our stress levels than other electronic media devices.", correct:"NOT GIVEN", mine:"", evPara:"Para 10", ev:"Repeatedly checking your phone... is related to stress.", why:"휴대폰과 스트레스의 관계는 언급되지만 다른 기기와의 비교는 없음 → NOT GIVEN", trap:"휴대폰이 스트레스와 관련 있다는 내용은 있지만 비교는 없음"},
    {qNum:38, stmt:"The more we read about a stressful public event on social media, the less able we are to take the information in.", correct:"NO", mine:"", evPara:"Para 11", ev:"individuals become very aware of [alarming information]... has the effect of exaggerating existing danger.", why:"글은 정보를 덜 흡수하는 것이 아니라 오히려 더 민감하게 반응한다고 함 → NO (반대)", trap:"'the less able'이 함정 — 실제로는 더 잘 흡수함"},
    {qNum:39, stmt:"Stress created by social media posts can lead us to take unnecessary precautions.", correct:"YES", mine:"", evPara:"Para 11", ev:"trips are cancelled, even if the disaster took place across the globe; stocks are sold, even when holding on is the best thing to do.", why:"불필요한 예방조치(여행 취소, 주식 매도)를 취한다고 명시 → YES", trap:"unnecessary를 판단하기 어렵지만 글은 이를 정당화되지 않은 반응으로 묘사"},
    {qNum:40, stmt:"Our tendency to be affected by other people's moods can be used in a positive way.", correct:"YES", mine:"", evPara:"Para 11", ev:"positive emotions, such as hope, are contagious too, and are powerful in inducing people to act to find solutions.", why:"긍정 감정도 전염되어 긍정적 변화를 이끌 수 있다 → YES", trap:"tendency가 항상 부정적인 것만 가리킨다고 오해할 수 있음"}

  summary:"스트레스 하에서 인간은 나쁜 소식에 더 민감하게 반응한다는 신경과학 연구. 소방관과 학생 실험을 통해 스트레스가 위협 정보 처리를 향상시킴을 발견. 이 메커니즘은 진화적으로 생존에 유용했으나 현대 소셜 미디어 환경에서 불필요한 공포를 야기한다. 긍정 감정도 전염되어 변화를 이끌 수 있다."

"C20_T2_P1": {
  title:"Cambridge 20 · Test 2 · Passage 1",
  topic:"Manatees",
  qTypes:["Notes Completion","True / False / Not Given"],
  sentences:[
    {type:"para", label:"Para 1", role:"도입 — 매너티 소개"},
    {num:1, en:"Manatees, also known as sea cows, are aquatic mammals that belong to a group of animals called Sirenia.", kr:"바다소라고도 불리는 매너티는 시레니아라는 동물 집단에 속하는 수생 포유류다.", grammar:"also known as: ~라고도 알려진 / belong to: ~에 속하다", vocab:[{w:"aquatic",pos:"adj",kr:"수생의, 물속에 사는"},{w:"mammal",pos:"n",kr:"포유류"},{w:"Sirenia",pos:"n",kr:"시레니아 (목 단위 분류)"}]},
    {num:2, en:"This group also contains dugongs.", kr:"이 집단에는 듀공도 포함된다.", grammar:"contain: 포함하다", vocab:[{w:"dugong",pos:"n",kr:"듀공"}]},
    {num:3, en:"Dugongs and manatees look quite alike – they are similar in size, colour and shape, and both have flexible flippers for forelimbs.", kr:"듀공과 매너티는 외관이 꽤 비슷하다 — 크기, 색깔, 모양이 유사하며 앞다리가 유연한 지느러미 발이다.", grammar:"alike: 비슷한 / flexible: 유연한 / forelimbs: 앞다리", vocab:[{w:"alike",pos:"adj",kr:"비슷한"},{w:"flexible",pos:"adj",kr:"유연한"},{w:"flipper",pos:"n",kr:"지느러미 발"}]},
    {num:4, en:"However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", kr:"그러나 매너티의 꼬리는 넓고 둥근 반면, 듀공의 꼬리는 고래처럼 두 갈래로 갈라져 있다.", grammar:"whereas: 반면에 / fluked: (꼬리가) 두 갈래로 갈라진 / broad: 넓은", vocab:[{w:"whereas",pos:"conj",kr:"반면에"},{w:"fluked",pos:"adj",kr:"두 갈래로 갈라진 (꼬리)"},{w:"broad",pos:"adj",kr:"넓은"}]},
    {num:5, en:"There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", kr:"매너티에는 세 종이 있다: 서인도 매너티, 아프리카 매너티, 아마존 매너티.", grammar:"species: 종 (단복수 동형) / 괄호 안 학명 표기", vocab:[{w:"species",pos:"n",kr:"종 (생물)"}]},
    {type:"para", label:"Para 2", role:"신체 구조 — 목, 지느러미, 피부"},
    {num:6, en:"Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", kr:"대부분의 포유류와 달리, 매너티는 목에 뼈가 6개뿐이다 — 인간과 기린을 포함한 대부분의 다른 포유류는 7개다.", grammar:"Unlike + 명사: ~와 달리 / including: ~을 포함하여", vocab:[{w:"unlike",pos:"prep",kr:"~와 달리"},{w:"bone",pos:"n",kr:"뼈"},{w:"neck",pos:"n",kr:"목"}]},
    {num:7, en:"This short neck allows a manatee to move its head up and down, but not side to side.", kr:"이 짧은 목 덕분에 매너티는 머리를 위아래로 움직일 수 있지만, 좌우로는 움직일 수 없다.", grammar:"allow + 목적어 + to부정사: ~가 ~할 수 있게 하다", vocab:[{w:"allow",pos:"v",kr:"허용하다, 가능하게 하다"}]},
    {num:8, en:"To see something on its left or its right, a manatee must turn its entire body, steering with its flippers.", kr:"왼쪽이나 오른쪽에 있는 것을 보려면, 매너티는 지느러미 발로 방향을 잡으며 온몸을 돌려야 한다.", grammar:"To 부정사(목적): ~하기 위해 / steer: 방향을 잡다", vocab:[{w:"steer",pos:"v",kr:"방향을 잡다, 조종하다"},{w:"entire",pos:"adj",kr:"전체의"}]},
    {num:9, en:"Manatees have pectoral flippers but no back limbs, only a tail for propulsion.", kr:"매너티에는 가슴 지느러미 발이 있지만 뒷다리는 없으며, 추진력을 위한 꼬리만 있다.", grammar:"pectoral: 가슴의 / propulsion: 추진력", vocab:[{w:"pectoral",pos:"adj",kr:"가슴의"},{w:"propulsion",pos:"n",kr:"추진력"}]},
    {num:10, en:"They do have pelvic bones, however – a leftover from their evolution from a four-legged to a fully aquatic animal.", kr:"그러나 그들은 골반 뼈를 갖고 있는데 — 네 다리 동물에서 완전한 수생 동물로의 진화에서 남은 흔적이다.", grammar:"do have: 강조 / leftover: 남은 것, 흔적 / evolution from A to B", vocab:[{w:"pelvic",pos:"adj",kr:"골반의"},{w:"leftover",pos:"n",kr:"남은 것, 흔적"},{w:"evolution",pos:"n",kr:"진화"}]},
    {num:11, en:"Manatees share some visual similarities to elephants.", kr:"매너티는 코끼리와 외형적으로 유사한 점이 있다.", grammar:"share similarities to: ~와 유사점을 공유하다 / visual: 외형적인", vocab:[{w:"similarity",pos:"n",kr:"유사점"}]},
    {num:12, en:"Like elephants, manatees have thick, wrinkled skin.", kr:"코끼리처럼, 매너티는 두껍고 주름진 피부를 가지고 있다.", grammar:"Like + 명사: ~처럼 / wrinkled: 주름진", vocab:[{w:"wrinkled",pos:"adj",kr:"주름진"},{w:"thick",pos:"adj",kr:"두꺼운"}]},
    {num:13, en:"They also have some hairs covering their bodies which help them sense vibrations in the water around them.", kr:"그들의 몸에는 털이 있는데, 이것은 주변 물속의 진동을 감지하는 데 도움을 준다.", grammar:"hairs covering their bodies: 현재분사 후치 수식 / sense: 감지하다", vocab:[{w:"vibration",pos:"n",kr:"진동"},{w:"sense",pos:"v",kr:"감지하다"}]},
    {type:"para", label:"Para 3", role:"식이 — 주로 해초류"},
    {num:14, en:"Seagrasses and other marine plants make up most of a manatee's diet.", kr:"해초류와 기타 해양 식물이 매너티 식단의 대부분을 차지한다.", grammar:"make up: 구성하다, 차지하다 / marine: 해양의", vocab:[{w:"seagrass",pos:"n",kr:"해초"},{w:"marine",pos:"adj",kr:"해양의"},{w:"diet",pos:"n",kr:"식단"}]},
    {num:15, en:"Manatees spend about eight hours each day grazing and uprooting plants.", kr:"매너티는 매일 약 8시간을 풀을 뜯고 식물을 뿌리째 뽑는 데 보낸다.", grammar:"spend + 시간 + 동명사: ~하는 데 시간을 보내다 / uproot: 뿌리째 뽑다", vocab:[{w:"graze",pos:"v",kr:"풀을 뜯다, 방목하다"},{w:"uproot",pos:"v",kr:"뿌리째 뽑다"}]},
    {num:16, en:"They eat up to 15% of their weight in food each day.", kr:"그들은 하루에 체중의 최대 15%에 해당하는 음식을 먹는다.", grammar:"up to: 최대 ~까지", vocab:[{w:"up to",pos:"phr",kr:"최대 ~까지"}]},
    {num:17, en:"African manatees are omnivorous – studies have shown that molluscs and fish make up a small part of their diets.", kr:"아프리카 매너티는 잡식성이다 — 연구에 따르면 연체동물과 어류가 식단의 작은 부분을 차지한다.", grammar:"omnivorous: 잡식성의 / mollusc: 연체동물", vocab:[{w:"omnivorous",pos:"adj",kr:"잡식성의"},{w:"mollusc",pos:"n",kr:"연체동물"}]},
    {num:18, en:"West Indian and Amazonian manatees are both herbivores.", kr:"서인도 매너티와 아마존 매너티는 둘 다 초식동물이다.", grammar:"herbivore: 초식동물 (↔ carnivore: 육식, omnivore: 잡식)", vocab:[{w:"herbivore",pos:"n",kr:"초식동물"}]},
    {type:"para", label:"Para 4", role:"치아 구조 — 이빨과 입술"},
    {num:19, en:"Manatees' teeth are all molars – flat, rounded teeth for grinding food.", kr:"매너티의 치아는 모두 어금니로 — 음식을 갈기 위한 평평하고 둥근 이빨이다.", grammar:"molar: 어금니 / grind: 갈다, 분쇄하다", vocab:[{w:"molar",pos:"n",kr:"어금니"},{w:"grind",pos:"v",kr:"갈다, 분쇄하다"}]},
    {num:20, en:"Due to manatees' abrasive aquatic plant diet, these teeth get worn down and they eventually fall out, so they continually grow new teeth that get pushed forward to replace the ones they lose.", kr:"연마성 있는 수생 식물 식단 때문에 이 이빨들은 닳아 결국 빠지며, 그래서 그들은 빠진 이빨을 대체하기 위해 앞쪽으로 밀려나오는 새 이빨을 계속 자라낸다.", grammar:"due to: ~ 때문에 / abrasive: 연마성의 / wear down: 닳게 하다", vocab:[{w:"abrasive",pos:"adj",kr:"연마성의, 마모성의"},{w:"wear down",pos:"phr.v",kr:"닳다, 마모되다"},{w:"continually",pos:"adv",kr:"계속해서"}]},
    {num:21, en:"Instead of having incisors to grasp their food, manatees have lips which function like a pair of hands to help tear food away from the seafloor.", kr:"음식을 붙잡는 앞니 대신, 매너티는 해저에서 음식을 찢는 데 도움을 주는 한 쌍의 손처럼 기능하는 입술을 가지고 있다.", grammar:"Instead of + 동명사: ~ 대신 / function like: ~처럼 기능하다", vocab:[{w:"incisor",pos:"n",kr:"앞니"},{w:"grasp",pos:"v",kr:"붙잡다, 파악하다"},{w:"tear",pos:"v",kr:"찢다"}]},
    {type:"para", label:"Para 5", role:"호흡과 부력 조절"},
    {num:22, en:"Manatees are fully aquatic, but as mammals, they need to come up to the surface to breathe.", kr:"매너티는 완전히 수생이지만, 포유류로서 호흡하기 위해 수면으로 올라와야 한다.", grammar:"fully aquatic: 완전히 수생의 / come up to: ~까지 올라오다", vocab:[{w:"surface",pos:"n",kr:"수면, 표면"}]},
    {num:23, en:"When awake, they typically surface every two to four minutes, but they can hold their breath for much longer.", kr:"깨어 있을 때는 보통 2~4분마다 수면으로 올라오지만, 훨씬 더 오래 숨을 참을 수 있다.", grammar:"hold one's breath: 숨을 참다 / typically: 보통, 일반적으로", vocab:[{w:"typically",pos:"adv",kr:"보통, 일반적으로"},{w:"hold one's breath",pos:"phr",kr:"숨을 참다"}]},
    {num:24, en:"Adult manatees sleep underwater for 10-12 hours a day, but they come up for air every 15-20 minutes.", kr:"성체 매너티는 하루에 10~12시간 물속에서 잠을 자지만, 15~20분마다 공기를 마시러 올라온다.", grammar:"come up for air: 공기를 마시러 올라오다", vocab:[{w:"come up for air",pos:"phr",kr:"공기를 마시러 올라오다"}]},
    {num:25, en:"Active manatees need to breathe more frequently.", kr:"활동적인 매너티는 더 자주 호흡해야 한다.", grammar:"frequently: 자주 / active: 활동적인", vocab:[{w:"frequently",pos:"adv",kr:"자주"}]},
    {num:26, en:"It's thought that manatees use their muscular diaphragm and breathing to adjust their buoyancy.", kr:"매너티는 근육질 횡격막과 호흡을 이용하여 부력을 조절하는 것으로 생각된다.", grammar:"It's thought that + 절: ~라고 생각된다 / buoyancy: 부력", vocab:[{w:"diaphragm",pos:"n",kr:"횡격막"},{w:"buoyancy",pos:"n",kr:"부력"},{w:"adjust",pos:"v",kr:"조절하다"}]},
    {num:27, en:"They may use diaphragm contractions to compress and store gas in folds in their large intestine to help them float.", kr:"그들은 횡격막 수축을 이용해 대장의 주름에 가스를 압축·저장하여 떠오르는 데 도움을 받을 수 있다.", grammar:"contraction: 수축 / compress: 압축하다 / intestine: 장", vocab:[{w:"contraction",pos:"n",kr:"수축"},{w:"compress",pos:"v",kr:"압축하다"},{w:"intestine",pos:"n",kr:"장"}]},
    {type:"para", label:"Para 6", role:"서인도 매너티 — 서식지와 아종"},
    {num:28, en:"The West Indian manatee reaches about 3.5 metres long and weighs on average around 500 kilogrammes.", kr:"서인도 매너티는 길이 약 3.5m에 달하며 평균 약 500kg의 무게가 나간다.", grammar:"reach: ~에 달하다 / on average: 평균적으로", vocab:[{w:"on average",pos:"phr",kr:"평균적으로"}]},
    {num:29, en:"It moves between fresh water and salt water, taking advantage of coastal mangroves and coral reefs, rivers, lakes and inland lagoons.", kr:"그것은 담수와 해수 사이를 이동하며, 해안 맹그로브와 산호초, 강, 호수, 내륙 석호를 이용한다.", grammar:"take advantage of: ~을 이용하다 / lagoon: 석호", vocab:[{w:"mangrove",pos:"n",kr:"맹그로브"},{w:"coral reef",pos:"n",kr:"산호초"},{w:"lagoon",pos:"n",kr:"석호"}]},
    {num:30, en:"There are two subspecies of West Indian manatee: the Antillean manatee is found in waters from the Bahamas to Brazil, whereas the Florida manatee is found in US waters, although some individuals have been recorded in the Bahamas.", kr:"서인도 매너티에는 두 아종이 있다: 앤틸리언 매너티는 바하마에서 브라질까지의 해역에 서식하고, 플로리다 매너티는 미국 해역에 서식하지만 일부는 바하마에서도 기록됐다.", grammar:"subspecies: 아종 / whereas: 반면에 / although: 비록 ~이지만", vocab:[{w:"subspecies",pos:"n",kr:"아종"},{w:"Antillean",pos:"adj",kr:"앤틸리언의 (카리브해)"}]},
    {num:31, en:"In winter, the Florida manatee is typically restricted to Florida.", kr:"겨울에 플로리다 매너티는 보통 플로리다에만 제한된다.", grammar:"be restricted to: ~에 제한되다", vocab:[{w:"restricted",pos:"adj",kr:"제한된"}]},
    {num:32, en:"When the ambient water temperature drops below 20°C, it takes refuge in naturally and artificially warmed water, such as at the warm-water outfalls from powerplants.", kr:"주변 수온이 20°C 아래로 떨어지면, 발전소의 온수 방류수 같이 자연적·인공적으로 데워진 물에 피신한다.", grammar:"ambient: 주변의 / take refuge in: ~에 피신하다 / outfall: 방류수", vocab:[{w:"ambient",pos:"adj",kr:"주변의"},{w:"take refuge",pos:"phr",kr:"피신하다"},{w:"outfall",pos:"n",kr:"방류수, 출구"}]},
    {type:"para", label:"Para 7", role:"아프리카·아마존 매너티"},
    {num:33, en:"The African manatee is also about 3.5 metres long and found in the sea along the west coast of Africa, from Mauritania down to Angola.", kr:"아프리카 매너티도 약 3.5m 길이이며 모리타니아에서 앙골라까지 아프리카 서해안을 따라 서식한다.", grammar:"from A down to B: A에서 B까지 (남쪽으로)", vocab:[{w:"Mauritania",pos:"n",kr:"모리타니아"},{w:"Angola",pos:"n",kr:"앙골라"}]},
    {num:34, en:"The species also makes use of rivers, with the mammals seen in landlocked countries such as Mali and Niger.", kr:"이 종은 강도 이용하며, 말리와 니제르 같은 내륙국에서도 발견된다.", grammar:"make use of: ~을 이용하다 / landlocked: 내륙의 (바다가 없는)", vocab:[{w:"landlocked",pos:"adj",kr:"내륙의, 바다가 없는"},{w:"make use of",pos:"phr",kr:"이용하다"}]},
    {num:35, en:"The Amazonian manatee is the smallest species, though it is still a big animal.", kr:"아마존 매너티는 가장 작은 종이지만, 그래도 여전히 큰 동물이다.", grammar:"though: 비록 ~이지만 (양보 접속사)", vocab:[]},
    {num:36, en:"It grows to about 2.5 metres long and 350 kilogrammes.", kr:"길이 약 2.5m, 무게 350kg까지 자란다.", grammar:"grow to: ~까지 자라다", vocab:[]},
    {num:37, en:"Amazonian manatees favour calm, shallow waters that are above 23°C.", kr:"아마존 매너티는 23°C 이상인 잔잔하고 얕은 물을 선호한다.", grammar:"favour: 선호하다 / shallow: 얕은", vocab:[{w:"favour",pos:"v",kr:"선호하다"},{w:"shallow",pos:"adj",kr:"얕은"}]},
    {num:38, en:"This species is found in fresh water in the Amazon Basin in Brazil, as well as in Colombia, Ecuador and Peru.", kr:"이 종은 브라질의 아마존 유역 담수에서 발견되며, 콜롬비아, 에콰도르, 페루에서도 서식한다.", grammar:"as well as: ~뿐만 아니라 / basin: 유역", vocab:[{w:"basin",pos:"n",kr:"유역, 분지"}]},
    {type:"para", label:"Para 8", role:"멸종 위기 — 세 종 모두"},
    {num:39, en:"All three manatee species are endangered or at a heightened risk of extinction.", kr:"세 종의 매너티 모두 멸종 위기에 처해 있거나 멸종 위험이 높아진 상태다.", grammar:"endangered: 멸종 위기의 / heightened: 높아진 / extinction: 멸종", vocab:[{w:"endangered",pos:"adj",kr:"멸종 위기의"},{w:"extinction",pos:"n",kr:"멸종"},{w:"heightened",pos:"adj",kr:"높아진"}]},
    {num:40, en:"The African manatee and Amazonian manatee are both listed as Vulnerable by the International Union for Conservation of Nature (IUCN).", kr:"아프리카 매너티와 아마존 매너티는 국제자연보전연맹(IUCN)에 의해 모두 취약종으로 등재되어 있다.", grammar:"be listed as: ~로 등재되다 / Vulnerable: (IUCN 기준) 취약종", vocab:[{w:"vulnerable",pos:"adj",kr:"취약한, 취약종의"},{w:"conservation",pos:"n",kr:"보전, 보존"}]},
    {num:41, en:"It is estimated that 140,000 Amazonian manatees were killed between 1935 and 1954 for their meat, fat and skin with the latter used to make leather.", kr:"1935년과 1954년 사이에 아마존 매너티 14만 마리가 고기, 지방, 가죽(피부)을 얻기 위해 죽임을 당한 것으로 추정된다.", grammar:"It is estimated that + 절 / the latter: 후자 (여기서 skin을 지칭)", vocab:[{w:"estimate",pos:"v",kr:"추정하다"},{w:"leather",pos:"n",kr:"가죽"}]},
    {num:42, en:"In more recent years, African manatee decline has been tied to incidental capture in fishing nets and hunting.", kr:"최근에는 아프리카 매너티 감소가 어망에의 우연한 포획과 사냥에 기인하고 있다.", grammar:"be tied to: ~에 기인하다 / incidental: 우연한, 부수적인", vocab:[{w:"incidental",pos:"adj",kr:"우연한, 부수적인"},{w:"capture",pos:"n",kr:"포획"}]},
    {num:43, en:"Manatee hunting is now illegal in every country the African species is found in.", kr:"매너티 사냥은 아프리카 종이 발견되는 모든 국가에서 현재 불법이다.", grammar:"illegal: 불법의 / 관계절 후치 수식: the African species is found in", vocab:[{w:"illegal",pos:"adj",kr:"불법의"}]},
    {type:"para", label:"Para 9", role:"서인도 매너티 위협 및 보호 조치"},
    {num:44, en:"The two subspecies of West Indian manatee are listed as Endangered by the IUCN.", kr:"서인도 매너티의 두 아종은 IUCN에 의해 멸종위기종으로 등재되어 있다.", grammar:"Endangered: (IUCN 기준) 멸종위기종", vocab:[{w:"Endangered",pos:"adj",kr:"멸종위기의"}]},
    {num:45, en:"Both are also expected to undergo a decline of 20% over the next 40 years.", kr:"두 아종 모두 향후 40년간 20% 감소할 것으로 예상된다.", grammar:"be expected to: ~할 것으로 예상되다 / undergo: 겪다 / decline: 감소", vocab:[{w:"undergo",pos:"v",kr:"겪다, 경험하다"},{w:"decline",pos:"n",kr:"감소"}]},
    {num:46, en:"A review of almost 1,800 cases of entanglement in fishing nets and of plastic consumption among marine mammals in US waters from 2009 to 2020 found that at least 700 cases involved manatees.", kr:"2009년부터 2020년까지 미국 해역의 해양 포유류 중 어망 얽힘 및 플라스틱 섭취 사례 약 1,800건을 검토한 결과 최소 700건이 매너티와 관련된 것으로 나타났다.", grammar:"entanglement: 얽힘 / consumption: 섭취 / a review found that + 절", vocab:[{w:"entanglement",pos:"n",kr:"얽힘, 뒤엉킴"},{w:"consumption",pos:"n",kr:"섭취, 소비"}]},
    {num:47, en:"The chief cause of death in Florida manatees is boat strikes.", kr:"플로리다 매너티의 주요 사망 원인은 보트 충돌이다.", grammar:"chief: 주요한 / boat strike: 보트 충돌", vocab:[{w:"chief",pos:"adj",kr:"주요한, 으뜸의"},{w:"boat strike",pos:"n",kr:"보트 충돌"}]},
    {num:48, en:"However, laws in certain parts of Florida now limit boat speeds during winter, allowing slow-moving manatees more time to respond.", kr:"그러나 플로리다 일부 지역의 법률은 겨울 동안 보트 속도를 제한하여 느리게 이동하는 매너티에게 반응할 시간을 더 많이 준다.", grammar:"limit: 제한하다 / allowing: 현재분사 결과 용법", vocab:[{w:"limit",pos:"v",kr:"제한하다"},{w:"slow-moving",pos:"adj",kr:"느리게 이동하는"}]}
  ],

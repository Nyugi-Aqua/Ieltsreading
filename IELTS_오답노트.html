"C20_T4_P3": {
  title:"Cambridge 20 · Test 4 · Passage 3",
  topic:"A new role for livestock guard dogs",
  qTypes:["Section Matching","Matching People","Summary Completion"],
  sentences:[
    {type:"para", label:"Section A", role:"도입 — 가축 보호견의 전통적 역할"},
    {num:1, en:"For thousands of years, farmers in many parts of the world have used dogs to protect their livestock from predators.", kr:"수천 년 동안 세계 여러 지역의 농부들은 포식자로부터 가축을 보호하기 위해 개를 사용해왔다.", grammar:"livestock: 가축 / predator: 포식자 / protect from: ~로부터 보호하다", vocab:[{w:"livestock",pos:"n",kr:"가축"},{w:"predator",pos:"n",kr:"포식자"},{w:"protect",pos:"v",kr:"보호하다"}]},
    {num:2, en:"These livestock guard dogs, or LGDs, bond with the animals they protect, living among them and deterring potential attackers.", kr:"이 가축 보호견(LGD)은 그들이 보호하는 동물들과 유대를 형성하여, 그들 사이에 살면서 잠재적 공격자들을 막는다.", grammar:"bond with: ~와 유대를 형성하다 / deter: 막다, 억제하다", vocab:[{w:"bond with",pos:"phr.v",kr:"~와 유대를 형성하다"},{w:"deter",pos:"v",kr:"막다, 억제하다"}]},
    {num:3, en:"Their presence alone is often enough to discourage predators such as wolves and jackals from approaching the herd.", kr:"그들의 존재만으로도 늑대와 자칼 같은 포식자들이 무리에 접근하는 것을 막는 데 충분한 경우가 많다.", grammar:"discourage from: ~하는 것을 막다 / herd: 무리 (가축)", vocab:[{w:"jackal",pos:"n",kr:"자칼"},{w:"herd",pos:"n",kr:"무리 (가축)"},{w:"discourage",pos:"v",kr:"막다, 단념시키다"}]},
    {type:"para", label:"Section B", role:"나미비아 — 치타 보호 프로그램"},
    {num:4, en:"In Namibia, a country in southern Africa, LGDs are now being used for a rather different purpose: protecting the predators themselves.", kr:"남아프리카의 국가인 나미비아에서 LGD는 이제 꽤 다른 목적으로 사용되고 있다: 포식자 자체를 보호하는 것.", grammar:"rather different: 꽤 다른 / purpose: 목적", vocab:[{w:"purpose",pos:"n",kr:"목적"}]},
    {num:5, en:"Cheetahs, which are endangered, have long been killed by farmers because they prey on livestock.", kr:"멸종 위기에 처한 치타는 가축을 먹이로 삼기 때문에 오랫동안 농부들에게 죽임을 당해왔다.", grammar:"endangered: 멸종 위기의 / prey on: ~을 먹이로 삼다", vocab:[{w:"endangered",pos:"adj",kr:"멸종 위기의"},{w:"prey on",pos:"phr.v",kr:"~을 먹이로 삼다"}]},
    {num:6, en:"The Cheetah Conservation Fund discovered that when farmers used LGDs, cheetah killings dropped dramatically.", kr:"치타 보존 재단은 농부들이 LGD를 사용하면 치타 살해가 극적으로 줄어든다는 것을 발견했다.", grammar:"Conservation Fund: 보존 재단 / drop: 줄어들다 / dramatically: 극적으로", vocab:[{w:"conservation",pos:"n",kr:"보존, 보호"},{w:"dramatically",pos:"adv",kr:"극적으로"}]},
    {num:7, en:"The dogs guarded the livestock so effectively that cheetahs no longer felt the need to risk an attack, and farmers no longer felt the need to kill them.", kr:"개들이 가축을 너무 효과적으로 보호하여, 치타들은 더 이상 공격을 위험에 빠뜨릴 필요를 느끼지 않았고, 농부들도 더 이상 치타를 죽일 필요를 느끼지 않았다.", grammar:"effectively: 효과적으로 / risk an attack: 공격을 감행하다", vocab:[{w:"effectively",pos:"adv",kr:"효과적으로"},{w:"risk",pos:"v",kr:"위험에 빠뜨리다, 감행하다"}]},
    {type:"para", label:"Section C", role:"질병 위험 — LGD의 또 다른 역할"},
    {num:8, en:"One concern with LGDs is the risk of disease transmission between domestic dogs and wild animals.", kr:"LGD의 한 가지 우려는 집개와 야생 동물 사이의 질병 전파 위험이다.", grammar:"disease transmission: 질병 전파 / domestic: 가정의, 집의 / concern: 우려", vocab:[{w:"transmission",pos:"n",kr:"전파, 전달"},{w:"domestic",pos:"adj",kr:"가정의, 집의"},{w:"concern",pos:"n",kr:"우려"}]},
    {num:9, en:"Rabies and distemper, for example, can spread from dogs to wildlife populations, with potentially devastating consequences.", kr:"예를 들어 광견병과 디스템퍼는 개에서 야생 동물 집단으로 퍼질 수 있으며, 잠재적으로 파괴적인 결과를 초래할 수 있다.", grammar:"rabies: 광견병 / distemper: 디스템퍼 (개 홍역) / devastating: 파괴적인", vocab:[{w:"rabies",pos:"n",kr:"광견병"},{w:"distemper",pos:"n",kr:"디스템퍼 (개 홍역)"},{w:"devastating",pos:"adj",kr:"파괴적인"}]},
    {num:10, en:"Vaccination programmes are therefore a crucial part of any LGD scheme.", kr:"따라서 백신 접종 프로그램은 모든 LGD 계획의 중요한 부분이다.", grammar:"vaccination: 백신 접종 / scheme: 계획", vocab:[{w:"vaccination",pos:"n",kr:"백신 접종"},{w:"scheme",pos:"n",kr:"계획"}]},
    {type:"para", label:"Section D", role:"식량 제공 문제 — 현지 조달"},
    {num:11, en:"Another practical challenge is feeding the dogs.", kr:"또 다른 실질적인 과제는 개에게 먹이를 제공하는 것이다.", grammar:"practical: 실질적인 / challenge: 과제", vocab:[{w:"practical",pos:"adj",kr:"실질적인, 현실적인"},{w:"challenge",pos:"n",kr:"과제, 도전"}]},
    {num:12, en:"In remote areas, bringing in commercial dog food is expensive and logistically difficult.", kr:"외진 지역에서는 상업용 개 사료를 가져오는 것이 비용이 많이 들고 물류적으로 어렵다.", grammar:"remote: 외진 / logistically: 물류적으로 / commercial: 상업적인", vocab:[{w:"remote",pos:"adj",kr:"외진, 멀리 떨어진"},{w:"logistically",pos:"adv",kr:"물류적으로"}]},
    {num:13, en:"Programmes have therefore sought to source the dogs' food locally, for example from abattoirs.", kr:"따라서 프로그램들은 예를 들어 도축장에서 개의 먹이를 현지에서 조달하려 해왔다.", grammar:"source: 조달하다 / locally: 현지에서 / abattoir: 도축장", vocab:[{w:"source",pos:"v",kr:"조달하다"},{w:"abattoir",pos:"n",kr:"도축장"}]},
    {type:"para", label:"Section E", role:"연구 결과 — 경제적 효과"},
    {num:14, en:"Studies have shown that LGD programmes are highly cost-effective.", kr:"연구에 따르면 LGD 프로그램은 매우 비용 효율적이다.", grammar:"cost-effective: 비용 효율적인", vocab:[{w:"cost-effective",pos:"adj",kr:"비용 효율적인"}]},
    {num:15, en:"The cost of keeping a dog is far outweighed by the savings from reduced livestock losses.", kr:"개를 키우는 비용은 가축 손실 감소로 인한 절감액에 의해 훨씬 능가된다.", grammar:"outweigh: 능가하다 / savings: 절감액 / livestock losses: 가축 손실", vocab:[{w:"outweigh",pos:"v",kr:"능가하다"},{w:"savings",pos:"n",kr:"절감액, 저축"}]},
    {num:16, en:"In some programmes, farmers have reported that their losses to predators fell by as much as 90 percent after introducing LGDs.", kr:"일부 프로그램에서 농부들은 LGD를 도입한 후 포식자로 인한 손실이 최대 90%까지 줄었다고 보고했다.", grammar:"as much as: 최대 ~만큼 / fall: 줄다 / introduce: 도입하다", vocab:[{w:"as much as",pos:"phr",kr:"최대 ~만큼"}]},
    {type:"para", label:"Section F", role:"여우 — 새로운 적용 사례"},
    {num:17, en:"The use of LGDs is now being extended to protect not just large predators like cheetahs but also smaller animals.", kr:"LGD의 사용은 이제 치타 같은 큰 포식자뿐만 아니라 더 작은 동물들도 보호하기 위해 확대되고 있다.", grammar:"extend: 확대하다 / not just A but also B: A뿐만 아니라 B도", vocab:[{w:"extend",pos:"v",kr:"확대하다, 연장하다"}]},
    {num:18, en:"In parts of Australia, dogs are being used to protect endangered foxes from being hunted by humans or killed by introduced predators such as feral cats.", kr:"호주 일부 지역에서는 개가 멸종 위기에 처한 여우를 인간의 사냥이나 야생 고양이 같은 외래 포식자에 의한 살해로부터 보호하는 데 사용되고 있다.", grammar:"feral: 야생의 (가축화되었다가 야생화) / introduced: 외래의 / endangered: 멸종 위기의", vocab:[{w:"feral",pos:"adj",kr:"야생의 (야생화된)"},{w:"introduced",pos:"adj",kr:"외래의 (도입된)"}]},
    {type:"para", label:"Section G", role:"전문가 의견 — 미래 전망"},
    {num:19, en:"Dr Lesley Dickie of the European Association of Zoos and Aquaria believes that LGD programmes have enormous potential.", kr:"유럽동물원수족관협회의 레슬리 딕키 박사는 LGD 프로그램이 엄청난 잠재력을 가지고 있다고 믿는다.", grammar:"enormous: 엄청난 / potential: 잠재력", vocab:[{w:"enormous",pos:"adj",kr:"엄청난"},{w:"potential",pos:"n",kr:"잠재력"}]},
    {num:20, en:"She argues that the approach can be applied in many different regions and ecosystems, wherever livestock farming and wildlife coexist.", kr:"그녀는 이 접근법이 가축 농업과 야생동물이 공존하는 곳이면 어디든지 다양한 지역과 생태계에 적용될 수 있다고 주장한다.", grammar:"apply: 적용하다 / ecosystem: 생태계 / coexist: 공존하다", vocab:[{w:"ecosystem",pos:"n",kr:"생태계"},{w:"coexist",pos:"v",kr:"공존하다"}]},

// ═══════════════════════ NAV TREE ═══════════════════════
const navTree = document.getElementById('nav-tree');
[16,17,18,19,20].forEach(book => {
  const bg = document.createElement('div'); bg.className='book-group';
  const bl = document.createElement('div'); bl.className='book-label';
  bl.innerHTML=`<span class="arr">▼</span>Cambridge ${book}`;
  bl.onclick=()=>bl.classList.toggle('collapsed');
  const tg = document.createElement('div'); tg.className='test-group';
  for(let t=1;t<=4;t++){
    const tl=document.createElement('div'); tl.className='test-label';
    tl.innerHTML=`<span class="arr">▼</span>Test ${t}`;
    tl.onclick=()=>tl.classList.toggle('collapsed');
    const pl=document.createElement('div'); pl.className='passage-list';
    for(let p=1;p<=3;p++){
      const key=`C${book}_T${t}_P${p}`;
      const has=!!PASSAGES[key];
      const pi=document.createElement('div');
      pi.className='passage-item'+(has?' done':'');
      pi.dataset.key=key;
      pi.innerHTML=`Passage ${p}<span class="p-badge">${has?'✓':'—'}</span>`;
      pi.onclick=()=>selectPassage(key,pi);
      pl.appendChild(pi);
    }
    tg.appendChild(tl); tg.appendChild(pl);
  }
  bg.appendChild(bl); bg.appendChild(tg);
  navTree.appendChild(bg);
});

// ═══════════════════════ SIDEBAR TOGGLE ═══════════════════════
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const btn=document.getElementById('toggle-sidebar');
  const collapsed=sb.classList.toggle('collapsed');
  document.body.classList.toggle('sb-collapsed',collapsed);
  btn.textContent=collapsed?'›':'‹';
  btn.style.left=collapsed?'8px':'258px';
  btn.title=collapsed?'사이드바 열기':'사이드바 닫기';
}
// ═══════════════════════ SELECT ═══════════════════════
function selectPassage(key,el){
  document.querySelectorAll('.passage-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const d=PASSAGES[key];
  if(!d){renderEmpty(key);return;}
  document.getElementById('ptitle').textContent=d.title;
  const pt=document.getElementById('ptopic'); pt.textContent=d.topic; pt.style.display='inline-block';
  renderSents(d); renderVocabAll(d); renderTFNG(d); renderSummary(d);
  // reset to first tab
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="sents"]').classList.add('active');
  document.getElementById('tab-sents').classList.add('active');
}

function renderEmpty(key){
  document.getElementById('ptitle').textContent=key.replace('C','Cambridge ').replace('_T',' · Test ').replace('_P',' · Passage ');
  document.getElementById('ptopic').style.display='none';
  const html=`<div class="empty"><div class="em">📝</div><h3>데이터 없음</h3><p>공부 후 PASSAGES 객체에 추가하세요.<br><code>"${key}": { ... }</code></p></div>`;
  ['tab-sents','tab-vocab','tab-tfng','tab-summary'].forEach(id=>document.getElementById(id).innerHTML=html);
}

// ═══════════════════════ CIRCLE NUMS ═══════════════════════
function cn(n){
  const c='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺';
  return n<=50?c[n-1]:n;
}

// ═══════════════════════ RENDER SENTENCES ═══════════════════════
function renderSents(d){
  const el=document.getElementById('tab-sents');
  const html=d.sentences.map(s=>{
    if(s.type==='para'){
      return `<div class="para-divider">
        <span class="para-divider-badge">${s.label}</span>
        <span class="para-divider-role">${s.role}</span>
        <div class="para-divider-line"></div>
      </div>`;
    }
    return `<div class="sent-block">
      <div class="sent-num-row">
        <div class="sent-num">${cn(s.num)}</div>
        <div class="sent-en">${s.en}</div>
      </div>
      <div class="sent-kr">${s.kr}</div>
      ${s.grammar?`<div class="grammar-note">${s.grammar}</div>`:''}
      ${s.vocab&&s.vocab.length?`<table class="vocab-table">
        <tr><th>단어</th><th>품사</th><th>의미</th></tr>
        ${s.vocab.map(v=>`<tr><td>${v.w}</td><td>${v.pos}</td><td>${v.kr}</td></tr>`).join('')}
      </table>`:''}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="passage-intro">
      <h3>${d.title}</h3>
      <p>${d.topic}</p>
      <div class="q-types">${d.qTypes.map(q=>`<span class="q-chip">${q}</span>`).join('')}</div>
    </div>
    <div class="legend-row">
      <span style="font-size:11px;color:var(--tl);font-weight:600;">문법 색상:</span>
      <span class="leg"><span class="leg-dot" style="background:#1d4ed8"></span>주어(S)</span>
      <span class="leg"><span class="leg-dot" style="background:#b91c1c"></span>동사(V)</span>
      <span class="leg"><span class="leg-dot" style="background:#047857"></span>목적어(O)</span>
      <span class="leg"><span class="leg-dot" style="background:#6d28d9"></span>수식어(M)</span>
    </div>
    <div class="sentences-container">${html}</div>`;
}

// ═══════════════════════ RENDER VOCAB ═══════════════════════
function renderVocabAll(d){
  const el=document.getElementById('tab-vocab');
  if(!d.allVocab||!d.allVocab.length){el.innerHTML='<div class="empty"><div class="em">📖</div><h3>어휘 데이터 없음</h3></div>';return;}
  el.innerHTML=`<div class="vocab-all-container"><div class="vocab-all-grid">${
    d.allVocab.map(v=>`<div class="vcard">
      <div><span class="vcard-word">${v.w}</span><span class="vcard-pos">${v.pos}</span></div>
      ${v.pron?`<div class="vcard-pron">${v.pron}</div>`:''}
      <div class="vcard-kr">${v.kr}</div>
      <div class="vcard-ex">예: ${v.ex}</div>
      ${v.syn&&v.syn.length?`<div class="vcard-syn">유의어: ${v.syn.map(s=>`<span>${s}</span>`).join('')}</div>`:''}
    </div>`).join('')}
  </div></div>`;
}

// ═══════════════════════ RENDER T/F/NG ═══════════════════════
function renderTFNG(d){
  const el=document.getElementById('tab-tfng');
  if(!d.tfng||!d.tfng.length){el.innerHTML='<div class="empty"><div class="em">❌</div><h3>오답 데이터 없음</h3></div>';return;}
  el.innerHTML=`<div class="tfng-container">${d.tfng.map(q=>{
    const ca=q.correct.replace(' ','');
    const wrong=q.mine&&q.mine!==q.correct;
    return `<div class="tfng-block ans-${ca}">
      <div class="tfng-head">
        <div class="q-circle">${q.qNum}</div>
        <div class="q-stmt">${q.stmt}</div>
        <span class="ans-pill pill-${ca}">정답: ${q.correct}</span>
        ${q.mine?`<span class="ans-pill pill-mine">내 답: ${q.mine}</span>`:''}
      </div>
      ${q.mine?`<div class="result-row ${wrong?'wrong':'correct'}">${wrong?'✗ 오답':'✓ 정답'}</div>`:''}
      <div class="ev-label">📍 근거 문장 (${q.evPara})</div>
      <div class="ev-box">${q.ev}</div>
      <div class="why-label">🧠 ${q.correct}인 이유</div>
      <div class="why-box">${q.why}</div>
      ${q.trap?`<div class="trap-label" style="margin-top:8px">⚠️ 함정</div><div class="trap-box">${q.trap}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

// ═══════════════════════ RENDER SUMMARY ═══════════════════════
function renderSummary(d){
  const el=document.getElementById('tab-summary');
  el.innerHTML=`<div class="summary-container">
    <div class="sum-card">
      <div class="sum-title">📄 패시지 개요</div>
      <div class="sum-text">${d.summary}</div>
      <div class="q-types" style="margin-top:10px">${d.qTypes.map(q=>`<span class="q-chip">${q}</span>`).join('')}</div>
    </div>
    <div class="sum-card">
      <div class="sum-title">🗺️ 단락별 구조도</div>
      ${d.paragraphs.map(p=>`<div class="smap-row">
        <div class="smap-lbl">${p.lbl}</div>
        <div><div class="smap-role">${p.role}</div><div class="smap-desc">${p.desc}</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════ TABS ═══════════════════════
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  };
});

// ═══════════════════════ AUTO SELECT ═══════════════════════
const first=document.querySelector('.passage-item.done');
if(first) first.click();

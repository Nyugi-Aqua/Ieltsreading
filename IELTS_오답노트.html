"C18_T3_P3": {
  title:"Cambridge 18 · Test 3 · Passage 3",
  topic:"The Case for Mixed-Ability Classes",
  qTypes:["Multiple Choice","Summary Completion","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 혼합 능력 학급의 현실"},
    {num:1,en:"It's an English literature lesson in a UK school, and the teacher has just read an extract from Shakespeare's Romeo and Juliet with a class of 15-year-olds.",kr:"영국 학교의 영문학 수업에서 교사가 방금 15세 학생들과 셰익스피어의 로미오와 줄리엣 발췌문을 읽었다.",grammar:"<strong>has just read</strong> = 현재완료(방금 완료). <strong>an extract from</strong> = ~의 발췌문",vocab:[{w:"extract",pos:"n",kr:"발췌문"},{w:"literature",pos:"n",kr:"문학"}]},
    {num:2,en:"He's given some of the students copies of No Fear Shakespeare, a kid-friendly translation of the original. For three students, even these literacy demands are beyond them.",kr:"그는 일부 학생들에게 아이 친화적인 번역본인 '노 피어 셰익스피어'를 주었다. 세 명의 학생에게는 이런 읽기 요구조차 버거운 수준이다.",grammar:"<strong>beyond them</strong> = 그들의 능력 밖에. <strong>literacy demands</strong> = 읽기 능력 요구",vocab:[{w:"literacy",pos:"n",kr:"읽고 쓰는 능력"},{w:"beyond",pos:"prep",kr:"~을 넘어, 능력 밖에"}]},
    {num:3,en:"The teacher can ask the No Fear group to identify the key characters and maybe provide a tentative plot summary. He can ask most of the class about character development, and five of them might be able to support their statements with textual evidence.",kr:"교사는 '노 피어' 그룹에게 주요 인물을 파악하고 잠정적인 줄거리 요약을 제공하도록 요청할 수 있다. 대부분의 학생에게는 인물 발전에 대해 물어볼 수 있고, 그 중 다섯 명은 텍스트 증거로 자신의 주장을 뒷받침할 수 있을 것이다.",grammar:"<strong>tentative</strong> = 잠정적인. <strong>support ... with textual evidence</strong> = 증거로 뒷받침하다",vocab:[{w:"tentative",pos:"adj",kr:"잠정적인"},{w:"textual evidence",pos:"n",kr:"텍스트 증거"}]},
    {num:4,en:"Now two curious students are wondering whether Shakespeare advocates living a life of moderation or one of passionate engagement.",kr:"이제 두 명의 호기심 많은 학생들은 셰익스피어가 절제의 삶을 지지하는지 아니면 열정적 참여의 삶을 지지하는지 의문을 갖는다.",grammar:"<strong>whether A or B</strong> = A인지 B인지. <strong>advocates -ing</strong> = ~하는 것을 지지하다",vocab:[{w:"advocate",pos:"v",kr:"지지하다, 옹호하다"},{w:"moderation",pos:"n",kr:"절제, 중용"}]},
    {type:"para",label:"Para 2",role:"능력별 분반의 직관적 매력"},
    {num:5,en:"The practice of 'streaming', or 'tracking', involves separating students into classes depending on their diagnosed levels of attainment.",kr:"'스트리밍' 또는 '트래킹'이라는 관행은 학생들을 진단된 성취 수준에 따라 학급으로 분리하는 것을 포함한다.",grammar:"<strong>involves -ing</strong> = ~하는 것을 포함하다. <strong>depending on</strong> = ~에 따라",vocab:[{w:"streaming",pos:"n",kr:"능력별 분반"},{w:"attainment",pos:"n",kr:"성취, 달성"}]},
    {num:6,en:"The practice is intuitively appealing to almost every stakeholder.",kr:"이 관행은 거의 모든 이해관계자에게 직관적으로 매력적이다.",grammar:"<strong>intuitively appealing</strong> = 직관적으로 매력적인. <strong>stakeholder</strong> = 이해관계자",vocab:[{w:"intuitively",pos:"adv",kr:"직관적으로"},{w:"stakeholder",pos:"n",kr:"이해관계자"}]},
    {type:"para",label:"Para 3",role:"혼합 학급 비판 — 하이킹 비유"},
    {num:7,en:"I have heard the mixed-ability model attacked by way of analogy: a group hike.",kr:"나는 혼합 능력 모델이 유추를 통해 공격받는 것을 들었다: 단체 하이킹.",grammar:"<strong>by way of analogy</strong> = 유추를 통해. <strong>attacked</strong> = 과거분사(목적보어)",vocab:[{w:"analogy",pos:"n",kr:"유추, 비유"},{w:"hike",pos:"n",kr:"하이킹"}]},
    {num:8,en:"The fittest in the group take the lead and set a brisk pace, only to have to stop and wait every 20 minutes. This is frustrating, and their enthusiasm wanes.",kr:"그룹에서 가장 체력이 좋은 사람들이 앞장서서 빠른 속도를 정하지만, 결국 20분마다 멈춰서 기다려야 한다. 이는 좌절스럽고, 그들의 열정은 시들어간다.",grammar:"<strong>only to do</strong> = 결국 ~하게 되다(실망스러운 결과). <strong>wane</strong> = 줄어들다, 시들다",vocab:[{w:"brisk",pos:"adj",kr:"활기찬, 빠른"},{w:"wane",pos:"v",kr:"줄어들다, 시들다"}]},
    {num:9,en:"Mixed-ability classes bore students, frustrate parents and burn out teachers. The brightest ones will never summit Mount Qomolangma, and the stragglers won't enjoy the lovely stroll in the park they are perhaps more suited to.",kr:"혼합 능력 학급은 학생을 지루하게 하고, 부모를 답답하게 하며, 교사를 탈진시킨다. 가장 뛰어난 학생들은 에베레스트산 정상에 결코 오르지 못할 것이고, 뒤처지는 학생들은 자신에게 더 적합할 수도 있는 공원 산책을 즐기지 못할 것이다.",grammar:"<strong>burn out</strong> = 탈진시키다. <strong>summit</strong> = 정상에 오르다(동사). <strong>straggler</strong> = 뒤처지는 사람",vocab:[{w:"burn out",pos:"v",kr:"탈진시키다"},{w:"straggler",pos:"n",kr:"뒤처지는 사람"},{w:"stroll",pos:"n",kr:"산책"}]},
    {type:"para",label:"Para 4",role:"비고츠키의 ZPD 이론 — 스트리밍 지지 논거"},
    {num:10,en:"The current pedagogical paradigm is arguably that of constructivism, which emerged out of the work of psychologist Lev Vygotsky.",kr:"현재의 교육학적 패러다임은 심리학자 레프 비고츠키의 연구에서 나온 구성주의라고 할 수 있다.",grammar:"<strong>arguably</strong> = 주장하건대, 아마도. <strong>emerged out of</strong> = ~에서 나왔다",vocab:[{w:"pedagogical",pos:"adj",kr:"교육학적인"},{w:"paradigm",pos:"n",kr:"패러다임"},{w:"constructivism",pos:"n",kr:"구성주의"}]},
    {num:11,en:"Vygotsky emphasised the importance of targeting a student's specific 'zone of proximal development' (ZPD). This is the gap between what they can achieve only with support and what they can achieve independently.",kr:"비고츠키는 학생의 특정 '근접발달영역'(ZPD)을 목표로 하는 것의 중요성을 강조했다. 이것은 지원을 통해서만 달성할 수 있는 것과 독립적으로 달성할 수 있는 것 사이의 간격이다.",grammar:"<strong>zone of proximal development</strong> = 근접발달영역. <strong>what they can achieve</strong> = 관계사절(명사절)",vocab:[{w:"zone of proximal development",pos:"n",kr:"근접발달영역(ZPD)"},{w:"independently",pos:"adv",kr:"독립적으로"}]},
    {num:12,en:"The purpose of teaching is to provide and then gradually remove this 'scaffolding' until they are autonomous.",kr:"교육의 목적은 이 '스캐폴딩'을 제공한 다음 학생이 자율적이 될 때까지 점차 제거하는 것이다.",grammar:"<strong>to provide and then gradually remove</strong> = 병렬 to부정사. <strong>until</strong> = ~할 때까지",vocab:[{w:"scaffolding",pos:"n",kr:"비계, 지원 구조"},{w:"autonomous",pos:"adj",kr:"자율적인"}]},
    {type:"para",label:"Para 5",role:"스트리밍 실증 근거 부족 — Hattie 연구"},
    {num:13,en:"Despite all this, there is limited empirical evidence to suggest that streaming results in better outcomes for students.",kr:"이 모든 것에도 불구하고, 스트리밍이 학생들에게 더 나은 결과를 가져온다는 경험적 증거는 제한적이다.",grammar:"<strong>empirical evidence</strong> = 경험적 증거. <strong>to suggest that</strong> = ~을 시사하는(형용사적 to부정사)",vocab:[{w:"empirical",pos:"adj",kr:"경험적인"},{w:"outcome",pos:"n",kr:"결과"}]},
    {num:14,en:"Professor John Hattie notes that 'tracking has minimal effects on learning outcomes'. What is more, streaming appears to significantly – and negatively – affect those students assigned to the lowest sets.",kr:"존 해티 교수는 '트래킹은 학습 결과에 미치는 영향이 미미하다'고 언급한다. 더욱이 스트리밍은 가장 낮은 반에 배정된 학생들에게 현저하고 부정적인 영향을 미치는 것으로 보인다.",grammar:"<strong>What is more</strong> = 게다가(접속부사). <strong>assigned to</strong> = ~에 배정된(과거분사 후치수식)",vocab:[{w:"minimal",pos:"adj",kr:"미미한, 최소한의"},{w:"assigned to",pos:"phr",kr:"~에 배정된"}]},
    {num:15,en:"These students tend to have much higher representation of low socioeconomic class. The overall result is that the smart stay smart and the dumb get dumber, further entrenching the social divide.",kr:"이러한 학생들은 낮은 사회경제적 계층의 비율이 훨씬 높은 경향이 있다. 전반적인 결과는 영리한 학생은 계속 영리하고 둔한 학생은 더 둔해져 사회적 분열을 더욱 공고히 한다는 것이다.",grammar:"<strong>further entrenching</strong> = 분사구문(결과). <strong>get dumber</strong> = 점점 더 둔해지다(비교급)",vocab:[{w:"socioeconomic",pos:"adj",kr:"사회경제적인"},{w:"entrench",pos:"v",kr:"공고히 하다, 고착시키다"},{w:"social divide",pos:"n",kr:"사회적 분열"}]},
    {type:"para",label:"Para 6",role:"스트리밍의 교사 기대치 문제"},
    {num:16,en:"Streaming students by diagnosed achievement automatically limits what the teacher feels the student is capable of. Meanwhile, in a mixed environment, teachers' estimates need to be more diverse and flexible.",kr:"진단된 성취도에 따라 학생을 분반하면 교사가 학생이 할 수 있다고 느끼는 것이 자동으로 제한된다. 반면 혼합 환경에서는 교사의 평가가 더 다양하고 유연해야 한다.",grammar:"<strong>what the teacher feels ... capable of</strong> = 관계절(명사절). <strong>Meanwhile</strong> = 반면에(대조)",vocab:[{w:"capable of",pos:"adj",kr:"~을 할 수 있는"},{w:"estimate",pos:"n",kr:"평가, 추정"}]},
    {type:"para",label:"Para 7",role:"동료 학습의 가치 — MKO(더 많이 아는 타자)"},
    {num:17,en:"While streaming might seem to help teachers effectively target a student's ZPD, it can underestimate the importance of peer-to-peer learning.",kr:"스트리밍이 교사들이 학생의 ZPD를 효과적으로 목표로 삼는 데 도움이 되는 것처럼 보일 수 있지만, 동료 간 학습의 중요성을 과소평가할 수 있다.",grammar:"<strong>While</strong> = 양보 접속사. <strong>underestimate</strong> = 과소평가하다",vocab:[{w:"peer-to-peer",pos:"adj",kr:"동료 간의"},{w:"underestimate",pos:"v",kr:"과소평가하다"}]},
    {num:18,en:"A crucial aspect of constructivist theory is the role of the MKO – 'more knowledgeable other' – in knowledge construction.",kr:"구성주의 이론의 핵심 측면은 지식 구성에서 MKO, 즉 '더 많이 아는 타자'의 역할이다.",grammar:"<strong>MKO</strong> = more knowledgeable other. 대시(--)로 삽입 설명",vocab:[{w:"constructivist",pos:"adj",kr:"구성주의적인"},{w:"knowledgeable",pos:"adj",kr:"지식이 풍부한"}]},
    {num:19,en:"I find it amazing to watch students get over an idea to their peers in ways that I would never think of. They operate with different language tools and different social tools from teachers.",kr:"나는 학생들이 내가 결코 생각하지 못할 방식으로 동료들에게 아이디어를 전달하는 것을 보는 것이 놀랍다고 생각한다. 그들은 교사와 다른 언어적 도구와 사회적 도구를 사용한다.",grammar:"<strong>find it + adj + to do</strong> = 가목적어 구문. <strong>in ways that I would never think of</strong> = 관계절",vocab:[{w:"get over an idea",pos:"phr",kr:"아이디어를 전달하다"}]},
    {num:20,en:"There is also something exciting about passing on skills and knowledge that you yourself have just mastered – a certain pride and zeal, a certain freshness to the interaction.",kr:"자신이 방금 익힌 기술과 지식을 전달하는 것에 대한 어떤 흥미로운 점이 있다 – 어떤 자부심과 열정, 상호작용에서의 어떤 신선함.",grammar:"<strong>There is something + adj + about -ing</strong> = ~하는 것에 대한 어떤 ~ 한 것이 있다. <strong>just mastered</strong> = 현재완료(방금 완료)",vocab:[{w:"zeal",pos:"n",kr:"열정, 열심"},{w:"freshness",pos:"n",kr:"신선함"}]},
    {type:"para",label:"Para 8",role:"결론 — 혼합 학급의 사회적·협력적 가치"},
    {num:21,en:"Having a variety of different abilities in a collaborative learning environment provides valuable resources for helping students meet their learning needs, not to mention improving their communication and social skills.",kr:"협력적 학습 환경에서 다양한 능력을 갖추는 것은 학생들이 학습 필요를 충족하도록 돕는 귀중한 자원을 제공하며, 의사소통 및 사회적 기술 향상은 말할 것도 없다.",grammar:"<strong>Having ... provides</strong> = 동명사 주어. <strong>not to mention</strong> = ~는 말할 것도 없이",vocab:[{w:"collaborative",pos:"adj",kr:"협력적인"},{w:"meet one's needs",pos:"phr",kr:"필요를 충족하다"}]},
    {num:22,en:"And today, more than ever, we need the many to flourish – not suffer at the expense of a few bright stars.",kr:"그리고 오늘날, 그 어느 때보다도, 우리는 소수의 뛰어난 학생들을 위해 다수가 희생하는 것이 아니라 다수가 번성하기를 필요로 한다.",grammar:"<strong>more than ever</strong> = 그 어느 때보다 더. <strong>at the expense of</strong> = ~을 희생하여",vocab:[{w:"flourish",pos:"v",kr:"번성하다, 번창하다"},{w:"at the expense of",pos:"phr",kr:"~을 희생하여"}]},
    {num:23,en:"Once a year, I go on a hike with my class, a mixed bunch of students. It is challenging. The fittest students realise they need to encourage the reluctant. There are lookouts who report back, and extra items to carry for others. We make it – together.",kr:"나는 일 년에 한 번 다양한 학생들로 구성된 반과 함께 하이킹을 간다. 힘들다. 가장 체력이 좋은 학생들은 소극적인 학생들을 격려해야 한다는 것을 깨닫는다. 상황을 전달하는 전령이 있고, 다른 사람들을 위해 추가 짐을 운반한다. 우리는 함께 해낸다.",grammar:"<strong>make it</strong> = 해내다, 목표에 도달하다. <strong>reluctant</strong> = 소극적인, 꺼리는",vocab:[{w:"reluctant",pos:"adj",kr:"소극적인, 꺼리는"},{w:"lookout",pos:"n",kr:"전령, 경계병"},{w:"make it",pos:"phr",kr:"해내다, 성공하다"}]}
  ],

    {qNum:36,stmt:"The Vygotsky model of education supports the concept of a mixed-ability class.",correct:"NO",mine:"",evPara:"Para 4",ev:"If we accept this model, it follows that <mark>streaming students with similar ZPDs would be an efficient and effective solution</mark>. And that forcing everyone on the same hike – regardless of aptitude – would be madness.",why:"비고츠키의 ZPD 이론은 오히려 스트리밍(분반)을 지지하는 논거로 사용된다. 유사한 ZPD를 가진 학생들을 함께 배치하는 것이 효율적이라고 시사함.",trap:"비고츠키 = 혼합 학급 지지라고 착각하기 쉬움. 실제로 저자는 ZPD 이론이 스트리밍을 지지하는 것처럼 보이지만, 그것이 전부가 아니라고 주장한다."},
    {qNum:37,stmt:"Some teachers are uncertain about allowing students to take on MKO roles in the classroom.",correct:"NOT GIVEN",mine:"",evPara:"Para 7",ev:"While teachers are traditionally the MKOs in classrooms, <mark>the value of knowledgeable student peers must not go unrecognised</mark> either.",why:"교사들이 학생 MKO 역할에 대해 불확실하다는 언급은 없다. 본문은 단순히 학생 동료의 가치를 인정해야 한다고 말할 뿐이다.",trap:"MKO 관련 내용이 나오기 때문에 YES/NO로 혼동하기 쉽지만, 교사들의 불확실성에 대한 언급이 전혀 없다."},
    {qNum:38,stmt:"It can be rewarding to teach knowledge which you have only recently acquired.",correct:"YES",mine:"",evPara:"Para 7",ev:"There is also <mark>something exciting about passing on skills and knowledge that you yourself have just mastered</mark> – a certain pride and zeal, a certain freshness to the interaction.",why:"방금 익힌 기술과 지식을 전달하는 것에 흥미로움, 자부심, 열정이 있다고 명시적으로 언급한다.",trap:""},
    {qNum:39,stmt:"The priority should be to ensure that the highest-achieving students attain their goals.",correct:"NO",mine:"",evPara:"Para 8",ev:"Today, more than ever, we need <mark>the many to flourish – not suffer at the expense of a few bright stars</mark>.",why:"저자는 소수의 우수 학생을 위해 다수가 희생되어서는 안 된다고 주장한다. 최우수 학생의 목표 달성이 우선순위가 아니라는 것.",trap:""},
    {qNum:40,stmt:"Taking part in collaborative outdoor activities with teachers and classmates can improve student outcomes in the classroom.",correct:"NOT GIVEN",mine:"",evPara:"Para 8",ev:"Once a year, I go on a hike with my class... <mark>We make it – together.</mark>",why:"하이킹이 협력의 메타포로 사용될 뿐, 교실 성과 향상과의 직접적 연관성은 언급되지 않는다.",trap:"하이킹 이야기가 결론에 나와 YES처럼 느껴지지만, 교실 성과 개선에 대한 명시적 주장은 없다."}

    {type:"para",label:"Para A",role:"도입 — 녹색 지붕의 확산과 도시 문제 해결"},
    {num:1,en:"Rooftops covered with grass, vegetable gardens and lush foliage are now a common sight in many cities around the world.",kr:"잔디, 채소 정원, 무성한 초목으로 덮인 옥상은 이제 전 세계 많은 도시에서 흔히 볼 수 있는 광경이다.",grammar:"<strong>covered with</strong> = 과거분사 후치수식. <strong>lush foliage</strong> = 무성한 초목",vocab:[{w:"lush",pos:"adj",kr:"무성한, 풍성한"},{w:"foliage",pos:"n",kr:"잎, 초목"}]},
    {num:2,en:"Among the benefits are saving on energy costs, mitigating the risk of floods, making habitats for urban wildlife, tackling air pollution and even growing food.",kr:"혜택으로는 에너지 비용 절감, 홍수 위험 완화, 도시 야생동물 서식지 조성, 대기오염 해결, 그리고 식량 재배까지 포함된다.",grammar:"<strong>Among the benefits are</strong> = 도치 구문. <strong>mitigating</strong> = 완화하는(동명사)",vocab:[{w:"mitigate",pos:"v",kr:"완화하다"},{w:"habitat",pos:"n",kr:"서식지"}]},
    {num:3,en:"The UK is relatively new to developing green roofs, and local governments and institutions are playing a major role in spreading the practice. London is home to much of the UK's green roof market, mainly due to forward-thinking policies such as the London Plan, which has paved the way to more than doubling the area of green roofs in the capital.",kr:"영국은 녹색 지붕 개발에 비교적 새로 진입했으며, 지방 정부와 기관이 이 관행을 확산하는 데 중요한 역할을 하고 있다. 런던은 영국 녹색 지붕 시장의 상당 부분을 차지하는데, 이는 주로 런던 플랜과 같은 선진적인 정책 덕분으로, 수도의 녹색 지붕 면적을 두 배 이상으로 늘리는 길을 열었다.",grammar:"<strong>is home to</strong> = ~의 중심지이다. <strong>paved the way to</strong> = ~로 가는 길을 닦다",vocab:[{w:"forward-thinking",pos:"adj",kr:"선진적인, 앞을 내다보는"},{w:"pave the way",pos:"phr",kr:"길을 닦다, 기반을 마련하다"}]},
    {type:"para",label:"Para B",role:"녹색 지붕의 사회적 가치 — 정신건강·생활질"},
    {num:4,en:"Ongoing research is showcasing how green roofs in cities can integrate with 'living walls': environmentally friendly walls which are partially or completely covered with greenery.",kr:"진행 중인 연구는 도시의 녹색 지붕이 '생태 벽'과 어떻게 통합될 수 있는지를 보여주고 있다: 환경친화적인 벽으로 부분적으로 또는 완전히 초록 식물로 덮인 것이다.",grammar:"<strong>showcasing how ... can integrate</strong> = 간접의문문. <strong>which are ... covered</strong> = 계속적 관계절",vocab:[{w:"integrate with",pos:"v",kr:"~와 통합되다"},{w:"greenery",pos:"n",kr:"녹색 식물, 초목"}]},
    {num:5,en:"Doctors are increasingly prescribing time spent gardening outdoors for patients dealing with anxiety and depression.",kr:"의사들은 불안과 우울증을 겪는 환자들에게 야외에서 가드닝하는 시간을 점점 더 많이 처방하고 있다.",grammar:"<strong>prescribing time spent gardening</strong> = 처방하다 + 시간 + 분사 수식. <strong>dealing with</strong> = 현재분사 후치수식",vocab:[{w:"prescribe",pos:"v",kr:"처방하다"},{w:"anxiety",pos:"n",kr:"불안"}]},
    {num:6,en:"Research has found that access to even the most basic green spaces can provide a better quality of life for dementia sufferers and help people avoid obesity.",kr:"연구에 따르면 가장 기본적인 녹지 공간에 대한 접근조차도 치매 환자들에게 더 나은 삶의 질을 제공하고 사람들이 비만을 피하는 데 도움을 줄 수 있다.",grammar:"<strong>access to</strong> = ~에 대한 접근. <strong>even the most basic</strong> = even은 최상급 강조",vocab:[{w:"dementia",pos:"n",kr:"치매"},{w:"obesity",pos:"n",kr:"비만"}]},
    {type:"para",label:"Para C",role:"북미 — 녹색 지붕 보편화와 신축 건물 이점"},
    {num:7,en:"In North America, green roofs have become mainstream, with a wide array of expansive, accessible and food-producing roofs installed in buildings.",kr:"북미에서 녹색 지붕은 주류가 되었으며, 넓고 접근 가능하며 식량을 생산하는 다양한 지붕이 건물에 설치되고 있다.",grammar:"<strong>have become mainstream</strong> = 현재완료(변화). <strong>with ... installed</strong> = 독립분사구문(부대상황)",vocab:[{w:"mainstream",pos:"n/adj",kr:"주류(의)"},{w:"expansive",pos:"adj",kr:"광범위한, 넓은"}]},
    {num:8,en:"Being able to keep enough water at roof height and distribute it right across the rooftop is crucial to maintaining the plants on any green roof.",kr:"옥상 높이에 충분한 물을 보관하고 옥상 전체에 분배할 수 있는 능력은 모든 녹색 지붕의 식물을 유지하는 데 필수적이다.",grammar:"<strong>Being able to</strong> = 동명사 주어. <strong>is crucial to -ing</strong> = ~하는 데 필수적이다",vocab:[{w:"crucial to",pos:"adj",kr:"~에 필수적인"},{w:"distribute",pos:"v",kr:"분배하다"}]},
    {num:9,en:"Having a stronger roof also makes it easier to grow a greater variety of plants, since the soil can be deeper.",kr:"더 튼튼한 지붕은 토양을 더 깊게 만들 수 있어 더 다양한 식물을 재배하기가 더 쉬워진다.",grammar:"<strong>makes it easier to grow</strong> = 가목적어-진목적어. <strong>since</strong> = 이유의 접속사",vocab:[{w:"variety of",pos:"n",kr:"다양한 종류의"}]},
    {type:"para",label:"Para D",role:"녹색 지붕 확산을 위한 경제적 논거와 과제"},
    {num:10,en:"For green roofs to become the norm for new developments, there needs to be support from public authorities and private investors.",kr:"녹색 지붕이 새로운 개발의 표준이 되려면 공공 기관과 민간 투자자들의 지원이 필요하다.",grammar:"<strong>For green roofs to become</strong> = 의미상 주어 + to부정사. <strong>the norm</strong> = 표준, 일반적인 것",vocab:[{w:"norm",pos:"n",kr:"표준, 기준"},{w:"public authority",pos:"n",kr:"공공 기관"}]},
    {num:11,en:"To convince investors and developers that installing green roofs is worthwhile, economic arguments are still the most important.",kr:"녹색 지붕 설치가 가치 있다는 것을 투자자와 개발업자에게 납득시키기 위해서는 경제적 논거가 여전히 가장 중요하다.",grammar:"<strong>To convince ... that</strong> = 목적의 to부정사. <strong>worthwhile</strong> = 가치 있는",vocab:[{w:"worthwhile",pos:"adj",kr:"가치 있는"},{w:"convince",pos:"v",kr:"납득시키다, 설득하다"}]},
    {num:12,en:"The term 'natural capital' has been developed to explain the economic value of nature; for example, measuring the money saved by installing natural solutions to protect against flood damage.",kr:"'자연 자본'이라는 용어는 자연의 경제적 가치를 설명하기 위해 개발되었다; 예를 들어, 홍수 피해로부터 보호하기 위해 자연적 해결책을 설치함으로써 절약되는 비용을 측정하는 것이다.",grammar:"<strong>has been developed to explain</strong> = 현재완료 수동 + 목적 to부정사. <strong>natural capital</strong> = 자연 자본",vocab:[{w:"natural capital",pos:"n",kr:"자연 자본"},{w:"flood damage",pos:"n",kr:"홍수 피해"}]},
    {type:"para",label:"Para E",role:"녹색 지붕의 진화 — 블루·브라운 지붕과 미래"},
    {num:13,en:"As the expertise about green roofs grows, official standards have been developed to ensure that they are designed, constructed and maintained properly.",kr:"녹색 지붕에 대한 전문 지식이 성장하면서 적절하게 설계, 건설 및 유지되도록 공식 기준이 개발되었다.",grammar:"<strong>As ... grows</strong> = 시간/비례의 접속사. <strong>to ensure that</strong> = 목적의 to부정사",vocab:[{w:"expertise",pos:"n",kr:"전문 지식"},{w:"official standards",pos:"n",kr:"공식 기준"}]},
    {num:14,en:"For example, 'blue roofs' enable buildings to hold water over longer periods of time, rather than draining it away quickly – crucial in times of heavier rainfall.",kr:"예를 들어, '블루 루프'는 빠르게 배수하는 대신 건물이 더 오랜 시간 동안 물을 보유할 수 있게 한다 – 폭우 시에 중요하다.",grammar:"<strong>enable A to do</strong> = A가 ~할 수 있게 하다. <strong>rather than -ing</strong> = ~하는 대신",vocab:[{w:"drain away",pos:"v",kr:"배수하다, 흘러나가다"},{w:"rainfall",pos:"n",kr:"강우량"}]},
    {num:15,en:"There are also combinations of green roofs with solar panels, and 'brown roofs' which are wilder in nature and maximise biodiversity.",kr:"태양광 패널과 결합된 녹색 지붕, 그리고 더 자연적이고 생물다양성을 극대화하는 '브라운 루프'도 있다.",grammar:"<strong>which are wilder in nature</strong> = 계속적 관계절. <strong>maximise biodiversity</strong> = 생물다양성을 극대화하다",vocab:[{w:"biodiversity",pos:"n",kr:"생물다양성"},{w:"solar panels",pos:"n",kr:"태양광 패널"}]},
    {num:16,en:"If the trend continues, it could create new jobs and a more vibrant and sustainable local food economy – alongside many other benefits.",kr:"이 추세가 계속된다면 새로운 일자리와 더 활발하고 지속 가능한 지역 식품 경제를 창출할 수 있다 – 다른 많은 혜택과 함께.",grammar:"<strong>If ... could create</strong> = 가정법 현재. <strong>alongside</strong> = ~와 함께",vocab:[{w:"vibrant",pos:"adj",kr:"활기찬, 생기 넘치는"},{w:"sustainable",pos:"adj",kr:"지속 가능한"}]},
    {num:17,en:"The evidence so far indicates that green roofs have the potential to transform cities and help them function sustainably long into the future.",kr:"지금까지의 증거는 녹색 지붕이 도시를 변화시키고 먼 미래까지 지속 가능하게 기능하도록 도울 잠재력이 있음을 나타낸다.",grammar:"<strong>have the potential to</strong> = ~할 잠재력이 있다. <strong>long into the future</strong> = 먼 미래까지",vocab:[{w:"potential",pos:"n",kr:"잠재력"},{w:"sustainably",pos:"adv",kr:"지속 가능하게"}]}
  ],

  summary:"Cambridge 18 Test 4 Passage 1. 녹색 지붕은 에너지 절감, 홍수 완화, 생물다양성, 식량 생산 등 다양한 혜택을 제공한다. 북미에서는 이미 주류화됐으며, 영국도 런던 플랜 등 정책으로 확산 중이다. 블루·브라운 지붕 등 새로운 변형도 등장하며 도시의 지속 가능성에 기여할 잠재력이 있다."

"C18_T4_P2": {
  title:"Cambridge 18 · Test 4 · Passage 2",
  topic:"The Growth Mindset",
  qTypes:["Multiple Choice","People Matching","YES/NO/NOT GIVEN"],
  sentences:[
    {type:"para",label:"Para 1",role:"도입 — 고정 지능관에서 가변 지능관으로의 전환"},
    {num:1,en:"Over the past century, a powerful idea has taken root in the educational landscape: the concept of intelligence as something innate has been supplanted by the idea that intelligence is not fixed.",kr:"지난 세기에 걸쳐 교육 분야에 강력한 아이디어가 자리 잡았다: 지능이 타고나는 것이라는 개념이 지능은 고정되어 있지 않다는 생각으로 대체되었다.",grammar:"<strong>has taken root</strong> = 현재완료(자리 잡다). <strong>has been supplanted by</strong> = 현재완료 수동",vocab:[{w:"innate",pos:"adj",kr:"타고난, 선천적인"},{w:"supplant",pos:"v",kr:"대체하다"}]},
    {num:2,en:"Psychologist Alfred Binet, the developer of the first intelligence tests, was one of many 19th-century scientists who held that earlier view and sought to quantify cognitive ability.",kr:"최초의 지능 테스트 개발자인 심리학자 알프레드 비네는 그 이전의 관점을 지지하고 인지 능력을 수량화하려 한 많은 19세기 과학자들 중 한 명이었다.",grammar:"<strong>the developer of</strong> = 동격 삽입구. <strong>who held that ... and sought</strong> = 관계절 내 병렬",vocab:[{w:"quantify",pos:"v",kr:"수량화하다"},{w:"cognitive",pos:"adj",kr:"인지적인"}]},
    {num:3,en:"Then, in the early 20th century, progressive thinkers revolted against the notion that inherent ability is destiny.",kr:"그 후 20세기 초에 진보적 사상가들은 타고난 능력이 운명이라는 개념에 반기를 들었다.",grammar:"<strong>revolted against</strong> = ~에 반기를 들다. <strong>the notion that</strong> = 동격 that절",vocab:[{w:"revolt against",pos:"v",kr:"~에 반기를 들다"},{w:"inherent",pos:"adj",kr:"타고난, 내재적인"},{w:"destiny",pos:"n",kr:"운명"}]},
    {type:"para",label:"Para 2",role:"성장 마인드셋 이론 — 학교 적용"},
    {num:4,en:"'Growth mindset theory' is a relatively new – and extremely popular – version of this idea. A major focus of the growth mindset in schools is coaxing students away from seeing failure as an indication of their ability.",kr:"'성장 마인드셋 이론'은 이 아이디어의 비교적 새롭고 매우 인기 있는 버전이다. 학교에서 성장 마인드셋의 주요 초점은 학생들이 실패를 자신의 능력의 지표로 보지 않도록 설득하는 것이다.",grammar:"<strong>coaxing away from -ing</strong> = ~하지 않도록 달래다. 삽입 대시(–)로 강조",vocab:[{w:"coax",pos:"v",kr:"달래다, 설득하다"},{w:"indication",pos:"n",kr:"지표, 징후"}]},
    {num:5,en:"'Smart is not something that you just are, smart is something that you can get.'",kr:"'똑똑하다는 것은 그냥 타고나는 것이 아니라, 얻을 수 있는 것이다.'",grammar:"<strong>something that you just are vs. something that you can get</strong> = 대조 구조. <strong>not ... but</strong>의 의미",vocab:[]},
    {type:"para",label:"Para 3",role:"Dweck의 실험 — 칭찬의 유형이 마인드셋에 미치는 영향"},
    {num:6,en:"In one key experiment, Dweck divided a group of 10- to 12-year-olds into two groups. All were told that they had achieved a high score on a test but the first group were praised for their intelligence in achieving this, while the others were praised for their effort.",kr:"한 핵심 실험에서 드웩은 10~12세 그룹을 두 그룹으로 나눴다. 모두 테스트에서 높은 점수를 받았다는 말을 들었지만, 첫 번째 그룹은 지능에 대해, 나머지는 노력에 대해 칭찬받았다.",grammar:"<strong>were told that</strong> = 수동태 + 명사절. <strong>while</strong> = 대조의 접속사",vocab:[{w:"praise",pos:"v",kr:"칭찬하다"},{w:"intelligence",pos:"n",kr:"지능"}]},
    {num:7,en:"The second group – those who had been instilled with a 'growth mindset' – were subsequently far more likely to put effort into future tasks.",kr:"두 번째 그룹 – '성장 마인드셋'을 심어받은 사람들 – 은 이후 미래 과제에 노력을 기울일 가능성이 훨씬 더 높았다.",grammar:"<strong>had been instilled with</strong> = 과거완료 수동. <strong>far more likely to</strong> = far가 비교급 강조",vocab:[{w:"instill",pos:"v",kr:"심어주다, 주입하다"},{w:"subsequently",pos:"adv",kr:"이후에, 그 결과"}]},
    {num:8,en:"Meanwhile, the former took on only those tasks that would not risk their sense of worth. Praising ability actually made the students perform worse, while praising effort emphasised that change was possible.",kr:"반면 전자는 자신의 가치감을 위험에 빠뜨리지 않을 과제만 맡았다. 능력을 칭찬하는 것은 오히려 학생들의 수행을 더 나쁘게 만들었고, 노력을 칭찬하는 것은 변화가 가능하다는 것을 강조했다.",grammar:"<strong>the former</strong> = 앞서 언급된 것. <strong>made the students perform worse</strong> = 사역동사 구조",vocab:[{w:"sense of worth",pos:"n",kr:"가치감"},{w:"the former",pos:"pron",kr:"전자"}]},
    {type:"para",label:"Para 4",role:"교육 시스템의 장벽 — 성과 중심 문화"},
    {num:9,en:"One of the greatest impediments to successfully implementing a growth mindset, however, is the education system itself: in many parts of the world, the school climate is obsessed with performance in the form of constant testing.",kr:"그러나 성장 마인드셋을 성공적으로 실행하는 데 있어 가장 큰 장애물 중 하나는 교육 시스템 그 자체이다: 세계 많은 지역에서 학교 분위기는 지속적인 시험의 형태로 성과에 집착한다.",grammar:"<strong>impediment to -ing</strong> = ~하는 데 있어 장애물. <strong>is obsessed with</strong> = ~에 집착하다",vocab:[{w:"impediment",pos:"n",kr:"장애물"},{w:"obsessed with",pos:"adj",kr:"~에 집착하는"}]},
    {num:10,en:"Nor is it unusual for schools to create a certain cognitive dissonance, when they applaud the benefits of a growth mindset but then hand out fixed target grades.",kr:"학교가 성장 마인드셋의 이점을 칭찬하면서도 고정된 목표 성적을 나눠주는 인지 부조화를 만드는 것도 드물지 않다.",grammar:"<strong>Nor is it unusual for</strong> = 부정어 도치. <strong>cognitive dissonance</strong> = 인지 부조화",vocab:[{w:"cognitive dissonance",pos:"n",kr:"인지 부조화"},{w:"applaud",pos:"v",kr:"칭찬하다, 박수를 보내다"}]},
    {type:"para",label:"Para 5",role:"드웩 연구에 대한 비판 — 재현 실패"},
    {num:11,en:"The statistician Andrew Gelman claims that 'their research designs have enough degrees of freedom that they could take their data to support just about any theory at all'.",kr:"통계학자 앤드류 겔만은 '그들의 연구 설계에는 데이터가 거의 모든 이론을 지지할 수 있을 만큼 충분한 자유도가 있다'고 주장한다.",grammar:"<strong>degrees of freedom</strong> = 자유도(통계 용어). <strong>just about any</strong> = 거의 모든",vocab:[{w:"statistician",pos:"n",kr:"통계학자"},{w:"degrees of freedom",pos:"n",kr:"자유도"}]},
    {num:12,en:"Professor Timothy Bates, who has been trying to replicate Dweck's work, is finding that the results are repeatedly null. 'Kids with the growth mindset aren't getting better grades, either before or after our intervention study.'",kr:"드웩의 연구를 재현하려는 티모시 베이츠 교수는 결과가 반복적으로 무효임을 발견하고 있다. '성장 마인드셋을 가진 아이들은 우리 개입 연구 전후 모두에서 더 나은 성적을 받지 못하고 있다.'",grammar:"<strong>has been trying</strong> = 현재완료 진행(지속된 시도). <strong>repeatedly null</strong> = 반복적으로 무효인",vocab:[{w:"replicate",pos:"v",kr:"재현하다, 복제하다"},{w:"null",pos:"adj",kr:"무효의, 효과 없는"}]},
    {type:"para",label:"Para 6",role:"드웩의 반론 — 오해와 오용"},
    {num:13,en:"Dweck argues that her work has been misunderstood and misapplied in a range of ways. She has also expressed concerns that her theories are being misappropriated in schools by being conflated with the self-esteem movement.",kr:"드웩은 자신의 연구가 다양한 방식으로 오해되고 잘못 적용되었다고 주장한다. 그녀는 또한 자신의 이론이 자존감 운동과 혼동됨으로써 학교에서 오용되고 있다는 우려를 표명했다.",grammar:"<strong>has been misunderstood and misapplied</strong> = 현재완료 수동 병렬. <strong>conflated with</strong> = ~와 혼동된",vocab:[{w:"misappropriate",pos:"v",kr:"오용하다"},{w:"conflate",pos:"v",kr:"혼동하다, 합치다"},{w:"self-esteem",pos:"n",kr:"자존감"}]},
    {num:14,en:"'For me the growth mindset is a tool for learning and improvement. It's not just a vehicle for making children feel good.'",kr:"'저에게 성장 마인드셋은 학습과 향상을 위한 도구입니다. 그것은 단순히 아이들을 기분 좋게 만드는 수단이 아닙니다.'",grammar:"<strong>a tool for</strong> vs. <strong>a vehicle for</strong> = 도구/수단 표현. <strong>just</strong> = 단순히(강조 부사)",vocab:[{w:"vehicle for",pos:"n",kr:"~을 위한 수단"}]},
    {type:"para",label:"Para 7",role:"교실 적용의 실패 원인 — 개입의 미묘함"},
    {num:15,en:"Growth mindset supporters David Yeager and Gregory Walton claim that interventions should be delivered in a subtle way to maximise their effectiveness.",kr:"성장 마인드셋 지지자인 데이비드 예거와 그레고리 월튼은 개입이 효과를 극대화하려면 미묘한 방식으로 전달되어야 한다고 주장한다.",grammar:"<strong>should be delivered</strong> = 수동태 당위. <strong>in a subtle way</strong> = 미묘한 방식으로",vocab:[{w:"intervention",pos:"n",kr:"개입"},{w:"subtle",pos:"adj",kr:"미묘한"}]},
    {num:16,en:"They say that if adolescents perceive a teacher's intervention as conveying that they are in need of help, this could undo its intended effects.",kr:"그들은 만약 청소년들이 교사의 개입을 자신이 도움이 필요하다는 것을 전달하는 것으로 인식한다면, 이것이 의도된 효과를 무효화할 수 있다고 말한다.",grammar:"<strong>perceive A as -ing</strong> = A를 ~하는 것으로 인식하다. <strong>undo</strong> = 무효화하다",vocab:[{w:"perceive",pos:"v",kr:"인식하다"},{w:"undo",pos:"v",kr:"무효화하다, 되돌리다"}]},
    {type:"para",label:"Para 8",role:"자기인식과 성취의 관계 — 실제 성취의 중요성"},
    {num:17,en:"There is a strong correlation between self-perception and achievement, but there is evidence to suggest that the actual effect of achievement on self-perception is stronger than the other way round.",kr:"자기인식과 성취 사이에는 강한 상관관계가 있지만, 성취가 자기인식에 미치는 실제 효과가 그 반대보다 더 강하다는 증거가 있다.",grammar:"<strong>the other way round</strong> = 반대 방향으로. <strong>there is evidence to suggest</strong> = ~을 시사하는 증거가 있다",vocab:[{w:"correlation",pos:"n",kr:"상관관계"},{w:"self-perception",pos:"n",kr:"자기인식"}]},
    {type:"para",label:"Para 9",role:"결론 — 성장 마인드셋은 철학으로서 효과적"},
    {num:18,en:"Recent evidence would suggest that growth mindset interventions are not the elixir of student learning that its proponents claim it to be.",kr:"최근 증거는 성장 마인드셋 개입이 지지자들이 주장하는 것처럼 학생 학습의 묘약이 아니라는 것을 시사한다.",grammar:"<strong>would suggest</strong> = 추측·신중한 주장. <strong>elixir</strong> = 묘약, 만병통치약",vocab:[{w:"elixir",pos:"n",kr:"묘약, 만병통치약"},{w:"proponent",pos:"n",kr:"지지자, 옹호자"}]},
    {num:19,en:"Teaching concrete skills such as how to write an effective introduction to an essay then praising students' effort in getting there is probably a far better way of improving confidence than telling them how unique they are.",kr:"에세이에 효과적인 서론을 쓰는 방법과 같은 구체적인 기술을 가르친 다음 그 과정에서의 노력을 칭찬하는 것이 아마도 그들이 얼마나 독특한지를 말해주는 것보다 자신감을 향상시키는 훨씬 더 나은 방법일 것이다.",grammar:"<strong>far better than</strong> = far가 비교급 강조. <strong>concrete skills</strong> = 구체적인 기술",vocab:[{w:"concrete",pos:"adj",kr:"구체적인"},{w:"confidence",pos:"n",kr:"자신감"}]},
    {num:20,en:"Perhaps growth mindset works best as a philosophy and not an intervention.",kr:"아마도 성장 마인드셋은 개입이 아니라 철학으로서 가장 잘 작동할 것이다.",grammar:"<strong>works best as</strong> = ~로서 가장 잘 작동하다. <strong>not A but B</strong> 구조",vocab:[{w:"philosophy",pos:"n",kr:"철학"}]}
  ],

  tfng:[

"C18_T4_P3": {

  sentences:[
    {type:"para",label:"Introduction",role:"도입 — 베게너와 대륙 이동설"},
    {num:1,en:"This is a book about the life and scientific work of Alfred Wegener, whose reputation today rests with his theory of continental displacements, better known as 'continental drift'.",kr:"이 책은 알프레드 베게너의 삶과 과학적 업적에 관한 것으로, 오늘날 그의 명성은 '대륙 이동설'로 더 잘 알려진 대륙 변위 이론에 기반한다.",grammar:"<strong>whose reputation ... rests with</strong> = 소유격 관계대명사. <strong>better known as</strong> = ~로 더 잘 알려진",vocab:[{w:"reputation",pos:"n",kr:"명성"},{w:"continental drift",pos:"n",kr:"대륙 이동설"},{w:"displacement",pos:"n",kr:"이동, 변위"}]},
    {num:2,en:"Wegener proposed this theory in 1912 and developed it extensively for nearly 20 years.",kr:"베게너는 1912년에 이 이론을 제안하고 거의 20년 동안 광범위하게 발전시켰다.",grammar:"<strong>proposed ... and developed</strong> = 과거 시제 병렬. <strong>extensively</strong> = 광범위하게",vocab:[{w:"propose",pos:"v",kr:"제안하다"},{w:"extensively",pos:"adv",kr:"광범위하게"}]},
    {num:3,en:"Wegener's basic idea was that many mysteries about the Earth's history could be solved if one supposed that the continents moved laterally, rather than supposing that they remained fixed in place.",kr:"베게너의 기본 아이디어는 대륙이 고정된 위치에 남아있다고 가정하는 대신 횡방향으로 이동했다고 가정하면 지구 역사의 많은 수수께끼가 풀릴 수 있다는 것이었다.",grammar:"<strong>if one supposed that</strong> = 가정법 과거. <strong>rather than supposing</strong> = ~하는 대신",vocab:[{w:"laterally",pos:"adv",kr:"횡방향으로, 옆으로"},{w:"fixed in place",pos:"phr",kr:"고정된 위치에"}]},
    {num:4,en:"Wegener showed in great detail how such continental movements were plausible and how they worked, using evidence from a large number of sciences including geology, geophysics, paleontology, and climatology.",kr:"베게너는 지질학, 지구물리학, 고생물학, 기후학을 포함한 다수의 과학 분야의 증거를 사용하여 그러한 대륙 이동이 어떻게 그럴듯한지, 어떻게 작동하는지를 매우 상세하게 보여주었다.",grammar:"<strong>showed ... how ... were plausible and how ... worked</strong> = 간접의문문 병렬. <strong>using evidence</strong> = 분사구문",vocab:[{w:"plausible",pos:"adj",kr:"그럴듯한, 타당한"},{w:"geophysics",pos:"n",kr:"지구물리학"},{w:"paleontology",pos:"n",kr:"고생물학"}]},
    {num:5,en:"Plate tectonics is in many respects quite different from Wegener's proposal, in the same way that modern evolutionary theory is very different from the ideas Charles Darwin proposed in the 1850s about biological evolution.",kr:"판구조론은 여러 면에서 베게너의 제안과 상당히 다른데, 이는 현대 진화 이론이 다윈이 1850년대에 제안한 생물 진화에 관한 아이디어와 매우 다른 것과 같은 방식이다.",grammar:"<strong>in the same way that</strong> = ~하는 것과 같은 방식으로. <strong>in many respects</strong> = 여러 면에서",vocab:[{w:"plate tectonics",pos:"n",kr:"판구조론"},{w:"evolutionary",pos:"adj",kr:"진화적인"}]},
    {type:"para",label:"Para 2",role:"베게너의 배경 — 지질학자가 아닌 기상학자"},
    {num:6,en:"Although he came up with a theory on continental drift, he was not a geologist. He trained as an astronomer and pursued a career in atmospheric physics.",kr:"비록 그가 대륙 이동 이론을 창안했지만, 그는 지질학자가 아니었다. 그는 천문학자로 훈련받고 대기물리학 분야에서 경력을 쌓았다.",grammar:"<strong>Although</strong> = 양보 접속사. <strong>came up with</strong> = 창안하다, 생각해내다",vocab:[{w:"come up with",pos:"v",kr:"창안하다, 생각해내다"},{w:"atmospheric physics",pos:"n",kr:"대기물리학"}]},
    {num:7,en:"When he proposed the theory of continental displacements in 1912, he was a lecturer in physics and astronomy at the University of Marburg, in southern Germany.",kr:"1912년 대륙 변위 이론을 제안할 당시, 그는 독일 남부 마르부르크 대학교의 물리학 및 천문학 강사였다.",grammar:"<strong>When he proposed</strong> = 시간 부사절. <strong>lecturer in</strong> = ~분야의 강사",vocab:[{w:"lecturer",pos:"n",kr:"강사"}]},
    {num:8,en:"In 1906 he had set a world record (with his brother Kurt) for time aloft in a hot-air balloon: 52 hours.",kr:"1906년에 그는 (동생 쿠르트와 함께) 열기구 체공 시간 세계 기록을 세웠다: 52시간.",grammar:"<strong>had set</strong> = 과거완료. <strong>time aloft</strong> = 체공 시간",vocab:[{w:"aloft",pos:"adv",kr:"높이, 공중에"},{w:"hot-air balloon",pos:"n",kr:"열기구"}]},
    {num:9,en:"Between 1906 and 1908 he had taken part in a highly publicized and extremely dangerous expedition to the coast of northeast Greenland.",kr:"1906년에서 1908년 사이 그는 그린란드 북동부 해안으로의 크게 알려지고 매우 위험한 탐험에 참여했다.",grammar:"<strong>highly publicized and extremely dangerous</strong> = 병렬 형용사 수식. <strong>expedition to</strong> = ~로의 탐험",vocab:[{w:"publicized",pos:"adj",kr:"알려진, 홍보된"},{w:"expedition",pos:"n",kr:"탐험, 원정"}]},
    {type:"para",label:"Para 3",role:"베게너 연구의 맥락 — 대기물리학이 주된 관심사"},
    {num:10,en:"As important as Wegener's work on continental drift has turned out to be, it was largely a sideline to his interest in atmospheric physics, geophysics, and paleoclimatology.",kr:"베게너의 대륙 이동 연구가 중요하게 밝혀졌음에도 불구하고, 그것은 대기물리학, 지구물리학, 고기후학에 대한 그의 관심에서 크게 부수적인 것이었다.",grammar:"<strong>As important as ... has turned out to be</strong> = 양보 as 구문. <strong>sideline</strong> = 부수적인 일",vocab:[{w:"sideline",pos:"n",kr:"부업, 부수적인 일"},{w:"paleoclimatology",pos:"n",kr:"고기후학"}]},
    {num:11,en:"I have been at great pains to put Wegener's work on continental drift in the larger context of his other scientific work.",kr:"나는 베게너의 대륙 이동 연구를 그의 다른 과학 연구의 더 넓은 맥락 속에 위치시키기 위해 많은 노력을 기울여 왔다.",grammar:"<strong>be at great pains to do</strong> = ~하기 위해 많은 노력을 하다. <strong>put ... in context</strong> = 맥락 속에 위치시키다",vocab:[{w:"be at great pains",pos:"phr",kr:"많은 노력을 기울이다"}]},
    {type:"para",label:"Para 4",role:"베게너의 변화하는 관심사들 — 독자에게 전체 맥락 권유"},
    {num:12,en:"Readers interested in the specific detail of Wegener's career will see that he often stopped pursuing a given line of investigation, only to pick it up later.",kr:"베게너의 경력에 대한 구체적인 세부 사항에 관심 있는 독자들은 그가 특정 연구 방향을 추구하는 것을 멈추고, 나중에 다시 이를 이어가는 것을 종종 볼 수 있을 것이다.",grammar:"<strong>only to pick it up later</strong> = only to + 동사원형(실망스럽거나 예상치 못한 결과). <strong>a given line of</strong> = 특정한 방향의",vocab:[{w:"line of investigation",pos:"n",kr:"연구 방향"},{w:"pick up",pos:"v",kr:"다시 이어받다"}]},
    {num:13,en:"My own feeling, however, is that the parts do not make as much sense on their own as do all of his activities taken together. In this respect I urge readers to try to experience Wegener's life as he lived it.",kr:"그러나 내 생각은 부분들이 그 자체로는 그의 모든 활동을 합친 것만큼 의미가 없다는 것이다. 이런 점에서 나는 독자들이 베게너의 삶을 그가 살아간 대로 경험해 보기를 촉구한다.",grammar:"<strong>do not make as much sense as</strong> = 동등비교 부정. <strong>urge readers to</strong> = 독자들에게 ~하도록 촉구하다",vocab:[{w:"urge",pos:"v",kr:"촉구하다, 강력히 권하다"}]},
    {type:"para",label:"Para 5",role:"베게너의 기록 부재 — 전기 작가의 어려움"},
    {num:14,en:"Wegener left behind a few published works but, as was standard practice, these reported the results of his work – not the journey he took to reach that point.",kr:"베게너는 몇 가지 발표된 연구를 남겼지만, 관례대로 이것들은 그의 연구 결과를 보고했을 뿐, 그 지점에 도달하기까지의 과정은 아니었다.",grammar:"<strong>as was standard practice</strong> = 관례대로(삽입 관계절). <strong>not the journey ... to reach</strong> = 동격적 부정",vocab:[{w:"standard practice",pos:"n",kr:"관례, 표준 관행"}]},
    {num:15,en:"He was not active in scientific societies, and did not seek to find influence or advance his ideas through professional contacts and politics, spending most of his time at home reading and writing.",kr:"그는 과학 학회에서 활발히 활동하지 않았고, 전문적인 인맥과 정치를 통해 영향력을 찾거나 자신의 아이디어를 발전시키려 하지 않았으며, 대부분의 시간을 집에서 읽고 쓰며 보냈다.",grammar:"<strong>did not seek to</strong> = ~하려 하지 않았다. <strong>spending most of his time</strong> = 분사구문",vocab:[{w:"scientific societies",pos:"n",kr:"과학 학회"},{w:"professional contacts",pos:"n",kr:"전문적인 인맥"}]},

    {num:16,en:"Some famous scientists, such as Newton, Darwin, and Einstein, left mountains of written material behind, hundreds of notebooks and letters numbering in the tens of thousands.",kr:"뉴턴, 다윈, 아인슈타인과 같은 일부 유명한 과학자들은 수백 권의 노트와 수만 통의 편지 등 방대한 저술 자료를 남겼다.",grammar:"<strong>mountains of</strong> = 엄청난 양의. <strong>numbering in the tens of thousands</strong> = 수만에 달하는",vocab:[{w:"mountains of",pos:"phr",kr:"엄청난 양의"}]},
    {num:17,en:"The more such material a scientist leaves behind, the better chance a biographer has of forming an accurate picture of how a scientist's ideas took shape.",kr:"과학자가 그러한 자료를 많이 남길수록, 전기 작가는 과학자의 아이디어가 어떻게 형성되었는지에 대한 정확한 그림을 만들 더 나은 기회를 갖는다.",grammar:"<strong>The more ... the better</strong> = 비례 비교 구문. <strong>biographer</strong> = 전기 작가",vocab:[{w:"biographer",pos:"n",kr:"전기 작가"},{w:"took shape",pos:"phr",kr:"형성되었다"}]},

// ═══════════════════════ NAV TREE ═══════════════════════
const navTree = document.getElementById('nav-tree');
[16,17,18,19,20].forEach(book => {
  const bg = document.createElement('div'); bg.className='book-group';
  const bl = document.createElement('div'); bl.className='book-label';
  bl.innerHTML=`<span class="arr">▼</span>Cambridge ${book}`;
  bl.onclick=()=>bl.classList.toggle('collapsed');
  const tg = document.createElement('div'); tg.className='test-group';
  for(let t=1;t<=4;t++){
    const tl=document.createElement('div'); tl.className='test-label';
    tl.innerHTML=`<span class="arr">▼</span>Test ${t}`;
    tl.onclick=()=>tl.classList.toggle('collapsed');
    const pl=document.createElement('div'); pl.className='passage-list';
    for(let p=1;p<=3;p++){
      const key=`C${book}_T${t}_P${p}`;
      const has=!!PASSAGES[key];
      const pi=document.createElement('div');
      pi.className='passage-item'+(has?' done':'');
      pi.dataset.key=key;
      pi.innerHTML=`Passage ${p}<span class="p-badge">${has?'✓':'—'}</span>`;
      pi.onclick=()=>selectPassage(key,pi);
      pl.appendChild(pi);
    }
    tg.appendChild(tl); tg.appendChild(pl);
  }
  bg.appendChild(bl); bg.appendChild(tg);
  navTree.appendChild(bg);
});

// ═══════════════════════ SELECT ═══════════════════════
function selectPassage(key,el){
  document.querySelectorAll('.passage-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const d=PASSAGES[key];
  if(!d){renderEmpty(key);return;}
  document.getElementById('ptitle').textContent=d.title;
  const pt=document.getElementById('ptopic'); pt.textContent=d.topic; pt.style.display='inline-block';
  renderSents(d); renderVocabAll(d); renderTFNG(d); renderSummary(d);
  // reset to first tab
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="sents"]').classList.add('active');
  document.getElementById('tab-sents').classList.add('active');
}

function renderEmpty(key){
  document.getElementById('ptitle').textContent=key.replace('C','Cambridge ').replace('_T',' · Test ').replace('_P',' · Passage ');
  document.getElementById('ptopic').style.display='none';
  const html=`<div class="empty"><div class="em">📝</div><h3>데이터 없음</h3><p>공부 후 PASSAGES 객체에 추가하세요.<br><code>"${key}": { ... }</code></p></div>`;
  ['tab-sents','tab-vocab','tab-tfng','tab-summary'].forEach(id=>document.getElementById(id).innerHTML=html);
}

// ═══════════════════════ CIRCLE NUMS ═══════════════════════
function cn(n){
  const c='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺';
  return n<=50?c[n-1]:n;
}

// ═══════════════════════ RENDER SENTENCES ═══════════════════════
function renderSents(d){
  const el=document.getElementById('tab-sents');
  const html=d.sentences.map(s=>{
    if(s.type==='para'){
      return `<div class="para-divider">
        <span class="para-divider-badge">${s.label}</span>
        <span class="para-divider-role">${s.role}</span>
        <div class="para-divider-line"></div>
      </div>`;
    }
    return `<div class="sent-block">
      <div class="sent-num-row">
        <div class="sent-num">${cn(s.num)}</div>
        <div class="sent-en">${s.en}</div>
      </div>
      <div class="sent-kr">${s.kr}</div>
      ${s.grammar?`<div class="grammar-note">${s.grammar}</div>`:''}
      ${s.vocab&&s.vocab.length?`<table class="vocab-table">
        <tr><th>단어</th><th>품사</th><th>의미</th></tr>
        ${s.vocab.map(v=>`<tr><td>${v.w}</td><td>${v.pos}</td><td>${v.kr}</td></tr>`).join('')}
      </table>`:''}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="passage-intro">
      <h3>${d.title}</h3>
      <p>${d.topic}</p>
      <div class="q-types">${d.qTypes.map(q=>`<span class="q-chip">${q}</span>`).join('')}</div>
    </div>
    <div class="legend-row">
      <span style="font-size:11px;color:var(--tl);font-weight:600;">문법 색상:</span>
      <span class="leg"><span class="leg-dot" style="background:#1d4ed8"></span>주어(S)</span>
      <span class="leg"><span class="leg-dot" style="background:#b91c1c"></span>동사(V)</span>
      <span class="leg"><span class="leg-dot" style="background:#047857"></span>목적어(O)</span>
      <span class="leg"><span class="leg-dot" style="background:#6d28d9"></span>수식어(M)</span>
    </div>
    <div class="sentences-container">${html}</div>`;
}

// ═══════════════════════ RENDER VOCAB ═══════════════════════
function renderVocabAll(d){
  const el=document.getElementById('tab-vocab');
  if(!d.allVocab||!d.allVocab.length){el.innerHTML='<div class="empty"><div class="em">📖</div><h3>어휘 데이터 없음</h3></div>';return;}
  el.innerHTML=`<div class="vocab-all-container"><div class="vocab-all-grid">${
    d.allVocab.map(v=>`<div class="vcard">
      <div><span class="vcard-word">${v.w}</span><span class="vcard-pos">${v.pos}</span></div>
      ${v.pron?`<div class="vcard-pron">${v.pron}</div>`:''}
      <div class="vcard-kr">${v.kr}</div>
      <div class="vcard-ex">예: ${v.ex}</div>
      ${v.syn&&v.syn.length?`<div class="vcard-syn">유의어: ${v.syn.map(s=>`<span>${s}</span>`).join('')}</div>`:''}
    </div>`).join('')}
  </div></div>`;
}

// ═══════════════════════ RENDER T/F/NG ═══════════════════════
function renderTFNG(d){
  const el=document.getElementById('tab-tfng');
  if(!d.tfng||!d.tfng.length){el.innerHTML='<div class="empty"><div class="em">❌</div><h3>오답 데이터 없음</h3></div>';return;}
  el.innerHTML=`<div class="tfng-container">${d.tfng.map(q=>{
    const ca=q.correct.replace(' ','');
    const wrong=q.mine&&q.mine!==q.correct;
    return `<div class="tfng-block ans-${ca}">
      <div class="tfng-head">
        <div class="q-circle">${q.qNum}</div>
        <div class="q-stmt">${q.stmt}</div>
        <span class="ans-pill pill-${ca}">정답: ${q.correct}</span>
        ${q.mine?`<span class="ans-pill pill-mine">내 답: ${q.mine}</span>`:''}
      </div>
      ${q.mine?`<div class="result-row ${wrong?'wrong':'correct'}">${wrong?'✗ 오답':'✓ 정답'}</div>`:''}
      <div class="ev-label">📍 근거 문장 (${q.evPara})</div>
      <div class="ev-box">${q.ev}</div>
      <div class="why-label">🧠 ${q.correct}인 이유</div>
      <div class="why-box">${q.why}</div>
      ${q.trap?`<div class="trap-label" style="margin-top:8px">⚠️ 함정</div><div class="trap-box">${q.trap}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

// ═══════════════════════ RENDER SUMMARY ═══════════════════════
function renderSummary(d){
  const el=document.getElementById('tab-summary');
  el.innerHTML=`<div class="summary-container">
    <div class="sum-card">
      <div class="sum-title">📄 패시지 개요</div>
      <div class="sum-text">${d.summary}</div>
      <div class="q-types" style="margin-top:10px">${d.qTypes.map(q=>`<span class="q-chip">${q}</span>`).join('')}</div>
    </div>
    <div class="sum-card">
      <div class="sum-title">🗺️ 단락별 구조도</div>
      ${d.paragraphs.map(p=>`<div class="smap-row">
        <div class="smap-lbl">${p.lbl}</div>
        <div><div class="smap-role">${p.role}</div><div class="smap-desc">${p.desc}</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════ TABS ═══════════════════════
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  };
});

// ═══════════════════════ AUTO SELECT ═══════════════════════
const first=document.querySelector('.passage-item.done');
if(first) first.click();
</script>
</body>
</html>
